            自動検出

      # 60日無活動によるスケジュール停止の防止を兼ねた実行記録
      - name: 実行記録をコミット
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          echo "最終実行: $(date -u -d '+9 hours' +'%Y-%m-%d %H:%M') JST / 結果: exit=${{ steps.lychee.outputs.exit_code }}" > linkcheck-last-run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkcheck-last-run.txt
          git commit -m "リンク点検の実行記録 [skip ci]" || exit 0
          git push
