悪性腫瘍。手術（患肢温存や切断）と化学療法のあと、運動の制限と移動の配慮が要る。小児慢性特定疾病。","ref":"pp.195–214","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/01_05_035/","sourceId":"shouman"}]}]},{"title":"腎臓病","items":[{"name":"ネフローゼ症候群","axis":"経過／寛解と再発を繰り返す","line":"尿にたんぱくが出てむくむ。ステロイド治療で寛解するが再発を繰り返すことが多く、服薬の副作用（肥満、感染しやすさ）と運動の調整が関わる。小児慢性特定疾病。","ref":"pp.195–214","links":[{"label":"小児慢性特定疾病情報センター（微小変化型）","url":"https://www.shouman.jp/disease/details/02_01_003/","sourceId":"shouman"},{"label":"小児特発性ネフローゼ症候群診療ガイドライン2020","url":"https://mhlw-grants.niph.go.jp/system/files/2019/192051/201911032B_upload/201911032B202007161223573470004.pdf","sourceId":"jspn-nephrotic2020"}]},{"name":"慢性糸球体腎炎（IgA腎症など）","axis":"経過／慢性・長期の管理","line":"学校検尿で見つかることが多い。多くは日常生活の制限は少ないが、進行する場合は食事・運動の制限と服薬が長期に続く。小児慢性特定疾病。","ref":"pp.195–214","links":[{"label":"小児慢性特定疾病情報センター（IgA腎症）","url":"https://www.shouman.jp/disease/details/02_02_008/","sourceId":"shouman"}]}]},{"title":"気管支喘息・アレルギー疾患","items":[{"name":"気管支喘息","axis":"経過／発作性・治療で安定","line":"気道の慢性的な炎症で発作性の呼吸困難が起こる。長期管理薬で安定するが、発作時の対応（吸入薬の携帯、呼吸の観察）と誘因（運動、ほこり、天候）の把握が要る。小児慢性特定疾病。","ref":"pp.195–214","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/03_02_002/","sourceId":"shouman"},{"label":"小児気管支喘息治療・管理ガイドライン2023","url":"https://www.jspaci.jp/news/both/20231109-4381/","sourceId":"jpgl2023"}]},{"name":"食物アレルギー・アナフィラキシー","axis":"治療による制限／除去食・緊急時","line":"原因食物の除去と、誤食時のアナフィラキシーへの対応（エピペン）が要る。運動と組み合わさって起こる食物依存性運動誘発アナフィラキシーもある。アレルギー疾患用の学校生活管理指導表で把握する。","ref":"pp.195–214","links":[{"label":"学校生活管理指導表（アレルギー疾患用）","url":"https://www.gakkohoken.jp/book/pdf/02sidou.pdf","sourceId":"gakko-hoken-allergy"}]},{"name":"アトピー性皮膚炎","axis":"治療による制限／日常のケア","line":"かゆみを伴う慢性の皮膚炎。保湿と外用薬、汗やプールの後の処置、掻き壊しへの配慮が関わる。","ref":"pp.195–214","links":[{"label":"学校生活管理指導表（アレルギー疾患用）","url":"https://www.gakkohoken.jp/book/pdf/02sidou.pdf","sourceId":"gakko-hoken-allergy"}]}]},{"title":"心臓病","items":[{"name":"先天性心疾患（心室中隔欠損症など）","axis":"経過／手術後の経過観察・運動の制限","line":"心臓の構造の異常。軽症は制限がないが、手術後や複雑な心奇形では運動の制限と定期受診が続く。運動の可否は学校生活管理指導表による。小児慢性特定疾病。","ref":"pp.195–214","links":[{"label":"小児慢性特定疾病情報センター（心室中隔欠損症）","url":"https://www.shouman.jp/disease/details/04_45_057/","sourceId":"shouman"},{"label":"学校生活管理指導表","url":"https://www.hokenkai.or.jp/publication/guidance.html","sourceId":"gakko-hoken"}]},{"name":"川崎病（冠動脈の後遺症）","axis":"経過／後遺症の有無で管理が変わる","line":"乳幼児期の血管の炎症。冠動脈瘤が残った場合は抗血栓薬の服用と運動の制限が長期に続く。小児慢性特定疾病（冠動脈瘤）。","ref":"pp.195–214","links":[{"label":"小児慢性特定疾病情報センター（川崎病性冠動脈瘤）","url":"https://www.shouman.jp/disease/details/04_26_032/","sourceId":"shouman"}]},{"name":"心筋症・重症不整脈","axis":"経過／突然の変化に備える","line":"心臓の筋肉や電気的な働きの病気。失神や急変の可能性があり、運動の制限、AEDの位置、緊急時の手順を校内で共有する。小児慢性特定疾病。","ref":"pp.195–214","links":[{"label":"小児慢性特定疾病情報センター（慢性心疾患の一覧）","url":"https://www.shouman.jp/disease/search/group/list/04/%E6%85%A2%E6%80%A7%E5%BF%83%E7%96%BE%E6%82%A3","sourceId":"shouman"}]}]},{"title":"糖尿病・血液の病気","items":[{"name":"1型糖尿病","axis":"治療による制限／日常の自己管理","line":"インスリンが作られなくなる。学校での血糖測定とインスリン注射、低血糖時の補食と対応が要る。運動の制限は原則ないが、運動量に応じた調整を本人が学ぶ。糖尿病患児の連絡表で把握する。小児慢性特定疾病。","ref":"pp.195–214","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/07_01_001/","sourceId":"shouman"},{"label":"糖尿病患児用連絡表","url":"https://www.hokenkai.or.jp/publication/pdf/kanri_03.pdf","sourceId":"gakko-hoken-diabetes"}]},{"name":"2型糖尿病","axis":"治療による制限／食事と運動","line":"肥満を背景に思春期に増える。食事と運動の指導が中心で、服薬やインスリンを要することもある。小児慢性特定疾病。","ref":"pp.195–214","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/07_01_002/","sourceId":"shouman"}]},{"name":"血友病","axis":"治療による制限／出血時の対応","line":"血液が固まりにくい。定期的な製剤の補充で日常生活はほぼ制限なく送れるが、打撲や関節内出血時の対応と、運動の種類の相談が要る。小児慢性特定疾病。","ref":"pp.195–214","links":[{"label":"小児慢性特定疾病情報センター（血友病A）","url":"https://www.shouman.jp/disease/details/09_21_040/","sourceId":"shouman"}]}]},{"title":"てんかん・神経の病気","items":[{"name":"てんかん","axis":"経過／発作の型と頻度","line":"脳の神経細胞の過剰な興奮による発作を繰り返す。発作の型、頻度、服薬の状況、緊急対応を要する発作かどうかを主治医から確認する。","ref":"pp.195–214","links":[{"label":"日本神経学会 てんかん","url":"https://www.neurology-jp.org/public/disease/tenkan_detail.html","sourceId":"neurology-jp"},{"label":"ILAE 2017年 てんかん分類（日本語訳）","url":"https://jes-jp.org/jes/pdf/ILAE_case2017_ja.pdf","sourceId":"ilae-jes"}]},{"name":"もやもや病","axis":"経過／脳血管の病気・発作への注意","line":"脳の血管が細くなる病気。泣く・激しく息を吐くなどの過呼吸で一時的なまひや脱力が起こることがあり、誘因を避ける配慮が要る。指定難病。","ref":"pp.195–214","links":[{"label":"難病情報センター（指定難病22）","url":"https://www.nanbyou.or.jp/entry/209","sourceId":"nanbyou"}]},{"name":"高次脳機能障害","axis":"身体か心か／脳損傷の後遺症","line":"脳腫瘍の治療、頭部外傷、脳炎などのあとに残る記憶・注意・遂行機能・社会的行動の障害。外から分かりにくく、学習と対人面の両方で配慮が要る。","ref":"pp.195–214","links":[{"label":"教育支援の手引 第3編 Ⅴ 病弱・身体虚弱（pp.195–214）","url":"https://www.mext.go.jp/content/20211014-mxt_tokubetu02-000018454_09.pdf","sourceId":"tebiki-3-health"}]}]},{"title":"筋・骨の病気","items":[{"name":"進行性筋ジストロフィー（デュシェンヌ型など）","axis":"経過／進行性","line":"筋力低下が進行する。医学的説明は手引ではこの章に置かれている。学校での姿勢・移動・呼吸の管理は肢体不自由のページと併せて見る。小児慢性特定疾病・指定難病。","ref":"pp.195–214","links":[{"label":"小児慢性特定疾病情報センター（デュシェンヌ型）","url":"https://www.shouman.jp/disease/details/11_21_047/","sourceId":"shouman"},{"label":"難病情報センター 筋ジストロフィー（指定難病113）","url":"https://www.nanbyou.or.jp/entry/4522","sourceId":"nanbyou"}]},{"name":"二分脊椎・骨形成不全症・ペルテス病・脊柱側弯症","axis":"治療による制限／整形外科的な管理","line":"手引はこれらの医学的説明をこの章に置いている。排泄の管理（二分脊椎）、骨折の予防（骨形成不全症）、荷重の制限（ペルテス病）、装具と姿勢（側弯症）が学校生活に関わる。","ref":"pp.195–214","links":[{"label":"教育支援の手引 第3編 Ⅴ 病弱・身体虚弱（pp.195–214）","url":"https://www.mext.go.jp/content/20211014-mxt_tokubetu02-000018454_09.pdf","sourceId":"tebiki-3-health"},{"label":"日本整形外科学会「側弯症」","url":"https://www.joa.or.jp/public/sick/condition/scoliosis.html","sourceId":"joa-sick"}]}]},{"title":"心身症・精神疾患","items":[{"name":"起立性調節障害","axis":"身体か心か／心身症","line":"自律神経の働きの乱れで、朝起きられない、立ちくらみ、午前中の不調が続く。思春期に多く、不登校の背景になることがある。怠けではないことの理解が要る。","ref":"pp.195–214","links":[{"label":"日本小児心身医学会 起立性調節障害","url":"https://www.jisinsin.jp/general/typical_diseases/%E8%B5%B7%E7%AB%8B%E6%80%A7%E8%AA%BF%E7%AF%80%E9%9A%9C%E5%AE%B3/","sourceId":"jisinsin"}]},{"name":"反復性腹痛・頭痛（機能性消化管疾患など）","axis":"身体か心か／心身症","line":"検査で異常がないのに腹痛や頭痛を繰り返す。本人の苦痛は実在し、ストレスとの関係を見ながら登校や活動の調整をする。","ref":"pp.195–214","links":[{"label":"日本小児心身医学会 機能性消化管疾患","url":"https://www.jisinsin.jp/general/typical_diseases/%E6%A9%9F%E8%83%BD%E6%80%A7%E6%B6%88%E5%8C%96%E7%AE%A1%E7%96%BE%E6%82%A3/","sourceId":"jisinsin"}]},{"name":"摂食障害","axis":"身体か心か／心身症・精神疾患","line":"極端な食事制限や過食を繰り返し、体重や体調に影響する。身体の管理（低体重・低栄養）と心理的な支援を医療と連携して行う。","ref":"pp.195–214","links":[{"label":"こころの情報サイト（国立精神・神経医療研究センター）","url":"https://kokoro.ncnp.go.jp/disease.php?%40uid=daWRhKdTNvsjgjM5","sourceId":"kokoro-ncnp"}]},{"name":"うつ病・適応障害・不安症","axis":"身体か心か／精神疾患","line":"気分の落ち込み、意欲の低下、不安や身体の不調が続く。中学校段階から現れることがあり、希死念慮への対応は医療との連携と校内の体制を前提にする。","ref":"pp.195–214","links":[{"label":"こころの情報サイト「うつ病」","url":"https://kokoro.ncnp.go.jp/disease.php?%40uid=9D2BdBaF8nGgVLbL","sourceId":"kokoro-ncnp"},{"label":"こころの情報サイト「不安症」","url":"https://kokoro.ncnp.go.jp/disease.php?%40uid=BLA9JV0KhiWPIMzX","sourceId":"kokoro-ncnp"}]},{"name":"統合失調症","axis":"身体か心か／精神疾患","line":"幻覚や妄想、思考のまとまりにくさが現れる。10代後半からの発症が多く、早期の受診と服薬の継続、刺激の少ない環境が関わる。","ref":"pp.195–214","links":[{"label":"こころの情報サイト「統合失調症」","url":"https://kokoro.ncnp.go.jp/disease.php?%40uid=tQtLd1xVUp1wHJMQ","sourceId":"kokoro-ncnp"}]}]},{"title":"その他","items":[{"name":"肥満症","axis":"治療による制限／食事と運動","line":"健康障害を伴う肥満。食事と運動の指導が中心で、自己肯定感への配慮が要る。","ref":"pp.195–214","links":[{"label":"教育支援の手引 第3編 Ⅴ 病弱・身体虚弱（pp.195–214）","url":"https://www.mext.go.jp/content/20211014-mxt_tokubetu02-000018454_09.pdf","sourceId":"tebiki-3-health"}]},{"name":"重症心身障害","axis":"医療的ケア・重複","line":"重度の肢体不自由と重度の知的障害が重なる状態。医療的ケア、姿勢の管理、体温調節、発作への対応など常時の医学的観察が要る。","ref":"pp.195–214","links":[{"label":"横地分類（大島分類の改訂）","url":"https://jushojisha.jp/yokochibunrui/","sourceId":"jushojisha"}]},{"name":"色素性乾皮症","axis":"治療による制限／紫外線の回避","line":"紫外線で皮膚がんや神経の症状が進む。遮光（窓のフィルム、長袖、日焼け止め）と屋外活動の調整が学校生活に直結する。指定難病。","ref":"pp.195–214","links":[{"label":"難病情報センター（指定難病159）","url":"https://www.nanbyou.or.jp/entry/217","sourceId":"nanbyou"}]}]}],"terms":[{"term":"学校生活管理指導表の指導区分","desc":"A（在宅・入院）、B（登校可・運動不可）、C（軽い運動まで）、D（中等度の運動まで）、E（強い運動も可）。主治医が記入する。","ref":"pp.195–214"},{"term":"寛解・再燃","desc":"症状が治まっている状態と、再び悪くなること。ネフローゼ症候群や炎症性の病気で使う。","ref":"p.174"},{"term":"晩期合併症","desc":"小児がんの治療から年月が経って現れる影響（成長、内分泌、二次がんなど）。治療後も経過観察が続く。","ref":"pp.195–214"},{"term":"CLS（チャイルド・ライフ・スペシャリスト）","desc":"入院中の子どもの心理的な支援を行う専門職。病院での療育の内容を知る窓口になる。","ref":"p.177"},{"term":"食物依存性運動誘発アナフィラキシー","desc":"特定の食物を食べたあとに運動すると起こる強いアレルギー反応。給食後の体育に関わる。","ref":"pp.195–214"},{"term":"緊急対応を要する発作／見守る発作","desc":"てんかん発作のうち、長い・繰り返す・呼吸の異常を伴うものは緊急対応。いつもどおりの短い発作は安全を確保して見守る。主治医と事前に確認する。","ref":"pp.195–214"},{"term":"QOL・レジリエンス","desc":"生活の質と、困難から回復する力。病弱教育で目標として使われる語。","ref":"p.181"}],"related":[{"label":"小学校等における医療的ケア実施支援資料","sourceId":"mext-iryoteki-care","note":"学校で医療的ケアを行うときの体制と手順"},{"label":"学校生活管理指導表（幼稚園用・小学生用・中学・高校生用）","sourceId":"gakko-hoken","note":"心疾患・腎疾患など"},{"label":"学校生活管理指導表（アレルギー疾患用）","sourceId":"gakko-hoken-allergy"},{"label":"小児摂食障害 サポートパンフ（日本小児心身医学会）","url":"https://www.jisinsin.jp/wp-content/uploads/2021/08/sesshokushougai.pdf","sourceId":"jisinsin","note":"摂食障害の子どもへの関わり方"}],"sources":["tebiki-3-health","tebiki","mext-iryoteki-care","gakko-hoken"],"reviewed":"2026-10-06","sheet":{"seed":"例：入院と退院を繰り返し、学習の空白がある。運動の制限があり、体育で何をさせてよいか分からない","ask":"例：服薬や体調の管理を本人に任せる範囲をどう広げるか"},"fields":[{"k":"dx","label":"診断名","type":"text","col":"status","ref":"p.174"},{"k":"course","label":"病気の経過","type":"select","options":["安定している","寛解と再燃を繰り返す","進行性","治療中","不明・未確認"],"col":"status","ref":"p.174"},{"k":"grade","label":"学校生活管理指導表の指導区分","type":"select","options":["A","B","C","D","E","対象外","不明・未確認"],"col":"status","ref":"pp.195–214"},{"k":"restrict","label":"治療による制限","type":"checks","options":["運動","食事・除去食","感染予防","紫外線","水分","その他"],"col":"status","ref":"p.175"},{"k":"meds","label":"学校での服薬・吸入・注射","type":"text","col":"status","ref":"p.174"},{"k":"emerg","label":"緊急時の対応の取り決め","type":"select","options":["主治医の指示あり","校内で確認済み","未確認"],"col":"status","ref":"p.182"},{"k":"care","label":"医療的ケア","type":"checks","options":["なし","経管栄養","喀痰吸引","導尿","酸素","人工呼吸器","血糖測定・インスリン","その他"],"col":"status","ref":"p.176"},{"k":"absence","label":"入院・欠席の状況と学習の空白","type":"text","col":"status","ref":"p.182"},{"k":"doc","label":"学校生活管理指導表・連絡表・指示書","type":"image","col":"status","ref":"pp.195–214","hint":"手元にあれば、AIが必要な時点で内容を聞いてきます"},{"k":"med","label":"主治医からの情報","type":"textarea","col":"status","ref":"p.176","hint":"本人・保護者の許可を得て"},{"k":"selfcare","label":"病気の理解と自己管理","type":"select","options":["自分で管理できる","一部できる","周囲の管理が必要","不明・未確認"],"col":"strengths","ref":"p.179"},{"k":"help","label":"必要なときに援助を求められるか","type":"select","options":["できる","促されればできる","難しい","不明・未確認"],"col":"strengths","ref":"p.179"}]}},{"id":"language","num":"06","name":"言語障害","en":"Speech and Language Disorder","overview":"発音が不明瞭であったり話し言葉のリズムが円滑でなかったりして、話し言葉によるコミュニケーションが円滑に進まず、本人が引け目を感じるなど社会生活上不都合な状態。構音障害・吃音・言語発達の遅れなどに大別されます。","places":[{"name":"通常の学級","note":"話しやすい学級の雰囲気づくりや音読等での個別配慮を受けて参加"},{"name":"通級による指導（言語障害）","note":"構音・吃音・言語発達の状態に応じた特別の指導を一部時間で実施"},{"name":"言語障害特別支援学級","note":"程度が著しい場合に、構音改善や流暢性の指導等を系統的に実施"}],"quote":"言語障害とは、発音が不明瞭であったり、話し言葉のリズムがスムーズでなかったりする…状態をいう。","sourceId":"tebiki-3-language","programCriteria":{"notice":"平成25年10月4日付け25文科初第756号 文部科学省初等中等教育局長通知（別紙）","sourceId":"mext-756","entries":[{"program":"特別支援学級","term":"言語障害者","text":"口蓋裂，構音器官のまひ等器質的又は機能的な構音障害のある者，吃音等話し言葉におけるリズムの障害のある者，話す，聞く等言語機能の基礎的事項に発達の遅れがある者，その他これに準じる者（これらの障害が主として他の障害に起因するものではない者に限る。）で，その程度が著しいもの"},{"program":"通級による指導","term":"言語障害者","text":"口蓋裂，構音器官のまひ等器質的又は機能的な構音障害のある者，吃音等話し言葉におけるリズムの障害のある者，話す，聞く等言語機能の基礎的事項に発達の遅れがある者，その他これに準じる者（これらの障害が主として他の障害に起因するものではない者に限る。）で，通常の学級での学習におおむね参加でき，一部特別な指導を必要とする程度のもの"}],"note":"特別支援学級・通級による指導の対象となる障害の程度として、国が示した目安です。学級の設置や指導の実施は市町村教育委員会の判断によるため、この程度に該当すれば必ず利用できるというものではありません。"},"v5":true,"diseases":{"v5":true,"id":"language","axisType":"profile","axisTypeLabel":"話し言葉の状態で見る","definition":"発音が不明瞭であったり、話し言葉のリズムが滑らかでなかったりするため、話し言葉によるコミュニケーションが円滑に進まず、本人が引け目を感じるなど社会生活上の不都合がある状態です。疾患ではなく話し言葉の状態が軸で、見逃されやすく「おとなしい子」と思われがちです。本人の苦しみは見た目より大きく、劣等感や不登校に波及することがあるため、心理的な面への支援を併せて考えます。","definitionRef":"pp.217–218","axesIntro":"言語障害は3つの基準で分類し、構音障害と吃音はそれぞれの状態像で見ます。聴覚障害・知的障害・脳性まひに主として起因する場合は、主たる障害のページで扱います。","axes":[{"name":"耳で聞いた特徴","levels":["発音の誤り（構音障害）","吃音（話し言葉のリズムの障害）"],"meaning":"通級による指導の対象区分そのもの。","ref":"pp.232, 235"},{"name":"言葉の発達","levels":["話す・聞くなど言語機能の基礎的事項の発達の遅れ","偏り（語彙や文法を知っていても場面で使えない）"],"meaning":"言語は環境との相互作用で発達する。周囲の大人の対応や子ども同士の関わりも把握の対象。","ref":"pp.218, 236"},{"name":"原因","levels":["器質性（口蓋裂など構音器官の構造・機能）","機能性・発達性（構造に異常がない）","他の障害（聴覚障害、知的障害、脳性まひ）に主として起因するもの"],"meaning":"通級・学級の対象は「他の障害に主として起因しない者」。器質性か発達性かで指導法が違う。","ref":"pp.232–233, 236–237"},{"name":"構音障害の状態像","levels":["置換（別の音になる）","省略","ひずみ","鼻にかかる（鼻咽腔閉鎖機能）"],"meaning":"構音点・構音様式で整理し、発語器官の運動、聴覚的な認知、構音の誘導のどこに働きかけるかを決める。","ref":"pp.237–238"},{"name":"吃音の状態像","levels":["中核症状：連発・伸発・難発","波現象（日・場面・相手で変動）","場面や語音の恐怖と回避、随伴症状","社会性・自己肯定感への影響"],"meaning":"変動するので様々な状況で観察する。流暢さを強調しすぎない。","ref":"pp.238–239"}],"assessmentIntro":"手引の「状態等の把握」を校内様式の5つの欄に対応させた観点の一覧です。状態は場面と相手で変わるため、場面ごとの様子と本人の受け止め方を書きます。","assessment":{"status":[{"text":"診断名、発病の時期、合併する疾患。器質性か発達性か","ref":"p.219"},{"text":"音声や構音の状態（共鳴、音質、大きさ、緊張、随伴する動作）。単音節・単語・会話の明瞭度","ref":"pp.219–220"},{"text":"流暢性（吃音のパターン、頻度、苦手な場面や音）","ref":"p.221"},{"text":"発語器官の運動（噛む・吸う・飲み込む、舌・口唇、軟口蓋・咽頭）","ref":"p.220"},{"text":"音の聴覚的な記銘力（語音の弁別、聴覚的記銘力、被刺激性）","ref":"p.220"},{"text":"発話の内容（文法、文脈の整合性、言語発達の程度）","ref":"p.221"},{"text":"喃語の初発・始語・二語文・人見知りの時期、育った国や言語の環境","ref":"p.219"},{"text":"言語聴覚士の評価と支援の内容","ref":"p.222"}],"development":[{"text":"聴覚的な記銘力：音の違い、自分の発音と手本の違いに気付くか","ref":"p.222"},{"text":"意思の相互伝達の様子、知的発達、運動の力","ref":"pp.222–223"},{"text":"健康と安全、基本的生活習慣、感覚の働き","ref":"p.222"},{"text":"情緒の安定と社会性（話す場面での緊張、集団での様子）","ref":"p.223"}],"interest":[{"text":"園等での遊びの中の関わり、興味・関心。楽しみながら話せる場面は何か","ref":"pp.222, 224"},{"text":"好きな活動、人との関わりで好むこと","ref":"p.222"}],"strengths":[{"text":"自分の話し方についての理解と受け止め方","ref":"p.223"},{"text":"自分から確かめる、伝わったか見る、補助的手段を使うなどの工夫をしているか","ref":"p.223"},{"text":"話す意欲と自信、自立への意欲、対人関係、学習への意欲","ref":"pp.223–224"}],"wish":[{"text":"本人の思いや願い。どの場面で楽に話したいか、周りにどうしてほしいか","ref":"p.224"},{"text":"保護者の思いや願いと、家庭での関わり方（話し方への反応を含む）","ref":"pp.218, 224"}],"how":[{"text":"話すことに自信がなく緊張しやすいので、プレイルームなどで楽しみながら観察する。保護者との関わりも記録する","ref":"p.222"},{"text":"検査は個別式で、非言語性を併用する。時間の延長や検査者の補助をしたら記録する","ref":"p.224"},{"text":"場面と相手を変えて複数回観察する（吃音は波現象で変動する）","ref":"p.239"},{"text":"言語聴覚士、園・児童発達支援施設から情報を集める","ref":"pp.222, 224"}],"tests":[{"name":"構音検査","note":"単音節（構音点・構音様式で整理）、単語（語頭・語中・語尾）、会話明瞭度","ref":"pp.239–240"},{"name":"聴覚的記銘力の検査","note":"語音弁別検査、聴覚的記銘力検査、被刺激性の検査","ref":"p.240"},{"name":"発語器官の運動機能の観察","note":"舌・口唇・軟口蓋の動き、鼻咽腔閉鎖","ref":"p.240"},{"name":"言語発達の検査","note":"LCSA（学齢版 言語・コミュニケーション発達スケール）など","ref":"p.224"}]},"specific":[{"title":"構音障害の見方","ref":"pp.237–238","body":["器質性（口蓋裂など）では、手術や歯科との連携を含めて医療の経過と併せて見る。口蓋裂の既往がある子どもは滲出性中耳炎やむし歯になりやすい。","発達性（機能性）では、構音の誤りが発達の個人差の範囲か、指導を要する状態かを、年齢と誤りの型（置換・省略・ひずみ）で見る。","指導は、発語器官の運動、音の聴覚的な認知、構音の誘導の順で組み立てる。方法の詳細は手引 pp.224–227 を参照。"]},{"title":"吃音の見方","ref":"pp.238–239","body":["連発（音の繰り返し）、伸発（引き伸ばし）、難発（出にくさ）の中核症状と、話す前の緊張や顔・身体の動き（随伴症状）を分けて見る。","日や場面、相手によって変わる（波現象）。音読や発表、電話、名前を言う場面など苦手な場面と、楽に話せる場面の両方を把握する。","回避（言い換え、話さない）が増えると、話す機会と自己肯定感が下がる。流暢さを求めすぎず、楽に話せる体験と、吃音について本人が学ぶことを指導の柱にする（手引 pp.227–228）。"]}],"guidance":{"intro":"手引が言語障害について挙げている指導内容と支援の要点です。指導の方法は手引の該当ページを参照してください。","preschool":null,"school":{"label":"特別な指導内容","ref":"pp.224–229","items":["構音障害の指導（発語器官の運動機能、音の聴覚的認知、構音の誘導、口蓋裂の既往がある子どもの健康管理）","流暢性の指導（楽に話せる環境、楽に話す体験、難発から抜け出す方法、苦手な場面・語音の緊張の解消、日常のコミュニケーションの態度）","言語機能の基礎的事項（コミュニケーションの態度と意欲、言語活動の促進、生活場面での使用、言語スキル、AAC・ICT）","障害特性の理解と環境調整（吃音について学ぶ、担任への伝え方）","困難を改善しようとする意欲"]},"accommodation":{"label":"合理的配慮を含む支援の内容","ref":"pp.230–231","groups":[{"title":"教育内容・方法","items":["個別の発音指導、音読や合唱の個別対応","書く・文字入力による代替、音読箇所の予告と練習時間"]},{"title":"支援体制","items":["言語聴覚士との連携、通級の活用","避難訓練での代替手段の確認"]},{"title":"施設・設備","items":["他の子どもと共通（特別な設備は要しない）"]}]}},"placesIntro":"手引 §2（pp.232–235）に基づく程度と学びの場の目安です。言語障害には特別支援学校の区分はなく、通級による指導と言語障害特別支援学級が対象です。","conditionsIntro":"手引が名前を挙げる疾患は口蓋裂です。構音障害・吃音・言語発達の遅れは状態として軸の表にあります。","conditionGroups":[{"title":"器質性構音障害の原因","items":[{"name":"口唇裂・口蓋裂","axis":"原因／器質性","line":"生まれつき口唇や口蓋が閉じていない。手術後も鼻にかかる声や構音の誤りが残ることがあり、歯科矯正と言語聴覚士の指導が長期に続く。滲出性中耳炎やむし歯になりやすい。","ref":"pp.225, 237","links":[{"label":"日本形成外科学会「口唇口蓋裂」","url":"https://jsprs.or.jp/general/disease/umaretsuki/kuchi/koshinkogairetsu.html","sourceId":"jsprs-disease"}]}]}],"terms":[{"term":"連発・伸発・難発","desc":"吃音の中核症状。音の繰り返し、引き伸ばし、出にくさ。","ref":"p.238"},{"term":"波現象","desc":"吃音の状態が日・場面・相手で変動すること。1回の観察で判断しない。","ref":"p.239"},{"term":"随伴症状","desc":"話す前や話すときに現れる顔・身体の動きや緊張。","ref":"p.239"},{"term":"置換・省略・ひずみ","desc":"構音の誤りの型。別の音になる、音が抜ける、正しい音にならない。","ref":"p.237"},{"term":"器質性・発達性（機能性）","desc":"構音器官の構造や機能に原因があるか、構造に異常がないか。","ref":"p.237"},{"term":"鼻咽腔閉鎖機能","desc":"軟口蓋が鼻への通路を閉じる働き。口蓋裂で問題になり、鼻にかかる声の原因になる。","ref":"p.238"},{"term":"被刺激性","desc":"手本を聞かせたときに正しい音が出せるか。指導のしやすさの目安。","ref":"p.240"},{"term":"AAC","desc":"拡大・代替コミュニケーション。文字盤、絵カード、音声出力装置など、話し言葉を補う手段。","ref":"p.229"}],"related":[{"label":"聴覚障害のページ","route":"#/c/hearing","note":"難聴に起因する言葉の問題"},{"label":"日本形成外科学会「口蓋裂」","url":"https://jsprs.or.jp/general/disease/umaretsuki/kuchi/kogairetsu.html","sourceId":"jsprs-disease"},{"label":"肢体不自由のページ","route":"#/c/physical","note":"脳性まひに伴う構音の問題"}],"sources":["tebiki-3-language","tebiki"],"reviewed":"2026-10-06","sheet":{"seed":"例：音読のときに言葉が出にくく、発表を嫌がる。日によって話しやすさが違う","ask":"例：本人が話し方を気にしている。周りの子どもにどう伝えるか"},"fields":[{"k":"kind","label":"主な状態","type":"select","options":["構音障害","吃音","言語発達の遅れ・偏り","複数","不明・未確認"],"col":"status","ref":"p.235"},{"k":"organic","label":"原因","type":"select","options":["器質性","機能性・発達性","他の障害に主として起因","不明・未確認"],"col":"status","ref":"p.236","hint":"器質性は口蓋裂など構音器官の構造によるもの"},{"k":"err","label":"構音の誤りの型","type":"checks","options":["置換","省略","ひずみ","鼻にかかる"],"col":"status","ref":"p.237"},{"k":"sounds","label":"誤りやすい音・苦手な音","type":"text","col":"status","ref":"p.237"},{"k":"stut","label":"吃音の中核症状","type":"checks","options":["連発","伸発","難発"],"col":"status","ref":"p.238"},{"k":"scenes","label":"苦手な場面・楽に話せる場面","type":"text","col":"status","ref":"p.239"},{"k":"clarity","label":"会話の明瞭度","type":"select","options":["ほぼ全て分かる","時々聞き返す","半分程度","ほとんど分からない","不明・未確認"],"col":"status","ref":"p.220"},{"k":"doc","label":"構音検査・言語検査の結果","type":"image","col":"status","ref":"p.239","hint":"手元にあれば、AIが必要な時点で内容を聞いてきます"},{"k":"st","label":"言語聴覚士の評価と支援の内容","type":"textarea","col":"status","ref":"p.222"},{"k":"hear","label":"自分の発音と手本の違いに気付くか","type":"select","options":["気付く","時々","気付きにくい","不明・未確認"],"col":"development","ref":"p.222"},{"k":"self","label":"自分の話し方についての受け止め","type":"select","options":["気にしていない","気にしている","話すのを避ける","不明・未確認"],"col":"strengths","ref":"p.223"}]}},{"id":"autism","num":"07","name":"自閉症","en":"Autism","overview":"①他者との社会的関係の形成の困難さ、②言葉の発達の遅れ、③興味や関心が狭く特定のものにこだわること、を特徴とする発達の障害。3歳くらいまでに特徴が現れることが多く、感覚の過敏性・鈍感性を伴うこともあります。","places":[{"name":"通常の学級","note":"視覚的な指示提示等の配慮を受けながら一斉授業に参加"},{"name":"通級による指導（自閉症）","note":"対人関係やコミュニケーションに関する自立活動を一部時間で実施"},{"name":"自閉症・情緒障害特別支援学級","note":"他人との意思疎通・対人関係の形成が困難な程度の子どもが対象"}],"quote":"自閉症とは、①他者との社会的関係の形成の困難さ、②言葉の発達の遅れ、③興味や関心が狭く特定のものにこだわることを特徴とする発達の障害である。","sourceId":"tebiki-3-autism","programCriteria":{"notice":"平成25年10月4日付け25文科初第756号 文部科学省初等中等教育局長通知（別紙）","sourceId":"mext-756","entries":[{"program":"特別支援学級","term":"自閉症・情緒障害者","text":"自閉症又はそれに類するもので，他人との意思疎通及び対人関係の形成が困難である程度のもの","part":"一"},{"program":"通級による指導","term":"自閉症者","text":"自閉症又はそれに類するもので，通常の学級での学習におおむね参加でき，一部特別な指導を必要とする程度のもの"}],"headNote":"特別支援学級では自閉症と情緒障害が「自閉症・情緒障害者」という一つの区分にまとめられ、二つの号が置かれています。ここでは自閉症にあたる第一号を引用しています。","note":"特別支援学級・通級による指導の対象となる障害の程度として、国が示した目安です。学級の設置や指導の実施は市町村教育委員会の判断によるため、この程度に該当すれば必ず利用できるというものではありません。"},"v5":true,"diseases":{"v5":true,"id":"autism","axisType":"profile","axisTypeLabel":"特性の現れ方で見る","definition":"他者との社会的な関係の形成の困難、言葉の発達の遅れ、興味や関心が狭く特定のものにこだわる、という3つの特性を持ち、中枢神経系の機能不全が推定される状態です。3歳くらいまでに現れることが多いとされます。手引は法令・通知に基づき「自閉症」と呼び、医学の診断名では自閉スペクトラム症に当たります。臨床像は一人一人異なり、成長の過程で変化します。","definitionRef":"pp.243, 259","axesIntro":"自閉症は、3つの基本特性の現れ方、知的障害の有無、感覚などの特徴、併存で状態像を見ます。「高機能自閉症」「アスペルガー症候群」は軸②の区分です。","axes":[{"name":"3つの基本特性の現れ方","levels":["他者との社会的関係の形成の困難","言葉の発達の遅れ（反響言語、独特の話し方）","興味や関心が狭く特定のものにこだわる（「特定のもの」へのこだわりと「同じもの」へのこだわり）"],"meaning":"こだわりは不安を抑えている状態でもあり、無理に止めるとパニックに至ることがある。成人期に顕在化することもある。","ref":"pp.259–260"},{"name":"知的障害の有無","levels":["知的発達の遅れを伴う","伴わない（高機能自閉症。アスペルガー症候群は知的・言語発達に遅れがない）"],"meaning":"学びの場（知的障害特別支援学級・特別支援学校か、自閉症・情緒障害特別支援学級か）に直結する。","ref":"pp.256, 260"},{"name":"感覚・認知の特徴","levels":["感覚の過敏性・鈍感性（視覚・聴覚・触覚・味覚・嗅覚）","刺激の過剰選択性（一部にだけ注目する）","中枢性統合の弱さ（全体より部分）","視覚認知の優位"],"meaning":"パニックや情緒の不安定の原因が特定の感覚刺激であることがある。観察して把握する。","ref":"pp.260–261"},{"name":"併存","levels":["知的障害","言語障害","ADHD、LD","不安症、発達性協調運動障害","てんかん"],"meaning":"併存の有無を確認して特性を理解する。検査の結果にも影響する。","ref":"pp.245, 261"},{"name":"年齢・知的能力による変化","levels":["幼児期","学齢期","思春期以降"],"meaning":"臨床像は成長の過程で変化する。一度の検査で把握せず、経時的に複数回見る。","ref":"pp.247, 261"}],"assessmentIntro":"手引の「状態等の把握」を校内様式の5つの欄に対応させた観点の一覧です。慣れた場で、経時的に、複数の方法で把握します。","assessment":{"status":[{"text":"3つの特性の現れ方：人との関わり、言葉とコミュニケーションの様子、こだわりの対象と強さ","ref":"pp.244, 259–260"},{"text":"感覚の過敏性・鈍感性（音、光、触感、味、におい）。パニックや不安定さの引き金になる刺激","ref":"pp.244, 260"},{"text":"併存する障害（知的障害、LD・ADHD、発達性協調運動障害、てんかん）、服薬","ref":"p.245"},{"text":"幼児期の発達の状況（乳幼児健診、発達相談・5歳児健診、就学時健診）、療育の内容","ref":"p.245"},{"text":"入院歴・服薬、育った国や言語の環境","ref":"p.244"}],"development":[{"text":"生活リズム、基本的生活習慣（偏食、衣服、身だしなみ）","ref":"p.245"},{"text":"活動への参加の状況：ルールのある遊びを理解して参加できるか","ref":"p.246"},{"text":"意思の伝達の力と手段（言葉、絵カード、身振り）","ref":"p.246"},{"text":"知的発達。特定の分野の成績が特に高いことがあり、知的障害の全般的な困難とは異なる","ref":"pp.246, 248"},{"text":"情緒の安定（環境の変化による緊張）","ref":"p.246"}],"interest":[{"text":"特定の分野への深い関心（強みにもなる）。没頭する対象と、そこから広げられること","ref":"pp.247–248"},{"text":"園等での遊びの中の関わり、興味・関心（日常の場での直接観察が有効）","ref":"p.249"}],"strengths":[{"text":"感覚や認知の特性（偏食の背景、感触への没頭、視覚認知の優位）","ref":"p.247"},{"text":"自分で環境を調整しようとするか。場所・道具・手順を整理しようとするか。気持ちを切り替える手段を持っているか","ref":"p.247"},{"text":"社会性と集団参加：字義どおりの受け止め、表情の読み取り、順番・勝ち負け・役割の理解。ルールを理解していないのか、説明が足りないのか。受け身型の子は従っているように見えても理解しているか慎重に","ref":"pp.247–248"},{"text":"学習の状況（読み書き、板書、視写・模写、道具への苦手意識）、自己理解","ref":"p.248"}],"wish":[{"text":"本人の思いや願い。本人が答えやすい形（選択肢、書く、絵）で聞く","ref":"p.248"},{"text":"保護者の思いや願いと、家庭での工夫","ref":"p.249"}],"how":[{"text":"慣れ親しんだ場所で観察する。知的発達・言語・社会性・運動と特性の現れ方を総合的に見る","ref":"p.245"},{"text":"複数の検査を適切な間隔で経時的に行う。教示が理解できない時期があることを踏まえる","ref":"pp.248–249"},{"text":"検査結果のアンバランス（運動は高く社会性・言語は低い、動作性が高い、記憶の一部が高い）を読む","ref":"p.248"},{"text":"療育機関、園・児童発達支援施設、医療機関から情報を集める","ref":"pp.245, 249"}],"tests":[{"name":"知能・発達検査","note":"田中ビネーV、WISC-IV、KABC-II、新版K式発達検査","ref":"p.248"},{"name":"自閉症の特性の評価","note":"PEP-R（心理教育プロフィール）、ADOS-2（自閉症診断観察検査）","ref":"p.248"}]},"specific":[{"title":"感覚の過敏性とこだわりの見方","ref":"pp.260–261","body":["聴覚の過敏（チャイム、ざわめき）、触覚の過敏（服のタグ、糊）、味覚・嗅覚（偏食の背景）、視覚（蛍光灯のちらつき）など、どの刺激にどう反応するかを場面ごとに記録する。鈍感さ（痛みや温度に気付きにくい）も安全に関わる。","こだわりは「特定のもの」へのこだわりと「同じもの・同じ手順」へのこだわりに分けて見る。不安を抑えている面があるので、無理に止めず、予告と代替で変化に備える。","刺激の過剰選択性（一部にだけ注目する）と中枢性統合の弱さ（全体より部分）は、指示の受け取り方と学習の仕方に直結する。"]},{"title":"構造化（手引が示す支援の枠組み）","ref":"pp.261–262","body":["物理的構造化（場所と活動を対応させる）、時間の構造化（予定の見える化）、活動の構造化（何をどれだけ、いつ終わるか）、一連の流れの構造化、課題の構造化の5つ。","決まった形はなく、一人一人に合わせて作り、定期的に見直す。外していく場合もある。全ての子どもに有効な場合もある。"]}],"guidance":{"intro":"手引が自閉症について挙げている指導内容と支援の要点です。","preschool":null,"school":{"label":"特別な指導内容","ref":"pp.249–252","items":["他者との関わりの基礎","情緒の安定（落ち着ける場所、絵カードで気持ちを伝える）","状況の理解と変化への対応（事前の予告、事前体験、行動の仕方を短い文で）","障害特性の理解と環境調整（自ら刺激を調整し、依頼する）","感覚調整の補助・代行手段（イヤーマフ、ノイズキャンセリング）","概念の形成（手順表、全体の把握、一斉指示の後の個別指示）","他者の意図や感情の理解","生活習慣の形成（偏食、衣服、身だしなみ、体調の気付き）"]},"accommodation":{"label":"合理的配慮を含む支援の内容","ref":"pp.252–254","groups":[{"title":"教育内容・方法","items":["動作で意味を理解、道具の使い方の反復、基礎・基本の確実な習得","視覚情報、扱いやすい道具、活動予定表、体験の機会","二次的な情緒障害・不登校・自尊感情の低下の予防"]},{"title":"支援体制","items":["センター的機能と学級と医療の連携","理解啓発（受け止められないことがある、言葉の理解、こだわり）","災害時のパニックを想定した体制"]},{"title":"施設・設備","items":["動線の視覚化、クールダウンの場所","蛍光灯のちらつきへの対応、避難所での落ち着ける空間"]}]}},"placesIntro":"手引 §2（pp.254–258）に基づく程度と学びの場の目安です。知的障害を伴い教科を替える必要があれば知的障害特別支援学級を検討します。自閉症と選択性かん黙は原因と対応が異なるので、学級内のグループ編成を工夫します。","conditionsIntro":"自閉症の特性を伴うことがある疾患です。各行は要点で、詳しくはリンク先を参照してください。","conditionGroups":[{"title":"自閉症の特性を伴うことがある疾患","items":[{"name":"てんかん（併存）","axis":"併存","line":"自閉症に医学的に併存することが多い。発作の型と服薬、緊急対応を要する発作かどうかを主治医から確認する。","ref":"p.261","links":[{"label":"日本神経学会 てんかん","url":"https://www.neurology-jp.org/public/disease/tenkan_detail.html","sourceId":"neurology-jp"}]},{"name":"脆弱X症候群","axis":"併存／遺伝性","line":"遺伝性の知的障害で最も多く、自閉症の特性や多動、感覚の過敏を伴うことが多い。小児慢性特定疾病。","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/11_11_032/","sourceId":"shouman"},{"label":"GeneReviews Japan FMR1関連疾患","url":"https://plaza.umin.ac.jp/~grj/grj/fmr1.htm","sourceId":"grj"}]},{"name":"結節性硬化症","axis":"併存／遺伝性","line":"脳などに良性の腫瘍ができる。てんかん、知的障害とともに自閉症の特性を伴うことが多い。指定難病・小児慢性特定疾病。","links":[{"label":"難病情報センター（指定難病158）","url":"https://www.nanbyou.or.jp/entry/4384","sourceId":"nanbyou"},{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/11_07_018/","sourceId":"shouman"}]},{"name":"レット症候群","axis":"併存／遺伝性（主に女児）","line":"乳児期以降に発達の後退、手の常同運動、言葉の喪失が現れる。自閉症と似た時期があるが別の疾患で、てんかんや側弯、呼吸の異常を伴う。小児慢性特定疾病。","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/11_06_017/","sourceId":"shouman"},{"label":"GeneReviews Japan","url":"https://plaza.umin.ac.jp/~grj/grj/rett.htm","sourceId":"grj"}]}]}],"terms":[{"term":"自閉スペクトラム症（ASD）","desc":"DSM-5の診断名。広汎性発達障害の下位分類（自閉性障害、アスペルガー障害など）を連続した一つの状態像として扱う。本ツールの見出しは法令・通知の「自閉症」。","ref":"p.259"},{"term":"反響言語（エコラリア）","desc":"聞いた言葉をそのまま繰り返す話し方。即時と遅延がある。","ref":"p.260"},{"term":"刺激の過剰選択性","desc":"多くの刺激のうち一部にだけ注目する傾向。指示の一部しか受け取らないことの背景。","ref":"p.261"},{"term":"中枢性統合","desc":"部分を全体にまとめて意味を捉える働き。弱いと細部に注目し、全体の意味が捉えにくい。","ref":"p.261"},{"term":"視覚認知の優位","desc":"聞くより見る方が理解しやすい傾向。視覚的な手掛かりの根拠。","ref":"p.261"},{"term":"受け身型","desc":"指示に従っているように見えるが、理解や意思が伴っていないことがある型。把握は慎重に。","ref":"p.248"},{"term":"構造化","desc":"場所・時間・活動・流れ・課題を分かりやすく整える支援の枠組み。一人一人に合わせて作り、見直す。","ref":"p.262"},{"term":"PEP-R・ADOS-2","desc":"自閉症の特性を評価する検査。医療・療育からの報告に出てくる。","ref":"p.248"}],"related":[{"label":"発達障害ナビポータル","sourceId":"hattatsu-navi"},{"label":"こころの情報サイト「発達障害（神経発達症）」","url":"https://kokoro.ncnp.go.jp/disease.php?%40uid=MbkmLbVbTEhSpxyE","sourceId":"kokoro-ncnp"}],"sources":["tebiki-3-autism","tebiki"],"reviewed":"2026-10-06","sheet":{"seed":"例：予定の変更でパニックになる。休み時間に一人でいることが多く、友達との関わりがうまくいかない","ask":"例：こだわりをどこまで認めるか。落ち着ける場所の使い方"},"fields":[{"k":"iq","label":"知的障害","type":"select","options":["伴わない","伴う・軽度","伴う・中度以上","不明・未確認"],"col":"status","ref":"p.260"},{"k":"comorb","label":"併存","type":"checks","options":["なし","ADHD","LD","不安症","発達性協調運動障害","てんかん"],"col":"status","ref":"p.261"},{"k":"sense","label":"感覚の過敏・鈍感","type":"checks","options":["聴覚","視覚","触覚","味覚・嗅覚","痛みや温度に鈍い"],"col":"status","ref":"p.260"},{"k":"trigger","label":"パニックや不安定の引き金になる刺激・場面","type":"text","col":"status","ref":"p.260"},{"k":"fix","label":"こだわりの対象","type":"text","col":"status","ref":"p.260","hint":"特定のもの、同じ手順"},{"k":"comm","label":"言葉とコミュニケーション","type":"select","options":["会話でやり取りできる","一方的・字義どおり","単語や決まった言い回し","言葉以外の手段","不明・未確認"],"col":"status","ref":"p.246"},{"k":"meds","label":"服薬","type":"text","col":"status","ref":"p.245"},{"k":"doc","label":"検査報告書など","type":"image","col":"status","ref":"p.248","hint":"手元にあれば、AIが必要な時点で内容を聞いてきます"},{"k":"med","label":"医療・療育機関からの情報","type":"textarea","col":"status","ref":"p.245"},{"k":"rule","label":"ルールのある遊びの理解と参加","type":"select","options":["理解して参加","説明があれば","難しい","不明・未確認"],"col":"development","ref":"p.246"},{"k":"adjust","label":"自分で環境を調整する・気持ちを切り替える手段","type":"select","options":["持っている","一部","まだこれから","不明・未確認"],"col":"strengths","ref":"p.247"}]}},{"id":"emotional","num":"08","name":"情緒障害","en":"Emotional Disturbance","overview":"周囲の環境から受けるストレスによって生じたストレス反応として、状況に合わない心身の状態が持続し、自分の意思ではコントロールできない状態。選択性かん黙や不登校などの「内在化」と、かんしゃくなどの「外在化」に大別されます。","places":[{"name":"通常の学級","note":"タブレット端末での文字表現等、負担の少ない手段での参加を支援"},{"name":"通級による指導（情緒障害）","note":"選択性かん黙等について、自立活動を一部時間で実施"},{"name":"自閉症・情緒障害特別支援学級","note":"社会生活への適応が困難な程度の子どもが対象"}],"quote":"情緒障害とは、周囲の環境から受けるストレスによって生じたストレス反応として状況に合わない心身の状態が持続し…コントロールできないことが継続している状態をいう。","sourceId":"tebiki-3-emotional","programCriteria":{"notice":"平成25年10月4日付け25文科初第756号 文部科学省初等中等教育局長通知（別紙）","sourceId":"mext-756","entries":[{"program":"特別支援学級","term":"自閉症・情緒障害者","text":"主として心理的な要因による選択性かん黙等があるもので，社会生活への適応が困難である程度のもの","part":"二"},{"program":"通級による指導","term":"情緒障害者","text":"主として心理的な要因による選択性かん黙等があるもので，通常の学級での学習におおむね参加でき，一部特別な指導を必要とする程度のもの"}],"headNote":"特別支援学級では自閉症と情緒障害が「自閉症・情緒障害者」という一つの区分にまとめられ、二つの号が置かれています。ここでは情緒障害にあたる第二号を引用しています。","note":"特別支援学級・通級による指導の対象となる障害の程度として、国が示した目安です。学級の設置や指導の実施は市町村教育委員会の判断によるため、この程度に該当すれば必ず利用できるというものではありません。"},"v5":true,"diseases":{"v5":true,"id":"emotional","axisType":"profile","axisTypeLabel":"行動の型と背景で見る","definition":"周囲の環境から受けるストレスへの反応として、状況に合わない心身の状態が持続し、自分の意思ではコントロールできないことが続いている状態です。疾患ではなく「行動問題の型」と「背景の要因」が軸で、自閉症とは別のものと位置づけられています。手引は、非行は情緒障害の原因として扱わず、意図的に登校を渋る場合も含めない、と線を引いています。","definitionRef":"pp.266, 280","axesIntro":"情緒障害は、現れている状態だけでなく環境との相互作用で見ます。状態の型、背景の要因、併存、代表的な状態の4つの軸です。","axes":[{"name":"行動問題の型","levels":["内在化（かん黙、過度の不安・恐怖、抑うつ、身体の訴え、集団への不安、不登校、ひきこもり）","外在化（かんしゃく、離席、抜け出し、反抗・暴言・暴力、規則違反、集団からの逸脱）","その他（友達関係、強迫、摂食、自傷）"],"meaning":"内在化は表に出ず「適応しているように見える」ことがある。型によって把握の方法が違う。","ref":"pp.267–268, 280"},{"name":"背景の要因","levels":["対人関係のストレス（いじめ、教師との関係、一方的・威圧的な指導）","学業・部活動の負担（気付かれない能力面の困難、過度な期待、先輩後輩）","親子関係（虐待。反抗期との区別は慎重に）","気質と精神疾患（不安症群、強迫性障害、適応障害、うつ病、摂食障害、PTSD）"],"meaning":"要因が違えば対応が違う。担任の言動そのものが環境因子になる。","ref":"pp.270–271, 281"},{"name":"併存する障害","levels":["自閉症","ADHD、LD","知的障害","身体疾患が背景にある場合"],"meaning":"原因が違えば対応が違う。選択性かん黙は自閉症と判別が付きにくいことがある。","ref":"pp.268, 281"},{"name":"代表的な状態","levels":["選択性かん黙（場面緘黙）","心理的要因が大きい不登校","習癖（指しゃぶり、爪かみ、抜毛、常同行動）が集団適応を妨げる場合","ストレスで増強・長期化するチック"],"meaning":"選択性かん黙は、対人緊張の自己防衛が固定化したもので、話さないことを選んでいるのではない。時期（緊張を和らげる時期／話せるようになる時期）で中心課題が変わる。","ref":"pp.281–282"}],"assessmentIntro":"手引の「状態等の把握」を校内様式の5つの欄に対応させた観点の一覧です。どんな場・相手なら落ち着けるか、何がきっかけで崩れるかを書きます。個別式の知能検査で全般的な遅れがないことを確かめます。","assessment":{"status":[{"text":"行動問題の状態：内在化・外在化・その他のどれが、いつから、どの場面で","ref":"pp.267–268"},{"text":"身体の症状（不眠、頭痛、腹痛、食事と排泄の問題）。身体の訴えは感情の不安定さのサインで、不登校の初期に多い","ref":"p.268"},{"text":"併存する障害（自閉症、ADHD、LD、知的障害）、医療歴・服薬","ref":"pp.267–268"},{"text":"生育環境、知的機能の状態、家庭や学校での生活の状態","ref":"p.267"},{"text":"習癖や常同行動が長期・頻回で、学習や集団に支障があるか","ref":"p.268"}],"development":[{"text":"生活リズム","ref":"p.269"},{"text":"身辺自立。「できるけれども何らかの事情でやれない」面に留意する","ref":"p.269"},{"text":"集団参加：個別の配慮があれば参加できるか、模倣で参加できるか","ref":"p.269"},{"text":"知的発達（全般的な遅れがないことの確認）","ref":"p.269"}],"interest":[{"text":"安心して取り組めること、達成感を得られている活動","ref":"pp.270–271"},{"text":"園等での遊びの中の関わり、興味・関心","ref":"p.272"}],"strengths":[{"text":"自分を安定させる支援や配慮を理解しているか。緊張を軽減する方法を使おうとするか。支援機器の活用","ref":"p.269"},{"text":"学習への意欲と学習の状況（学習の空白）","ref":"pp.269–270"},{"text":"意思の伝達：手段を持っているか（言葉以外も含めて）","ref":"p.270"},{"text":"自己理解（低学年から気付いていることがある。自己の確立と関連）","ref":"p.270"},{"text":"環境との関係：どんな場・相手・活動なら落ち着けるか。達成感を得られない状況が続くと無気力→孤立・学業不振に向かう","ref":"pp.270–271"}],"wish":[{"text":"本人の思いや願い。話すことが難しければ、書く・選ぶ・指さすなどの方法で","ref":"pp.270, 273"},{"text":"保護者の思いや願い、家庭での様子と関わり方","ref":"pp.271–272"}],"how":[{"text":"行動観察と心理アセスメントを基に、必要に応じて知的発達を把握する。焦点を絞ったアセスメントは巡回相談員や外部の専門家と相談する","ref":"p.270"},{"text":"環境との相互作用を見る：いつ・どこで・誰と・何をしているときに状態が変わるか","ref":"pp.270–271"},{"text":"中学校段階からは成人と同じ不安や強迫の状態が見られることがあり、医療と連携する","ref":"p.268"},{"text":"園・児童発達支援施設、スクールカウンセラー、医療機関から情報を集める","ref":"pp.270, 272"}],"tests":[{"name":"個別式知能検査","note":"全般的な遅れがないことの確認","ref":"p.269"},{"name":"行動観察と心理アセスメント","note":"焦点化したアセスメントは外部の専門家と相談","ref":"p.270"}]},"specific":[{"title":"選択性かん黙（場面緘黙）の見方","ref":"pp.281–282","body":["家庭では話せるのに、学校など特定の場面で話せない。対人緊張に対する自己防衛が固定化したもので、話さないことを選んでいるのではない。","時期によって中心課題が変わる。緊張を和らげる時期は、話すことを求めず、非言語の手段（指さし、カード、筆談）で参加を保障する。話せるようになる時期は、話しやすい条件（相手、場所、定型的な場面）からスモールステップで。","自閉症と判別が付きにくいことがある。原因と対応が異なるので、学級内のグループ編成を工夫する。"]},{"title":"心理的な要因が大きい不登校の見方","ref":"pp.278, 281","body":["情緒障害のページでは「障害としての把握」（ストレス反応としての状態と背景の要因）を扱い、学校の組織的な対応は生徒指導上の課題「不登校」のページで扱う。","段階的な登校の促しを考慮し、教育支援センターが適切な場合もある。意図的に登校を渋る場合は情緒障害に含めない。","身体の訴え（腹痛・頭痛）は不登校の初期に多い。病弱・身体虚弱のページの心身症と併せて見る。"]}],"guidance":{"intro":"手引が情緒障害について挙げている指導内容と支援の要点です。","preschool":null,"school":{"label":"特別な指導内容","ref":"pp.272–274","items":["情緒の安定（本人と相談して落ち着ける支援を決める。非言語的なコミュニケーションを認める。書いて発表する）","状況の理解と変化への対応（一緒に活動する、視覚的なスケジュール、写真や動画で行事を予告）","非言語的コミュニケーションの表出（指さし、カード）","状況に応じたコミュニケーション（共感しながら一緒に活動、日記・作文、筆談）","言語の表出（スモールステップ、話しやすい条件、定型的な発話場面、ICレコーダー）"]},"accommodation":{"label":"合理的配慮を含む支援の内容","ref":"pp.274–276","groups":[{"title":"教育内容・方法","items":["社会適応に必要な技術と態度、学習の空白への配慮","一律の評価で不利益を生じさせない（タブレットで発表、身振りで意思表示）","緊張や不安の緩和、学習機会の確保"]},{"title":"支援体制","items":["カウンセリング的な対応と、医師の診断を踏まえた対応","センター的機能と学級と医療の連携、理解啓発","災害時の心理的な混乱への備え"]},{"title":"施設・設備","items":["動線の分かりやすさ、クールダウンの場所","刺激を制限できる避難場所"]}]}},"placesIntro":"手引 §2（pp.276–280）に基づく程度と学びの場の目安です。通級は主として心理的な要因による選択性かん黙等、自閉症・情緒障害特別支援学級（第二号）は社会生活への適応が困難な場合です。","conditionsIntro":"背景にあることがある精神疾患と、状態として把握するものです。不登校・自傷・摂食障害への学校の対応は、生徒指導上の課題のページにあります。","conditionGroups":[{"title":"背景にあることがある精神疾患","items":[{"name":"不安症群（社交不安症・分離不安症・全般性不安症・パニック症）","axis":"背景要因／気質と精神疾患","line":"過度の不安や恐怖が続き、回避や身体の症状が出る。選択性かん黙や登校しぶりの背景になることがある。","ref":"p.271","links":[{"label":"こころの情報サイト「不安症」","url":"https://kokoro.ncnp.go.jp/disease.php?%40uid=BLA9JV0KhiWPIMzX","sourceId":"kokoro-ncnp"}]},{"name":"うつ病","axis":"背景要因／気質と精神疾患","line":"気分の落ち込み、意欲や集中の低下、睡眠や食欲の変化が続く。子どもでは不機嫌やいらだちとして現れることがある。","ref":"p.271","links":[{"label":"こころの情報サイト「うつ病」","url":"https://kokoro.ncnp.go.jp/disease.php?%40uid=9D2BdBaF8nGgVLbL","sourceId":"kokoro-ncnp"}]},{"name":"強迫性障害","axis":"背景要因／気質と精神疾患","line":"不合理と分かっていても止められない考えや行為（確認、手洗い）を繰り返す。中学校段階から目立つことがある。","ref":"pp.268, 271","links":[{"label":"こころの情報サイト「強迫性障害」","url":"https://kokoro.ncnp.go.jp/disease.php?%40uid=MiyHEH6ZUZDxDeYX","sourceId":"kokoro-ncnp"}]},{"name":"心的外傷後ストレス障害（PTSD）","axis":"背景要因／気質と精神疾患","line":"強い恐怖体験のあとに、再体験・回避・過覚醒が続く。虐待や事故・災害の経験と関わる。","ref":"p.271","links":[{"label":"こころの情報サイト「PTSD」","url":"https://kokoro.ncnp.go.jp/disease.php?%40uid=iGkwv4PNzgWhQ9xI","sourceId":"kokoro-ncnp"}]},{"name":"摂食障害","axis":"背景要因／気質と精神疾患","line":"極端な食事制限や過食を繰り返す。身体の管理が要るため、病弱・身体虚弱のページと併せて見る。","ref":"p.271","links":[{"label":"こころの情報サイト「摂食障害」","url":"https://kokoro.ncnp.go.jp/disease.php?%40uid=daWRhKdTNvsjgjM5","sourceId":"kokoro-ncnp"}]}]},{"title":"状態として把握するもの","items":[{"name":"チック症（ストレスで増強・長期化する場合）","axis":"代表的な状態","line":"まばたきや咳払いなど意図しない動きや声の繰り返し。多くは一過性だが、ストレスで増え長引くことがある。叱責は逆効果。","ref":"p.282","links":[{"label":"日本小児心身医学会 代表的な疾患","url":"https://www.jisinsin.jp/general/typical_diseases/","sourceId":"jisinsin"}]}]}],"terms":[{"term":"内在化・外在化","desc":"行動問題を、内に向かう型（不安・抑うつ・かん黙）と外に向かう型（かんしゃく・暴言・逸脱）に分ける見方。","ref":"p.280"},{"term":"選択性かん黙（場面緘黙）","desc":"家庭では話せるのに特定の場面で話せない状態。自己防衛の固定化で、選んで黙っているのではない。","ref":"p.281"},{"term":"身体愁訴","desc":"腹痛・頭痛など身体の不調の訴え。感情の不安定さのサインであることがある。","ref":"p.268"},{"term":"習癖・常同行動","desc":"指しゃぶり、爪かみ、抜毛、同じ動きの繰り返しなど。長期・頻回で学習や集団に支障がある場合に把握の対象になる。","ref":"pp.268, 282"},{"term":"ストレス反応","desc":"環境からのストレスに対して心身に現れる反応。情緒障害の定義の中心。","ref":"p.280"}],"related":[{"label":"こころの情報サイト","sourceId":"kokoro-ncnp","note":"精神疾患の一般向け解説"}],"sources":["tebiki-3-emotional","tebiki"],"reviewed":"2026-10-06","sheet":{"seed":"例：学校では話せないが家では話せる。教室には入れるが、指名されると固まってしまう","ask":"例：話すことを求めないで参加できる方法と、次の段階へ進む時期の見極め"},"fields":[{"k":"type","label":"行動問題の型","type":"checks","options":["内在化","外在化","その他"],"col":"status","ref":"p.280","hint":"内在化＝かん黙・不安・抑うつ・不登校、外在化＝かんしゃく・離席・反抗、その他＝強迫・摂食・自傷"},{"k":"state","label":"代表的な状態","type":"select","options":["該当なし","選択性かん黙","心理的要因が大きい不登校","習癖","チック","不明・未確認"],"col":"status","ref":"p.281"},{"k":"body","label":"身体の症状","type":"checks","options":["なし","不眠","頭痛","腹痛","食事・排泄の問題"],"col":"status","ref":"p.268"},{"k":"bg","label":"背景の要因として考えられること","type":"checks","options":["対人関係","学業・部活動の負担","家庭の状況","気質・精神疾患","不明"],"col":"status","ref":"p.270"},{"k":"comorb","label":"併存する障害","type":"checks","options":["なし","自閉症","ADHD","LD","知的障害"],"col":"status","ref":"p.268"},{"k":"medical","label":"医療機関の受診・服薬","type":"text","col":"status","ref":"p.267"},{"k":"doc","label":"検査報告書など","type":"image","col":"status","ref":"p.270","hint":"手元にあれば、AIが必要な時点で内容を聞いてきます"},{"k":"env","label":"どんな場・相手・活動なら落ち着けるか","type":"textarea","col":"strengths","ref":"p.270"},{"k":"calm","label":"自分を安定させる方法を使おうとするか","type":"select","options":["使える","促されれば","まだこれから","不明・未確認"],"col":"strengths","ref":"p.269"},{"k":"join","label":"集団参加","type":"select","options":["参加できる","個別の配慮があれば","模倣で参加","難しい","不明・未確認"],"col":"development","ref":"p.269"}]}},{"id":"ld","num":"09","name":"学習障害（LD）","en":"Learning Disabilities","overview":"全般的な知的発達に遅れはないが、聞く・話す・読む・書く・計算する・推論するといった特定の能力の習得や使用に著しい困難を示す状態。「見えにくい障害」であり、努力不足と誤解されやすい点に注意が必要です。","places":[{"name":"通常の学級","note":"基本的な学びの場。個に応じた教材の工夫等により学習に参加"},{"name":"通級による指導（学習障害）","note":"自分に合った学習方法や代替手段の活用力を育てる自立活動を実施"}],"quote":"学習障害とは…聞く、話す、読む、書く、計算する又は推論するといった学習に必要な基礎的な能力のうち…なかなか習得できなかったり、うまく発揮することができなかったりする…状態をいう。","sourceId":"tebiki-3-ld","programCriteria":{"notice":"平成25年10月4日付け25文科初第756号 文部科学省初等中等教育局長通知（別紙）","sourceId":"mext-756","entries":[{"program":"通級による指導","term":"学習障害者","text":"全般的な知的発達に遅れはないが，聞く，話す，読む，書く，計算する又は推論する能力のうち特定のものの習得と使用に著しい困難を示すもので，一部特別な指導を必要とする程度のもの"}],"absent":[{"program":"特別支援学級","reason":"この通知が示す特別支援学級の対象に学習障害者は挙げられていません。学習障害は通級による指導の対象として定められています。"}],"note":"特別支援学級・通級による指導の対象となる障害の程度として、国が示した目安です。学級の設置や指導の実施は市町村教育委員会の判断によるため、この程度に該当すれば必ず利用できるというものではありません。"},"v5":true,"diseases":{"v5":true,"id":"ld","axisType":"profile","axisTypeLabel":"困難の領域で見る","definition":"全般的な知的発達に遅れはないが、聞く・話す・読む・書く・計算する・推論するのうち、一つまたは複数の特定の能力の習得と使用に著しい困難を示す状態です。中枢神経系の機能不全が推定され、視覚・聴覚・知的・情緒の障害や環境の要因が直接の原因ではありません。手引は「学習障害」と呼び、医学の診断名では限局性学習症に当たります。「見えにくい障害」で、努力不足とみなされたり、本人が隠したりしやすい点に注意が要ります。","definitionRef":"pp.285, 300","axesIntro":"学習障害は、困難の領域、知的発達との関係、認知の偏り、併存と二次的な問題の4つの軸で見ます。","axes":[{"name":"困難を示す領域","levels":["聞く","話す","読む","書く","計算する","推論する"],"meaning":"手引が各能力の内容を定義している。どの領域かで検査も代替手段も違う。英語は表記と読みの対応が複雑で困難が出やすい。","ref":"pp.300–302"},{"name":"知的発達との関係","levels":["全般的な遅れがない（知的障害とは重複しない）","高学年以降、学習障害が原因で全般的な遅れに見えることがある"],"meaning":"個別式の知能検査で確認する。過去に知的障害の疑いがあっても即座に否定しない。","ref":"pp.288, 302"},{"name":"認知の偏り","levels":["視覚・聴覚の情報処理","言語の力・語彙","注意の持続","記憶","不器用さ","発達の進んでいる側面"],"meaning":"下位項目ごとに分析して実態と関連付ける。得意な力を、苦手を補う手段に使う。","ref":"pp.287, 290"},{"name":"併存と二次的な問題","levels":["ADHD、自閉症","運動機能の障害、視覚・聴覚の障害","不登校・心身症・不安やうつ","学年が進むと全般的な学力不振や怠学に見える"],"meaning":"ADHDや自閉症が原因なら学習障害の判断は慎重に行うが、併存は多い。","ref":"pp.287, 302–303"}],"assessmentIntro":"手引の「状態等の把握」を校内様式の5つの欄に対応させた観点の一覧です。チェックリストで気付き、通常の学級でできるアセスメントから始め、必要に応じて個別検査へ進みます。","assessment":{"status":[{"text":"困難の領域（聞く・話す・読む・書く・計算する・推論する）と、その程度。ノート、提出物や作品、学力検査や成績、宿題の取組、読み書きのチェックリストで確認する","ref":"pp.286–287"},{"text":"認知の偏り（視覚・聴覚の情報処理、言語、注意、記憶、不器用さ）と、進んでいる側面。検査結果の要点","ref":"pp.287, 290"},{"text":"全般的な知的発達に遅れがないこと（個別式知能検査）","ref":"p.288"},{"text":"併存する障害（ADHD・自閉症）、二次的な問題、運動機能、視覚・聴覚","ref":"p.287"},{"text":"幼児期の発達の状況（乳幼児健診、発達相談・5歳児健診、就学時健診）、育った国や言語の環境、服薬","ref":"p.286"}],"development":[{"text":"言語面：文字への興味、言い間違い、しりとりなど音の分解・抽出、名前の記憶（就学前）","ref":"p.288"},{"text":"運動面：身体の使い方、鉛筆・はさみの操作","ref":"p.288"},{"text":"感覚や認知：見え方・聞こえ方、形の弁別、上下左右","ref":"p.288"},{"text":"姿勢、集中力","ref":"p.288"}],"interest":[{"text":"得意な力と興味・関心（学習中の様子から）。苦手を補う手段の手掛かりになる","ref":"p.287"},{"text":"園等での遊びの中の関わり、興味・関心","ref":"p.291"}],"strengths":[{"text":"教科学習上の困難のサイン：聞いて理解できているか、話して伝えられるか、音読の読み間違い・拾い読み・遅さ、書く時間と書き誤り、ひらがな・漢字の習得、板書で何度も黒板を見る、数の順番と大きさ、指を使う計算・九九、図形の模写","ref":"pp.288–289"},{"text":"聞けば分かる、図なら表せる、口頭なら答えられる、など得意な経路","ref":"p.290"},{"text":"身体の動き（粗大運動、道具、不器用さ）、感覚や認知の特性（空間の位置関係、図と地、目と手の協応）","ref":"p.289"},{"text":"学習意欲と習慣（姿勢、注意、整理整頓、忘れ物、聞き洩らし）、自己理解","ref":"pp.289–290"}],"wish":[{"text":"本人の思いや願い。どの教科・場面が苦しいか、使ってみたい道具や方法","ref":"p.290"},{"text":"保護者の思いや願い。家庭学習の様子（面談で必要な範囲を把握）","ref":"p.286"}],"how":[{"text":"通常の学級担任が実施できるアセスメントツールから始め、必要に応じて読み書きや計算に焦点化した検査、個別検査へ","ref":"p.290"},{"text":"学習困難の評価：国語・算数の基礎的能力の著しいアンバランス／全般的な知的発達の遅れがない／必要に応じて医学的評価／他の障害や環境要因が直接の原因でない","ref":"pp.302–303"},{"text":"専門機関の結果は「学校場面でどう表れるか、どんな支援が考えられるか」を保護者を通じて整理してもらい、校内で共有して個別の指導計画へ","ref":"p.290"},{"text":"園・児童発達支援施設、専門機関から情報を集める","ref":"pp.290–291"}],"tests":[{"name":"読み書き・計算のチェックリストとアセスメントツール","note":"通常の学級担任が実施できるものから","ref":"p.290"},{"name":"個別式知能検査・心理アセスメント","note":"全般的な遅れがないことの確認と、認知の偏り・進んでいる側面の把握","ref":"pp.288, 290"},{"name":"読み書き・計算に焦点化した検査","note":"専門機関で","ref":"p.290"}]},"specific":[{"title":"領域ごとの通常の学級での手立てと、通級の指導の例","ref":"pp.296–300","body":["読む：振り仮名、拡大、読みやすい書体と行間、読み上げ・電子書籍、音読箇所の予告と練習時間。","書く：書く量の調整と時間の延長、板書の写真、キーボードやフリック・音声入力、体裁の変更。本質的なことを評価する（漢字の誤りで減点しない）。","計算する・推論する：具体物や図、手順の視覚化、九九表や電卓の使用、問題文の読み上げ。","聞く・話す：短い指示、視覚情報の併用、話す前に整理する時間、マインドマップ。","通級では、自分に合った学習方法の自覚と代替手段の使用、その必要性を周囲に伝える力、自信の回復を扱う。例：板書の色分けや拡大プリントだけでは時間内に書き終えられない場合。"]},{"title":"気付きから支援までの順序","ref":"pp.287, 290, 298","body":["学期の途中で必要が生じることがあるので、校内委員会で日頃から把握しておく。診断の有無だけで判断しない。","気付き（チェックリスト、ノートや提出物）→ 通常の学級でできるアセスメント → 校内委員会 → 必要に応じて専門機関・個別検査 → 個別の指導計画。","努力不足とみなさない、方法を工夫すれば力を発揮できる、誰にも得意不得意がある、という理解を学級と保護者に広げる。"]}],"guidance":{"intro":"手引が学習障害について挙げている指導内容と支援の要点です。","preschool":null,"school":{"label":"特別な指導内容","ref":"pp.291–293","items":["感覚や認知の特性の理解と対応（読みやすい書体、文字間・行間、得意な学習方法の自覚）","代替手段の使用（振り仮名、拡大、読み上げ、電子書籍、音声入力、キーボード、フリック）と、使う必要性を周囲に伝える力","言語の形成と活用、コミュニケーション手段（読み上げ、マインドマップ）","感覚の総合的な活用（腕で文字をなぞる）、概念の形成（左右、空間・時間）","集団参加の基礎（友達の言い回し、尋ね方）","障害特性の理解（自己評価の低下を防ぐ）、情緒の安定（やり遂げた経験）"]},"accommodation":{"label":"合理的配慮を含む支援の内容","ref":"pp.293–295","groups":[{"title":"教育内容・方法","items":["認知特性に応じた代替・補完、本質的なことを評価する","基礎的内容の確実な習得、体裁の変更・拡大・振り仮名・読み上げ","身体を使う活動、時間の延長、音読箇所の予告"]},{"title":"支援体制","items":["受容的な学級、通級の参観","理解啓発（努力不足ではない、方法を工夫すれば発揮できる、誰にも得意不得意がある）"]},{"title":"施設・設備","items":["避難の注意書きに振り仮名","不要な情報を隠せる環境"]}]}},"placesIntro":"通常の学級が基本で、通級による指導（LD）が一部特別な指導を担います。特別支援学級・特別支援学校の対象ではありません（手引 §2 pp.296–300）。","conditionsIntro":"困難の領域（読む・書く・計算する など）は状態として軸①にあります。ADHDとの併存はADHDのページも参照してください。","conditionGroups":[],"terms":[{"term":"聞く・話す・読む・書く・計算する・推論する","desc":"手引が定義する6つの能力。どれに困難があるかで支援が変わる。","ref":"pp.300–302"},{"term":"限局性学習症（SLD）","desc":"DSM-5の診断名。本ツールの見出しは「学習障害（LD）」。","ref":"p.300"},{"term":"図と地","desc":"注目すべきもの（図）と背景（地）を分けて捉える働き。弱いと文字や図形が拾いにくい。","ref":"p.289"},{"term":"カモフラージュ","desc":"困難を隠して周囲に合わせること。見えにくさの一因になる。","ref":"p.303"},{"term":"アセスメントツール","desc":"通常の学級担任が実施できる読み書き・計算のチェックや課題。個別検査の前段階。","ref":"p.290"},{"term":"6.5%","desc":"平成24年の文部科学省調査で、通常の学級に在籍し学習面または行動面で著しい困難を示すとされた割合。専門家の判断によるものではない。","ref":"p.303"}],"related":[{"label":"発達障害ナビポータル","sourceId":"hattatsu-navi"},{"label":"インクルDB","sourceId":"nise-inclusive","note":"合理的配慮の実践事例"}],"sources":["tebiki-3-ld","tebiki"],"reviewed":"2026-10-06","sheet":{"seed":"例：音読で読み飛ばしが多く、漢字の書き取りに時間がかかる。聞けば分かっているので、努力不足と思われがち","ask":"例：読み上げや書く量の調整をどこまで認めるか。本人への伝え方"},"fields":[{"k":"area","label":"困難を示す領域","type":"checks","options":["聞く","話す","読む","書く","計算する","推論する"],"col":"status","ref":"p.300"},{"k":"iq","label":"知能検査の結果","type":"text","col":"status","ref":"p.288","hint":"全般的な遅れがないことの確認。例：WISC-V FSIQ 98、WMI 78"},{"k":"cog","label":"認知の偏り","type":"checks","options":["視覚の情報処理","聴覚の情報処理","言語・語彙","注意の持続","記憶","不器用さ"],"col":"status","ref":"p.287"},{"k":"comorb","label":"併存","type":"checks","options":["なし","ADHD","自閉症","運動機能","視覚・聴覚"],"col":"status","ref":"p.287"},{"k":"check","label":"チェックリスト・ノート・提出物から分かること","type":"text","col":"status","ref":"p.286"},{"k":"doc","label":"検査報告書・ノートや作品","type":"image","col":"status","ref":"p.290","hint":"手元にあれば、AIが必要な時点で内容を聞いてきます"},{"k":"expert","label":"専門機関からの情報","type":"textarea","col":"status","ref":"p.290","hint":"学校場面でどう表れるか"},{"k":"read","label":"音読","type":"select","options":["年齢相応","読み間違い・拾い読み","遅い","とても困難","不明・未確認"],"col":"strengths","ref":"p.288"},{"k":"write","label":"書く","type":"select","options":["年齢相応","時間がかかる","書き誤りが多い","とても困難","不明・未確認"],"col":"strengths","ref":"p.288"},{"k":"calc","label":"計算","type":"select","options":["年齢相応","指を使う・九九が苦手","文章題が苦手","とても困難","不明・未確認"],"col":"strengths","ref":"p.289"},{"k":"strong","label":"得意な経路","type":"text","col":"strengths","ref":"p.290","hint":"聞けば分かる、図なら表せる など"}]}},{"id":"adhd","num":"10","name":"注意欠陥多動性障害（ADHD）","en":"Attention-Deficit/Hyperactivity Disorder","overview":"注意力に様々な問題があり、または衝動的で落ち着きのない行動により、生活上様々な困難に直面している状態。通常12歳になる前に現れ、叱責の積み重ねによる自己肯定感の低下を防ぐ関わり方が特に重視されます。","places":[{"name":"通常の学級","note":"座席配慮や視覚的な行動目標の提示等を受けながら学習に参加"},{"name":"通級による指導（ADHD）","note":"注意集中や行動調整に関する自立活動を一部時間で実施"}],"quote":"注意欠陥多動性障害とは、身の回りの特定のものに意識を集中させる脳の働きである注意力に様々な問題があり、又は、衝動的で落ち着きのない行動により、生活上、様々な困難に直面している状態をいう。","sourceId":"tebiki-3-adhd","programCriteria":{"notice":"平成25年10月4日付け25文科初第756号 文部科学省初等中等教育局長通知（別紙）","sourceId":"mext-756","entries":[{"program":"通級による指導","term":"注意欠陥多動性障害者","text":"年齢又は発達に不釣り合いな注意力，又は衝動性・多動性が認められ，社会的な活動や学業の機能に支障をきたすもので，一部特別な指導を必要とする程度のもの"}],"absent":[{"program":"特別支援学級","reason":"この通知が示す特別支援学級の対象に注意欠陥多動性障害者は挙げられていません。注意欠陥多動性障害は通級による指導の対象として定められています。"}],"note":"特別支援学級・通級による指導の対象となる障害の程度として、国が示した目安です。学級の設置や指導の実施は市町村教育委員会の判断によるため、この程度に該当すれば必ず利用できるというものではありません。"},"v5":true,"diseases":{"v5":true,"id":"adhd","axisType":"profile","axisTypeLabel":"3つの状態の現れ方で見る","definition":"年齢や発達に不釣り合いな注意力、または衝動性・多動性を特徴とし、社会的な活動や学校生活に著しい困難を示す状態です。通常12歳になる前に現れて継続し、中枢神経系の機能不全が推定されます。一定程度の不注意や多動はどの子どもにも現れますが、継続し著しい困難を示す程度のものを指します。手引は「注意欠陥多動性障害」と呼び、医学の診断名では注意欠如・多動症に当たります。","definitionRef":"pp.306, 320","axesIntro":"注意欠陥多動性障害は、3つの状態の現れ方、併存、二次的な問題、行動の背景の要因の4つの軸で見ます。","axes":[{"name":"3つの状態の現れ方","levels":["不注意（気が散る、集中が続かない、忘れる）","衝動性（最後まで聞かずに答える、順番を待てない、他者を妨げる）","多動性（手足を動かす、離席、走り回る、しゃべりすぎる）"],"meaning":"6か月以上続き、12歳前に出現し、学校と家庭など複数の場面で見られ、知的障害（軽度を除く）・自閉症等によらないこと。手引は設問の形で項目を列挙している（pp.321–322）。","ref":"pp.320–322"},{"name":"併存","levels":["学習障害","自閉症","反抗挑発症・素行症"],"meaning":"症状は学習障害・自閉症・愛着形成上の問題と似ており、判断は慎重に。併存は多い。","ref":"pp.308, 322"},{"name":"二次的な問題","levels":["叱責の積み重ねによる自己肯定感の低下","無力感、反抗","不安・うつ"],"meaning":"早期の気付きと、「注意や叱責では行動が改善しない」前提の対応。","ref":"pp.308, 312, 323"},{"name":"行動の背景の要因","levels":["視覚・聴覚の情報処理","言語の力・語彙","注意の集中と持続、記憶","不器用さ"],"meaning":"行動の実態だけでなく、要因と得意な力を把握する。","ref":"p.309"}],"assessmentIntro":"手引の「状態等の把握」を校内様式の5つの欄に対応させた観点の一覧です。二つ以上の場面で観察します。","assessment":{"status":[{"text":"不注意・衝動性・多動性の状態：刺激への反応、注意集中の時間、複数の指示への反応、忘れ物・整理整頓、身体の動きや立ち歩き、突発的な行動、計画性、行動の調整","ref":"pp.307–308"},{"text":"二つ以上の場面（学校・家庭など）で特徴が見られるか。いつから続いているか","ref":"p.308"},{"text":"併存する障害（学習障害・自閉症）、二次的な問題、視覚・聴覚","ref":"p.308"},{"text":"服薬の有無と、服薬による様子の変化","ref":"p.308"},{"text":"幼児期の発達の状況（乳幼児健診、発達相談・5歳児健診、就学時健診）、療育の内容","ref":"p.307"}],"development":[{"text":"生活リズム、基本的生活習慣（挨拶、整理整頓）","ref":"p.309"},{"text":"遊びの状況：ルールのある遊びができるか、終了できるか","ref":"p.309"},{"text":"社会性（集団参加）","ref":"p.309"},{"text":"知的発達（必要に応じて把握）","ref":"p.310"}],"interest":[{"text":"好きなもの・得意なこと。学習の導入に関連付けて使う","ref":"pp.309, 315"},{"text":"園等での遊びの中の関わり、興味・関心（就学先への移行時に引き継ぐ）","ref":"p.311"}],"strengths":[{"text":"学習意欲と習慣（姿勢の崩れ、注意の持続、離席、整理整頓、忘れ物・紛失、聞き洩らし）","ref":"p.309"},{"text":"感覚や認知（見え方・聞こえ方、注目すべき対象に注意を向けられるか）","ref":"p.310"},{"text":"社会性（ルール、行動の調整、相手の気持ちを想像した表現）","ref":"p.310"},{"text":"身体の動き（常に動いている、目と手の協応、不器用さ）、学習の状況","ref":"p.310"},{"text":"自己理解と、得意な力","ref":"pp.309–310"}],"wish":[{"text":"本人の思いや願い。困っている場面と、やってみたい工夫","ref":"p.310"},{"text":"保護者の思いや願い、家庭での様子と関わり方","ref":"p.308"}],"how":[{"text":"行動観察と心理アセスメントを基に、必要に応じて知的発達を把握する。焦点を絞ったアセスメントは外部の専門家と相談する","ref":"p.310"},{"text":"認知の偏りと進んでいる側面を下位項目ごとに見る","ref":"p.310"},{"text":"専門機関の結果は「学校場面でどう表れ、どんな支援が考えられるか」を整理してもらい、校内で共有して個別の指導計画へ","ref":"p.310"},{"text":"学習中・生活の様子から、行動の要因と得意な力・興味を把握する。園等からの情報は就学先へ引き継ぐ","ref":"pp.308, 311"}],"tests":[{"name":"行動観察と心理アセスメント","note":"複数の場面で。焦点化は外部の専門家と","ref":"p.310"},{"name":"個別式知能検査","note":"必要に応じて。認知の偏りと進んでいる側面を下位項目ごとに","ref":"p.310"}]},"specific":[{"title":"通常の学級での手立てと、通級の指導の例","ref":"pp.316–320","body":["掲示物を減らす、座席を前方に、短い活動で区切る、動くことが許容される役割を用意する、行動目標を見える形にして即時に肯定的に評価する、意思表示カードを使う。","近づいて目を合わせて指示する、指示を分割する、視覚情報を併用する、静かな環境を用意する。","通級では、自分に適した集中の方法を身に付ける、行動の調整（因果関係の図示、目当てと点検表）、感情のコントロールの方法、ルールを段階的に学ぶ（勝ち負けのロールプレイ）などを扱う。例：座席や掲示物の配慮だけでは聞き洩らしが減らない場合。","学期の途中で必要が生じることがある。診断の有無だけで判断しない。"]},{"title":"叱責では改善しない、という前提","ref":"pp.312–313, 323","body":["注意や叱責の積み重ねは自己肯定感を下げ、無力感や反抗につながる。望ましい行動を具体的に示し、できたときにすぐ認める。","姿勢の崩れへの執拗な指導は逆効果。崩れにくい机・椅子や、チェックポイントで本人が確かめられる形にする。","本人なりの理由がある、生まれつきの特性である、安全のための制止は短く、という理解を学級と保護者に広げる。"]}],"guidance":{"intro":"手引が注意欠陥多動性障害について挙げている指導内容と支援の要点です。","preschool":null,"school":{"label":"特別な指導内容","ref":"pp.311–314","items":["注意集中の持続（色分け、他の感覚の活用、指示の分割、自分に合った方法）","行動の調整（因果関係の図示、目当てと点検表）","生活リズムと習慣、姿勢の保持（崩れにくい机・椅子、チェックポイント）","作業の動作と遂行、集団参加の基礎（ルールを段階的に、勝ち負けのロールプレイ）","概念の形成（スケジュール、時計、優先順位）、言語の受容と表出（ロールプレイ、ゲーム）","障害特性の理解（自分を認め、支援を求める）、情緒の安定（落ち着ける場所、深呼吸、刺激を統制した環境）"]},"accommodation":{"label":"合理的配慮を含む支援の内容","ref":"pp.314–316","groups":[{"title":"教育内容・方法","items":["物品管理の工夫とメモ、学習内容の分割、掲示物の精選","近づいて目を合わせて指示、視覚情報、静かな環境","好きなものと関連付けた導入、危険防止をした体験学習、成功体験と賞賛","感情のコントロールの方法、相談できる人と場所"]},{"title":"支援体制","items":["発達障害者支援センター等の助言、通級の活用","理解啓発（本人なりの理由がある、生まれつきの特性、安全な制止）"]},{"title":"施設・設備","items":["短時間で伝わる避難指示、カーテン、照明の防護、小部屋"]}]}},"placesIntro":"通常の学級が基本で、通級による指導（ADHD）が一部特別な指導を担います。特別支援学級・特別支援学校の対象ではありません。自閉症等を併せ有する場合は別です（手引 §2 pp.316–320）。","conditionsIntro":"「不注意優勢」「多動・衝動性優勢」などは現れ方の区分として軸①にあります。学習障害との併存は学習障害のページも参照してください。","conditionGroups":[],"terms":[{"term":"不注意・衝動性・多動性","desc":"ADHDの3つの状態。手引は設問の形で項目を列挙している（不注意9項目、衝動性3項目、多動性6項目）。","ref":"pp.321–322"},{"term":"12歳前・6か月・複数の場面","desc":"状態の判断の条件。12歳になる前に現れ、6か月以上続き、学校と家庭など二つ以上の場面で見られること。","ref":"p.320"},{"term":"注意欠如・多動症（ADHD）","desc":"DSM-5の診断名。本ツールの見出しは法令・通知の「注意欠陥多動性障害」。","ref":"p.320"},{"term":"反抗挑発症・素行症","desc":"ADHDに併存することがある、反抗的な行動や規則違反を特徴とする状態。二次的な問題と区別して見る。","ref":"p.322"},{"term":"6.5%","desc":"平成24年の文部科学省調査で、通常の学級に在籍し学習面または行動面で著しい困難を示すとされた割合。専門家の判断によるものではない。","ref":"p.323"}],"related":[{"label":"発達障害ナビポータル","sourceId":"hattatsu-navi"},{"label":"こころの情報サイト「発達障害（神経発達症）」","url":"https://kokoro.ncnp.go.jp/disease.php?%40uid=MbkmLbVbTEhSpxyE","sourceId":"kokoro-ncnp"}],"sources":["tebiki-3-adhd","tebiki"],"reviewed":"2026-10-06","sheet":{"seed":"例：授業中に離席し、指示の途中で動き出す。注意すると反発する。忘れ物が多い","ask":"例：叱らずに行動を変える手立て。座席や掲示物の工夫はしたが足りない"},"fields":[{"k":"type","label":"目立つ状態","type":"checks","options":["不注意","衝動性","多動性"],"col":"status","ref":"p.320"},{"k":"scenes","label":"二つ以上の場面で見られるか","type":"select","options":["学校と家庭の両方","学校のみ","家庭のみ","不明・未確認"],"col":"status","ref":"p.308"},{"k":"since","label":"いつから続いているか","type":"text","col":"status","ref":"p.320"},{"k":"comorb","label":"併存","type":"checks","options":["なし","LD","自閉症","反抗挑発症・素行症"],"col":"status","ref":"p.322"},{"k":"meds","label":"服薬と、服薬による様子の変化","type":"text","col":"status","ref":"p.308"},{"k":"attn","label":"注意が続く時間・集中できる条件","type":"text","col":"status","ref":"p.307"},{"k":"doc","label":"検査報告書など","type":"image","col":"status","ref":"p.310","hint":"手元にあれば、AIが必要な時点で内容を聞いてきます"},{"k":"expert","label":"専門機関からの情報","type":"textarea","col":"status","ref":"p.310","hint":"学校場面でどう表れるか"},{"k":"rule","label":"ルールのある遊び・活動の終了","type":"select","options":["できる","声かけがあれば","難しい","不明・未確認"],"col":"development","ref":"p.309"},{"k":"self","label":"自分の特性の理解と援助要請","type":"select","options":["できる","部分的に","まだこれから","不明・未確認"],"col":"strengths","ref":"p.310"},{"k":"strong","label":"得意な力・好きなもの","type":"text","col":"interest","ref":"p.309"}]}}],"curriculum":[{"id":"nihongo","num":"01","name":"日本語指導が必要な児童生徒","en":"Students Requiring Japanese Language Support","subtitle":"来日・帰国・家庭内言語が日本語以外、などの背景で、日本語の力が学習の壁になっている幼児児童生徒","status":{"tone":"ok","label":"制度あり","text":"「特別の教育課程」による日本語指導が制度化されている（小・中学校等は平成26年度から、高等学校は令和5年度から）"},"basis":[{"text":"学習指導要領 総則「特別な配慮を必要とする児童生徒への指導」に、海外から帰国した児童生徒や日本語習得に困難のある幼児児童生徒への指導が明記されている"},{"text":"平成26年（2014年）1月の学校教育法施行規則改正により、小・中学校等で日本語指導を「特別の教育課程」として編成・実施できるようになった（同年4月施行）。高等学校は令和5年度から","sourceId":"mext-clarinet-info"},{"text":"文部科学省「外国人児童生徒受入れの手引」（改訂版、2019年3月）が、受入れから指導・保護者対応までの基本資料","sourceId":"mext-clarinet-tebiki"},{"text":"日本語の力の把握には、文部科学省が開発した「外国人児童生徒のためのJSL対話型アセスメントDLA」（現在の名称は「外国人児童生徒等のことばの力のアセスメント」）がある","sourceId":"mext-clarinet-info"},{"text":"「特別の教育課程」による指導を行う場合、日本語指導用の「個別の指導計画」を作成する。文部科学省が作成参考資料を公開している","sourceId":"mext-clarinet-info"}],"overview":"文部科学省の調査では、「日本語指導が必要な児童生徒」は、日本語で日常会話が十分にできない幼児児童生徒に加え、日常会話はできても学年相当の学習言語が不足し、学習活動への参加に支障が生じている幼児児童生徒を指します。外国籍の幼児児童生徒だけでなく、日本国籍でも家庭内言語が日本語以外である場合などが含まれます。","points":["日常会話ができることと、教科の学習に必要な日本語（学習言語）が身についていることは別。会話が流暢に見えても、教科書の読解や作文で困難を抱えている場合がある。一般に、日常会話は数年で身につくが、学習言語の習得にはさらに長い年月を要するとされる","母語の力は学習の土台。日本語を優先して母語を軽視すると、思考の道具そのものが弱くなることがある","言葉の問題と、来日に伴う生活・文化の変化、家庭の状況が重なって現れる。学習面の困難だけを見ると見誤る"],"signsLabel":"気づきのポイント","signs":["授業中の発言や友達との会話は問題ないのに、テストの文章題・記述・作文で極端に点が取れない","音読はできるが、内容を問うと答えられない","指示の理解が「周りを見て動く」形になっている（一斉指示だけでは動けない）","学習の遅れが「学力の問題」「意欲の問題」「発達の特性」のいずれなのか判断がつかない。この場合、日本語の力を先に評価しないと、障害のある幼児児童生徒と誤って判断するおそれがある（逆も同様）"],"supportsLabel":"支援の要点","supports":[{"title":"日本語の力の把握","items":["DLAなどにより、「会話」「読む」「書く」「聴く」の力を分けて把握する。会話の印象で判断しない","母語での学力・学習経験（来日前の就学状況）を保護者から聞き取る"]},{"title":"指導の形態","items":["取り出し指導（別室での日本語指導。「特別の教育課程」として実施）と、在籍学級での入り込み・配慮の組み合わせ","文部科学省「JSLカリキュラム」の考え方：日本語指導と教科指導を切り離さず、教科の学習活動の中で日本語を育てる"]},{"title":"在籍学級でできる配慮","items":["指示は短く、書いて示す。キーワードを板書に残す","具体物・写真・図・動作を伴わせ、言葉だけで説明しない","教科の重要語は、母語訳やルビつきの語彙表を用意する","テストでは、問題文のルビ、平易な言い換え、時間延長、辞書の使用などを検討する","発表や記述は、まず口頭や選択式で理解を確認してから文章にする段階を踏む"]},{"title":"家庭・関係機関","items":["保護者への連絡は、翻訳ツール・多言語の文書テンプレート（文部科学省「かすたねっと」に多言語の学校文書がある）・通訳の活用を組み合わせる","進路指導では、高校入試における外国人生徒等への特別措置（有無・内容は自治体により異なる）を早い時期から確認する"]}],"planningLabel":"計画への落とし込み","planning":["「特別の教育課程」で日本語指導を行う場合は、日本語指導の個別の指導計画を作成する。項目は文部科学省の参考資料に沿う（日本語の力の現状、指導目標、指導内容、指導形態・時間、評価）","障害のある幼児児童生徒の個別の指導計画とは別の様式・別の根拠。両方に該当する場合は、それぞれの計画で扱う内容を分け、相互に参照させる","目標は「日本語の力」と「教科の学習」を分けて書くと評価しやすい","次期学習指導要領に向けて、日本語指導・通級指導・不登校・特異な才能の各計画を一体的に運用する参考様式（「2階シート」仮称）を国が示す方向で検討されている。共通事項と日本語指導固有の事項を分けて書いておくと移行しやすい"],"related":[{"catId":"ld","note":"読み書きや学習の遅れが、日本語の力によるものか特性によるものかの見分けが課題になる。日本語の評価を先に行う"},{"catId":"intellectual","note":"同上。日本語の力を評価せずに知能検査の結果だけで判断しない"},{"catId":"language","note":"発音の誤りが、母語の音の影響なのか構音の問題なのかを区別する"},{"catId":"autism","note":"来日直後の適応の困難と、特性による困難が重なることがある"}],"sources":["mext-clarinet-tebiki","mext-clarinet-info"],"reviewed":"2026-09-14"},{"id":"twice-exceptional","num":"02","name":"特異な才能と障害を併せ有する幼児児童生徒（2E）","en":"Twice-Exceptional Students","subtitle":"特定分野の特異な才能と、発達障害などの困難を併せ持ち、どちらか一方だけで見立てられやすい幼児児童生徒","status":{"tone":"warn","label":"制度化の直前","text":"次期学習指導要領に向けて「特別の教育課程」の制度が検討中。本項は令和8年8月4日付のワーキンググループ取りまとめ案（会議後修正）に基づく整理で、最終版・運用の手引きの公表後に更新する"},"basis":[{"text":"文部科学省は「ギフテッド」という語を用いず、「特定分野に特異な才能のある児童生徒」（文書内では「特才児童生徒」と略される）と呼んでいる"},{"text":"令和4年9月、有識者会議が「審議のまとめ」を公表。IQなどの特定の基準や数値で才能を定義することを明確に退け、ラベル付けや選別ではなく、才能や特性があるがゆえに生じている学習上・生活上の困難に着目する、という立場を示した","sourceId":"mext-sainou-matome"},{"text":"令和7年9月から中央教育審議会 教育課程部会に「特定分野に特異な才能のある児童生徒に係る特別の教育課程ワーキンググループ」が置かれ、次期学習指導要領に向けて特別の教育課程を編成・実施できる制度の創設が検討された。令和8年6月16日の第9回で取りまとめ案が審議され、8月4日付で会議後修正版が公表されている（令和8年9月時点で「案」の付かない最終版は未掲載）","sourceId":"mext-sainou-wg"},{"text":"文部科学省の実証事業として、愛媛大学の才能教育センター（全国単位の相談支援）、京都府・京都市・京都教育大学（地域単位の相談支援）などが動いている","sourceId":"mext-sainou-wg-r8-08"}],"overview":"「2E（twice-exceptional、二重に特別）」は、特異な才能と、発達障害などの障害を併せ有する状態を指す用語です。ワーキンググループの取りまとめ案も、特才幼児児童生徒の中に発達障害などを併せ有する者がいること（2E）を明記し、あわせて「才能ゆえの激しさや過興奮性を中心とした特性による行動が、誤って障害の枠組みのみで捉えられ、不適切な対応がなされる場合がある」という指摘を載せています。","points":["才能面の支援が必要な幼児児童生徒のうち、学校が最初に気づくのは「困っている」側面であることが多く、それは既存の障害種別（発達障害）の枠で見立てが始まる。本ハンドブックで2Eを入口にする理由はここにある","障害の側だけを見て支援すると、才能の側が伸びる機会を失い、本人の意欲や自己理解に影響する。逆に才能の側だけを見ると、困難が「本人の努力不足」として扱われる","取りまとめ案は、才能に恵まれているだけでなく困難を抱えやすい存在として特才幼児児童生徒を捉え、「困難の軽減・解消」と「好きを育み得意を伸ばす」の両方を支援の目的としている"],"framework":{"title":"検討中の制度の骨子（取りまとめ案より）","intro":"現場で判断の枠組みになる部分だけを抜き出しています。施行前の内容であり、今後変わりえます。","items":[{"k":"2階建て","v":"まず通常の教育課程（1階）の中で、発展的な課題の設定、生成AIの活用、次期指導要領で創設予定の「裁量的な時間」などによる支援の可能性を検討する。それだけでは支援が十分できない幼児児童生徒を、特別の教育課程（2階）の対象とする。全ての特才幼児児童生徒を2階の対象と考えるのではない"},{"k":"線引きをしない","v":"対象とすることは「特異な才能がある」と診断しラベル付けすることではなく、本人の意向を踏まえて「特別の教育課程により支援を提供することが適切」と判断すること、と位置づけている"},{"k":"飛び級ではない","v":"本来の学年に在籍したまま、通常の教育課程での「拡充」を重視しつつ、上位学年・学校種の内容を部分的に履修する「部分早修」を取り入れる。完全早修（飛び級・飛び入学）は採らない"},{"k":"対象活動","v":"算数・数学、理科など教科等に関わる認知的な側面を基本とし、相当する教科等（総合的な学習の時間または各教科の一部・全部）に代えて、部分早修、大学教員等の支援を得た個人探究、大学の科目受講、大学・研究機関等のプログラムやコンテスト参加などを行う。在籍校でのオンライン受講も想定"},{"k":"対象幼児児童生徒を判断するプロセス","v":"日常的な見取り→必要に応じて面談やWISC等の心理検査（必須ではない）→どのような学習上・生活上の困難が生じているかを整理→まず1階での工夫を検討→対象活動を実施する方が効果的か（学習上の困難の軽減、学級での関係構築の観点）を総合判断→本人・保護者の意向確認→教育委員会と調整。相談支援体制の活用が前提"},{"k":"指導計画","v":"対象活動を行う場合は指導計画の作成が必須。記載項目例は、才能を発揮する分野・程度、困難の状況（心理検査の結果を含む）、学校外での学習状況、本人の希望、通常学級での支援の在り方、相当教科等、実施場所・指導者、目標・内容・頻度、学習状況の記録"},{"k":"「2階シート（仮称）」","v":"通級指導、日本語指導、不登校、特異な才能の各特例で別々に作られている計画・支援シートを、一つの電子ファイルで一体的に運用する参考様式を国が示す方向。共通シート＋特例ごとの個別シートの構成。通常学級に在籍する特別な配慮を必要とする児童生徒の個別の教育支援計画・個別の指導計画にも活用できる様式とする方向で検討（特別支援学校の計画との関係は別途整理）"},{"k":"学習評価","v":"相当教科等の観点別評価・評定は、在籍学級の既存の評価規準をそのまま使い、対象活動の成果を評価材料として参酌する。指導要録本体には特別の教育課程の実施を記載せず、指導計画の写しを別紙として添付する。調査書には別紙の内容を使わない（入試対策を助長させないため）"},{"k":"相談支援体制","v":"学校の知見だけで指導計画を作ることは困難という前提で、知見を有する複数の大学等による全国規模のプラットフォームと、都道府県教育委員会（総合教育センター等）の相談支援担当の設置を想定"},{"k":"対象学校種","v":"当面は義務教育段階（小学校、中学校、義務教育学校、特別支援学校の小学部・中学部）。高校は学校外学修の単位認定や、検討中の必履修科目の履修免除で対応"},{"k":"施行時期","v":"次期学習指導要領の全面実施を待たず先行実施を可能とし、事例を蓄積する。総則・評価特別部会で、調整授業時数制度と一体的に令和10年度からの先行実施期間から取組を可能とする方向が示されており、令和10年度から実施できるよう「運用の手引き」を作成するとしている"},{"k":"教員養成","v":"教職課程・免許・大学院課程ワーキンググループのまとめで、全ての教職課程で学ぶ内容に「教育における多様性の包摂」が加わり、強み専門性の例として「特異な才能のある児童生徒の才能の伸長と困難の軽減」が挙げられている"}]},"signsLabel":"気づきのポイント","signsNote":"ワーキンググループの参考資料（京都市・愛媛大学の実証研究、有識者会議のアンケート）で挙げられた特性と困難から整理しています。","signs":["特定の分野（算数・数学、理科、言語、芸術、音楽、記憶、プログラミング、将棋、特定のテーマなど）で学年をはるかに超える知識・技能を示す一方で、別の分野や日常の課題（板書を写す、順序立てて作業する、集団の指示に従う）で著しく困難がある","検査結果の下位項目間の差が大きい（得意と不得意の落差）","授業内容が易しすぎることによる退屈・離席・課題の未提出が、「注意の問題」「意欲の問題」として扱われている。授業中に過集中や白昼夢の状態になり、指示を聞いていない","漢字の反復練習や同じパターンの計算プリントを、苦手を超えて激しく嫌がる","興味のある分野には過集中し、切り替えが難しい。好奇心が強く質問が止まらない","語彙が豊富で言語能力は高いのに、同級生と話がかみ合わない、対人スキルが幼い、些細なことで怒る・泣くなど感情のコントロールが追いつかない","感覚過敏（チャイム、大声、楽器の音のずれなど）で授業に集中できない","学業成績は平均的なのに、本人・保護者から「学校がつまらない」「本当はもっとできる」という訴えがある（才能と困難が相殺され、平均に見えている場合）","発言すると雰囲気を壊すため、分からないふりをしている"],"supportsLabel":"支援の要点","supports":[{"title":"見立て","items":["困難の側は、既存の障害種別（LD、ADHD、自閉症など）の枠組みで通常どおりアセスメントする","才能の側は、特定の数値で判定しない。何に、どのくらい深く、どんな形で取り組めているかを、本人・保護者・教科担当から集める","才能と困難を別々の軸として記述し、一方で他方を説明しない（「賢いのだからできるはず」「障害があるのだから仕方ない」の両方を避ける）","取りまとめ案の指摘のとおり、才能ゆえの激しさや過興奮性を、障害の枠組みだけで捉えていないか立ち止まる"]},{"title":"授業・学習（まず1階で）","items":["困難の側への配慮は、該当する障害種別のページを参照する","才能の側は、まず通常の教育課程の中で。授業内で、より深い課題・発展的な内容に取り組める選択肢を用意する（全員に同じ量ではなく、質の異なる課題）。一人一台端末や生成AIによる個に応じた課題設定は、取りまとめ案でも1階の手段として例示されている","学校外の学びの場（大学・研究機関・地域のプログラム・オンライン）につなぐ。情報が届かない、地域に場がない、という格差が課題として指摘されている","得意分野で貢献できる役割を学級・学校の中に作る","義務教育段階では飛び級は採られない。本来の学年に在籍したまま、拡充と部分早修で対応する、という制度の方向を押さえておく"]},{"title":"2階（特別の教育課程）を検討する場面","items":["1階の工夫を行ってもなお、学習上・生活上の困難が解消しない場合。取りまとめ案の事例では、理科は発展課題で困難が軽減したが、算数は担任が設定できる課題の範囲・難易度では満足できず意欲が持てない状態が続いたため、算数を相当教科等として大学のプログラム参加を対象活動とした","判断は学校単独では行わず、教育委員会と相談支援体制（大学等）を交え、本人・保護者の意向を確認して進める","制度施行前の現在（令和10年度からの先行実施が目標）は、実証研究事業の相談支援や、大学等が実施する休日・長期休業中のプログラムへの参加が現実的な選択肢"]},{"title":"本人・保護者・周囲","items":["才能と困難の両方を、本人が自分の言葉で理解できるように支える（自己理解）","「特別扱い」が周囲の幼児児童生徒との分断や妬みにつながらないよう、学級全体の中での位置づけを考える。取りまとめ案も、対象幼児児童生徒を含めて一人一人の多様性が認められる包摂的な学級文化の醸成を留意点に挙げている","保護者との情報共有では、才能を認めることと、困難への支援の必要性を同時に伝える"]}],"planningLabel":"計画への落とし込み","planning":["障害のある幼児児童生徒として個別の指導計画を作成する場合、困難の側の目標に加えて、才能の側の「伸ばす目標」「学校外の資源との連携」を記述する欄を設ける。取りまとめ案の指導計画の記載項目例（才能を発揮する分野・程度／困難の状況／学校外での学習状況／本人の希望／通常学級での支援）は、そのまま欄の設計に使える","自立活動の観点（例：環境の把握、人間関係の形成、心理的な安定）は困難の側に適用し、才能の側の記述には用いない","通級・日本語指導・不登校・特異な才能の計画を一体化する「2階シート（仮称）」が国から示される見込み。複数の特例に重なる幼児児童生徒（2Eはその典型）は、この様式で俯瞰する運用に移行する可能性が高い。現行の計画を作るときも、共通事項と特例固有の事項を分けて書いておくと移行しやすい","進路については、高校段階で学校外学修の単位認定や必履修科目の履修免除の仕組みがあることを見据える"],"related":[{"catId":"adhd","note":"退屈による離席・不注意・白昼夢と、特性による不注意の見分け"},{"catId":"autism","note":"特定分野への強い関心と深い知識が、才能でもあり、こだわりとしての困難でもある。感覚過敏の重なり"},{"catId":"ld","note":"口頭では高度な理解を示すのに、読み書きで著しい困難がある場合。反復練習の拒否がLDの見立てと重なることがある"},{"catId":"emotional","note":"才能に見合った学びがないことによる不適応が、情緒面の困難として現れることがある"}],"sources":["mext-sainou-matome","mext-sainou-wg","mext-sainou-wg-r8-08"],"reviewed":"2026-09-14","relatedTopics":[{"tab":"seito","id":"futoukou","note":"取りまとめ案の事例でも不登校期間・保健室登校が描かれている"}]}],"seito":[{"id":"bullying","num":"04","chapter":"第4章 いじめ","name":"いじめ","en":"Bullying","subtitle":"一定の人的関係にある他の幼児児童生徒の行為によって心身の苦痛を感じている幼児児童生徒（インターネットを通じたものを含む）","status":{"tone":"ok","label":"法の枠組みあり","text":"いじめ防止対策推進法と国の基本方針が、定義・学校の対策組織・早期発見・重大事態の調査まで定めている。障害のある幼児児童生徒は「特に配慮が必要な児童生徒」として基本方針に明記"},"basis":[{"text":"いじめ防止対策推進法（平成25年法律第71号）が、いじめの定義（第2条）、学校いじめ防止基本方針の策定（第13条）、いじめ対策組織の設置（第22条）、早期発見の措置（第16条）、いじめに対する措置（第23条）、重大事態への対処（第28条）を定めている","sourceId":"ijime-law"},{"text":"いじめの定義は、児童等に対して、一定の人的関係にある他の児童等が行う心理的又は物理的な影響を与える行為（インターネットを通じて行われるものを含む）であって、対象となった児童等が心身の苦痛を感じているもの。行為の内容や動機ではなく、対象となった子どもが苦痛を感じているかどうかで判断する","sourceId":"ijime-law"},{"text":"「いじめの防止等のための基本的な方針」（平成25年10月11日文部科学大臣決定、平成29年3月14日最終改定）が国の基本方針。けんかやふざけ合いも背景を調べて被害性に着目して判断すること、学校いじめ対策組織の位置づけ、SC・SSWの役割を示す。「特に配慮が必要な児童生徒」として、発達障害を含む障害のある幼児児童生徒、海外から帰国した児童生徒や外国人の児童生徒、性同一性障害や性的指向・性自認に係る幼児児童生徒、東日本大震災の被災幼児児童生徒を挙げ、特性を踏まえた支援と保護者との連携、周囲の幼児児童生徒への指導を求めている","sourceId":"mext-ijime-tsuchi-h29"},{"text":"重大事態（法第28条）は、①いじめにより生命・心身・財産に重大な被害が生じた疑い（自殺企図など）、②いじめにより相当の期間（年間30日を目安）欠席を余儀なくされている疑い。「いじめの重大事態の調査に関するガイドライン」（平成29年3月策定、令和6年8月改訂）が調査の進め方を定める。幼児児童生徒や保護者から「いじめられて重大事態に至った」と申し立てがあったときは、重大事態が発生したものとして対応する","sourceId":"mext-ijime-gl-r6"},{"text":"令和6年11月「いじめ防止対策の更なる強化について」（関係省庁連絡会議決定）、令和7年11月こども家庭庁・文部科学省「いじめの重大化を防ぐための留意事項集」。後者は、いじめの背景に発達障害の特性や家庭環境が関係している場合や、いじめが犯罪行為に相当しうる場合は、学校だけで解決しようとせず、SSWが調整役となって児童相談所・こども家庭センター・児童精神科・警察・法務少年支援センターなどに相談・協力依頼することを明記","sourceId":"cfa-ijime-ryui-r7"},{"text":"生徒指導提要（令和4年12月改訂）第4章は、いじめを法の理念と重層的支援構造（いじめの防止につながる発達支持的生徒指導／未然防止教育／早期発見対応／重大事態への対応）で整理し、学校いじめ対策組織を中心とした組織的対応と関係機関連携を求めている","sourceId":"seito-shido-teiyo"}],"overview":"いじめは、法の定義では「対象となった子どもが心身の苦痛を感じているもの」であり、行為の軽重や加害の意図で決まりません。この定義は広く、けんかやふざけ合いに見えるものも含めて、まず「いじめ」として認知し、組織で対応することを求めています。本ハンドブックで扱うのは、障害のある子どもはいじめの被害側になりやすく、同時に特性による行動が誤解されて加害側と見なされやすいからです。国の基本方針が「特に配慮が必要な児童生徒」の筆頭に発達障害を含む障害のある幼児児童生徒を挙げ、個別の教育支援計画や個別の指導計画を活用した情報共有を求めているのは、このためです。","points":["「いじめ」と認知することと、「いじめ」という言葉を本人や保護者にどう使うかは別。状況によっては言葉を使わず対応することもある（基本方針）。ただし認知と組織対応は省略しない","加害側の子どもにも背景がある。虐待、発達の特性、家庭環境。指導と同時に「加害者への成長支援」の観点を持つ（平成29年改定で基本方針に位置づけ）","障害のある子どもがかかわるいじめでは、障害の特性への理解を深め、本人のニーズや特性、専門家の意見を踏まえた指導と支援を行う。特性の理解不足が、被害の見逃しにも、加害の誤認にもつながる","重大事態は「疑い」の段階で調査に着手する。「本人が休んでいるが、いじめかどうかはっきりしない」は着手しない理由にならない"],"signsLabel":"気づきのポイント","signs":["持ち物がなくなる、壊れる、汚れる。金銭の要求","遊びやふざけの形で、特定の子どもだけが一方的に叩かれる・追い回される・役割を押しつけられる","グループ内での序列、命令と服従の関係。「いじられキャラ」として笑われている","SNS・グループチャットでの誹謗中傷、仲間外し、画像の拡散。学校からは見えにくい","欠席・遅刻・保健室利用の増加、成績の低下、表情の変化、一人でいることが増える","障害のある子どもの場合：本人がいじめと認識していない、または言葉で説明できない。周囲が「本人も楽しんでいる」と誤解している。からかいの対象が障害の特性（話し方、動き、こだわり）である","特性による行動（急に大声を出す、距離が近い、順番を守れない）が、周囲から「いじめ」と訴えられる。本人への指導だけでなく、周囲の理解と環境調整が要る"],"supportsLabel":"支援の要点","supports":[{"title":"未然防止（発達支持的・未然防止教育）","items":["障害の特性を含む多様性を認め合う学級づくり。障害のある子どもについて周囲が理解する機会を、本人・保護者の意向を確認したうえで設ける","いじめ防止の授業、SOSの出し方に関する教育、情報モラル教育。「いじめを見たら止める・伝える」ことが安全であると子どもが実感できる環境","学校いじめ対策組織の構成と役割を全教職員が知っている状態にする。個々の教員が抱え込まない"]},{"title":"早期発見・初動","items":["アンケート、個人面談、1人1台端末による心の健康観察などを定期的に行い、訴えがあれば必ず組織で共有する","いじめの情報を得た教職員は、一人で抱えず学校いじめ対策組織に報告する。組織は情報を集約し、事実関係を確認し、対応方針を決める","被害の子どもの安全確保を最優先に。本人が安心して過ごせる場所と、信頼できる大人の確保","加害側の子どもへの指導は、行為の停止と再発防止を明確に求めつつ、背景（虐待、特性、家庭）を見て成長を支援する視点で","障害のある子どもがかかわる場合は、特別支援教育コーディネーターを組織に加え、個別の教育支援計画・個別の指導計画の情報を共有して対応方針を決める。保護者との連携、周囲の幼児児童生徒への指導もあわせて行う"]},{"title":"外部連携・重大事態","items":["いじめの背景に発達障害の特性や家庭環境が関係している場合、いじめが犯罪行為に相当しうる場合は、学校だけで解決しようとせず、SSWを調整役に児童相談所・こども家庭センター・児童精神科・警察・法務少年支援センター等に相談する（留意事項集）","重大事態の疑いがある段階で、設置者に報告し、ガイドラインに沿って調査組織を設け、被害の子ども・保護者に調査の方針を説明する。調査の目的は責任追及ではなく、対処と再発防止","不登校重大事態（年間30日目安）は、不登校のページの支援と並行して進める"]}],"planningLabel":"計画への落とし込み","planning":["学校いじめ防止基本方針と学校いじめ対策組織が、いじめ対応の計画にあたる。障害のある子どもがかかわる事案では、個別の教育支援計画・個別の指導計画の情報を対策組織と共有し、対応方針と配慮を記録に残す（基本方針）","被害・加害それぞれの子どもについて、安全確保、指導、経過観察、保護者との連携の担当と期限を決め、対策組織で経過を確認する","重大事態の調査は設置者の判断と組織で行う。学校単独で調査計画を立てない"],"related":[{"catId":"autism","note":"対人関係の特性や独特の言動がからかいの対象になりやすい。一方、距離感や言葉の直接さが「いじめ」と受け取られることもある。双方向で特性の理解が要る"},{"catId":"adhd","note":"衝動的な言動が加害と見なされやすい。行為への指導と、特性に応じた環境調整を同時に"},{"catId":"ld","note":"読み書きの困難や成績が「できない子」というからかいの対象になることがある。合理的配慮が周囲に「特別扱い」と映らないよう、学級全体への説明を工夫する"},{"catId":"intellectual","note":"本人がいじめと認識できない、言葉で伝えられないため、被害が長期化しやすい。行動や表情の変化から周囲が気づく"},{"catId":"language","note":"話し方（吃音、構音）がからかいの対象になりやすい"},{"catId":"emotional","note":"いじめの被害が選択性かん黙や不安の背景になることがある。逆に情緒の不安定さから加害側に立つこともある"},{"catId":"physical","note":"身体の状態や補助具、通院・欠席がからかいの対象になることがある"},{"catId":"hearing","note":"聞こえにくさによる聞き返しや、補聴器・人工内耳がからかいの対象になることがある"},{"catId":"visual","note":"見えにくさによる動きや補助具がからかいの対象になることがある"},{"catId":"health","note":"通院・欠席や体調の制限がからかいの対象になることがある"}],"relatedTopics":[{"tab":"curriculum","id":"nihongo","note":"基本方針が「特に配慮が必要な児童生徒」に挙げる。言葉や文化の違いがからかいの対象になりやすい"},{"tab":"seito","id":"futoukou","note":"いじめによる欠席が年間30日の目安に達すれば不登校重大事態。不登校対応と重大事態対応を並行する"},{"tab":"seito","id":"child-abuse","note":"虐待を受けた子どもが加害側に立つことがある。加害への指導と同時に背景を見る"},{"tab":"seito","id":"suicide-prevention","note":"いじめは自殺の危険因子の一つ。生命・心身への重大な被害の疑いは1号重大事態"},{"tab":"seito","id":"internet","note":"ネット上のいじめは法の定義に含まれる"},{"tab":"seito","id":"sexuality","note":"性的な言動によるからかいや、性的指向・性自認に関するいじめ"},{"tab":"seito","id":"violence-delinquency","note":"暴力を伴ういじめ、犯罪に相当するいじめは警察と連携する"}],"sources":["ijime-law","mext-ijime-tsuchi-h29","mext-ijime-gl-r6","mext-ijime-kyoka-r6","cfa-ijime-ryui-r7","seito-shido-teiyo"],"reviewed":"2026-09-14"},{"id":"violence-delinquency","num":"05","chapter":"第5章 暴力行為／第6章 少年非行","name":"暴力行為・少年非行","en":"Violent Behavior and Juvenile Delinquency","subtitle":"対教師・生徒間・対人の暴力、器物損壊、喫煙・深夜徘徊・万引きなどの問題行動や非行のある幼児児童生徒","status":{"tone":"info","label":"行為は止め、背景を見る","text":"学校は行為を止めて安全を確保し、背景（虐待、発達の特性、家庭、対人関係）を見て指導と支援を行う。犯罪に相当する行為は、ためらわず警察と連携する。障害の特性による行動が非行と誤認されないよう、見立てを分ける"},"basis":[{"text":"学校教育法第11条は、校長と教員が教育上必要があると認めるときに幼児児童生徒に懲戒を加えることができると定め、体罰を禁止している。同法第35条（第49条で中学校に準用）は、他の幼児児童生徒の教育に妨げがある場合に、市町村教育委員会が保護者に出席停止を命じることができると定める"},{"text":"少年法は20歳未満を「少年」とし、14歳以上で罪を犯した犯罪少年、14歳未満で刑罰法令に触れる行為をした触法少年（児童福祉法の対象）、将来罪を犯すおそれのあるぐ犯少年を家庭裁判所の審判の対象とする。令和4年4月施行の改正で18・19歳は「特定少年」とされ、原則逆送の対象が拡大し、ぐ犯の対象から外れた","sourceId":"moj-shonenho"},{"text":"学校と警察の連携は、学校警察連絡協議会などの「日々の連携」と、深刻ないじめや暴力行為が起きたときの「緊急時の連携」の2つの視点で。日頃の交流があれば緊急時に相談しやすい（国立教育政策研究所 生徒指導リーフ）","sourceId":"nier-leaf"},{"text":"文部科学省は令和5年2月の通知で、犯罪に相当するいじめ事案については直ちに警察に相談・通報し、適切な援助を求めなければならないことを周知した。いじめの重大化を防ぐための留意事項集（令和7年11月）も、発達障害の特性や家庭環境が背景にある場合や犯罪行為に相当しうる場合の関係機関連携を明記","sourceId":"cfa-ijime-ryui-r7"},{"text":"少年鑑別所は「法務少年支援センター」として、学校や保護者からの相談に無料で応じている。非行や問題行動の背景の見立て、対応の助言、心理検査などが受けられる"},{"text":"生徒指導提要（令和4年12月改訂）第5章は暴力行為を、第6章は少年非行を扱い、規範意識と自己指導能力を育てる発達支持的生徒指導、未然防止、早期発見、困難課題対応、警察・児童相談所・家庭裁判所等との連携を整理している","sourceId":"seito-shido-teiyo"}],"overview":"暴力行為は、対教師暴力、生徒間暴力、対人暴力、器物損壊に分けて調査されています。少年非行は、犯罪少年・触法少年・ぐ犯少年という少年法の枠組みで扱われ、喫煙・深夜徘徊・家出などの不良行為も含めて、警察・児童相談所・家庭裁判所が関わります。学校の役割は、行為を止めて安全を確保すること、背景を見て指導と支援を行うこと、犯罪に相当する行為はためらわず警察と連携すること、の3つです。本ハンドブックで扱うのは、発達障害の特性による行動（衝動性、パニック、感覚過敏からの反応）が暴力行為や非行として扱われることが少なくなく、逆に背景の障害や虐待が見過ごされることもあるからです。","points":["行為は止める。被害を受けた子ども・教職員の安全と、行為をした子ども自身の安全を確保する。止めることと、背景を理解することは両立する","背景を見る。虐待、発達の特性、家庭環境、対人関係、学業不振。少年院在院者に発達障害や虐待の経験が多いことは各種の調査で指摘されている。行為だけを罰しても繰り返す","犯罪に相当する行為は、ためらわず警察に相談・通報する。学校で抱え込むことは、被害の子どもにも行為をした子どもにも不利益になる。日頃から学校警察連絡協議会などで顔の見える関係を作っておく","障害の特性による行動と非行を見分ける。パニックや衝動的な行動は、環境調整と行動の機能の分析（何が引き金で、何を得ているか）で減らせる。見立ては特別支援教育コーディネーターと、必要なら法務少年支援センターの助言を得る"],"signsLabel":"気づきのポイント","signs":["些細なことで激しく怒る、物に当たる、教職員への反抗的な態度や暴言が増える","特定の場面（切り替え、指示、騒がしい環境、嫌な感覚）で決まって荒れる。引き金が読める場合は特性の可能性が高い","友人関係の急な変化、年上の集団との付き合い、金銭の出入り、深夜の外出、無断外泊","持ち物の変化（喫煙具、金品）、学校の器物の損壊が繰り返される","家庭での暴力や叱責、虐待の兆候。家に帰りたがらない","被害の側の子どもが登校を渋る、特定の子どもを避ける、けがや持ち物の紛失が続く","障害のある子どもの場合：叱責の積み重ねによる自己否定、「悪い子」というラベル。周囲に「乱暴な子」と見られている"],"supportsLabel":"支援の要点","supports":[{"title":"発達支持的・未然防止","items":["規範意識と、自分の行動を自分で決める力（自己指導能力）を育てる。ルールを押しつけるのではなく、なぜそのルールがあるかを考える場を","怒りや衝動への対処法（アンガーマネジメント、落ち着ける場所、合図）を、全体と個別の両方で教える","非行防止教室、薬物乱用防止教室を警察・関係機関と連携して実施する","障害のある子どもには、引き金になる場面を減らす環境調整（見通し、刺激の調整、逃げ場）と、代わりの行動を教えることを、個別の指導計画に位置づける"]},{"title":"暴力行為が起きたときの初動","items":["複数の教職員で、被害の子ども・教職員と行為をした子どもを離し、安全を確保する。けががあれば手当と保護者への連絡を最優先に","事実確認は複数で、双方から、時系列で。事実と推測を分けて記録する。行為をした子どもの言い分も聞く","行為をした子どもへの指導は、行為を認めさせ、被害の側への謝罪と修復を促す。ただし、背景に虐待や特性がある場合は、指導と並行して支援の方針を立てる","懲戒（学校教育法第11条）は教育上必要な範囲で、体罰は禁止。出席停止（第35条）は市町村教育委員会の措置で、期間中の学習支援と復帰の計画が要る","被害を受けた子ども・教職員のケアを忘れない。SC・SSWにつなぎ、保護者に経過を説明する"]},{"title":"外部連携","items":["犯罪に相当する行為（傷害、恐喝、器物損壊、性的な加害など）は、ためらわず警察に相談・通報する。学校警察連絡協議会などの日頃の関係が緊急時の連携を円滑にする","14歳未満の触法行為や、家庭に問題がある場合は児童相談所へ。要保護児童対策地域協議会の対象になることもある","法務少年支援センター（少年鑑別所）に、見立てと対応の助言を無料で相談できる。保護者も相談できる","家庭裁判所の審判、保護観察、少年院送致になった場合は、保護観察所や少年院と連携し、学校復帰や進路（修学の継続、通信制、就労支援）を切れ目なく支える","非行の背景に発達障害の特性がある場合は、特別支援教育コーディネーターと医療機関を交え、非行として扱う部分と特性として支援する部分を分ける"]}],"planningLabel":"計画への落とし込み","planning":["行為をした子どもについて、背景の見立て、指導の方針、支援の方針、関係機関との連携、被害の側への対応を1枚に整理し、校内の生徒指導部会で経過を確認する","障害のある子どもについては、個別の指導計画に、引き金になる場面、環境調整、代わりの行動、危機時の対応を書く。自立活動の目標はサポートシートの手順で","出席停止や保護処分の期間中は、学習の継続と復帰の計画を設置者・関係機関と作る"],"related":[{"catId":"adhd","note":"衝動的な行為が暴力行為や非行として扱われやすい。環境調整と代わりの行動を教える。叱責の積み重ねによる二次的な問題を防ぐ"},{"catId":"autism","note":"パニック、感覚過敏からの反応、切り替えの困難が暴力行為に見えることがある。引き金の分析と見通しの提示"},{"catId":"intellectual","note":"善悪の判断やルールの理解が年齢相応でない場合、年上の集団に利用されて非行に巻き込まれることがある"},{"catId":"emotional","note":"情緒の不安定さや対人関係の困難が、暴力や反抗の形で現れることがある。背景の不安や虐待を見る"},{"catId":"ld","note":"学業不振と自己評価の低下が、荒れや非行の背景になることがある"}],"relatedTopics":[{"tab":"seito","id":"child-abuse","note":"虐待を受けた子どもが攻撃的・衝動的な行動を示すことがある。背景に虐待がないかを見る"},{"tab":"seito","id":"bullying","note":"暴力を伴ういじめ、犯罪に相当するいじめは警察と連携する"},{"tab":"seito","id":"dropout","note":"非行や問題行動を理由とする修学の中断を防ぐ。処分後の学習の継続と復帰の計画"},{"tab":"seito","id":"futoukou","note":"非行傾向のある子どもの不登校。教育支援センターや居場所づくりと連携"}],"sources":["moj-shonenho","nier-leaf","cfa-ijime-ryui-r7","seito-shido-teiyo"],"reviewed":"2026-09-14"},{"id":"child-abuse","num":"07","chapter":"第7章 児童虐待","name":"児童虐待","en":"Child Abuse and Neglect","subtitle":"保護者から身体的虐待・性的虐待・ネグレクト・心理的虐待を受けている、または受けている疑いのある幼児児童生徒","status":{"tone":"info","label":"通告義務","text":"虐待を受けたと思われる子どもを発見した者には通告義務がある（児童虐待防止法第6条）。確証は要らず、通告は守秘義務違反にならない。虐待の有無の判断と家庭への対応は児童相談所・市町村の役割で、学校の役割は「気づいて、通告する」こと"},"basis":[{"text":"児童虐待防止法（平成12年法律第82号）は、虐待を受けたと思われる子どもを発見した者に、市町村（こども家庭センター等）または児童相談所への通告義務を課している（第6条）。教職員に限らず誰にでも生じる義務で、虐待の確証は要らず、一般の人の目から見て疑われる段階で通告義務が生じる。通告は守秘義務違反にならず（第6条第3項）、結果として誤りでも責任は問われない","sourceId":"mext-gyakutai-tebiki-r8"},{"text":"学校・教職員の役割は法で4つ。早期発見に努める（第5条第1項）、通告する（第6条）、関係機関に協力する（第5条第2項）、虐待防止のための教育に努める（第5条第5項）。虐待の有無を判断し、保護者を指導・支援するのは児童相談所と市町村の役割","sourceId":"mext-gyakutai-tebiki-r8"},{"text":"文部科学省「学校・教育委員会等向け 虐待対応の手引き」（令和元年5月作成、令和2年6月改訂、令和8年5月第二次改訂）が学校向けの基本資料。第二次改訂で市町村の窓口が「こども家庭センター等」に整理され、令和7年12月改正の「こども虐待対応の手引き」（こども家庭庁）を反映した","sourceId":"mext-gyakutai-tebiki-r8"},{"text":"平成31年2月28日の初等中等教育局長等通知が定めた3つのルール。保護者から情報元の開示を求められても伝えない／威圧的な要求や暴力が予測される場合は市町村・児童相談所・警察・弁護士と速やかに情報共有／要保護児童等が休業日を除き7日以上欠席したら理由を問わず速やかに市町村または児童相談所に情報提供","sourceId":"mext-gyakutai-tebiki-r8"},{"text":"親権者等による体罰は令和2年4月から法律で禁止（児童虐待防止法・児童福祉法の改正）。民法の懲戒権の規定も令和4年に削除された","sourceId":"mext-gyakutai-tebiki-r8"},{"text":"生徒指導提要（令和4年12月改訂）第7章は、学校の役割を早期発見と通告、対応の主体を児童相談所等とする枠組みで整理し、不登校・非行・いじめ・自殺の背景に虐待が潜んでいる可能性への留意を求めている","sourceId":"seito-shido-teiyo"}],"overview":"児童虐待は、保護者がその監護する18歳未満の子どもに対して行う、身体的虐待・性的虐待・ネグレクト・心理的虐待の4類型を指します。多くの事例で複数の類型が重なります。子どもの目の前で配偶者等に暴力を振るうこと（面前DV）は心理的虐待、学校に通わせないこと（教育ネグレクト）はネグレクトにあたります。本ハンドブックで扱うのは、障害のある子どもは虐待のリスクが高いことが手引きに明記されており、しかも本人が虐待と認識できない・伝えられないことがあるため、周囲がより丁寧かつ積極的に見る必要があるからです。","points":["学校の役割は「気づいて、通告する」こと。虐待の有無の判断、家庭への指導、保護は児童相談所と市町村の役割。学校が確証を探し切る必要はなく、探し続けて時間が経つことが最も危険","「保護者との関係がこじれる」「あの保護者がそんなことをするはずがない」という迷いが、重大な事態を招いた事例がある。子どもの安全を保護者との関係より優先する","不登校・非行・いじめ・自殺の背景に虐待があることがある。表面の現象だけを見ない","障害のある子どもへの対応には工夫や配慮が要るため、保護者の心理的な不安やプレッシャーから虐待のリスクが生じることがある。保護者を責めるのではなく、寄り添い、具体的な対応方法を一緒に考え、相談支援のネットワークを広げることが予防になる（手引き「障害のある子供について」）"],"signsLabel":"気づきのサイン","signsNote":"手引きの表1と「虐待リスクのチェックリスト」から。単独では判断できないので、複数の重なりと経過を見ます。健康診断・身体測定・水泳指導は、身体的虐待やネグレクトに気づきやすい機会です。","signs":["子ども：表情が乏しい、極端に無口、大人の顔色をうかがう、反抗的、落ち着かない。触られること・近づかれることをひどく嫌がる。手を挙げただけで顔や頭をかばう","子ども：家に帰りたがらない。過度なスキンシップを求める。教員を独占したがる","子ども：説明できない不自然なけが、繰り返すけが。臀部・太ももの内側・首・脇の下など、事故では傷つきにくい場所の外傷","子ども：衣服の汚れ、季節に合わない服装、におい、虫歯の未治療、低身長・低体重・体重減少。食べ物への強い執着、極端な食欲不振、友達に食べ物をねだる","子ども：理由のはっきりしない欠席・遅刻・早退。きょうだいの世話のための欠席。性的に逸脱した言動（幼児・低学年では性的虐待の発見のきっかけになることが多い）","保護者：感情や態度が変化しやすい、余裕がない、表情が硬い。人前で子どもを厳しく叱る・叩く。子どもへの近づき方や距離感が不自然","保護者：連絡が取りにくい、家庭訪問や懇談のキャンセルが多い、行事に来ない。子どもの発達に無関心、育児に拒否的な発言、きょうだいへの差別的な扱い、発達にそぐわない厳しいしつけ","状況：体育や身体計測のときによく欠席する。親といるときは親をうかがい表情が乏しいが、親がいなくなると急に表情が晴れやかになる。子どもの具合が悪いと連絡しても保護者に緊急性を感じている様子がない"],"supportsLabel":"気づいてからの動き","supports":[{"title":"校内での初動（気づき・情報集約）","items":["一人で抱えず、直ちに校長等管理職に報告する。管理職は学年主任・養護教諭・SC・SSWなど関係職員を集め、情報を集めて事実関係を整理する。必要に応じて学校医・学校歯科医に助言を求める","外傷がある場合は養護教諭などが確認し、スケッチやメモで詳細に記録する。事実関係は本人の発言を含めて時系列で、事実と推測を分けて記録する（手引きの様式1）","子どもから聞き取る場合は「どんなふうにけがをしたの？」というオープンクエスチョンで。誘導しない。踏み込んだ聴取や度重なる質問は専門機関に任せる","知的障害や発達障害のある子どもは、されていることを虐待と認識できない場合がある。障害の状態、発達の段階、特性を考慮して、周囲がより丁寧かつ積極的に介入する","保護者に外傷の原因を確認する場合、「お子さんは○○と言っていました」と伝えない。保護者を責める発言をしない（子どもにさらなる危害が加わるおそれがある）。説明が実態と矛盾する、二転三転する、子どもの説明と異なる場合は通告する","通告せず様子を見ることにした場合でも、誰がどう観察するか、役割と見通しをチームで共有する"]},{"title":"通告（迷ったら市町村へ、重篤なら児童相談所へ）","items":["次の4つに当たれば児童相談所（虐待対応ダイヤル189）へ通告し、警察にも通報する。①明らかな外傷があり身体的虐待が疑われる、②生命・身体の安全に関わるネグレクト（栄養失調、医療放棄など）、③性的虐待が疑われる、④子どもが帰りたくないと言っている（子ども自身が保護を求めている）","それ以外は市町村（こども家庭センター等）へ。迷ったらまず市町村に相談する。夜間休日や担当不在なら児童相談所へ","通告は口頭（電話）でよい。子ども・保護者の氏名と年齢、家庭の状況、外傷や症状（誰から、いつから、頻度）、出席状況、学校での様子、特記事項（障害の有無、転校歴、これまでの支援）を伝える。通告後速やかに教育委員会等の設置者にも連絡する","性的虐待が疑われる場合は、学校として積極的な情報収集や確認を行うより前に、早急に児童相談所に通告する。障害や発達の特性のある子どもは、性的虐待と認識できない、言葉で伝えることが難しいなどの理由で把握が難しいため、速やかに専門機関と協議する"]},{"title":"通告後・外部連携","items":["児童相談所は原則48時間以内に安全確認を行う。学校での様子の聞き取りに協力する","一時保護中も通学する場合は、不安になっている子どもに適切に声をかける。通学できない場合は一時保護施設等での学習について児童相談所・教育委員会と連携する（要件を満たせば指導要録上出席扱いにできる）","通告後のケースの大半は在宅での支援になる。学校は引き続き普段と変わったことがないか注意深く見取り、不自然な点があれば児童相談所・市町村に相談する","要保護児童対策地域協議会（要対協）の個別ケース会議への参加を求められることがある。学校からの情報は他の構成員にとって重要。構成員には守秘義務があり、学校が提供した情報が保護者に伝わる心配はない","進行管理台帳に登録された子どもについては、月1回程度、出欠状況等を書面で情報提供する。休業日を除き7日以上欠席したら、期日を待たず速やかに情報提供する","保護者から「学校が言いつけた」と言われても、通告の事実や情報元は伝えない。「一時保護等は児童相談所の判断で、学校が決めたものではない」と明確に伝える。威圧的な要求や暴力が予想される場合は複数で対応し、設置者・児童相談所・警察・弁護士（スクールロイヤー）と連携する","転校・進学時は、指導要録・健康診断票・虐待に係る記録の写しを確実に引き継ぎ、対面や電話で必要な情報を伝える。本人・保護者の同意なしに提供できると解されている"]},{"title":"虐待を受けた子どもへの関わり","items":["大人への不信感や恐怖心、著しく低い自己肯定感を抱えていることが多い。安心感・安全感が感じられる受容的な学級づくりに努める","感情を思い通りに表現できないことが多い。周囲に許容される方法を身に付けるよう支援する","「自分は価値のない悪い子だ」「大人は自分をいじめるものだ」というイメージができあがっていることが多い。認め、励ましていく","教職員を試す挑発的な言動（リミットテスティング）があることを理解し、叱責や疎外で不信をさらに強めない"]}],"related":[{"catId":"intellectual","note":"されていることを虐待と認識できないことがある。周囲がより丁寧かつ積極的に見る必要がある（手引き）"},{"catId":"autism","note":"衝動的な行動やパニック、コミュニケーションの困難に対して、保護者が「しつけ」と称した不適切な関わりをしてしまうことがある。理由と背景の理解を保護者と共有する"},{"catId":"adhd","note":"行動への対応の難しさが保護者のストレスと養育の困難につながることがある"},{"catId":"language","note":"言葉で伝えることの難しさから、性的虐待を含めて把握が難しい"},{"catId":"physical","note":"介助の負担が保護者の孤立とストレスにつながることがある。相談支援のネットワークを広げる"},{"catId":"health","note":"医療放棄（受診させない）はネグレクトにあたる。慢性疾患のある子どもの育児負担は虐待のリスク要因の一つ"},{"catId":"emotional","note":"虐待の心理的影響（対人関係の問題、攻撃的・衝動的な行動、多動）は情緒障害や発達障害の特性と見分けにくい。背景に虐待がないかを見る"}],"relatedTopics":[{"tab":"seito","id":"young-carer","note":"ネグレクトとヤングケアラーは重なりうる。きょうだいの世話のための欠席は両方の視点で見る"},{"tab":"seito","id":"futoukou","note":"長期欠席は虐待のリスク情報として重要。家庭訪問で本人に会えない場合は関係機関と共有する"},{"tab":"seito","id":"bullying","note":"虐待を受けた子どもが攻撃的・衝動的な行動でいじめの加害側になることがある"},{"tab":"seito","id":"sexuality","note":"性的虐待は学校が確認するより前に児童相談所へ通告する"},{"tab":"seito","id":"violence-delinquency","note":"虐待を受けた子どもが攻撃的・衝動的な行動を示すことがある"}],"sources":["mext-gyakutai-tebiki-r8","seito-shido-teiyo"],"reviewed":"2026-09-14"},{"id":"suicide-prevention","num":"08","chapter":"第8章 自殺","name":"自殺予防","en":"Suicide Prevention","subtitle":"死にたい気持ちや自傷など、自殺の危険のサインを示している幼児児童生徒と、その予防・危機介入・事後対応","status":{"tone":"warn","label":"法改正・施行済み","text":"改正自殺対策基本法（令和8年4月1日施行）が、学校の責務、心の健康の保持のための健康診断・保健指導、こどもの自殺対策の協議会を新設。学校の役割は、予防（心の健康を育てる）、危機介入（サインに気づき安全を確保してつなぐ）、事後対応（周囲の子どもと教職員を守る）の3つ"},"basis":[{"text":"自殺対策基本法（平成18年法律第85号）。令和7年6月の改正（令和7年法律第64号）が令和8年4月1日に施行され、こどもに係る自殺対策が書き込まれた。学校の責務（第5条：関係者と連携し、こどもの自殺の防止等に取り組むよう努める）、心の健康の保持のための健康診断・保健指導と精神保健に関する知識の向上（第17条第3項）、自治体が学校・教育委員会・児童相談所・精神保健福祉センター・医療機関・警察等で構成する協議会を置けること（第23〜25条。構成員に守秘義務と罰則）","sourceId":"mext-jisatsu-kaisei-r8"},{"text":"自殺総合対策大綱（令和4年10月14日閣議決定）。こども・若者の自殺対策の推進が重点施策","sourceId":"mhlw-jisatsu-taiko-r4"},{"text":"文部科学省の手引き。「教師が知っておきたい子どもの自殺予防」（平成21年3月）、「子供の自殺が起きたときの緊急対応の手引き」（平成22年3月）、「子供に伝えたい自殺予防（学校における自殺予防教育導入の手引）」（平成26年7月）。および「児童生徒の自殺が起きたときの背景調査の指針」（令和7年12月改訂）","sourceId":"mext-jisatsu-page"},{"text":"「SOSの出し方に関する教育」は平成30年1月23日の通知（文部科学省・厚生労働省）で推進。子どもが困難な事態・強い心理的負担を受けたときに対処の仕方を身に付ける教育","sourceId":"mext-sos-h30"},{"text":"文部科学省は毎年、長期休業の前後に「児童生徒の自殺予防に係る取組について（通知）」を出している。相談窓口の周知、自殺予防教育の実施、1人1台端末による心の健康観察、保護者への見守りの依頼、休業明けの見守りを求める内容","sourceId":"mext-jisatsu-tsuchi-r8"},{"text":"生徒指導提要（令和4年12月改訂）第8章は、自殺予防を3段階（予防活動＝プリベンション、危機介入＝インターベンション、事後対応＝ポストベンション）と重層的支援構造で整理し、校内の自殺予防体制、TALKの原則、関係機関連携を示す","sourceId":"seito-shido-teiyo"}],"overview":"児童生徒の自殺は、いじめ、虐待、家庭の問題、精神疾患、学業や進路、対人関係など複数の要因が重なって起こることが多く、単一の原因に帰すことはできません。国は、自殺は「追い込まれた末の死」であり、防ぐことができる社会的な問題と位置づけています。学校の役割は、日頃から心の健康を育て（予防）、危険のサインに気づいて安全を確保しつなぐ（危機介入）、万一起きたときに周囲の子どもと教職員を守る（事後対応）、の3つです。本ハンドブックで扱うのは、自殺の背景として指摘される要因の多くが、他の項目（発達障害、精神疾患、いじめ、虐待、不登校）と重なるからです。","points":["「死にたい」という言葉や自傷を、注意を引くためのものと軽く見ない。TALKの原則：Tell（心配していることを言葉で伝える）、Ask（死にたい気持ちについて率直に尋ねる）、Listen（訴えを傾聴する）、Keep safe（安全を確保する。一人にしない、確実につなぐ）","尋ねることで自殺を促すことはない、というのが手引きの立場。率直に尋ねることが、本人が話せる入口になる","一人で抱えない。気づいた教職員は管理職・養護教諭・SCに直ちにつなぎ、校内の自殺予防体制で対応する。保護者への連絡と医療機関へのつなぎは組織で判断する","事後対応（ポストベンション）は、周囲の子どもの連鎖を防ぎ、教職員を守るためのもの。「子供の自殺が起きたときの緊急対応の手引き」と「背景調査の指針」に沿って、設置者と連携して進める。憶測に基づく説明や、方法の詳細を伝えることは避ける"],"signsLabel":"気づきのサイン","signsNote":"手引きが挙げる自殺の危険因子と直前のサインから。単独で判断せず、変化と重なりを見ます。","signs":["自殺未遂歴、自傷行為。過去の未遂は最も重い危険因子の一つ","「死にたい」「消えたい」「いなくなりたい」という言葉。SNSや作文、端末の健康観察への書き込み","精神疾患（うつ状態、不安、摂食の問題、依存）の兆候。眠れない、食べられない、極端な気分の変化","大切なものを人にあげる、身辺を整理する、別れを告げるような言動","急な行動の変化。無断欠席、深夜の外出、危険な行動、急に落ち着く（決意した後に穏やかに見えることがある）","喪失体験：身近な人の死、失恋、転校、受験の失敗、部活動からの離脱","いじめの被害、虐待、家庭の不和、経済的困窮。孤立し、相談する相手がいない、SOSを出せない","障害のある子どもの場合：特性からくる生きづらさや二次的な自己否定、いじめや叱責の積み重ね、感情の言語化の難しさ。「大丈夫」と言い続けることがサインの見落としにつながる"],"supportsLabel":"気づいてからの動き","supports":[{"title":"校内での初動（気づき・危機介入）","items":["「死にたい」と聞いたら、驚きや否定で返さず、TALKの原則で応じる。話を聞き、心配していることを伝え、率直に尋ね、安全を確保する","一人にしない。その場を離れる前に管理職・養護教諭・SCに連絡し、引き継ぐ。「誰にも言わないで」と言われても、命に関わることは伝えると本人に説明する","校内の自殺予防体制で、緊急度の判断、保護者への連絡、医療機関（精神科・小児科）や相談機関へのつなぎを決める。保護者への連絡は原則として行うが、虐待が背景にある場合は児童相談所と連携して判断する","自傷が続いている子どもには、自傷を叱責せず、背景の苦しさに目を向け、SC・医療につなぐ。自傷の方法や程度を詳しく聞き出すことに時間をかけない","記録は事実と推測を分けて残す。関係者間の情報共有は本人の安全を優先して行う"]},{"title":"予防（プリベンション）","items":["SOSの出し方に関する教育を含む自殺予防教育を、発達段階に応じて計画的に行う（保健、道徳、特別活動と関連づけて）。事前に校内の合意形成と、ハイリスクの子どもへの個別の配慮を整える（「子供に伝えたい自殺予防」）","相談窓口（24時間子供SOSダイヤル 0120-0-78310、SNS相談など）を教室・端末・保護者に周知する。窓口が多すぎて迷わないよう整理する","1人1台端末による心の健康観察を日常的に行い、変化を早期に把握する","長期休業の前後は特に注意する（休業明けに自殺が多いことが通知で毎年注意喚起されている）","心の健康を育てる授業、安心できる学級、教職員が信頼できる大人であること。援助希求性を高める"]},{"title":"外部連携・事後対応","items":["医療機関、精神保健福祉センター、児童相談所、警察、いのちの電話などの民間団体。令和8年4月からは、自治体が置く協議会で学校・医療・警察等が情報交換と対処の協議を行える","万一の事後対応は、設置者と連携し「子供の自殺が起きたときの緊急対応の手引き」に沿って行う。周囲の子どもへの説明は憶測を避け、方法の詳細を伝えず、悲しみの表現を認め、相談窓口を示す。教職員自身のケアも含む","背景調査は「児童生徒の自殺が起きたときの背景調査の指針」（令和7年12月改訂）に沿って、遺族の意向を尊重しつつ設置者が行う"]}],"related":[{"catId":"emotional","note":"不安、抑うつ、選択性かん黙などの状態は、援助希求を難しくする。精神疾患との重なりを見る"},{"catId":"autism","note":"感情の言語化の難しさ、二次的な抑うつ、いじめ被害の重なり。「死にたい」を字義どおりに受け止め、率直に尋ねる"},{"catId":"adhd","note":"衝動性が自傷や危険な行動につながることがある。叱責の積み重ねによる自己否定"},{"catId":"ld","note":"学業不振と自己評価の低下が長く続くことによる二次的な抑うつ"},{"catId":"health","note":"慢性疾患や長期入院に伴う孤立。精神疾患（うつ病、統合失調症、摂食障害など）は自殺の危険因子。病弱の項目の精神疾患を参照"},{"catId":"intellectual","note":"言葉での訴えが乏しく、行動の変化からサインを読み取る必要がある"}],"relatedTopics":[{"tab":"seito","id":"bullying","note":"いじめは自殺の危険因子の一つ。重大事態（1号）の対応と並行する"},{"tab":"seito","id":"child-abuse","note":"虐待は自殺の危険因子の一つ。保護者への連絡の判断は児童相談所と連携する"},{"tab":"seito","id":"futoukou","note":"不登校の背景に抑うつや希死念慮があることがある。家庭訪問や連絡で本人の様子を確認する"},{"tab":"seito","id":"young-carer","note":"ケアの負担と孤立が心の健康を損なうことがある"},{"tab":"seito","id":"sexuality","note":"性被害や性的マイノリティに関する悩みは自殺の危険因子になりうる"}],"sources":["mext-jisatsu-page","mext-jisatsu-kaisei-r8","mext-jisatsu-tebiki-h26","mext-jisatsu-kinkyu-h22","mext-jisatsu-haikei-r7","mext-sos-h30","mext-jisatsu-tsuchi-r8","mhlw-jisatsu-taiko-r4","seito-shido-teiyo"],"reviewed":"2026-09-14"},{"id":"dropout","num":"09","chapter":"第9章 中途退学","name":"中途退学","en":"Dropping Out of High School","subtitle":"高等学校・高等部で、学業不振、不登校、進路の迷い、経済的事情、病気などから退学に至る、またはそのおそれのある生徒","status":{"tone":"info","l
