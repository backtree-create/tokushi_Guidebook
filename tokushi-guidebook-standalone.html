<script>window.__BUNDLE__={"meta":{"title":"特別な配慮を要する幼児児童生徒 指導支援ハンドブック","shortTitle":"配慮ハンドブック","version":"5.5.1","updated":"2026-10-06","disclaimer":{"short":"疾患の医学的な説明は公的な資料へのリンクで示し、疾患ごとの支援は載せていません。自立活動の項目は子どもの実態から選びます。","long":"本ツールは、文部科学省「障害のある子供の教育支援の手引」（令和3年6月）と「特別支援学校教育要領・学習指導要領解説 自立活動編」（平成30年3月）を一次資料とし、要旨を言い換えて整理したものです。疾患の医学的な説明は、小児慢性特定疾病情報センター・難病情報センター・GeneReviews Japan・関係学会などのページへのリンクで示しています。個々の指導計画は、専門家・主治医・教育委員会の判断のもとで作成してください。"},"feedback":{"label":"誤りのご指摘・ご意見","url":"https://forms.gle/VuwXhhbAHGqZcfL18","note":"特別支援教育の実務に携わる方からのご指摘を歓迎します。お名前の記入は不要です。","itemLabel":"この項目について指摘する"},"termMap":{"note":"本ツールの見出しは学校教育法および文部科学省の障害種別区分に従っています。医学的診断名（DSM-5-TR／ICD-11）とは以下のように対応します。","rows":[{"edu":"自閉症／高機能自閉症／アスペルガー症候群","med":"自閉スペクトラム症（ASD）に統合","memo":"「高機能自閉症」は文部科学省の平成15年定義には残るが、DSM-5（2013）で診断名としては廃止"},{"edu":"注意欠陥多動性障害（ADHD）","med":"注意欠如多動症（ADHD）","memo":"DSM-5-TR日本語版の訳語。診断書には「注意欠如多動症」と記載されることが多い"},{"edu":"学習障害（LD）","med":"限局性学習症（SLD）","memo":"教育上のLDは医学的なSLDより広い概念を含む"},{"edu":"情緒障害","med":"単一の診断名には対応しない","memo":"教育上の区分。選択性かん黙・不登校等を含む"},{"edu":"言語障害","med":"語音症・小児期発症流暢症 等","memo":"器質性・機能性の別により対応する診断名が異なる"},{"edu":"知的障害","med":"知的発達症（知的能力障害）","memo":"—"}]},"basisLabels":{"overview":{"mext":{"label":"文部科学省「教育支援の手引」に記載","tone":"ok"},"shouman":{"label":"小児慢性特定疾病 対象疾病","tone":"ok"},"nanbyou":{"label":"指定難病","tone":"ok"},"grj":{"label":"GeneReviews Japan 収録","tone":"ok"},"dsm-icd":{"label":"DSM-5-TR／ICD-11 の診断分類","tone":"ok"},"academic":{"label":"学会・国立研究機関の解説","tone":"ok"},"research":{"label":"研究段階の知見","tone":"warn"},"editorial":{"label":"公的な出典を特定できず","tone":"warn"}},"support":{"mext":{"label":"文部科学省「教育支援の手引」に記載","tone":"ok"},"editorial":{"label":"本ツールによる教育的整理","tone":"info"}},"intro":"各項目の①概要（医学的説明）は公的な資料に基づき、末尾の出典欄に資料名を示します。②個別に求められる支援は、その医学的特性を踏まえて本ツールが教育実務上まとめたもので、資料に直接の記載があるわけではありません。「公的な出典を特定できず」は誤りという意味ではなく、対応する公的分類が見当たらない類型であることを表します。"},"maintenance":{"_note":"改修中の箇所を「メンテナンス中」の案内で覆うスイッチ。各項目の on を true/false にするだけで切り替わる。label=呼び名、place=画面上の場所、scope=覆われる範囲（この3つは編集者向けのメモで画面には出ない）。title=案内の見出し、note=理由、until=再開の目安（この3つが画面に出る）。previewKey は覆いを外して確認する合言葉（URL末尾に ?preview=合言葉）","previewKey":"tokushi-preview-2026","site":{"on":false,"label":"サイト全体","place":"すべての画面（ホーム、両方の冊、出典・リンク集、サポートシート）","scope":"ヘッダーの名称・お知らせ枠・上段の切替は見えるが、中身はすべて案内に置き換わる。個別の5つのスイッチより優先","title":"ただいまメンテナンス中です","note":"内容の見直しと再構成を行っています。終わり次第、再開します。","until":"時期未定"},"support":{"on":true,"label":"自立活動サポートシート（AIと考える）","place":"上部タブ「自立活動 6区分27項目 一覧」→ 上部のカード → サポートシートのページ","scope":"ページ全体（入力欄と指示書の生成）","title":"自立活動サポートシートは整備中です","note":"内容を整えています。終わり次第、公開します。","until":"時期未定"},"jiritsu-block":{"on":true,"label":"障害種別ページの自立活動の欄","place":"上部タブ「障害種別ガイド」→ 各障害種のページ → 「自立活動」の欄","scope":"その欄だけ（教育的ニーズ・支援内容・学びの場は見える）","title":"自立活動の欄は整備中です","note":"自立活動編解説が障害種ごとに挙げている例に基づく内容へ、書き換えています。","until":"時期未定"},"curriculum":{"on":true,"label":"特別の教育課程（日本語指導・2E）","place":"特別支援ガイドブック → タブ「特別の教育課程」","scope":"タブ全体（一覧と2件のページ）","title":"特別の教育課程の節は整備中です","note":"日本語指導が必要な児童生徒と、特異な才能と障害を併せ有する幼児児童生徒（2E）について整理しています。校内での確認を経て公開します。","until":"時期未定"},"seito":{"on":true,"label":"指導提要ガイドブック（生徒指導上の課題）","place":"上段の切替「指導提要ガイドブック」","scope":"冊全体（課題の一覧と各ページ）","title":"指導提要ガイドブックは整備中です","note":"生徒指導提要（令和4年12月改訂）の第II部の各課題を整理しています。校内での確認を経て公開します。","until":"時期未定"},"links":{"on":true,"label":"目的別リンク（○○についてはここから）","place":"上部タブ「出典・リンク集」→ 上部の目的別リンク","scope":"目的別リンクの部分だけ（診断名の対応表と参照資料の一覧は見える）","title":"目的別リンクは整備中です","note":"「○○についてはここから」の目的別の案内を準備しています。診断名の対応表と参照資料の一覧は下にあります。","until":"時期未定"},"sheet2":{"on":true,"label":"計画シート（2階シート 試作）","place":"特別支援ガイドブック → タブ「計画シート」","scope":"タブ全体","title":"計画シートは整備中です","note":"通級・日本語指導・不登校・特異な才能の計画を一枚にまとめる様式を準備しています。校内での試行を経て公開します。","until":"時期未定"}},"notice":{"heading":"先生方へ","lines":["このたび、学校全体の特別支援教育全般に係る専門性の向上と、幼児児童生徒一人ひとりの指導目標や支援の方法、配慮の内容等の検討に係る時間の効率化を図るため、ポータルサイトを作成しました。","現在大幅な改修を行っておりますので、しばらくお待ちください。"],"form":{"url":"https://forms.gle/VuwXhhbAHGqZcfL18","label":"問い合わせ・情報提供フォーム","sub":"お名前の記入は不要です（Googleフォームが開きます）"},"pdf":{"url":"https://backtree-create.github.io/tokushi_Guidebook/about.pdf","label":"作成の趣旨と活用場面（令和8年9月15日改訂）"},"intro":"2冊構成です。特別支援ガイドブックは、障害種ごとの見るべき軸・実態把握の仕方・指導内容と支援の要点・学びの場を、文部科学省の手引と解説に基づいて整理し、主な疾患は公的な医学資料へのリンクで示します。指導提要ガイドブックは、生徒指導提要に基づく生徒指導上の課題を扱います。","primary":["文部科学省「障害のある子供の教育支援の手引」（令和3年6月）","文部科学省「特別支援学校 自立活動編」（平成30年3月）","文部科学省「生徒指導提要」（令和4年12月改訂）"],"classification":"主な疾患・状態のリンク先：小児慢性特定疾病情報センター／難病情報センター／GeneReviews Japan／関係学会の一般向け解説 ほか","supportForm":{"url":"","label":"自立活動サポートシート（校内様式・R8.3時点）","_note":"校内様式のWordファイルの置き場所（SharePoint等）のURLを入れると、サポートシートのページにリンクが出る。空なら出ない"}},"changelog":[{"date":"2026-10-08","summary":"版5.5.1。「見るべき軸」のレイアウトを、左に軸名、右に区分（横並び）と支援上の意味、の行に変更。カードの枠をやめ区切り線に"},{"date":"2026-10-08","summary":"版5.5.0。障害種別ページの見やすさを改善。節の見出しを大きくし余白で区切る／目次を番号付きにして画面上部に固定／「見るべき軸」を表からカード（左に区分、右に支援上の意味）に／主な疾患・状態を枠の重なりから区切り線の一覧に変え、リンクを右側に寄せて発行元の行を削除／「手引 p.○」の印を枠なしの薄い文字に"},{"date":"2026-10-08","summary":"版5.4.1。出典・リンク集と障害種別索引の末尾にあった免責文を削除（フッターと同じ文が二重に出ていた）。免責文そのものも短く書き直した"},{"date":"2026-10-07","summary":"版5.4.0。出典・リンク集を刷新。参照資料の一覧を「文部科学省の手引・解説・資料／法令・通知／関係省庁・国の機関／医療／学校保健の様式／診断分類」の群に分け、列を「資料・発行・版・時点・確認日」の4列に固定幅で揃えた。「常に最新を参照」「特定版の固定引用」の更新方針の表示と一覧URLの行を廃止し、確認日だけを表示。資料の補足（note）は読み手向けの一言に書き直し、編集者向けのメモは editorNote に退避（画面には出ない）。診断名の対応表も列幅を固定"},{"date":"2026-10-07","summary":"版5.3.4。障害種別ページとサポートシートの説明文を全体に見直し、編集方針の断り書き（「公的な資料で確認できるものだけ」「疾患ごとの支援は書きません」「学齢期に多いものから」「自立活動の項目との対応付けはしません」「疾患名や氏名は渡しません」など）を削除。各節の導入文は、読み手が何を得られるかだけを書く形に統一"},{"date":"2026-10-07","summary":"版5.3.3。サポートシートの項目名・選択肢・見出しから括弧書きの説明を減らした。説明は小さな補足（hint）に移すか削除。「（未選択）」は「—」、「手元にある（AIに求められたら内容を伝える）」は「手元にある」、「（任意）」は補足表示に"},{"date":"2026-10-06","summary":"版5.3.2。画像の取り込み（ページ内に置く・コピー・保存）を廃止。AIに自動で渡せないため。検査結果などの資料は「なし・未確認／手元にある」の有無だけを選び、手元にある場合は指示書に一覧が入り、AIが必要な時点で内容（数値や所見）を教えるよう求める形に統一"},{"date":"2026-10-06","summary":"版5.3.1。画像の項目に有無の選択（なし・未確認／手元にある（AIに求められたら渡す）／ここに取り込む）を追加。「手元にある」を選ぶと、指示書に「手元にある資料（まだ渡していません）」の一覧が入り、AIは必要になった時点で画像を貼るよう求め、貼られるまで中身を推測せず、貼られたら読み取りを要約して確認してから進む"},{"date":"2026-10-06","summary":"版5.3.0。自立活動サポートシートの①実態把握を、障害種ごとの独立した項目で入力できるようにした（各区分の json の fields。選択式・数値・文字・チェック・画像）。校内様式の5欄ごとに項目を置き、末尾に補足の自由記述。入力した項目は「項目：値」の行として指示書・校内様式へ貼る用テキスト・計画シートに入る。検査結果などの画像をページ内に取り込め（送信・保存はしない。長辺1600pxに縮小）、指示書に「添付する画像」の一覧と読み取りの指示が入る。画像は「コピー」（クリップボード）か「保存」でAIに添付する。氏名・生年月日が写っていないか確かめる注意書きを追加。版5.2.0の「観点を下書きとして欄に入れる」ボタンは項目に置き換えて廃止"},{"date":"2026-10-06","summary":"版5.2.0。自立活動サポートシートが障害種の観点を受け取ったとき、中身がその障害種に合わせて切り替わるようにした。「今、困っていること」「特に相談したいこと」の例文が障害種ごとに変わる／①の5欄に「観点を下書きとして欄に入れる」ボタン（空いている欄に「・観点：」の形で入る）／②の上に、手引がその障害種について挙げている指導内容を参考として折りたたみで表示／指示書にも同じ指導内容を「参考」として同梱（項目の選定は①〜④の実態からと明記）／観点を持つときは詳しい欄を最初から開く。障害種→項目の対応表は引き続き持たない"},{"date":"2026-10-06","summary":"版5.1.1。障害種別索引の説明文を版5.0の構成に合わせて書き直し、「自立活動 項目数」の数字と、自立活動の項目を疾患から引かない旨の断り書きを削除（各ページの指導内容の節からも同じ断り書きを外した。手順はサポートシート側で示す）"},{"date":"2026-10-06","summary":"版5.1.0。残り7区分（知的障害・病弱・身体虚弱・言語障害・自閉症・情緒障害・学習障害・ADHD）も版5.0の型へ移行し、10区分すべてが「見るべき軸」「実態把握の仕方（校内様式の5欄）」「固有の見方」「指導内容と支援の要点」「学びの場」「主な疾患・状態」「用語」「出典」の構成になった。旧型の疾患データ（495件）は廃止し、主な疾患・状態は公的資料で確認できる103件に。言語・LD・ADHDは疾患一覧を持たず、状態は軸の表に置く。疾患の並びは50音順ではなく、手引の記載と学齢期の頻度を踏まえて主要なものから（視覚障害の先頭は未熟児網膜症・網膜色素変性症）。実態把握の見出しの番号の円が横に伸びる不具合を修正。サポートシートの観点のプルダウンは10区分すべてが選べる。出典に日本形成外科学会（口唇裂・口蓋裂）を追加。免責の文言を版5.0の構成に合わせて書き直し"},{"date":"2026-10-06","summary":"版5.0.0。障害種別ページを作り替える第1段（聴覚障害・視覚障害・肢体不自由）。文部科学省「障害のある子供の教育支援の手引」第3編の各章を読み込み、「見るべき軸」（聴覚＝部位・程度・聴力型・時期・原因、視覚＝視力・視野・光覚・その他の視機能・眼疾患、肢体＝起因疾患・進行性・運動と姿勢・病型と随伴障害・医療的ケア）、校内様式の5欄に対応させた「実態把握の仕方」、障害種に固有の見方、指導内容と支援の要点、学びの場、主な疾患・状態、用語、出典の順に組み直した。疾患ごとの「個別に求められる支援」（本ツールの編集）は廃止し、疾患は手引が挙げるものを中心に公的な医学資料へのリンクで確認できるものだけに絞った（聴覚29→22件、視覚66→16件、肢体57→17件）。各ページの「この子の支援を考える」から、自立活動サポートシートがその障害種の実態把握の観点を持った状態で開く（#/jiritsu/support?cat=障害種）。サポートシート側は観点のプルダウン、5欄のプレースホルダー、指示書への観点の同梱、計画シートへの障害種名の受け渡しを追加。残り7区分は旧型のまま（順次移行）。出典に日本耳鼻咽喉科頭頸部外科学会（子どもの病気、小児難聴診療の手引き）、日本整形外科学会、日本小児神経学会、聴覚障害教育の手引、点字学習指導の手引、医療的ケア実施支援資料を追加"},{"date":"2026-10-01","summary":"版4.6.0。自立活動サポートシートに校種の選択（幼稚部・小学部・中学部／高等部）を追加。高等部を選ぶと、根拠を「特別支援学校高等部学習指導要領（平成31年2月告示）第6章」と「解説 総則等編（高等部）第9章 自立活動」に切り替え、卒業後の生活を見据えた観点（自己理解・自己選択・援助要請、進路・職業教育との関連）をAIへの指示に加える。出典に総則等編（高等部）と学習指導要領等の入口ページを登録し、一覧タブ・リンク集にも掲載"},{"date":"2026-09-30","summary":"版4.5.1。自立活動タブのサポートシートのカードで、「整備中」の印だけ文字色と大きさが他と違っていた（カード内の説明文用の指定が印にも効いていた）のを揃えた"},{"date":"2026-09-30","summary":"版4.5.0。自立活動サポートシートを校内様式（R8.3時点）に合わせた。①実態把握の欄を様式と同じ5欄（障害の状態／発達や経験の程度／興味・関心等／学習や生活の中で見られる長所やよさ、課題等／思いや願い（○○年後をイメージする姿））に。AIには最後に「＜自立活動サポートシート（校内様式 R8.3時点）＞【欄名】…」の形式で出すよう指示し、貼り付けると①の欄に流し込める。「校内様式へ貼る用テキストをコピー」を追加。計画シートへの受け渡しも新しい欄に対応。様式ファイルのURLは meta.json の notice.supportForm に入れるとリンクが出る"},{"date":"2026-09-28","summary":"版4.4.10。本文の「子供」を「子ども」に統一（文部科学省の資料名「障害のある子供の教育支援の手引」「子供に伝えたい自殺予防」などの固有名と「」内の引用は原文のまま）。自立活動タブのサポートシートのカードで「整備中」の印だけ書体が違っていたのを揃えた"},{"date":"2026-09-28","summary":"版4.4.9。ダークモードの視認性を改善。青の強調色を明るく（#7db3e8→#a6cdf5）、濃紺で塗っていた選択中の状態（索引・メニューの項目・障害種別のボタン）を金色に、入口カードの上縁や見出しの小さな青も明るい青に"},{"date":"2026-09-26","summary":"版4.4.8。サポートシートと計画シートを連携。サポートシートの指示書は最後に計画シートへ貼り戻せる形式（【個別シート：通級による指導】■ 欄名）を出すよう指示し、サポートシートに「計画シート（通級の欄）へ送る」を追加（AIの回答を貼れば欄に流し込み、貼らなければ困りごとと①〜④を送る。共通シートの実態・得意・校種も補う）。計画シートの通級の欄に「サポートシートで項目を考える」を追加（実態と課題を持って行く）"},{"date":"2026-09-26","summary":"版4.4.7。名称と本文の「児童生徒」を「幼児児童生徒」に改めた（法令・通知・様式の名称と「」で引用した語は原文のまま）。全体のホームで2冊のカードと一次資料の欄の間に余白を追加"},{"date":"2026-09-26","summary":"版4.4.6。全体のホームから、2冊の行き来の説明文と、フッターと重複していた免責文を削除"},{"date":"2026-09-26","summary":"版4.4.5。全体のホーム(#/)を新設。「先生方へ」のお知らせ、2冊への入口カード（特別支援ガイドブック／指導提要ガイドブック）、一次資料を置き、ここから2冊に分岐する。障害種別の索引は特別支援ガイドブックのホーム(#/guide)へ。名称・ホームボタンは全体のホームに戻る"},{"date":"2026-09-26","summary":"版4.4.4。上の帯の「特別支援」「指導提要」をタブより一回り大きくして冊の切替と分かるようにした。メニューの中身を今いる冊に合わせた：指導提要側では「生徒指導上の課題へ」（9件の小さなボタン）と、計画シート・出典、特別支援側への入口。特別支援側では「障害種別へ」、道具、指導提要側への入口"},{"date":"2026-09-26","summary":"版4.4.3。画面構成を版4.4.1の形（上に名称の帯と冊・タブの帯、左に障害種別の索引、右下にメニュー）へ戻し、メニューの中身を作り直した。上の帯にある冊とタブは繰り返さず、「このページの中」（本文の見出しから自動で拾ったジャンプ）、「障害種別へ」（10区分の小さなボタン）、「道具」（サポートシート・計画シート・出典）、「操作」（先頭へ・ホーム・問い合わせ）を置く。本文の読み幅を整えた"},{"date":"2026-09-26","summary":"版4.4.2。画面全体を再構成。上は名称と2つのリンクだけの細い帯、左は目次（特別支援ガイドブック：障害種別ガイド〈その下に10区分の索引と検索〉／特別の教育課程／自立活動／計画シート、指導提要ガイドブック：生徒指導上の課題、共通：出典・リンク集）、右が本文。目次は常に見え、本文は読み幅を制限。スマホでは目次を左からせり出す形にし、右下の三本線ボタンで開閉。ホームのお知らせは白地に"},{"date":"2026-09-26","summary":"版4.4.1。右下の「メニュー」を三本線の形にし、開くと×に変わる。パネルは右下から広がって項目が上から順に現れ、項目を押すと短く光って他が薄くなってから閉じる。ホバーで左に印が伸びる。スマホは下からせり上がる。動きを減らす設定（prefers-reduced-motion）では無効"},{"date":"2026-09-26","summary":"版4.4.0。ヘッダーを2段（名称＋趣意書・問い合わせのリンク／2冊とタブを1本の帯）に圧縮。「先生方へ」のお知らせ、2冊の説明、一次資料はホームの本文の先頭へ移動（文面は meta.json の notice で編集）。右下のボタンを「メニュー」に変え、押すとホーム・両冊のタブ・出典が並ぶパネルが開く（外側かEscで閉じる。スマホでは下から出る）"},{"date":"2026-09-26","summary":"版4.3.3。全体の読みやすさを調整。行間・本文の余白・節の間隔を広げ、見出しと本文の文字を少し大きく、囲みの線と影を減らして余白で区切る形に。ヘッダーの一次資料欄は右の列をやめて名称の下に1行で。索引・疾患の行・カード・表の余白を広げた"},{"date":"2026-09-25","summary":"版4.3.2。2階シートを自立活動タブから切り離し、特別支援ガイドブックの新タブ「計画シート」(#/plan)へ。自立活動タブは27項目一覧とサポートシート（項目を選ぶ道具）だけに。計画シートは「該当する特例を選ぶ」まで入力欄を出さない形にし、通級の欄からサポートシートへ、サポートシートの末尾から計画シートへ相互リンク。旧URL #/jiritsu/sheet2 は転送"},{"date":"2026-09-25","summary":"版4.3.1。2階シートに「AIと考える」を追加。困っていることを一言書くと、Copilot／Gemini 向けの指示書（AIは1回1問で聞き出し、共通シート→個別シートの順に整理し、貼り戻せる形式で出力）ができる。AIの回答を貼り付けると欄に流し込める（■ 欄名／内容 の形式を読み取り、上書きは確認付き）。通級を選ぶと27項目の正式名称を同梱"},{"date":"2026-09-25","summary":"版4.3.0。「2階シート（試作）」(#/jiritsu/sheet2)を新設。通級・日本語指導・不登校・特異な才能の各特例の計画を、共通シート＋特例ごとの個別シート（タブ切替）で入力し、印刷（PDF）とWord貼り付け用テキストに出す。各個別シートの欄は既存の様式・記載項目（自立活動編解説、日本語指導の個別の指導計画作成参考資料、児童生徒理解・支援シート、WG取りまとめ案の記載項目例）に基づく。国の参考様式の公表後に欄を合わせ直す前提。氏名は扱わず、入力は送信・保存しない。整備中の覆い（sheet2）を追加"},{"date":"2026-09-25","summary":"版4.2.9。指導提要ガイドブック・特別の教育課程の各ページの読みやすさを改善。ページ内の目次チップを追加、箇条書きの1文目を太字にして拾い読みできるように、行間・余白と最大行長を調整、法令・通知の根拠（公的な位置づけ）を末尾の折り畳みに移動"},{"date":"2026-09-25","summary":"版4.2.8。出典の監視を整理。一般向け解説ポータル5件（目の病気・代表的な病気・こころの情報サイト・発達障害ナビポータル・インクルDB）に watch: quiet を付け、月次の変化検出では台帳に記録するだけで Issue に載せず、年次の棚卸しに一覧する。版という概念のない常時更新ページ29件に kind: portal を付け、年次の「版の記載がないもの」から除外。版のあるガイドライン7件に edition を追加。source-watch.yml と annual-review.yml を更新"},{"date":"2026-09-25","summary":"版4.2.7。リンク切れ検出への対応：東京大学IRCNのプレスリリースは論文DOI（eNeuro 2023）に、血友病のガイドラインPDF（移動）は小児慢性特定疾病の疾患概要に差し替え。Mindsは自動検査に応答しないため一覧URLから外した。出典の一覧ページの変化検出（11件）は、新版の公表ではなくページ側の更新と判断し、確認日を更新"},{"date":"2026-09-25","summary":"版4.2.6。疾患の詳細で、①概要（医学的説明）②個別に求められる支援 ③程度別の支援 の各見出しに①②③の印を付け、末尾の「出典」欄を同じ番号の2列（項目名／出典と資料）で並べる形に改めた。②が本ツールの整理であることを一文で明記"},{"date":"2026-09-15","summary":"版4.2.5。趣意書（about.pdf）を改訂。新名称と2冊構成、廃止した対応付け・逆引きに代えてサポートシート、見立ての切り分けと気づき・初動の活用例、検索避けの案内を反映。ヘッダーのリンク文言を「令和8年9月15日改訂」に"},{"date":"2026-09-15","summary":"版4.2.4。画面の文言を再精査。版番号・内部の仕組み・変更の経緯など読む人に不要な説明（出典・リンク集の管理方法、自立活動の対応付けを廃止した経緯、旧タブからの移動の履歴、カードの件数表示）を削除し、使い方の説明だけを残した。メンテナンス中の案内も簡潔に"},{"date":"2026-09-14","summary":"版4.2.3。リンク切れ検出（Issue #4）への対応：GeneReviews Japan の移転先（plaza.umin.ac.jp/~grj/）へ更新、小児腎臓病学会のPDFは到達を再確認し一覧URLをMindsに変更。画面移動のスクロールを見直し：最上部には戻さず、別画面へ移ったときは本文の先頭（スマホの障害種別ページは本文）まで、疾患を開いたときは動かさず画面外なら最小限だけ寄せる、戻る／進むは離れたときの位置に戻す"},{"date":"2026-09-14","summary":"版4.2.2。メンテナンス中スイッチに「サイト全体」（maintenance.site）を追加。on にするとすべての画面が案内に置き換わる（プレビューの合言葉は有効）"},{"date":"2026-09-14","summary":"版4.2.1。自立活動サポートシートを作り直し。入力は「今、困っていること」1つに絞り、①実態把握〜④指導目標はAIが1回1問で聞き出す指示書に変更（分からない事項は「確認すべき点」に残す）。従来の①〜④の欄は「書けるところまで書いておく（任意）」として折り畳みに"},{"date":"2026-09-14","summary":"版4.2.0。指導提要ガイドブックに 暴力行為・少年非行（第5・6章）、中途退学（第9章）、インターネット・SNS（第11章）、性に関する課題（第12章）の4件を追加し、第II部の10章を全て反映（9件）。出典8件を登録"},{"date":"2026-09-14","summary":"版4.1.0。指導提要ガイドブックに いじめ（第4章）・児童虐待（第7章）・自殺予防（第8章）の3件を追加（出典16件を登録。虐待対応の手引き 令和8年5月第二次改訂版、改正自殺対策基本法 令和8年4月施行、いじめ重大化防止の留意事項集 令和7年11月を反映）。ヘッダーの名称が長くなって一次資料欄が下に落ちていた崩れを修正"},{"date":"2026-09-14","summary":"版4.0.0。名称を「特別な配慮を要する児童生徒 指導支援ハンドブック」に改め、その中に「特別支援ガイドブック」（障害種別・特別の教育課程・自立活動）と「指導提要ガイドブック」（生徒指導提要 第II部の課題）の2冊を置く2段構成にした。旧「配慮を要する背景」は解体し、日本語指導・2Eを特別支援側の「特別の教育課程」（curriculum.json）へ、ヤングケアラーを指導提要側（seito.json、第13章）へ振り分け。障害種別ページに「関連する生徒指導上の課題・特別の教育課程」を自動表示（指導提要側の関連情報を逆引き）。指導提要側の各課題からサポートシートへの導線。旧URL #/haikei/* は転送"},{"date":"2026-09-14","summary":"版3.2.4。meta.json の maintenance の各項目に呼び名・画面上の場所・覆われる範囲のメモ（label/place/scope）を持たせ、どのキーがどこに対応するか分かるようにした。画面側の表示は従来どおり（見出し・理由・目安のみ）"},{"date":"2026-09-14","summary":"版3.2.3。検索避けを追加（robots.txt で全体のクロール拒否、index.html と単一ファイル版に noindex/nofollow/noarchive）。validate が両方を検査"},{"date":"2026-09-14","summary":"版3.2.2。メンテナンス中の覆いを外して確認するプレビュー（?preview=合言葉、meta.json の maintenance.previewKey）を追加。配慮を要する背景・生徒指導上の課題・目的別リンクも整備中表示にした（5か所すべて on）"},{"date":"2026-09-14","summary":"版3.2.1。改修中の箇所を「メンテナンス中」の案内で覆うスイッチ(meta.json の maintenance)を追加。サポートシートと障害種別ページの自立活動の欄を整備中表示にした"},{"date":"2026-09-14","summary":"版3.2.0。疾患・障害種ごとの自立活動の項目候補(全件が根拠のない編集整理)を廃止し、データからも削除。代わりに「自立活動サポートシートをAIと考える」(#/jiritsu/support)を新設。解説の手順(①実態把握〜④指導目標を教員が記入、⑤項目の選定〜⑦指導内容をAIと)に沿った入力欄から、Copilot用・Gemini用の指示書を生成。AIの役割は問い返す人。氏名は扱わず、入力は送信・保存しない。シート（案）の表示・印刷は見送り（指示書の生成のみ）"},{"date":"2026-09-14","summary":"版3.1.0。「診断名・出典」タブを「出典・リンク集」に改め、目的別のリンク集(links.json、10群)を上部に追加。行は大きく押しやすい形にし、本ツール内のページへの導線も併記。文中のリンクに太めの下線と外部リンクの印(↗)を付けた。インクルDB(国立特別支援教育総合研究所)を出典に追加"},{"date":"2026-09-14","summary":"版3.0.0。不登校を障害種別ガイドから外し、生徒指導提要を一次資料とする新タブ「生徒指導上の課題」(seito.json)に書き直した(自立活動との対応付けと未確認の19類型は廃止。旧URL #/c/futoukou は転送)。「項目→疾患」の逆引き(#/jiritsu/区分/項目)を廃止。自立活動の対応付けに「編集整理」バッジと選定手順(実態把握→課題の整理→項目の選定→指導内容)を表示。区分は10、疾患・状態は495件"},{"date":"2026-09-14","summary":"タブ「配慮を要する背景」を新設。日本語指導が必要な児童生徒・特異な才能と障害を併せ有する児童生徒（2E）・ヤングケアラーの3件（haikei.json）。自立活動とは対応付けず、関連する障害種別へ内部リンク。出典11件を追加し、validate.mjsに専用の検査を追加"},{"date":"2026-09-08","summary":"ヘッダーに「先生方へ」の枠（作成の趣旨、問い合わせ・情報提供フォーム、趣意書PDFへのリンク）を追加"},{"date":"2026-08-26","summary":"学校生活管理指導表の対象疾患27件に印を付けた。様式に根拠のある範囲（心疾患・腎疾患・糖尿病・アレルギー6疾患）に限定"},{"date":"2026-08-26","summary":"学校教育法施行令第22条の3の条文を収録。程度別支援に尺度の明示を必須化し、GMFCSを5段階・脳性まひ全病型に。根拠のない2件を削除"},{"date":"2026-08-26","summary":"「学びの場から探す」の逆引き画面を削除。各障害種ページ内の学びの場欄はそのまま"},{"date":"2026-08-25","summary":"配色を白地・濃紺・藍で組み直した。生成りの地と金の差し色をやめ、本文コントラストを18:1に。役割ごとの下限をvalidate.mjsで固定"},{"date":"2026-08-25","summary":"URLに現在地を持たせ戻るボタンを有効化。自立活動からの逆引き、学びの場から探す、支援内容までの検索、印刷用体裁、暗い配色、指摘フォームへの導線を追加"},{"date":"2026-08-25","summary":"ヘッダーの説明文をクリックしてもホームに戻ってしまう問題を修正。操作対象を紋章とタイトルに限定"},{"date":"2026-08-25","summary":"視認性を調整。薄すぎた文字色をコントラスト比4.5以上に補正し、11px未満の文字を底上げ。validate.mjsで再発を検査"},{"date":"2026-08-25","summary":"疾患514件の医学的説明について出典を特定し、区分と出典元を各項目に表示。公的疾患DB・学会・国立研究機関の情報源9件を出典レジストリに追加"},{"date":"2026-08-25","summary":"データをJSONに分離。出典レジストリと出典区分バッジを追加。特別支援教育資料を令和6年度版に更新。Service Workerをネットワーク優先に修 ,"publisher":"文部科学省","edition":"令和5年改訂版","url":"https://www.mext.go.jp/a_menu/shotou/tokubetu/material/1340250_00010.htm","policy":"pinned","checked":"2026-10-06","group":"mext","editorNote":"点字を使う幼児児童生徒の指導","note":"点字を使う幼児児童生徒の指導"},{"id":"mext-iryoteki-care","title":"小学校等における医療的ケア実施支援資料～医療的ケア児を安心・安全に受け入れるために～","publisher":"文部科学省","edition":"令和3年6月","url":"https://www.mext.go.jp/a_menu/shotou/tokubetu/material/1340250_00002.htm","policy":"pinned","checked":"2026-10-06","group":"mext","editorNote":"学校での医療的ケアの体制と手順","note":"学校での医療的ケアの体制と手順"},{"id":"jsprs-disease","title":"形成外科で扱う疾患（一般向け解説）","publisher":"日本形成外科学会","url":"https://jsprs.or.jp/general/disease/","indexUrl":"https://jsprs.or.jp/general/disease/","policy":"latest","review":"年1回","checked":"2026-10-06","kind":"portal","watch":"quiet","group":"medical","editorNote":"口唇裂・口蓋裂など","note":"口唇裂・口蓋裂など"}],"jiritsu27":[{"ku":"健康の保持","items":[{"name":"生活のリズムや生活習慣の形成","desc":"睡眠と覚醒などの生活リズムを整え、食事・排せつ等の生活習慣や、清潔の保持など健康な生活環境をつくる力を育てる。","official":"生活のリズムや生活習慣の形成に関すること"},{"name":"病気の状態の理解と生活管理","desc":"自分の病気の状態を理解し、進行を防ぐための生活の仕方を身に付け、自己管理できるようにする。","official":"病気の状態の理解と生活管理に関すること"},{"name":"身体各部の状態の理解と養護","desc":"病気や事故による神経・筋・骨・皮膚等の状態を理解し、部位を保護したり症状の進行を防いだりできるようにする。","official":"身体各部の状態の理解と養護に関すること"},{"name":"障害の特性の理解と生活環境の調整","desc":"自己の障害の特性が及ぼす学習・生活上の困難を理解し、行動や感情を調整したり周囲に働きかけたりして環境を整える。","official":"障害の特性の理解と生活環境の調整に関すること"},{"name":"健康状態の維持・改善","desc":"運動量の減少や体力低下を防ぐため、日常生活における健康の自己管理ができるようにする。","official":"健康状態の維持・改善に関すること"}]},{"ku":"心理的な安定","items":[{"name":"情緒の安定","desc":"情緒の安定を図ることが難しい子どもが、安定した情緒のもとで生活できるようにする。","official":"情緒の安定に関すること"},{"name":"状況の理解と変化への対応","desc":"場所や場面の状況を理解して心理的な抵抗を減らしたり、変化する状況に適切に対応したりする力を育てる。","official":"状況の理解と変化への対応に関すること"},{"name":"困難を改善・克服する意欲","desc":"自分の障害の状態を理解・受容し、積極的に困難の改善・克服に取り組もうとする意欲を高める。","official":"障害による学習上又は生活上の困難を改善・克服する意欲に関すること"}]},{"ku":"人間関係の形成","items":[{"name":"他者との関わりの基礎","desc":"人に対する基本的な信頼感をもち、他者からの働きかけを受け止め、それに応じることができるようにする。","official":"他者とのかかわりの基礎に関すること"},{"name":"他者の意図や感情の理解","desc":"他者の意図や感情を理解し、場に応じた適切な行動をとれるようにする。","official":"他者の意図や感情の理解に関すること"},{"name":"自己の理解と行動の調整","desc":"自分の得意・不得意や行動の特徴を理解し、集団の中で状況に応じた行動ができるようにする。","official":"自己の理解と行動の調整に関すること"},{"name":"集団への参加の基礎","desc":"集団の雰囲気に合わせたり、参加の手順や決まりを理解したりして、集団活動に積極的に参加できるようにする。","official":"集団への参加の基礎に関すること"}]},{"ku":"環境の把握","items":[{"name":"保有する感覚の活用","desc":"保有する視覚・聴覚・触覚・嗅覚・固有覚・前庭覚等の感覚を十分に活用できるようにする。","official":"保有する感覚の活用に関すること"},{"name":"感覚や認知の特性についての理解と対応","desc":"自分の感覚や認知の特性（過敏さや偏り等）を理解し、情報を適切に処理し対応できるようにする。","official":"感覚や認知の特性についての理解と対応に関すること"},{"name":"感覚の補助及び代行手段の活用","desc":"補助機器の活用や、他の感覚・機器による代行によって、状況を的確に把握できるようにする。","official":"感覚の補助及び代行手段の活用に関すること"},{"name":"周囲の状況把握と状況に応じた行動","desc":"複数の感覚や補助・代行手段を総合的に活用し、情報を収集して的確な判断・行動ができるようにする。","official":"感覚を総合的に活用した周囲の状況についての把握と状況に応じた行動に関すること"},{"name":"概念の形成","desc":"ものの機能・属性・形・色や、空間・時間等の概念の形成を図り、認知や行動の手がかりとして活用できるようにする。","official":"認知や行動の手掛かりとなる概念の形成に関すること"}]},{"ku":"身体の動き","items":[{"name":"姿勢と運動・動作の基本的技能","desc":"姿勢保持や上肢・下肢の運動・動作の改善、関節拘縮・変形の予防、筋力の維持・強化を図る。","official":"姿勢と運動・動作の基本的技能に関すること"},{"name":"補助的手段の活用","desc":"姿勢の保持や運動・動作が困難な場合に、補助用具等の補助的手段を活用してできるようにする。","official":"姿勢保持と運動・動作の補助的手段の活用に関すること"},{"name":"日常生活に必要な基本動作","desc":"食事・排せつ・衣服の着脱・洗面等の身辺処理や、書字・描画等、学習に必要な基本動作を身に付ける。","official":"日常生活に必要な基本動作に関すること"},{"name":"身体の移動能力","desc":"自力での移動や歩行、歩行器・車椅子による移動など、日常生活に必要な移動能力の向上を図る。","official":"身体の移動能力に関すること"},{"name":"作業に必要な動作と円滑な遂行","desc":"作業に必要な基本動作を習得し、巧緻性・持続性を高め、円滑に作業を遂行する力を養う。","official":"作業に必要な動作と円滑な遂行に関すること"}]},{"ku":"コミュニケーション","items":[{"name":"コミュニケーションの基礎的能力","desc":"表情・身振り・各種の機器等を用いて、意思のやり取りができる基礎的な力を身に付ける。","official":"コミュニケーションの基礎的能力に関すること"},{"name":"言語の受容と表出","desc":"話し言葉や文字・記号等を用いて、相手の意図を受け止めたり自分の考えを伝えたりできるようにする。","official":"言語の受容と表出に関すること"},{"name":"言語の形成と活用","desc":"コミュニケーションを通じて事物・現象・自己の行動等に対応した言語概念を形成し、体系的に言語を身に付ける。","official":"言語の形成と活用に関すること"},{"name":"コミュニケーション手段の選択と活用","desc":"話し言葉・文字・記号・機器等の中から適切な手段を選択・活用し、円滑なやり取りができるようにする。","official":"コミュニケーション手段の選択と活用に関すること"},{"name":"状況に応じたコミュニケーション","desc":"相手との関係やその場の状況を把握し、場や相手に応じて主体的にコミュニケーションを展開できるようにする。","official":"状況に応じたコミュニケーションに関すること"}]}],"categories":[{"id":"visual","num":"01","name":"視覚障害","en":"Visual Impairment","overview":"視機能の永続的な低下により、学習や生活に困難がある状態。文字の読み書きや事物の確認、初めての場所での移動などに困難が生じやすく、出生後から10歳頃までの視力の発達時期における早期対応が特に重要とされます。","places":[{"name":"通常の学級","note":"拡大教材の活用や座席位置の配慮等の支援を受けながら参加"},{"name":"通級による指導（弱視）","note":"大部分は通常の学級で学び、一部の時間で自立活動の指導を受ける"},{"name":"弱視特別支援学級","note":"視知覚・視機能の向上を図る指導を系統的・継続的に実施"},{"name":"特別支援学校（視覚障害）","note":"点字による教育や自立活動を含む専門的な一貫教育を実施"}],"quote":"視覚障害とは、視機能の永続的な低下により、学習や生活に困難がある状態をいう。","sourceId":"tebiki-3-visual","legalCriteria":{"law":"学校教育法施行令 第22条の3","term":"視覚障害者","clauses":["両眼の視力がおおむね〇・三未満のもの又は視力以外の視機能障害が高度のもののうち、拡大鏡等の使用によつても通常の文字、図形等の視覚による認識が不可能又は著しく困難な程度のもの"],"sourceId":"shikkourei-22-3","note":"特別支援学校に就学する障害の程度として政令が定めるもの。就学先はこの程度に該当するかどうかだけで決まるものではなく、本人・保護者の意向、専門家の意見、学校や地域の状況等を総合的に判断して市町村教育委員会が決定します。"},"programCriteria":{"notice":"平成25年10月4日付け25文科初第756号 文部科学省初等中等教育局長通知（別紙）","sourceId":"mext-756","entries":[{"program":"特別支援学級","term":"弱視者","text":"拡大鏡等の使用によつても通常の文字，図形等の視覚による認識が困難な程度のもの"},{"program":"通級による指導","term":"弱視者","text":"拡大鏡等の使用によつても通常の文字，図形等の視覚による認識が困難な程度の者で，通常の学級での学習におおむね参加でき，一部特別な指導を必要とするもの"}],"note":"特別支援学級・通級による指導の対象となる障害の程度として、国が示した目安です。学級の設置や指導の実施は市町村教育委員会の判断によるため、この程度に該当すれば必ず利用できるというものではありません。"},"v5":true,"diseases":{"v5":true,"id":"visual","axisType":"function","axisTypeLabel":"見え方の状態で見る","definition":"視機能の永続的な低下により、学習や生活に困難がある状態です。手引は病名ではなく視機能で定義しています。教育上の視覚障害は、両眼とも低下していて回復が望めない場合を指し、片眼だけの障害や手術で回復する白内障などは含めません。視力は出生後に発達し、10歳頃に安定するため、それまでの時期の見る経験と早期の対応が重要です。","definitionRef":"pp.60–61, 80","axesIntro":"視機能は7つの要素（視力、視野、光覚、色覚、屈折・調節、眼球運動、両眼視）から成ります。①〜④が見え方、⑤が眼疾患です。","axes":[{"name":"視力","levels":["矯正視力 0.3程度（黒板・教科書に困難）","0.1前後（拡大が要る）","0.01以下（指数弁・手動弁・光覚弁・0）"],"meaning":"文字をどう学ぶか（点字か、拡大した普通の文字か）を判断する中心。両眼で見た遠見視力のほか、近見視力を別に測る。","ref":"pp.80–81"},{"name":"視野","levels":["求心性視野狭窄（中心10度以内）","中心暗点","半盲・その他の欠損"],"meaning":"視野が狭いと移動や周囲の把握に著しい不自由が出る。中心が見えないと周辺は見えても読み書きに困難が出る。困難の出方が逆方向になる。","ref":"p.81"},{"name":"光覚","levels":["暗順応障害（夜盲）","明順応障害（昼盲）","羞明（まぶしさ）"],"meaning":"屋外・暗所・照明・まぶしさで見え方が変わる。遮光眼鏡、カーテン、机上の照明など環境の条件に直結する。","ref":"p.81"},{"name":"色覚・屈折・眼球運動・両眼視","levels":["色の弁別","ピント（屈折・調節）","追視・注視（眼球運動、眼振）","遠近感（両眼視）"],"meaning":"教材の色やコントラスト、見る距離、動くものを目で追えるか、立体的に捉えられるかに関わる。","ref":"pp.80–82"},{"name":"眼疾患と経過","levels":["進行性か","視覚管理上の運動制限（眼球への衝撃）があるか","手術・治療の予定"],"meaning":"疾患は「視機能の特徴と医学的な管理」を知るために押さえる。分類の主役ではない。","ref":"pp.83–84"}],"assessmentIntro":"手引の「状態等の把握」を校内様式の5つの欄に対応させた観点の一覧です。最も見やすい条件（文字の大きさ・距離・照明・コントラスト）は実測して書きます。","assessment":{"status":[{"text":"眼疾患名と発症の時期、合併する疾患、進行性かどうか","ref":"p.62"},{"text":"視力（遠見・近見、裸眼・矯正）、視野障害・光覚障害の有無、両眼視・追視などの評価","ref":"pp.62–63"},{"text":"視覚管理上の配慮：眼球への衝撃を避ける全身運動の制限があるか","ref":"p.63"},{"text":"補装具：眼鏡・コンタクト・遮光眼鏡、弱視レンズ（遠用・近用）、視覚補助具の種類と使う頻度","ref":"p.63"},{"text":"使っている文字（点字／普通の文字）、見やすい字体・文字の大きさ・最小可読指標・行間、照明、アイパッチの使用","ref":"p.64"},{"text":"医療機関からの情報：検査結果、進行の見通し、眼鏡の調整、調光の必要性、視能訓練士の評価","ref":"p.63"}],"development":[{"text":"保有する視覚の活用の様子。慣れた場所では視覚を使わず経験で判断していることがあるので、小部屋と大部屋、移動を含めて見る","ref":"pp.63–64"},{"text":"歩行・階段・方向感覚、目と手の協応、探索的に触って調べる動作","ref":"p.65"},{"text":"慣れた場所を一人で歩けるかを含む基本的生活習慣","ref":"p.65"},{"text":"言葉だけで作られた誤ったイメージがないか（概念の形成と意思の伝え合い）","ref":"p.66"},{"text":"健康と安全、感覚の働き、知的発達","ref":"pp.64–66"}],"interest":[{"text":"屋外活動への消極性や自分で選ぶ力の弱さがないか（情緒の安定）","ref":"p.66"},{"text":"園等での遊びの中の関わりと興味・関心。保護者が行動を制限しすぎていないかも見る","ref":"pp.66, 68"}],"strengths":[{"text":"自分の見え方の理解。最も見やすい環境の条件を自分で分かっているか","ref":"p.67"},{"text":"弱視レンズなどの補助的手段を使いこなせるか、自分から工夫しているか","ref":"p.67"},{"text":"自分で安全を管理できるか（自立への意欲）","ref":"p.67"},{"text":"アイ・コンタクトの程度など対人関係の様子、道具を使う活動への苦手意識の有無","ref":"pp.67–68"}],"wish":[{"text":"本人の思いや願い。使いたい文字や道具、やってみたい活動","ref":"p.68"},{"text":"保護者の思いや願いと、家庭での関わり方","ref":"p.68"}],"how":[{"text":"音・光・素材の異なるおもちゃで、顔の向き・距離・眼球の動き・手の動きを観察する","ref":"p.63"},{"text":"最も見やすい条件を知るための検査：5mの遠見視力、30cmの近見視力、最も近づいた距離での最小可読視標、視力以外の視機能の評価","ref":"pp.67–68"},{"text":"屋外と屋内、照明、色やコントラストでの見えやすさの違いを観察して記録する","ref":"p.85"},{"text":"検査で文字の指示を音声に代える、時間を延ばす、検査者が補助するなどの工夫をしたら記録する。動作性の検査は下位項目ごとに構造的に評価する","ref":"p.68"},{"text":"医療機関（眼科・視能訓練士）、園・児童発達支援施設から情報を集める","ref":"pp.63, 68"}],"tests":[{"name":"遠見視力検査（5m）","note":"ランドルト環。両眼で見た矯正視力が学びの場の目安に使われる","ref":"pp.67, 81"},{"name":"近見視力検査（30cm）","note":"読み書きの条件を知る。遠見とは別に測る","ref":"p.67"},{"name":"最小可読視標","note":"最も近づいた距離で読める最小の文字。拡大の程度を決める材料","ref":"p.67"},{"name":"視野検査・暗順応検査","note":"視野計、暗順応計。移動や照明の条件に関わる","ref":"p.82"},{"name":"視知覚の検査","note":"フロスティッグ視知覚発達検査など","ref":"p.68"}]},"specific":[{"title":"視力の程度と文字の学び方","ref":"pp.74–80","body":["両眼の矯正視力がおおむね0.3未満（0.5程度まで想定）または視力以外の視機能障害が高度で、拡大鏡等を使っても通常の文字・図形の認識が不可能（点字が必要）または著しく困難な場合が、特別支援学校（視覚障害）の対象の目安。","「著しく困難」とは、認識に倍以上の時間がかかる、正答率が半分に満たないなど。「拡大鏡等」は弱視レンズ類・単眼鏡・遮光眼鏡を指し、拡大読書器やタブレットは含まない。","拡大教材を使う場合も、最も見やすい文字の大きさ・行間・コントラストは一人一人違う。実測した条件を校内様式の「障害の状態」に書く。"]},{"title":"視野・光覚ごとの見え方の特徴","ref":"pp.81–82","body":["視野が狭い（求心性狭窄）：読む・見ることはできても、歩行や周囲の把握、動くものへの対応が難しい。","中心が見えない（中心暗点）：周辺は見えるので移動はできるが、文字を読むのに時間がかかる。視線をずらして見ることがある。","暗順応障害：暗い場所や夕方に急に見えにくくなる。明順応障害・羞明：明るい場所でまぶしく見えにくい。遮光眼鏡や照明の調整で変わる。"]},{"title":"特別支援学校（視覚障害）で使われる教材・設備","ref":"pp.85–86","body":["点字教科書、拡大教科書、拡大読書器、弱視レンズ、書見台、感光器、表面作図器、点字器、3Dプリンタによる触察教材など。","通常の学級や弱視特別支援学級でも、特別支援学校のセンター的機能を通じて相談できる。"]}],"guidance":{"intro":"手引が視覚障害について挙げている指導内容と支援の要点です。","preschool":{"label":"就学前（幼稚部など）","ref":"pp.68–69","items":["注視・追視など視覚を活用する基礎的な技能","概念の形成と言葉の活用（触って順に捉える把握と、一目で捉える把握の違いを踏まえる）","状況の理解と変化への対応、他者の意図や感情の理解"]},"school":{"label":"義務教育段階","ref":"pp.69–71","items":["保有する視機能の活用と向上","認知や行動の手掛かりとなる概念の形成","感覚の補助・代行手段の活用（弱視レンズ、タブレット端末など）","状況に応じたコミュニケーション","身体の移動能力（ガイド歩行、援助の依頼、白杖）"]},"accommodation":{"label":"合理的配慮を含む支援の内容","ref":"pp.71–73","groups":[{"title":"教育内容・方法","items":["弱視レンズの活用と、見やすい環境を自分で整える力","時間の延長、近づく・触る学習、実物や模型に触れる機会","拡大・音声・読み上げによる情報保障、予定の事前提示","自分の視覚障害の理解と事故防止、見えにくいときに尋ねられる雰囲気"]},{"title":"支援体制","items":["特別支援学校（視覚障害）のセンター的機能、弱視特別支援学級・通級の専門性","眼科医の助言、点字図書館など地域資源との連携","災害時の避難"]},{"title":"施設・設備","items":["廊下を含む十分な明るさ、分かりやすい目印や段差の表示","まぶしさを防ぐ照明・カーテンの調整、拡大読書器の設置"]}]}},"placesIntro":"手引 §2（pp.74–80）に基づく程度と学びの場の目安です。","conditionsIntro":"各行は、どの視機能にどう影響するか（視力／視野／光覚／進行性／運動制限）の要点です。詳しくはリンク先を参照してください。","conditionGroups":[{"title":"手引が挙げる学齢期の主な原因疾患","items":[{"name":"未熟児網膜症","axis":"視力・視野（瘢痕期の程度による）","line":"早産児の網膜の血管の発達異常。軽症は自然に治るが、重症では網膜剥離により高度の視覚障害が残る。強度近視を伴うことがある。","ref":"p.83","links":[{"label":"国立成育医療研究センター 子どもの病気","url":"https://www.ncchd.go.jp/hospital/sickness/children/retinopathy.html","sourceId":"ncchd"}]},{"name":"網膜色素変性症","axis":"視野・光覚（進行性）","line":"夜盲と求心性の視野狭窄が進行する。暗い場所での移動に注意が要る。指定難病。","ref":"p.83","links":[{"label":"難病情報センター（指定難病90）","url":"https://www.nanbyou.or.jp/entry/196","sourceId":"nanbyou"},{"label":"日本眼科学会 目の病気「網膜色素変性」","url":"https://www.nichigan.or.jp/public/disease/name.html?pdid=53","sourceId":"nichigan"}]},{"name":"視神経萎縮","axis":"視力・視野","line":"視神経の障害で視力や視野が低下する。原因はさまざまで、進行の有無は原因による。","ref":"p.83","links":[{"label":"教育支援の手引 第3編 Ⅰ 視覚障害（p.83）","url":"https://www.mext.go.jp/content/20211014-mxt_tokubetu02-000018454_05.pdf","sourceId":"tebiki-3-visual"},{"label":"日本眼科学会 目の病気「視神経症」","url":"https://www.nichigan.or.jp/public/disease/name.html?pdid=32","sourceId":"nichigan"}]},{"name":"先天白内障","axis":"視力（手術後の経過）","line":"生まれつき水晶体が濁る。手術後も視力の発達には弱視訓練が要り、眼鏡やコンタクトで調整する。","ref":"p.83","links":[{"label":"国立成育医療研究センター 子どもの病気","url":"https://www.ncchd.go.jp/hospital/sickness/children/029.html","sourceId":"ncchd"},{"label":"日本眼科学会 目の病気「白内障」","url":"https://www.nichigan.or.jp/public/disease/name.html?pdid=48","sourceId":"nichigan"}]},{"name":"先天緑内障","axis":"視力・視野（進行性）","line":"眼圧が高く視神経が障害される。視野が狭くなり、進行する。眼圧の管理と定期受診が要る。","ref":"p.83","links":[{"label":"日本眼科学会 目の病気「緑内障」","url":"https://www.nichigan.or.jp/public/disease/name.html?pdid=35","sourceId":"nichigan"}]},{"name":"強度近視","axis":"視力・屈折（運動制限に注意）","line":"眼軸が長く、矯正しても視力が出にくいことがある。網膜剥離のリスクがあり、眼球への衝撃を避ける指示が出ることがある。","ref":"p.83","links":[{"label":"日本眼科学会 目の病気「近視・遠視・乱視」","url":"https://www.nichigan.or.jp/public/disease/name.html?pdid=28","sourceId":"nichigan"}]},{"name":"網膜芽細胞腫","axis":"視力（治療後の経過）","line":"乳幼児の網膜にできる悪性腫瘍。眼球摘出や放射線・薬物の治療後に視覚障害が残ることがある。小児慢性特定疾病。","ref":"p.83","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/01_05_029/","sourceId":"shouman"}]},{"name":"黄斑変性（黄斑ジストロフィー）","axis":"視力・中心暗点","line":"網膜の中心（黄斑）が障害され、中心が見えにくくなる。周辺は見えるため移動はできるが読みに困難が出る。指定難病。","ref":"p.83","links":[{"label":"難病情報センター 黄斑ジストロフィー（指定難病301）","url":"https://www.nanbyou.or.jp/entry/4798","sourceId":"nanbyou"}]},{"name":"小眼球症","axis":"視力（先天）","line":"眼球が小さく生まれ、視力の発達が限られる。他の眼の異常（コロボーマ等）を伴うことがある。","ref":"p.83","links":[{"label":"教育支援の手引 第3編 Ⅰ 視覚障害（p.83）","url":"https://www.mext.go.jp/content/20211014-mxt_tokubetu02-000018454_05.pdf","sourceId":"tebiki-3-visual"}]}]},{"title":"そのほかの疾患","items":[{"name":"眼皮膚白皮症（アルビニズム）","axis":"視力・光覚（羞明）・眼振","line":"色素が少なく、強いまぶしさと視力低下、眼振を伴う。遮光眼鏡や照明の調整が関わる。指定難病・小児慢性特定疾病。","links":[{"label":"難病情報センター（指定難病164）","url":"https://www.nanbyou.or.jp/entry/4492","sourceId":"nanbyou"},{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/14_01_001/","sourceId":"shouman"}]},{"name":"無虹彩症","axis":"光覚（羞明）・視力","line":"虹彩がほとんどなく、強いまぶしさと視力低下がある。緑内障や白内障を併発することがある。指定難病。","links":[{"label":"難病情報センター（指定難病329）","url":"https://www.nanbyou.or.jp/entry/5452","sourceId":"nanbyou"}]},{"name":"レーベル先天黒内障","axis":"視力（先天・重度）","line":"生後早期から重度の視覚障害がある遺伝性の網膜疾患。眼振や光に対する反応の弱さを伴う。","links":[{"label":"GeneReviews Japan","url":"https://plaza.umin.ac.jp/~grj/grj/LCA-EOSRD.htm","sourceId":"grj"}]},{"name":"レーベル遺伝性視神経症","axis":"視力・中心暗点（思春期以降の急な低下）","line":"ミトコンドリア遺伝子の変異により、10代〜20代に両眼の中心視力が急に低下する。指定難病。","links":[{"label":"難病情報センター（指定難病302）","url":"https://www.nanbyou.or.jp/entry/4661","sourceId":"nanbyou"}]},{"name":"アッシャー症候群","axis":"視野・光覚（進行性）＋難聴","line":"難聴に網膜色素変性症を伴う。視野が就学後に狭くなっていくため、聴覚障害との連携で見る。指定難病。","links":[{"label":"難病情報センター（指定難病303）","url":"https://www.nanbyou.or.jp/entry/4624","sourceId":"nanbyou"}]},{"name":"弱視（医学的弱視：屈折異常・斜視・不同視による）","axis":"視力（発達期の治療で改善しうる）","line":"眼に器質的な病気がなく、視力の発達が妨げられた状態。眼鏡やアイパッチの治療で改善が見込める。教育上の「弱視」（視覚障害）とは意味が違う。","links":[{"label":"日本眼科学会 目の病気「弱視」","url":"https://www.nichigan.or.jp/public/disease/name.html?pdid=25","sourceId":"nichigan"},{"label":"国立成育医療研究センター「斜視」","url":"https://www.ncchd.go.jp/hospital/sickness/children/019.html","sourceId":"ncchd"}]},{"name":"先天色覚異常","axis":"色覚","line":"特定の色の組合せが見分けにくい。視力は正常で、教育上の視覚障害には当たらないが、教材の色づかいに配慮が要る。","links":[{"label":"日本眼科学会 目の病気「先天色覚異常」","url":"https://www.nichigan.or.jp/public/disease/name.html?pdid=33","sourceId":"nichigan"}]}]}],"terms":[{"term":"視力の表し方","desc":"ランドルト環で測る。0.1以下は距離を縮めて換算し、さらに低いと指数弁・手動弁・光覚弁・0と表す。矯正視力は「0.04（1.0×−5.0D）」のように眼鏡の度数と一緒に書かれる。","ref":"pp.80–81"},{"term":"遠見視力・近見視力","desc":"5mで測る遠見と30cmで測る近見。黒板を見る力と手元を見る力は別に把握する。","ref":"p.67"},{"term":"最小可読視標","desc":"最も近づいた距離で読める最小の文字の大きさ。拡大の程度を決める材料。","ref":"p.67"},{"term":"拡大鏡等","desc":"学びの場の判断で使われる語。弱視レンズ類・単眼鏡・遮光眼鏡を指し、拡大読書器やタブレットは含まない。","ref":"p.77"},{"term":"求心性視野狭窄・中心暗点","desc":"視野の周りから狭くなるのが求心性狭窄、中心が見えないのが中心暗点。困難の出方が逆になる。","ref":"p.81"},{"term":"暗順応・明順応","desc":"暗い所・明るい所に目が慣れること。障害があると夜盲・昼盲として現れる。","ref":"p.81"},{"term":"弱視レンズ","desc":"遠用（単眼鏡）と近用（ルーペ）がある。使いこなしには練習が要る。","ref":"p.63"},{"term":"視能訓練士","desc":"視機能の検査と訓練を行う医療職。医療機関からの情報で評価を得る。","ref":"p.63"}],"related":[{"label":"点字学習指導の手引","sourceId":"mext-tenji-tebiki","note":"点字を使う場合の指導"},{"label":"日本眼科学会「ロービジョン」","url":"https://www.nichigan.or.jp/public/disease/name.html?pdid=80","sourceId":"nichigan","note":"見えにくさへの医療側の対応"}],"sources":["tebiki-3-visual","tebiki","mext-tenji-tebiki"],"reviewed":"2026-10-06","sheet":{"seed":"例：拡大教科書を使っているが、黒板の字は見えていないようで写すのに時間がかかる。どのくらいの大きさなら見やすいのか分からない","ask":"例：弱視レンズを使いたがらない。本人の見え方をどう聞き取ればいいか"},"fields":[{"k":"dx","label":"眼疾患名","type":"text","col":"status","ref":"p.62"},{"k":"prog","label":"進行性か","type":"select","options":["進行性","非進行性","不明・未確認"],"col":"status","ref":"p.62"},{"k":"vaFarR","label":"遠見矯正視力（右）","type":"number","unit":"","col":"status","ref":"p.67"},{"k":"vaFarL","label":"遠見矯正視力（左）","type":"number","unit":"","col":"status","ref":"p.67"},{"k":"vaFarB","label":"遠見矯正視力（両眼）","type":"text","col":"status","ref":"p.67","hint":"例：0.08。指数弁・手動弁・光覚弁はそのまま書く"},{"k":"vaNear","label":"近見視力（30cm）","type":"text","col":"status","ref":"p.67"},{"k":"field","label":"視野","type":"select","options":["異常なし","求心性視野狭窄","中心暗点","半盲・その他の欠損","不明・未確認"],"col":"status","ref":"p.81"},{"k":"light","label":"光覚","type":"select","options":["異常なし","暗順応障害（夜盲）","明順応障害・羞明","両方","不明・未確認"],"col":"status","ref":"p.81"},{"k":"restrict","label":"運動の制限","type":"select","options":["あり","なし","不明・未確認"],"col":"status","ref":"p.63","hint":"眼球への衝撃を避ける指示があるか"},{"k":"script","label":"使っている文字","type":"select","options":["普通の文字","拡大した文字","点字","併用","不明・未確認"],"col":"status","ref":"p.64"},{"k":"minSize","label":"最も見やすい文字の大きさ・距離・行間","type":"text","col":"status","ref":"p.67","hint":"例：22ポイント、25cm、行間広め"},{"k":"aids","label":"使っている補助具","type":"checks","options":["眼鏡","遮光眼鏡","弱視レンズ（遠用）","弱視レンズ（近用）","拡大読書器","タブレット","書見台","白杖"],"col":"status","ref":"p.63"},{"k":"light2","label":"見やすい照明・コントラストの条件","type":"text","col":"status","ref":"p.85","hint":"例：手元は明るく、窓を背にしない、白黒反転"},{"k":"exam","label":"視力・視野検査などの結果","type":"image","col":"status","ref":"p.67","hint":"手元にあれば、AIが必要な時点で内容を聞いてきます"},{"k":"med","label":"医療機関・視能訓練士からの情報","type":"textarea","col":"status","ref":"p.63"},{"k":"walk","label":"慣れた場所の単独歩行","type":"select","options":["できる","一部できる","難しい","不明・未確認"],"col":"development","ref":"p.65"},{"k":"cond","label":"最も見やすい条件を自分で分かっているか","type":"select","options":["分かっている","部分的に","まだこれから","不明・未確認"],"col":"strengths","ref":"p.67"}]}},{"id":"hearing","num":"02","name":"聴覚障害","en":"Hearing Impairment","overview":"身の周りの音や話し言葉が聞こえにくい、またはほとんど聞こえない状態。聴覚と言葉の発達には臨界期があり、乳幼児期からの早期発見・早期の教育的対応が、その後の言語発達や人間関係の形成に大きく影響します。","places":[{"name":"通常の学級","note":"補聴器・人工内耳の活用や座席配慮等を受けながら学習に参加"},{"name":"通級による指導（難聴）","note":"大部分は通常の学級で学び、聴覚活用や言語指導を一部時間で実施"},{"name":"難聴特別支援学級","note":"聴覚活用や音声の受容・表出に関する指導を系統的に実施"},{"name":"特別支援学校（聴覚障害）","note":"聴覚活用・言語発達を軸とした一貫した専門教育を実施"}],"quote":"聴覚障害とは、身の周りの音や話し言葉が聞こえにくかったり、ほとんど聞こえなかったりする状態をいう。","sourceId":"tebiki-3-hearing","legalCriteria":{"law":"学校教育法施行令 第22条の3","term":"聴覚障害者","clauses":["両耳の聴力レベルがおおむね六〇デシベル以上のもののうち、補聴器等の使用によつても通常の話声を解することが不可能又は著しく困難な程度のもの"],"sourceId":"shikkourei-22-3","note":"特別支援学校に就学する障害の程度として政令が定めるもの。就学先はこの程度に該当するかどうかだけで決まるものではなく、本人・保護者の意向、専門家の意見、学校や地域の状況等を総合的に判断して市町村教育委員会が決定します。"},"programCriteria":{"notice":"平成25年10月4日付け25文科初第756号 文部科学省初等中等教育局長通知（別紙）","sourceId":"mext-756","entries":[{"program":"特別支援学級","term":"難聴者","text":"補聴器等の使用によつても通常の話声を解することが困難な程度のもの"},{"program":"通級による指導","term":"難聴者","text":"補聴器等の使用によつても通常の話声を解することが困難な程度の者で，通常の学級での学習におおむね参加でき，一部特別な指導を必要とするもの"}],"note":"特別支援学級・通級による指導の対象となる障害の程度として、国が示した目安です。学級の設置や指導の実施は市町村教育委員会の判断によるため、この程度に該当すれば必ず利用できるというものではありません。"},"v5":true,"diseases":{"v5":true,"id":"hearing","axisType":"function","axisTypeLabel":"聞こえの状態で見る","definition":"身の回りの音や話し言葉が聞こえにくい、または聞こえない状態で、そのために学習や生活に困難がある状態です。医学的な難聴の種類や程度だけでなく、補聴器や人工内耳を使ったときの聞こえ、言葉を身に付ける前か後かといった、教育上の見方が重要になります。","definitionRef":"p.89","axesIntro":"難聴は次の5つの軸で見ます。同じ診断名でも、軸の組合せで聞こえ方と必要な配慮が変わります。","axes":[{"name":"障害の部位","levels":["伝音難聴","感音難聴（内耳性・後迷路性）","混合性難聴"],"meaning":"伝音難聴は音が小さく聞こえる状態、感音難聴は音がひずんで言葉の聞き分けが落ちる状態。平均聴力レベルが同じでも聞こえ方は違う。","ref":"pp.106–107"},{"name":"程度","levels":["軽度（25〜40dB）","中等度（40〜60dB）","高度（60〜90dB）","最重度（90dB以上）"],"meaning":"500・1000・2000Hzの平均聴力レベルで区分する。聞き取れる距離や場面、補聴の必要性が変わり、学びの場の目安にもなる。","ref":"pp.107–108, 112"},{"name":"聴力型（オージオグラムの形）","levels":["水平型","低音障害型","高音漸傾型","高音急墜型","dip型"],"meaning":"子どもの難聴の多くは高音漸傾型。高音急墜型は平均聴力が軽く見えても子音が聞き取れず、発音に影響する。","ref":"p.108"},{"name":"障害が生じた時期","levels":["言語習得期前","言語習得期後"],"meaning":"先天性か後天性かより、言葉を身に付ける前か後かが教育上は重要。言語発達への影響と、必要な指導の中身が大きく変わる。","ref":"pp.108–109"},{"name":"原因と経過","levels":["遺伝性（非症候群性／症候群性）","獲得性（胎生期／周産期／後天性）","進行性・遅発性の有無"],"meaning":"症候群性では視覚や腎臓の問題が就学後に出ることがある。外から見える原因がなくても進行することがあり、聴力検査で経過を追う。","ref":"pp.109–110"}],"assessmentIntro":"手引の「状態等の把握」を校内様式の5つの欄に対応させた観点の一覧です。","assessment":{"status":[{"text":"診断名（伝音・感音・混合）、発病と失聴の時期、合併する障害や疾患","ref":"p.90"},{"text":"両耳の聴力レベル（オージオグラム）と聴力型。進行性・遅発性の指摘があるか","ref":"pp.90, 108–110"},{"text":"補聴器・人工内耳の装用状況（なし／片耳／両耳）と、装用したときの聞き取り（装用下の聴取能）","ref":"pp.90–91"},{"text":"補聴援助機器（ワイヤレスのマイクなど）の種類と、使う場面","ref":"p.91"},{"text":"出生の状況、障害の発見と確定診断の時期、治療歴と見通し","ref":"p.90"},{"text":"医療機関からの情報：検査の種類と結果、補聴器の調整、言語聴覚士の評価","ref":"p.91"}],"development":[{"text":"保有する聴覚の活用の様子。聞こえていても言葉として処理しにくい、音の区切りが捉えにくいといった困難がないか","ref":"p.92"},{"text":"意思の伝え合いの手段（音声、読話、キュード、手話、指文字など）と、家庭でどの手段を使っているか","ref":"p.93"},{"text":"言葉の理解と表出、概念の形成の様子（知的発達は概念形成の把握が中心）","ref":"p.93"},{"text":"健康と安全、基本的生活習慣、運動の様子、感覚の働き","ref":"pp.92–93"},{"text":"読み書きの技能と速さ（学習意欲と取組の姿勢の中で見る）","ref":"p.95"}],"interest":[{"text":"園や児童発達支援施設での遊びの中の関わり、興味・関心、社会性の育ち","ref":"p.96"},{"text":"人との関わりで好むこと、保護者との関わりの様子","ref":"p.91"}],"strengths":[{"text":"自分の聞こえについての気付きと受け止め、必要なときに助けを求められるか","ref":"p.94"},{"text":"聞き返す、伝わったか確かめる、補聴援助機器のマイクを相手に渡すなど、困難を減らす工夫を自分でしているか","ref":"p.94"},{"text":"自立への意欲、対人関係の様子、学習への意欲","ref":"pp.94–95"},{"text":"情緒の安定と社会性の発達","ref":"p.93"}],"wish":[{"text":"本人の思いや願い。伝え合いの手段についての本人の好みも含めて","ref":"p.93"},{"text":"保護者の思いや願い。家庭で使っている伝達手段と、就学後に望むこと","ref":"pp.93, 96"}],"how":[{"text":"遊びの場面で観察する：音への反応、言葉の理解と表出、人との関わり、保護者との関わり","ref":"p.91"},{"text":"検査は個別式を優先し、言語性と非言語性を併用する。音声の指示を文字に代える、時間を延ばす、補聴システムを使うなどの配慮をしたら記録する","ref":"p.95"},{"text":"行動観察は「どんな条件や援助があればできるか」の視点で見る。下位項目ごとに構造的に見る","ref":"pp.95–96"},{"text":"医療機関、言語聴覚士、園・児童発達支援施設から情報を集める","ref":"pp.91, 96"}],"tests":[{"name":"純音聴力検査","note":"気導と骨導。オージオグラムの基になる","ref":"pp.113–114"},{"name":"語音聴力検査","note":"語音の聴取域値と弁別（聞き分け）。感音難聴で特に重要","ref":"p.114"},{"name":"乳幼児聴力検査","note":"聴性行動反応、COR、遊戯聴力検査。他覚的検査（ABR・ASSR・OAE）を含む","ref":"pp.114–115"},{"name":"補聴器適合検査","note":"補聴器を付けた状態での聞こえを確かめる","ref":"p.116"}]},"specific":[{"title":"程度ごとの聞こえの特徴と学びの場の目安","ref":"pp.112–113","body":["軽度（25〜40dB）：小さな声や離れた場所の声が聞き取りにくい。騒がしい場所で聞き落としが増える。","中等度（40〜60dB）：普通の大きさの会話で聞き落としがある。補聴器の装用が必要になることが多い。難聴特別支援学級や通級による指導の典型的な対象。","高度（60〜90dB）：補聴器がないと会話の聞き取りが難しい。特別支援学校（聴覚障害）の対象の目安（施行令第22条の3）。","最重度（90dB以上）：補聴器の効果が限られ、人工内耳が検討される。"]},{"title":"補聴の手段","ref":"pp.110–112","body":["補聴器：気導・骨導・軟骨伝導、植え込み型がある。調整は医療機関と補聴器店で行う。","人工内耳：一般に90dB以上で補聴器の効果が不十分な場合に検討される。装用した状態の聴力は20〜40dB程度になることが多いが、聞こえ方は健聴と同じではない。","補聴援助機器：騒音・距離・残響の影響を減らす。話し手がマイクを持ち、音声を直接届ける。教室で有効。"]}],"guidance":{"intro":"手引が聴覚障害について挙げている指導内容と支援の要点です。","preschool":{"label":"就学前（幼稚部など）","ref":"pp.96–97","items":["聴覚の活用","言葉の習得と概念形成","言葉を用いた関わりと知識の広がり"]},"school":{"label":"義務教育段階","ref":"pp.97–100","items":["自分の障害の特性を理解し、聞こえやすい環境を整える","困難を改善しようとする意欲","他者の意図や感情を理解し、集団に参加する","保有する聴覚を活用し、補助・代行手段を使う","言語の受容と表出","言語概念の形成と、言語による思考","コミュニケーション手段の選択と活用"]},"accommodation":{"label":"合理的配慮を含む支援の内容","ref":"pp.100–102","groups":[{"title":"教育内容・方法","items":["情報保障（文字・視覚的な提示）、学習内容の調整","座席の位置と教室の騒音への対策","体験と言葉を結び付ける学習","孤立させない学級づくり"]},{"title":"支援体制","items":["特別支援学校（聴覚障害）のセンター的機能、通級・学級の専門性の活用","耳鼻科、補聴器店、親の会との連携","周囲の理解啓発、災害時の避難誘導"]},{"title":"施設・設備","items":["字幕放送、聞こえの環境（残響・騒音）の調整","緊急情報の視覚化"]}]}},"placesIntro":"手引 §2（pp.102–106）に基づく程度と学びの場の目安です。","conditionsIntro":"原因と経過の枠組みで整理しています。各行は軸上の位置と医学的な要点で、詳しくはリンク先を参照してください。","conditionGroups":[{"title":"遺伝性（非症候群性）","items":[{"name":"先天性難聴（非症候群性）","axis":"原因／遺伝性","line":"先天性難聴の多くを占める。GJB2遺伝子の変異が最も多い。新生児聴覚スクリーニングで発見されることが多い。","ref":"p.109","links":[{"label":"新生児聴覚スクリーニング（日本耳鼻咽喉科頭頸部外科学会）","url":"https://www.jibika.or.jp/modules/disease_kids/index.php?content_id=6","sourceId":"jibika-kids"},{"label":"小児難聴診療の手引き（同学会）","url":"https://www.jibika.or.jp/uploads/files/guidelines/shoni_nancho_0430.pdf","sourceId":"jibika-shoni-tebiki"}]},{"name":"若年発症型両側性感音難聴","axis":"原因／遺伝性・進行性","line":"40歳未満で発症する両側の感音難聴で、遺伝子変異によるもの。進行することがある。指定難病。","links":[{"label":"難病情報センター（指定難病304）","url":"https://www.nanbyou.or.jp/entry/4628","sourceId":"nanbyou"}]},{"name":"ミトコンドリア病に伴う難聴","axis":"原因／遺伝性（母系遺伝）","line":"ミトコンドリアの働きの異常で、難聴のほか筋力低下や糖尿病などを伴うことがある。指定難病。","links":[{"label":"難病情報センター（指定難病21）","url":"https://www.nanbyou.or.jp/entry/335","sourceId":"nanbyou"}]}]},{"title":"遺伝性（症候群性）— 難聴以外の症状を伴う","items":[{"name":"アッシャー症候群","axis":"原因／症候群性・進行性","line":"難聴に網膜色素変性症による視覚障害を伴う。視野や夜間の見え方が就学後に変化することがあり、視覚障害との連携が要る。指定難病。","ref":"pp.109, 117","links":[{"label":"難病情報センター（指定難病303）","url":"https://www.nanbyou.or.jp/entry/4624","sourceId":"nanbyou"},{"label":"GeneReviews Japan アッシャー症候群1型","url":"https://plaza.umin.ac.jp/~grj/grj/usher1.htm","sourceId":"grj"}]},{"name":"鰓耳腎（BOR）症候群","axis":"原因／症候群性","line":"難聴に、耳や首の形の特徴と腎臓の異常を伴う。腎機能の経過に注意が要る。小児慢性特定疾病。","ref":"p.109","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/02_17_044/","sourceId":"shouman"}]},{"name":"ペンドレッド症候群","axis":"原因／症候群性・変動性","line":"内耳の形の異常（前庭水管拡大）を伴う難聴で、甲状腺の腫れを伴うことがある。頭部への衝撃などで聴力が変動・悪化することがある。","links":[{"label":"GeneReviews Japan","url":"https://plaza.umin.ac.jp/~grj/grj/pds_nseva.htm","sourceId":"grj"}]},{"name":"アルポート症候群","axis":"原因／症候群性・進行性","line":"腎炎に進行性の感音難聴と眼の異常を伴う。指定難病・小児慢性特定疾病。","links":[{"label":"難病情報センター（指定難病218）","url":"https://www.nanbyou.or.jp/entry/4348","sourceId":"nanbyou"},{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/02_02_013/","sourceId":"shouman"}]},{"name":"CHARGE症候群","axis":"原因／症候群性","line":"眼・心臓・鼻（後鼻孔）・成長・性腺・耳の異常を組み合わせて持つ。難聴に視覚障害や心疾患を伴うことが多く、重複障害として見る。指定難病・小児慢性特定疾病。","links":[{"label":"難病情報センター（指定難病105）","url":"https://www.nanbyou.or.jp/entry/4138","sourceId":"nanbyou"},{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/13_01_021/","sourceId":"shouman"}]},{"name":"トリーチャー・コリンズ症候群","axis":"原因／症候群性（伝音）","line":"顔面の骨の形成異常に、外耳・中耳の異常による伝音難聴を伴う。骨導補聴器の適応になることがある。小児慢性特定疾病。","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/13_01_038/","sourceId":"shouman"}]}]},{"title":"獲得性（胎生期・周産期）","items":[{"name":"先天性風疹症候群","axis":"原因／胎生期","line":"妊娠中の風疹感染による。重度の難聴に心疾患・眼疾患（白内障など）を伴うことがある。小児慢性特定疾病。","ref":"p.109","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/11_35_094/","sourceId":"shouman"}]},{"name":"先天性サイトメガロウイルス感染症","axis":"原因／胎生期・遅発性","line":"出生時に症状がなくても、後から難聴が現れたり進行したりすることがある。定期的な聴力検査で経過を追う。小児慢性特定疾病。","ref":"p.109","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/11_35_095/","sourceId":"shouman"}]},{"name":"先天性トキソプラズマ感染症","axis":"原因／胎生期","line":"妊娠中の感染による。難聴のほか眼や脳の症状を伴うことがある。小児慢性特定疾病。","ref":"p.109","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/11_35_096/","sourceId":"shouman"}]},{"name":"周産期の要因（低出生体重、新生児仮死、重症高ビリルビン血症）","axis":"原因／周産期","line":"出生前後の要因で内耳や聴神経が障害されることがある。他の障害を併せ持つことがあり、重複障害として見る。","ref":"p.110","links":[{"label":"教育支援の手引 第3編 Ⅱ 聴覚障害（p.110）","url":"https://www.mext.go.jp/content/20211014-mxt_tokubetu02-000018454_06.pdf","sourceId":"tebiki-3-hearing"}]}]},{"title":"獲得性（後天性）","items":[{"name":"滲出性中耳炎","axis":"部位／伝音・変動性","line":"中耳に液がたまり、音が小さく聞こえる。子どもに多く、治療で改善するが、繰り返すと言葉の発達に影響することがある。","links":[{"label":"日本耳鼻咽喉科頭頸部外科学会 子どもの病気","url":"https://www.jibika.or.jp/modules/disease_kids/index.php?content_id=4","sourceId":"jibika-kids"}]},{"name":"慢性中耳炎（真珠腫性を含む）","axis":"部位／伝音（進行すると混合）","line":"鼓膜の穴や真珠腫により伝音難聴が続く。真珠腫は骨を壊して進行するため手術の対象になる。","links":[{"label":"日本耳鼻咽喉科頭頸部外科学会 子どもの病気","url":"https://www.jibika.or.jp/modules/disease_kids/index.php?content_id=5","sourceId":"jibika-kids"}]},{"name":"髄膜炎後の難聴","axis":"原因／後天性（言語習得期前後）","line":"細菌性髄膜炎のあとに両側の高度難聴が残ることがある。内耳が骨化することがあり、人工内耳の判断を急ぐ場合がある。","ref":"p.110","links":[{"label":"教育支援の手引 第3編 Ⅱ 聴覚障害（p.110）","url":"https://www.mext.go.jp/content/20211014-mxt_tokubetu02-000018454_06.pdf","sourceId":"tebiki-3-hearing"}]},{"name":"一側難聴（ムンプス難聴など）","axis":"部位／片側","line":"おたふくかぜのあとなどに片耳が高度に聞こえなくなる。音の方向が分かりにくく、騒がしい場所で聞き取りが落ちる。","links":[{"label":"日本耳鼻咽喉科頭頸部外科学会 子どもの病気「一側難聴」","url":"https://www.jibika.or.jp/modules/disease_kids/index.php?content_id=8","sourceId":"jibika-kids"}]},{"name":"音響外傷","axis":"原因／後天性","line":"大きな音を聞いたあとに起こる感音難聴。耳鳴りを伴うことがある。","links":[{"label":"日本耳鼻咽喉科頭頸部外科学会 子どもの病気","url":"https://www.jibika.or.jp/modules/disease_kids/index.php?content_id=11","sourceId":"jibika-kids"}]},{"name":"薬剤性難聴（耳毒性薬物）","axis":"原因／後天性","line":"ストレプトマイシンやゲンタマイシン、シスプラチンなどの薬剤で内耳が障害されることがある。治療歴の確認が要る。","ref":"p.110","links":[{"label":"教育支援の手引 第3編 Ⅱ 聴覚障害（p.110）","url":"https://www.mext.go.jp/content/20211014-mxt_tokubetu02-000018454_06.pdf","sourceId":"tebiki-3-hearing"}]},{"name":"神経線維腫症Ⅱ型（聴神経腫瘍）","axis":"原因／後天性・進行性","line":"両側の聴神経に腫瘍ができ、難聴が進行する。指定難病。","links":[{"label":"難病情報センター（指定難病34）","url":"https://www.nanbyou.or.jp/entry/275","sourceId":"nanbyou"}]}]},{"title":"伝音難聴の代表例とその他","items":[{"name":"外耳道閉鎖症・小耳症","axis":"部位／伝音","line":"耳の穴がふさがっている、または耳の形が小さい状態。内耳は正常なことが多く、骨導補聴器の適応になる。","ref":"p.110","links":[{"label":"教育支援の手引 第3編 Ⅱ 聴覚障害（p.110）","url":"https://www.mext.go.jp/content/20211014-mxt_tokubetu02-000018454_06.pdf","sourceId":"tebiki-3-hearing"}]},{"name":"機能性難聴","axis":"その他","line":"耳の器官に異常がないのに聴力検査で難聴の結果が出る状態。学校健診で見つかることがあり、心理的な背景を含めて医療機関で確かめる。","links":[{"label":"日本耳鼻咽喉科頭頸部外科学会 子どもの病気","url":"https://www.jibika.or.jp/modules/disease_kids/index.php?content_id=12","sourceId":"jibika-kids"}]}]}],"terms":[{"term":"平均聴力レベル","desc":"500・1000・2000Hzの聴力レベルの平均。程度の区分に使う。dBの値が大きいほど聞こえにくい。","ref":"p.107"},{"term":"オージオグラム","desc":"周波数ごとの聴力レベルを描いた図。形（聴力型）で聞こえ方の特徴が分かる。","ref":"p.108"},{"term":"高音急墜型","desc":"高い音だけ急に聞こえなくなる型。平均聴力は軽くても子音が聞き取れず、発音や聞き分けに影響する。","ref":"p.108"},{"term":"装用下の聴取能（装用閾値）","desc":"補聴器や人工内耳を付けた状態での聞こえ。裸耳の聴力より、教室での聞こえを考えるときに重要。","ref":"pp.90, 111"},{"term":"語音弁別","desc":"語音を聞き分ける力。感音難聴では聴力レベルの割に弁別が落ちることがある。","ref":"p.114"},{"term":"ABR・ASSR・OAE","desc":"本人の反応を要しない他覚的な聴力検査。乳幼児や検査が難しい子どもに使う。","ref":"p.115"},{"term":"読話・キュード・指文字","desc":"口の形を読み取る読話、手の形で音を補うキュードスピーチ、五十音を手で表す指文字。手話と併せて、本人の伝達手段を把握する。","ref":"p.93"},{"term":"補聴援助機器","desc":"話し手のマイクの音声を直接届ける機器。距離・騒音・残響の影響を減らす。","ref":"p.111"}],"related":[{"label":"聴覚障害教育の手引","sourceId":"mext-choukaku-tebiki","note":"言語指導の方法と実践"},{"label":"補聴器・人工内耳と学校生活（日本耳鼻咽喉科頭頸部外科学会）","url":"https://www.jibika.or.jp/modules/disease_kids/index.php?content_id=15","sourceId":"jibika-kids","note":"学校での補聴機器の扱い"},{"label":"お子様の難聴に関する情報（同学会）","url":"https://www.jibika.or.jp/modules/hearingloss/index.php?content_id=6","sourceId":"jibika-kids","note":"保護者向けの入口"}],"sources":["tebiki-3-hearing","tebiki","mext-choukaku-tebiki"],"reviewed":"2026-10-06","sheet":{"seed":"例：補聴器を付けているが、一斉指示を聞き落として周りを見てから動く。本人はどこまで聞こえているのか分からない","ask":"例：補聴援助機器を使うべきか。聞こえなかったときに聞き返せるようにしたい"},"fields":[{"k":"kind","label":"難聴の種類","type":"select","options":["伝音難聴","感音難聴","混合性難聴","不明・未確認"],"col":"status","ref":"p.90"},{"k":"dbR","label":"平均聴力レベル（右）","type":"number","unit":"dB","col":"status","ref":"p.90"},{"k":"dbL","label":"平均聴力レベル（左）","type":"number","unit":"dB","col":"status","ref":"p.90"},{"k":"type","label":"聴力型","type":"select","options":["水平型","低音障害型","高音漸傾型","高音急墜型","dip型","不明・未確認"],"col":"status","ref":"p.108"},{"k":"onset","label":"障害が生じた時期","type":"select","options":["言語習得期前","言語習得期後","不明・未確認"],"col":"status","ref":"p.108"},{"k":"prog","label":"進行性・遅発性の指摘","type":"select","options":["あり","なし","不明・未確認"],"col":"status","ref":"p.110"},{"k":"ha","label":"補聴器","type":"select","options":["なし","片耳","両耳"],"col":"status","ref":"p.90"},{"k":"ci","label":"人工内耳","type":"select","options":["なし","片耳","両耳"],"col":"status","ref":"p.90"},{"k":"aided","label":"装用したときの聞き取り","type":"text","col":"status","ref":"p.90","hint":"装用下の聴取能。例：装用閾値30dB、静かな場所なら会話可"},{"k":"fm","label":"補聴援助機器","type":"select","options":["使用している","使用していない","検討中"],"col":"status","ref":"p.91"},{"k":"audio","label":"オージオグラム・検査結果","type":"image","col":"status","ref":"p.114","hint":"手元にあれば、AIが必要な時点で内容を聞いてきます"},{"k":"med","label":"医療機関・言語聴覚士からの情報","type":"textarea","col":"status","ref":"p.91"},{"k":"comm","label":"主な伝え合いの手段","type":"checks","options":["音声","読話","手話","指文字","キュード","筆談・文字","絵カード"],"col":"development","ref":"p.93"},{"k":"lang","label":"言葉の理解と表出、概念の形成の様子","type":"textarea","col":"development","ref":"p.93"},{"k":"ask","label":"聞き返す・伝わったか確かめる・助けを求める","type":"select","options":["自分からできる","促されればできる","難しい","不明・未確認"],"col":"strengths","ref":"p.94"},{"k":"self","label":"自分の聞こえについての理解","type":"select","options":["よく分かっている","部分的に","まだこれから","不明・未確認"],"col":"strengths","ref":"p.94"}]}},{"id":"intellectual","num":"03","name":"知的障害","en":"Intellectual Disability","overview":"認知や言語などにかかわる知的機能の発達に遅れがあり、他者との意思の交換や日常生活・社会生活等についての適応能力も不十分で、特別な支援を要する状態。状態は環境的・社会的条件によって変わり得るとされています。","places":[{"name":"知的障害特別支援学級","note":"小中学校等の教育課程に準じつつ、実態に応じた特別の教育課程を編成"},{"name":"特別支援学校（知的障害）","note":"生活に根ざした独自の教科・内容による一貫した教育を実施"}],"quote":"認知や言語などにかかわる知的機能の発達に遅れが認められ…特別な支援や配慮が必要な状態。","sourceId":"tebiki-3-intellectual","legalCriteria":{"law":"学校教育法施行令 第22条の3","term":"知的障害者","clauses":["一　知的発達の遅滞があり、他人との意思疎通が困難で日常生活を営むのに頻繁に援助を必要とする程度のもの","二　知的発達の遅滞の程度が前号に掲げる程度に達しないもののうち、社会生活への適応が著しく困難なもの"],"sourceId":"shikkourei-22-3","note":"特別支援学校に就学する障害の程度として政令が定めるもの。就学先はこの程度に該当するかどうかだけで決まるものではなく、本人・保護者の意向、専門家の意見、学校や地域の状況等を総合的に判断して市町村教育委員会が決定します。"},"programCriteria":{"notice":"平成25年10月4日付け25文科初第756号 文部科学省初等中等教育局長通知（別紙）","sourceId":"mext-756","entries":[{"program":"特別支援学級","term":"知的障害者","text":"知的発達の遅滞があり，他人との意思疎通に軽度の困難があり日常生活を営むのに一部援助が必要で，社会生活への適応が困難である程度のもの"}],"absent":[{"program":"通級による指導","reason":"この通知が示す通級による指導の対象に知的障害者は挙げられていません。知的障害のある幼児児童生徒への指導は、特別支援学級や特別支援学校を含めて検討されます。"}],"note":"特別支援学級・通級による指導の対象となる障害の程度として、国が示した目安です。学級の設置や指導の実施は市町村教育委員会の判断によるため、この程度に該当すれば必ず利用できるというものではありません。"},"v5":true,"diseases":{"v5":true,"id":"intellectual","axisType":"profile","axisTypeLabel":"知的機能と適応行動で見る","definition":"知的機能の発達に明らかな遅れがあり、適応行動（意思の交換、日常生活、社会生活、安全、仕事、余暇など）も不十分で、特別な支援が必要な状態です。手引は疾患ではなく「知的機能」と「適応行動」の2つの軸で定義し、状態は環境的・社会的な条件で変わり得るとしています。","definitionRef":"pp.120, 138","axesIntro":"知的障害は次の軸で見ます。検査の数値だけで決めず、生活年齢や経験、環境と関連付けて見ます。","axes":[{"name":"知的機能の発達の遅れ","levels":["認知や言語の機能","標準化された個別検査でおおむねIQ70〜75以下が平均的水準以下の目安"],"meaning":"数値だけで決めない。検査の誤差、そのときの状態、検査者との関係を考慮する。同じ結果でも生活年齢や経験で状態像は大きく違う。","ref":"pp.138–139"},{"name":"適応行動の困難さ","levels":["概念的スキル（言語・読み書き・数）","社会的スキル（対人・ルール・安全）","実用的スキル（身辺処理・生活・仕事・余暇）"],"meaning":"その年齢で標準的に求められる水準に、支援なしで達しているかを見る。求められない状況では困難が表に出ない。","ref":"pp.139–140"},{"name":"両方を伴う状態と発現時期","levels":["知的機能と適応行動の両方の困難が同時にある","発達期（おおむね18歳まで）に現れる"],"meaning":"原因は中枢神経系の機能障害に心理・社会・環境の要因が加わる。環境を整えると困難が目立たなくなることがある。頭部外傷や老化による低下とは区別する。","ref":"pp.138, 140"},{"name":"併存・合併する障害","levels":["自閉症","運動障害","てんかん","精神疾患","視覚・聴覚の障害が遅れの原因になっていないか"],"meaning":"他の障害を併せ有すると適応行動の困難が増す。検査結果の解釈にも反映する（自閉症を併せ有すると言語性が低く出る、手指の障害で動作性が低く出る）。","ref":"pp.123, 127, 140"},{"name":"程度","levels":["軽度（約85%）","中度","重度","最重度"],"meaning":"DSM-5は概念・社会・実用の各領域で総合的に判定する。学びの場の目安は「知的発達の遅滞＋意思疎通の困難＋援助の必要度」で書かれている。軽度は就学時健診で見落とされ、入学後に自己肯定感が下がって二次的な問題が生じることがある。","ref":"pp.124, 133–137, 141"}],"assessmentIntro":"手引の「状態等の把握」を校内様式の5つの欄に対応させた観点の一覧です。知識を生活場面で使えているか、できることを他者に依存していないかを見ます。検査の結果はある時点・ある条件での状態で、IQだけで判断しません。","assessment":{"status":[{"text":"入院歴・服薬、原因となる疾患、育った国や言語の環境","ref":"p.122"},{"text":"知的機能の遅れの状態と、適応行動の困難の状態（他者とのやり取りで有効なコミュニケーションの手段、日常生活動作）","ref":"pp.122–123"},{"text":"困難が現れた時期。併存する障害（自閉症・運動障害・てんかん・精神疾患）、視覚・聴覚の確認","ref":"p.123"},{"text":"検査の結果（MA/DA、IQ/DQ、SA/SQ）と、いつ・どの検査で・どんな条件で取ったか。知能と社会性を対比すると環境の要因が見える","ref":"pp.127–128, 133"},{"text":"医療機関からの情報：原因・病理・治療、緊急時の対応","ref":"p.123"}],"development":[{"text":"身辺自立（食事・排泄・着替え・清潔）","ref":"p.124"},{"text":"社会生活の力（買い物、乗り物、公共機関の利用）","ref":"p.124"},{"text":"社会性（ルールの理解、集団行動、対人スキル）。同年齢の子どもと遊べるか、年齢相応の身辺処理ができるかが基準","ref":"pp.123–124"},{"text":"学習技能（読字・書字・計算・推論）の習得の状況","ref":"p.124"},{"text":"運動機能（協調運動、持久力）、意思の伝達の力と手段","ref":"pp.124–125"}],"interest":[{"text":"園や児童発達支援施設での遊びの中の関わり、興味・関心、社会性の育ち","ref":"p.128"},{"text":"好きな活動、集中できること、人との関わりで好むこと（学習への導入に使える）","ref":"p.125"}],"strengths":[{"text":"学習への意欲と取組の姿勢（着席・姿勢の保持）、読み書き計算の習得状況","ref":"p.125"},{"text":"自分でできることを他者に依存していないか。周囲の支援を活用して実現しようとするか","ref":"p.125"},{"text":"対人関係の様子、身体の動き（粗大・微細・協応）","ref":"pp.125–126"},{"text":"自己の理解（できる・できないの認識、援助を求められるか）","ref":"p.126"},{"text":"知識を生活場面で使えているか（断片的になりやすい）","ref":"p.137"}],"wish":[{"text":"本人の思いや願い。本人が理解できる形で聞く（絵や写真、選択肢）","ref":"p.125"},{"text":"保護者の思いや願いと、家庭での関わり方","ref":"p.128"}],"how":[{"text":"信頼関係を作ってから検査する。方法は、検査者が反応を求める／行動を観察する／保護者等に尋ねる・記入してもらう、の組合せ","ref":"pp.126–127"},{"text":"同じ検査の間隔は1〜2年。結果は実態の一部で、ある時点・ある条件での状態として読む","ref":"pp.127, 133"},{"text":"知能と社会性（適応行動）を対比すると、環境の要因が見える。知的機能が同じでも適応行動は経験で様々","ref":"p.133"},{"text":"医療機関、療育機関、園・児童発達支援施設から情報を集める","ref":"pp.123, 128"}],"tests":[{"name":"知能・発達検査","note":"田中ビネー知能検査、WPPSI・WISC・WAIS、K-ABC、新版K式発達検査、津守・稲毛式、遠城寺式、KIDS など","ref":"pp.126–127"},{"name":"適応行動の検査","note":"新版S-M社会生活能力検査、Vineland-II、ASA旭出式社会適応スキル検査","ref":"p.127"},{"name":"結果の表し方","note":"精神年齢（MA）・発達年齢（DA）、IQ・DQ、社会生活年齢（SA）・社会生活指数（SQ）","ref":"p.127"}]},"specific":[{"title":"学習上の特性（解説 各教科等編が示すもの）","ref":"p.137","body":["学習によって得た知識や技能が断片的になりやすく、実際の生活の場面で生かすことが難しい。生活場面に即した繰り返しの指導、段階的・継続的な指導が求められる。","成功経験が少なく、主体的に活動に取り組む意欲が育ちにくい。達成感を得られる課題設定と、具体的に思考・判断・表現できる活動を組む。","詳しくは特別支援学校学習指導要領解説 各教科等編（小学部・中学部）第4章第2節の「学習上の特性等を踏まえた教育的対応」を参照。"]},{"title":"推定される原因の枠組み","ref":"p.123","body":["出生前（先天性代謝異常、脳の発生異常、胎内環境）／周産期／出生後（頭部外傷、脳の感染症、変性疾患、発作性疾患、中毒・代謝、栄養不良）。原因不明も多く、多くは出生前の要因と考えられる。","ダウン症候群などの染色体異常や遺伝性疾患が先に診断され、知的障害が推定されることがある。医学的な合併症（心疾患など）はその疾患の資料で確認する。"]}],"guidance":{"intro":"手引が知的障害について挙げている指導内容と支援の要点です。","preschool":null,"school":{"label":"特別な指導内容","ref":"pp.128–130","items":["困難を改善・克服しようとする意欲（双方向のコミュニケーションの成功体験）","自己の理解と行動の調整（容易な活動で成就感を得る）","感覚を総合的に活用した状況の把握と行動（身体意識）","概念の形成（実物や写真で）","姿勢と運動・動作の基本的技能（道具の操作）、作業に必要な動作と遂行（手指の巧緻性、持続）","コミュニケーションの基礎的な力（絵カード、ジェスチャー）と、手段の選択・活用（タブレット、音声出力）"]},"accommodation":{"label":"合理的配慮を含む支援の内容","ref":"pp.131–132","groups":[{"title":"教育内容・方法","items":["実生活につながる技術と態度、規範やルールの理解","学習内容の焦点化と基礎・基本の確実な習得","文字の拡大・読み仮名・短い文・具体的な用語・動作化・視覚化","調理実習や宿泊学習などの体験、図や写真の日課表","所属意識と自尊感情を育てる学級"]},{"title":"支援体制","items":["てんかん等への医療連携","外部から分かりにくい障害であることの理解啓発","災害時の避難誘導"]},{"title":"施設・設備","items":["分かりやすい動線と目印","安全な校内環境"]}]}},"placesIntro":"手引 §2（pp.133–138）に基づく程度と学びの場の目安です。知的障害は通級による指導の対象ではありません。","conditionsIntro":"知的障害が推定される主な原因疾患です。各行は合併症と医学的管理の要点で、詳しくはリンク先を参照してください。","conditionGroups":[{"title":"染色体異常・遺伝性疾患","items":[{"name":"ダウン症候群","axis":"原因／染色体異常（出生前）","line":"21番染色体が3本ある。知的発達の遅れに加え、心疾患、難聴・視覚障害、甲状腺機能低下、環軸椎の不安定性、筋緊張の低さを伴うことがある。小児慢性特定疾病。","ref":"p.123","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/13_01_014/","sourceId":"shouman"}]},{"name":"脆弱X症候群","axis":"原因／遺伝性（X連鎖）","line":"遺伝性の知的障害として最も多い。自閉症の特性や多動を伴うことが多い。小児慢性特定疾病。","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/11_11_032/","sourceId":"shouman"},{"label":"GeneReviews Japan FMR1関連疾患","url":"https://plaza.umin.ac.jp/~grj/grj/fmr1.htm","sourceId":"grj"}]},{"name":"22q11.2欠失症候群","axis":"原因／染色体の微細欠失","line":"心疾患、口蓋裂（鼻にかかる声）、免疫の問題、低カルシウム血症を伴い、軽度の知的障害や学習の困難が多い。小児慢性特定疾病。","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/10_02_019/","sourceId":"shouman"}]},{"name":"プラダー・ウィリ症候群","axis":"原因／染色体（15番）","line":"乳児期の筋緊張低下と哺乳の弱さ、幼児期以降の過食と肥満、知的障害。食事の管理と行動面（こだわり、かんしゃく）への対応が要る。小児慢性特定疾病。","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/05_41_089/","sourceId":"shouman"}]},{"name":"ウィリアムズ症候群","axis":"原因／染色体の微細欠失（7番）","line":"心血管の異常（大動脈弁上狭窄）、特徴的な顔立ち、社交的で言語面が比較的良い一方で視空間認知が苦手。小児慢性特定疾病。","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/04_56_073/","sourceId":"shouman"}]},{"name":"アンジェルマン症候群","axis":"原因／染色体（15番）","line":"重度の知的障害と発語の乏しさ、てんかん、失調性の歩行、よく笑う行動特徴。小児慢性特定疾病。","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/13_01_009/","sourceId":"shouman"}]},{"name":"結節性硬化症","axis":"原因／遺伝性","line":"脳・皮膚・腎などに良性の腫瘍ができる。てんかん、知的障害、自閉症の特性を伴うことが多い。指定難病・小児慢性特定疾病。","links":[{"label":"難病情報センター（指定難病158）","url":"https://www.nanbyou.or.jp/entry/4384","sourceId":"nanbyou"},{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/11_07_018/","sourceId":"shouman"}]}]},{"title":"先天性代謝異常・内分泌","items":[{"name":"先天性甲状腺機能低下症","axis":"原因／内分泌（出生前〜出生後）","line":"甲状腺ホルモンの不足。新生児スクリーニングで見つかり早期に治療すれば発達は保たれるが、発見が遅れると知的障害が残る。服薬の継続が要る。小児慢性特定疾病。","links":[{"label":"小児慢性特定疾病情報センター（先天性甲状腺機能低下症の群）","url":"https://www.shouman.jp/disease/details/05_11_018/","sourceId":"shouman"}]},{"name":"フェニルケトン尿症","axis":"原因／先天性代謝異常","line":"アミノ酸の代謝異常。新生児スクリーニングで見つかり、食事療法を続ければ発達は保たれる。学校では除去食・特殊ミルクの管理が関わる。小児慢性特定疾病。","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/08_01_001/","sourceId":"shouman"}]}]}],"terms":[{"term":"MA／DA、IQ／DQ","desc":"精神年齢・発達年齢と、知能指数・発達指数。生活年齢との比で表す。検査の種類と実施条件を併せて読む。","ref":"p.127"},{"term":"SA／SQ","desc":"社会生活年齢・社会生活指数。適応行動の検査の結果。知能と対比して環境の要因を見る。","ref":"pp.127, 133"},{"term":"適応行動（AAIDDの3領域）","desc":"概念的スキル、社会的スキル、実用的スキル。その年齢で標準的に求められる水準に達しているか。","ref":"p.139"},{"term":"DSM-5の重症度・ICD-11の知的発達症","desc":"医学的な分類での呼び方と程度の区分。本ツールの見出しは学校教育法に基づく「知的障害」。","ref":"p.141"},{"term":"学習上の特性","desc":"知識が断片的になりやすく生活場面で生かしにくい、成功経験が少なく意欲が育ちにくい、という特性。各教科等編解説が指導の前提として示す。","ref":"p.137"}],"related":[{"label":"特別支援学校学習指導要領解説 各教科等編（小学部・中学部）","sourceId":"mext-tokushi-youryou","note":"第4章第2節「学習上の特性等を踏まえた教育的対応」"}],"sources":["tebiki-3-intellectual","tebiki"],"reviewed":"2026-10-06","sheet":{"seed":"例：ひらがなは読めるが、生活の中で使えていない。言われたことを覚えていられず、同じ失敗を繰り返す","ask":"例：できることまで手伝ってもらうのを待っている。どこから自分でさせるか"},"fields":[{"k":"dx","label":"原因となる疾患","type":"text","col":"status","ref":"p.122"},{"k":"iq","label":"知能・発達検査の結果","type":"text","col":"status","ref":"p.127","hint":"例：WISC-V FSIQ 62（R7.5実施）"},{"k":"sq","label":"適応行動の検査の結果","type":"text","col":"status","ref":"p.127","hint":"例：Vineland-II 適応行動総合点 60"},{"k":"level","label":"程度の目安","type":"select","options":["軽度","中度","重度","最重度","不明・未確認"],"col":"status","ref":"p.141","hint":"医療・判定の記載があれば"},{"k":"comorb","label":"併存する障害","type":"checks","options":["なし","自閉症","てんかん","運動障害","視覚・聴覚","不明・未確認"],"col":"status","ref":"p.123"},{"k":"env","label":"育った国や言語の環境","type":"text","col":"status","ref":"p.122"},{"k":"doc","label":"検査報告書など","type":"image","col":"status","ref":"p.127","hint":"手元にあれば、AIが必要な時点で内容を聞いてきます"},{"k":"med","label":"医療・療育機関からの情報","type":"textarea","col":"status","ref":"p.123"},{"k":"adl","label":"身辺自立","type":"select","options":["年齢相応にできる","一部援助が必要","援助が必要","不明・未確認"],"col":"development","ref":"p.124","hint":"食事・排泄・着替え・清潔"},{"k":"social","label":"社会生活の力","type":"select","options":["できる","一部できる","援助が必要","不明・未確認"],"col":"development","ref":"p.124","hint":"買い物、乗り物、公共機関"},{"k":"comm","label":"意思の伝達","type":"select","options":["会話でやり取りできる","短い言葉・単語","絵カードや身振り","不明・未確認"],"col":"development","ref":"p.125"},{"k":"dep","label":"自分でできることを他者に依存していないか","type":"select","options":["自分でしようとする","一部依存","依存が強い","不明・未確認"],"col":"strengths","ref":"p.125"}]}},{"id":"physical","num":"04","name":"肢体不自由","en":"Physical Disability","overview":"身体の動きに関する器官が病気やけがで損なわれ、歩行や筆記など日常生活動作が困難な状態。原因疾患は多様で、知的障害や言語障害などを併せ有することも少なくなく、二次的な困難への配慮も重要になります。","places":[{"name":"通常の学級","note":"書く時間の延長等の配慮を受けながら一斉授業に参加"},{"name":"通級による指導（肢体不自由）","note":"自立活動を中心とした特別の指導を一部時間で実施"},{"name":"肢体不自由特別支援学級","note":"個別・グループ指導を組み合わせ、自立活動を継続的に実施"},{"name":"特別支援学校（肢体不自由）","note":"多様な教育課程を編成し、自立活動と各教科を一体的に指導"}],"quote":"肢体不自由とは、身体の動きに関する器官が、病気やけがで損なわれ…困難な状態をいう。","sourceId":"tebiki-3-physical","legalCriteria":{"law":"学校教育法施行令 第22条の3","term":"肢体不自由者","clauses":["一　肢体不自由の状態が補装具の使用によつても歩行、筆記等日常生活における基本的な動作が不可能又は困難な程度のもの","二　肢体不自由の状態が前号に掲げる程度に達しないもののうち、常時の医学的観察指導を必要とする程度のもの"],"sourceId":"shikkourei-22-3","note":"特別支援学校に就学する障害の程度として政令が定めるもの。就学先はこの程度に該当するかどうかだけで決まるものではなく、本人・保護者の意向、専門家の意見、学校や地域の状況等を総合的に判断して市町村教育委員会が決定します。"},"programCriteria":{"notice":"平成25年10月4日付け25文科初第756号 文部科学省初等中等教育局長通知（別紙）","sourceId":"mext-756","entries":[{"program":"特別支援学級","term":"肢体不自由者","text":"補装具によつても歩行や筆記等日常生活における基本的な動作に軽度の困難がある程度のもの"},{"program":"通級による指導","term":"肢体不自由者，病弱者及び身体虚弱者","text":"肢体不自由，病弱又は身体虚弱の程度が，通常の学級での学習におおむね参加でき，一部特別な指導を必要とする程度のもの"}],"note":"特別支援学級・通級による指導の対象となる障害の程度として、国が示した目安です。学級の設置や指導の実施は市町村教育委員会の判断によるため、この程度に該当すれば必ず利用できるというものではありません。"},"v5":true,"diseases":{"v5":true,"id":"physical","axisType":"disease","axisTypeLabel":"疾患と経過で見る","definition":"身体の動きに関する器官が、病気やけがで損なわれ、歩く・座る・書くなどの日常生活の動作が困難な状態です。手引は、起因疾患と運動・姿勢の状態の両方で記述しています。疾患名と進行の有無が、必要な医学的管理と支援に直結する障害種です。","definitionRef":"p.143","axesIntro":"肢体不自由は次の5つの軸で見ます。疾患名は軸①、脳性まひの病型は軸④です。","axes":[{"name":"起因疾患","levels":["脳原性（脳性まひが大半）","脊髄疾患（二分脊椎など）","末梢神経・筋疾患（筋ジストロフィー、脊髄性筋萎縮症など）","骨・関節（骨形成不全症などの骨系統疾患、外傷後遺症）","四肢の切断・拘縮・変形、染色体異常、脳炎・頭部外傷・脳腫瘍の後遺症"],"meaning":"疾患ごとに随伴する障害と医学的管理が違う。二分脊椎は排泄の管理、筋ジストロフィーは呼吸と心理的なケア、骨形成不全症は骨折と立位、頭部外傷は認知・言語の面。","ref":"pp.143, 162–168"},{"name":"進行性かどうか","levels":["非進行性（脳性まひ。症状は発達につれ変化し、小学校高学年で固定）","進行性（筋ジストロフィーなど）","中途障害（発生時期と、失われた機能・保有する機能で見る）"],"meaning":"進行性では見通しをもった計画と全身の管理が要る。中途障害では喪失感への配慮と新しい動作の獲得が課題になる。","ref":"pp.163–168"},{"name":"運動・姿勢の状態","levels":["姿勢の保持（頸定・座位・立位）と姿勢の変換","移動（はいはい・伝い歩き・独歩・車椅子・歩行器・つえ）","手の操作（握る・つまむ・持ち替える・利き手）、筆記"],"meaning":"「不可能」か「困難」かの判断は歩行と筆記を例に示されている。補助的な手段でどこまで軽減されるかで見る。","ref":"pp.145, 156–160"},{"name":"脳性まひの病型と随伴障害","levels":["痙直型（両まひ・四肢まひ・片まひ）","アテトーゼ型（不随意運動と筋緊張の変動）","失調型","固縮型","混合型"],"meaning":"病型で随伴障害の出方が違う。痙直型では知的障害・視覚障害・言語障害・てんかん、拘縮や変形。アテトーゼ型では構音障害、難聴、頸髄症。知的発達は、時間や手段を変えればできるかで潜在的な力を確かめる。","ref":"pp.163–166"},{"name":"医療的ケアと健康","levels":["経管栄養、喀痰吸引","吸入・酸素・人工呼吸器","導尿","口腔機能と食形態、けいれん発作、体温調節"],"meaning":"重度・重複では常時の医学的な観察が要る。主治医の指示書に基づいて把握する。","ref":"pp.146–147, 150"}],"assessmentIntro":"手引の「状態等の把握」を校内様式の5つの欄に対応させた観点の一覧です。「体験の不足」「介助への依存」「補助的な手段でどこまで軽減されるか」を見ます。","assessment":{"status":[{"text":"起因疾患名と進行性の有無、側弯・変形・拘縮の状態（保護者と主治医から）","ref":"pp.144, 147"},{"text":"乳幼児期の姿勢や運動・動作の発達：姿勢の保持／姿勢の変換／移動／手の操作を「何か月で」「どのようにして」で","ref":"p.145"},{"text":"けいれん発作と高熱の既往（頻度・様子・服薬・対応・回復までの時間）、入院歴と服薬","ref":"p.144"},{"text":"医療的ケアの実施状況：種類ごとに、いつ・どの姿勢で・何分かかるか（主治医の指示書）","ref":"p.146"},{"text":"口腔機能と食形態：取り込み・咀嚼・嚥下、食物の大きさ・軟らかさ・粘性、食事の姿勢と食器、誤嚥性肺炎・食物アレルギーの既往、偏食・除去食","ref":"p.146"},{"text":"補装具：車椅子、歩行器（前方・後方支持）、座位保持装置、つえ（松葉・ロフストランド）、短下肢装具・靴型装具・足底装具。使い方と定期受診の状況","ref":"p.147"},{"text":"低体温時の対処や搬送の手順を主治医から事前に確認しているか","ref":"p.147"}],"development":[{"text":"無理なく活動できる姿勢、姿勢の変換、補装具の調整、休息の必要性","ref":"p.148"},{"text":"粗大運動と微細運動。筆記の力（文字の大きさ・運筆・速さ、補助具やICTの必要性）","ref":"pp.148–149"},{"text":"意思の伝達の力と手段（文字盤、音声出力装置、情報機器）","ref":"p.149"},{"text":"介助の方法を含む基本的生活習慣、感覚の働き、知的発達","ref":"pp.148–149"},{"text":"障害が重度で重複している場合：食事と水分の時間・回数・量、調理の形態、排泄のサイン、呼吸・体温調節、服薬、発熱・発作・嘔吐・下痢・便秘。拘縮・変形の予防、側弯の姿勢管理、骨折のしやすさ、感染症","ref":"p.150"}],"interest":[{"text":"園や児童発達支援施設での遊びの中の関わりと興味・関心。体験の不足で情報が乏しくなっていないか","ref":"pp.151–152"},{"text":"環境の変化や緊張、伝えられないストレスによる多動や自傷がないか（情緒の安定）","ref":"p.149"}],"strengths":[{"text":"身体の各部の状態の理解と、自分の身体を守る意識（障害の理解）","ref":"p.150"},{"text":"補助具・補助的手段の使い方を理解し、自分から工夫しているか","ref":"p.151"},{"text":"介助に慣れて依存していないか（自立への意欲）","ref":"p.151"},{"text":"対人関係、読み書きの技能と速さを含む学習への意欲","ref":"p.151"},{"text":"補助的な手段で、どの動作がどこまで軽減されるか","ref":"pp.157–160"}],"wish":[{"text":"本人の思いや願い。表現に時間がかかる場合は、表情や身体の動きの中の表出も手掛かりに","ref":"pp.149, 153"},{"text":"保護者の思いや願いと、家庭での介助・医療的ケアの様子","ref":"p.147"}],"how":[{"text":"プレイルームで玩具を使う様子から姿勢・運動を観察する。脳性まひでは緊張で観察が難しいので、保護者が抱いた状態で見る","ref":"p.147"},{"text":"検査は個別式。新しい場面で緊張や不随意運動が強まることを踏まえ、音声出力装置などの代替表現、時間の延長、検査者の補助を使い、記録する","ref":"p.151"},{"text":"脳性まひでは目と手の協応・速さ・言語を要する項目が低く出やすく、体験不足で情報が乏しいことがある。弾力的に解釈する","ref":"p.151"},{"text":"主治医（指示書）、PT・OT・ST、園・児童発達支援施設から情報を集める","ref":"pp.146–147, 152"}],"tests":[{"name":"個別式の知能・発達検査","note":"上肢や言語の障害に応じた代替表現と時間延長。下位項目ごとに見る","ref":"p.151"},{"name":"姿勢・運動の発達の把握","note":"頸定・座位・立位・移動・手の操作を発達の順に","ref":"p.145"},{"name":"主治医の指示書","note":"医療的ケアの種類・手順・姿勢・所要時間、緊急時の対応","ref":"p.146"}]},"specific":[{"title":"「不可能」と「困難」の見方（学びの場の判断で使う）","ref":"pp.156–160","body":["特別支援学校の対象は、補装具を使っても歩行・筆記などの基本的な動作が不可能または困難、あるいは常時の医学的な観察指導を要する程度。手引の表は座位保持・筆記・歩行・身辺処理について「不可能」と「困難」の具体例を並べている。","特別支援学級の対象は軽度の困難（動作はできるが、速さ・正確さ・持続性で実用性が低い）。通級は、通常の学級の学習におおむね参加でき、一部特別な指導を要する場合。","判断は、補助的な手段でどこまで軽減されるかを含めて行う。片手で使える道具、ICT、座位保持装置などを試した上での状態を書く。"]},{"title":"脳性まひの病型と随伴障害","ref":"pp.163–166","body":["痙直型：筋緊張が高く、両まひ・四肢まひ・片まひがある。知的障害、視覚障害、言語障害、てんかんを伴うことがあり、成長とともに拘縮や変形が進むことがある。","アテトーゼ型：不随意運動と筋緊張の変動。知的な力が高い例も多く、構音障害や難聴を伴うことがある。成人期に頸髄症が問題になる。","失調型：平衡と微細な運動の困難。固縮型：筋のこわばり。混合型は複数の型が合わさる。","知的発達は、時間や手段を変えればできるかを確かめ、潜在的な力を見る。"]},{"title":"進行性の疾患と中途障害の見方","ref":"pp.166–168","body":["進行性（筋ジストロフィーなど）：できていた動作が次第に難しくなる。見通しをもった計画、呼吸・心臓の管理、本人と家族の心理的なケアが要る。","中途障害（脊髄損傷、頭部外傷、脳炎の後遺症など）：いつ・どの機能を失い、何が残っているかで見る。喪失感への配慮と、新しい方法での動作の獲得が課題になる。頭部外傷では認知や言語の面（高次脳機能障害）を併せて見る。"]}],"guidance":{"intro":"手引が肢体不自由について挙げている指導内容と支援の要点です。","preschool":null,"school":{"label":"特別な指導内容","ref":"pp.152–153","items":["姿勢","保有する感覚の活用（固有覚・前庭覚を含む。注視・追視・目と手の協応）","基礎的な概念の形成（体験の不足を補う）","表出・表現する力（ICT・支援機器、言語の代替手段。重度では表情や身体の動きの中の表出の手掛かり）","健康と医療的なニーズへの対応（拘縮・変形の予防、筋力、呼吸・摂食）","障害の理解（中途障害を含む自己理解・自己管理・自己肯定感）"]},"accommodation":{"label":"合理的配慮を含む支援の内容","ref":"pp.153–155","groups":[{"title":"教育内容・方法","items":["片手で使える道具、移動の方法、書く時間の延長と量の軽減、運動内容の変更","上肢の機能に応じた教材・支援機器、未経験の活動の事前の確認","高い位置の花壇、サポーター、姿勢を変えるスペース"]},{"title":"支援体制","items":["介助者の配置、PT・OT・STとの連携","医療的ケアの実施体制（看護師、主治医、指示書）","避難の経路と人的な体制"]},{"title":"施設・設備","items":["段差・スロープ・手すり・引戸・エレベーター・トイレのバリアフリー","非常用電源（人工呼吸器など）"]}]}},"placesIntro":"手引 §2（pp.156–162）に基づく程度と学びの場の目安です。","conditionsIntro":"各行は随伴する障害と医学的管理の要点です。筋ジストロフィー・二分脊椎・骨形成不全症・ペルテス病・側弯症の医学的説明は、手引では病弱の章にあります。","conditionGroups":[{"title":"脳原性","items":[{"name":"脳性まひ","axis":"起因疾患／脳原性・非進行性","line":"受胎から新生児期までに生じた脳の損傷による運動と姿勢の異常。病型（痙直・アテトーゼ・失調・固縮・混合）で随伴障害が違う。症状は発達につれ変化し、二次的な拘縮・変形に注意する。","ref":"pp.163–166","links":[{"label":"教育支援の手引 第3編 Ⅳ 肢体不自由（pp.163–166）","url":"https://www.mext.go.jp/content/20211014-mxt_tokubetu02-000018454_08.pdf","sourceId":"tebiki-3-physical"},{"label":"日本小児神経学会 小児神経Q&A","url":"https://www.childneuro.jp/general/6463/","sourceId":"childneuro-qa"}]},{"name":"脳炎・頭部外傷・脳腫瘍の後遺症","axis":"起因疾患／脳原性・中途障害","line":"運動まひに加え、記憶・注意・言語などの高次脳機能障害を伴うことがある。発生の時期と失われた機能・保有する機能で見る。","ref":"pp.167–168","links":[{"label":"教育支援の手引 第3編 Ⅳ 肢体不自由（pp.167–168）","url":"https://www.mext.go.jp/content/20211014-mxt_tokubetu02-000018454_08.pdf","sourceId":"tebiki-3-physical"}]}]},{"title":"脊髄疾患・脊髄損傷","items":[{"name":"二分脊椎（脊髄髄膜瘤）","axis":"起因疾患／脊髄疾患・非進行性","line":"脊髄の形成異常。下肢・体幹の運動と知覚の障害に、直腸・膀胱の障害（導尿など排泄管理）と水頭症を伴うことが多い。小児慢性特定疾病。","ref":"p.166","links":[{"label":"小児慢性特定疾病情報センター「脊髄髄膜瘤」","url":"https://www.shouman.jp/disease/details/11_01_002/","sourceId":"shouman"}]},{"name":"脊髄損傷","axis":"起因疾患／中途障害","line":"事故などで脊髄が損傷され、損傷の高さで運動・知覚・排泄・呼吸の障害の範囲が決まる。","ref":"p.168","links":[{"label":"日本整形外科学会 症状・病気をしらべる","url":"https://www.joa.or.jp/public/sick/condition/spinal_cord_injury.html","sourceId":"joa-sick"}]}]},{"title":"末梢神経・筋疾患（多くは進行性）","items":[{"name":"デュシェンヌ型筋ジストロフィー","axis":"起因疾患／筋疾患・進行性","line":"筋力低下が進行し、歩行は小学校高学年頃に難しくなることが多い。呼吸と心臓の管理、側弯への対応、本人と家族の心理的ケアが要る。指定難病・小児慢性特定疾病。","ref":"p.166","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/11_21_047/","sourceId":"shouman"},{"label":"難病情報センター 筋ジストロフィー（指定難病113）","url":"https://www.nanbyou.or.jp/entry/4522","sourceId":"nanbyou"},{"label":"デュシェンヌ型筋ジストロフィー診療ガイドライン","url":"https://www.neurology-jp.org/guidelinem/pdf/dmd_03.pdf","sourceId":"dmd-guideline"}]},{"name":"福山型先天性筋ジストロフィー","axis":"起因疾患／筋疾患・進行性","line":"日本人に多い先天性の筋ジストロフィー。筋力低下に脳の形成異常による知的障害やてんかんを伴う。小児慢性特定疾病。","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/11_21_051/","sourceId":"shouman"}]},{"name":"脊髄性筋萎縮症（SMA）","axis":"起因疾患／神経性筋萎縮・進行性","line":"脊髄の運動神経細胞の変性による筋力低下。発症年齢で型が分かれ、治療薬で経過が変わってきている。指定難病・小児慢性特定疾病。","ref":"p.166","links":[{"label":"難病情報センター（指定難病3）","url":"https://www.nanbyou.or.jp/entry/285","sourceId":"nanbyou"},{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/11_19_044/","sourceId":"shouman"},{"label":"神経筋疾患ポータルサイト（NCNP）","url":"https://nmdportal.ncnp.go.jp/information/sma.html","sourceId":"ncnp-nmd"}]},{"name":"シャルコー・マリー・トゥース病","axis":"起因疾患／末梢神経・緩やかに進行","line":"手足の先から筋力低下と感覚の低下が進む遺伝性の末梢神経の病気。足の変形と歩行の困難、手の細かい動作の困難が出る。指定難病・小児慢性特定疾病。","links":[{"label":"難病情報センター（指定難病10）","url":"https://www.nanbyou.or.jp/entry/3774","sourceId":"nanbyou"},{"label":"小児慢性特定疾病情報センター「遺伝性運動感覚ニューロパチー」","url":"https://www.shouman.jp/disease/details/11_20_046/","sourceId":"shouman"}]},{"name":"先天性ミオパチー","axis":"起因疾患／筋疾患・多くは非進行性〜緩徐","line":"生まれつき筋緊張が低く、運動発達が遅れる筋肉の病気の総称。呼吸や嚥下の管理が要ることがある。指定難病。","links":[{"label":"難病情報センター（指定難病111）","url":"https://www.nanbyou.or.jp/entry/4726","sourceId":"nanbyou"}]}]},{"title":"骨・関節","items":[{"name":"骨形成不全症","axis":"起因疾患／骨系統疾患","line":"骨がもろく骨折しやすい。骨折の予防と、立位・歩行の可否の判断、難聴を伴うことがある。指定難病・小児慢性特定疾病。","ref":"p.167","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/15_02_005/","sourceId":"shouman"},{"label":"難病情報センター（指定難病274）","url":"https://www.nanbyou.or.jp/entry/4568","sourceId":"nanbyou"}]},{"name":"軟骨無形成症","axis":"起因疾患／骨系統疾患","line":"四肢が短い低身長。手が届く範囲や歩行距離、脊柱管狭窄による症状に配慮が要る。指定難病・小児慢性特定疾病。","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/15_02_002/","sourceId":"shouman"},{"label":"難病情報センター（指定難病276）","url":"https://www.nanbyou.or.jp/entry/4570","sourceId":"nanbyou"}]},{"name":"進行性骨化性線維異形成症（FOP）","axis":"起因疾患／骨系統疾患・進行性","line":"筋肉や腱が骨に変わっていき、関節が動かなくなる。打撲や注射など外からの刺激で悪化するため、けがの予防が重要。指定難病。","links":[{"label":"難病情報センター（指定難病272）","url":"https://www.nanbyou.or.jp/entry/54","sourceId":"nanbyou"}]},{"name":"若年性特発性関節炎","axis":"起因疾患／関節・活動性で変動","line":"16歳未満で発症する慢性の関節炎。痛みと関節の動きの制限が活動性で変わる。薬物治療と運動の調整が要る。指定難病・小児慢性特定疾病。","links":[{"label":"難病情報センター（指定難病107）","url":"https://www.nanbyou.or.jp/entry/3946","sourceId":"nanbyou"}]},{"name":"側弯症","axis":"随伴／骨・関節","line":"脊柱が横に曲がる。特発性のほか、脳性まひや筋疾患に伴って進むことがあり、姿勢の管理と装具・手術の判断が要る。","links":[{"label":"日本整形外科学会 症状・病気をしらべる","url":"https://www.joa.or.jp/public/sick/condition/scoliosis.html","sourceId":"joa-sick"}]},{"name":"発育性股関節形成不全（先天性股関節脱臼）","axis":"起因疾患／骨・関節","line":"股関節の形成が不十分で脱臼しやすい。治療後の運動制限や歩行の様子を確認する。","links":[{"label":"日本整形外科学会 症状・病気をしらべる","url":"https://www.joa.or.jp/public/sick/condition/congenital_hip_dislocation.html","sourceId":"joa-sick"}]},{"name":"腕神経叢損傷（分娩まひ）","axis":"起因疾患／末梢神経・片側上肢","line":"出生時などに腕の神経が傷つき、片側の上肢の運動がまひする。利き手の判断と片手で使える道具の工夫に関わる。","links":[{"label":"日本整形外科学会 症状・病気をしらべる","url":"https://www.joa.or.jp/public/sick/condition/brachial_plexus_injury.html","sourceId":"joa-sick"}]}]},{"title":"染色体異常など","items":[{"name":"ダウン症候群","axis":"起因疾患／染色体異常","line":"筋緊張の低さによる運動発達の遅れと関節の緩さ。心疾患、環軸椎の不安定性、難聴・視覚障害を伴うことがある。小児慢性特定疾病。","ref":"p.167","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/13_01_014/","sourceId":"shouman"}]}]}],"terms":[{"term":"姿勢の保持・変換","desc":"頸定（首のすわり）、座位、立位を保てるか、自分で姿勢を変えられるか。活動の基盤になる。","ref":"p.145"},{"term":"拘縮・変形","desc":"関節が動く範囲が狭まる（拘縮）、骨や関節の形が変わる（変形）。筋緊張の高い脳性まひで成長とともに進むことがある。","ref":"pp.147, 164"},{"term":"補装具","desc":"車椅子、歩行器、座位保持装置、つえ、短下肢装具などの総称。処方と定期的な調整が要る。","ref":"p.147"},{"term":"補助的手段","desc":"フットサポート、ヘッドサポート、太柄のスプーン、固定具、支援機器（AT）など。動作の困難をどこまで減らせるかを見る。","ref":"pp.158–160"},{"term":"医療的ケア","desc":"経管栄養、喀痰吸引、導尿、人工呼吸器の管理など。学校での実施は主治医の指示書と校内の体制に基づく。","ref":"p.146"},{"term":"高次脳機能障害","desc":"脳損傷のあとに残る記憶・注意・遂行機能・言語などの障害。頭部外傷や脳炎の後遺症で運動障害と併せて見る。","ref":"p.168"},{"term":"PT・OT・ST","desc":"理学療法士（姿勢・移動）、作業療法士（手の操作・日常生活動作）、言語聴覚士（言語・摂食嚥下）。実態把握と指導で連携する。","ref":"p.155"}],"related":[{"label":"小学校等における医療的ケア実施支援資料","sourceId":"mext-iryoteki-care","note":"学校で医療的ケアを行うときの体制と手順"},{"label":"教育支援の手引 第3編 Ⅴ 病弱・身体虚弱","sourceId":"tebiki-3-health","note":"筋ジストロフィー・二分脊椎・骨形成不全症・ペルテス病・側弯症の医学的説明"}],"sources":["tebiki-3-physical","tebiki","mext-iryoteki-care"],"reviewed":"2026-10-06","sheet":{"seed":"例：車椅子で移動し、筆記に時間がかかる。書く量を減らすべきか、ICTに替えるべきか迷っている","ask":"例：姿勢が崩れやすく疲れやすい。活動量と休息のバランスをどう決めるか"},"fields":[{"k":"dx","label":"起因疾患名","type":"text","col":"status","ref":"p.144"},{"k":"prog","label":"進行性か","type":"select","options":["非進行性","進行性","中途障害","不明・未確認"],"col":"status","ref":"p.163"},{"k":"cpType","label":"脳性まひの病型","type":"select","options":["該当なし","痙直型","アテトーゼ型","失調型","固縮型","混合型","不明・未確認"],"col":"status","ref":"p.163"},{"k":"posture","label":"姿勢の保持","type":"select","options":["立位・座位とも保持できる","座位は保持できる","座位保持装置があれば","保持が難しい","不明・未確認"],"col":"status","ref":"p.145"},{"k":"move","label":"主な移動手段","type":"select","options":["独歩","つえ・歩行器","車椅子（自走）","車椅子（介助）","その他","不明・未確認"],"col":"status","ref":"p.145"},{"k":"write","label":"筆記","type":"select","options":["普通に書ける","時間がかかる・量を減らす","補助具やICTが必要","筆記は難しい","不明・未確認"],"col":"status","ref":"p.149"},{"k":"care","label":"医療的ケア","type":"checks","options":["なし","経管栄養","喀痰吸引","導尿","酸素","人工呼吸器","その他"],"col":"status","ref":"p.146"},{"k":"seizure","label":"けいれん発作","type":"select","options":["なし","あり・服薬で安定","あり・指示書あり","不明・未確認"],"col":"status","ref":"p.144"},{"k":"food","label":"食形態・食事の姿勢","type":"text","col":"status","ref":"p.146","hint":"例：きざみ食、とろみ、座位保持装置で"},{"k":"device","label":"補装具","type":"checks","options":["車椅子","歩行器","座位保持装置","つえ","短下肢装具","靴型装具","その他"],"col":"status","ref":"p.147"},{"k":"doc","label":"主治医の指示書・リハビリ評価など","type":"image","col":"status","ref":"p.146","hint":"手元にあれば、AIが必要な時点で内容を聞いてきます"},{"k":"med","label":"主治医・PT・OT・STからの情報","type":"textarea","col":"status","ref":"p.147"},{"k":"comm","label":"意思の伝達手段","type":"select","options":["音声","文字盤・筆談","音声出力装置・タブレット","表情や身振り","不明・未確認"],"col":"development","ref":"p.149"},{"k":"aid","label":"補助具・補助的手段を自分から使おうとするか","type":"select","options":["自分から使う","促されれば使う","まだこれから","不明・未確認"],"col":"strengths","ref":"p.151"},{"k":"dep","label":"介助への依存","type":"select","options":["できることは自分でする","一部依存がある","依存が強い","不明・未確認"],"col":"strengths","ref":"p.151"}]}},{"id":"health","num":"05","name":"病弱・身体虚弱","en":"Health Impairment / Physical Weakness","overview":"病弱とは心身が病気のため弱っている状態、身体虚弱とは病気ではないが不調が続きやすい状態。慢性疾患・小児がん・心身症・精神疾患など対象は多岐にわたり、入院の短期化に伴い在籍校との連携がより重要になっています。","places":[{"name":"通常の学級","note":"血糖測定や酸素使用等、支援を受けつつ通常学級で学ぶ例も増加"},{"name":"通級による指導（病弱・身体虚弱）","note":"体力向上や心理的課題への対応等、自立活動を一部時間で実施"},{"name":"病弱・身体虚弱特別支援学級","note":"病院内・小中学校内いずれにも設置され、生活の管理を伴う指導を実施"},{"name":"特別支援学校（病弱）","note":"病院に隣接・併設される例が多く、訪問教育を行う学校もある"}],"quote":"病弱とは、心身が病気のため弱っている状態をいう。身体虚弱とは…病気にかかりやすいといった状態をいう。","sourceId":"tebiki-3-health","legalCriteria":{"law":"学校教育法施行令 第22条の3","term":"病弱者","clauses":["一　慢性の呼吸器疾患、腎臓疾患及び神経疾患、悪性新生物その他の疾患の状態が継続して医療又は生活規制を必要とする程度のもの","二　身体虚弱の状態が継続して生活規制を必要とする程度のもの"],"sourceId":"shikkourei-22-3","note":"特別支援学校に就学する障害の程度として政令が定めるもの。就学先はこの程度に該当するかどうかだけで決まるものではなく、本人・保護者の意向、専門家の意見、学校や地域の状況等を総合的に判断して市町村教育委員会が決定します。"},"programCriteria":{"notice":"平成25年10月4日付け25文科初第756号 文部科学省初等中等教育局長通知（別紙）","sourceId":"mext-756","entries":[{"program":"特別支援学級","term":"病弱者及び身体虚弱者","text":"一 慢性の呼吸器疾患その他疾患の状態が持続的又は間欠的に医療又は生活の管理を必要とする程度のもの\n二 身体虚弱の状態が持続的に生活の管理を必要とする程度のもの"},{"program":"通級による指導","term":"肢体不自由者，病弱者及び身体虚弱者","text":"肢体不自由，病弱又は身体虚弱の程度が，通常の学級での学習におおむね参加でき，一部特別な指導を必要とする程度のもの"}],"note":"特別支援学級・通級による指導の対象となる障害の程度として、国が示した目安です。学級の設置や指導の実施は市町村教育委員会の判断によるため、この程度に該当すれば必ず利用できるというものではありません。"},"v5":true,"diseases":{"v5":true,"id":"health","axisType":"disease","axisTypeLabel":"疾患と経過で見る","definition":"病弱とは心身が病気のために弱っている状態、身体虚弱とは病気ではないが不調が続く、または病気にかかりやすい状態を指します。いずれも継続または反復するものを言い、風邪のような一時的なものは含めません。手引は「診断名だけでは実態も必要な支援も分からない」と繰り返し、程度は「医療または生活規制の必要が継続しているか」で判断するとしています。","definitionRef":"pp.172, 185","axesIntro":"病弱・身体虚弱は次の5つの軸で見ます。","axes":[{"name":"医療・生活規制の継続の程度","levels":["継続して医療を要する（長期入院、退院後の綿密な配慮、在宅での常時医療）","継続して生活規制を要する（治療はないが著しい制限）","持続的・間欠的に医療や生活管理を要する","ほとんど配慮を要しない"],"meaning":"学びの場の判断基準そのもの（施行令第22条の3、平成25年通知）。入院中に限らない。","ref":"pp.185–191"},{"name":"病気の経過","levels":["急性か慢性か","進行性か","寛解と再燃を繰り返すか","治療の過程と予後、晩期合併症"],"meaning":"手引が特に強調する点。疾患名だけでなく、進行性か、治療の過程や予後はどうかを把握する。","ref":"pp.174–175"},{"name":"治療による制限","levels":["運動・安静","食事・除去食","服薬","感染予防、紫外線","入退院の見通し"],"meaning":"学校生活管理指導表に基づいて運動や行事を調整する。過剰な制限もしない。","ref":"pp.175, 182, 195–214"},{"name":"身体の病気か心の病気か","levels":["慢性疾患（小児慢性特定疾病の16疾患群など）","心身症（反復性腹痛・頭痛・摂食障害など）","精神疾患（うつ病・適応障害・統合失調症など）","高次脳機能障害"],"meaning":"対応が大きく違う。精神疾患は発達障害・いじめ・虐待・不登校・希死念慮の経験と重なることが増えている。","ref":"pp.186, 195–214"},{"name":"医療的ケア・重複","levels":["経管栄養、喀痰吸引","酸素、人工呼吸器","導尿","重症心身障害"],"meaning":"主治医の指示書に基づいて把握する。肢体不自由と共通。","ref":"pp.176, 195–214"}],"assessmentIntro":"手引の「状態等の把握」を校内様式の5つの欄に対応させた観点の一覧です。生活の自己管理（服薬、参加できる活動の判断、援助要請）を育てる視点を中心に置き、本人・保護者の許可を得て主治医から情報を得ます。","assessment":{"status":[{"text":"診断名、通院・入院・手術の歴、症状、治療の方法、服薬、予後","ref":"p.174"},{"text":"生活規制の種類と程度（運動・食事・感染予防など）、退院後の配慮事項。学校生活管理指導表の指導区分","ref":"pp.174–175, 195–214"},{"text":"病気の経過：進行性か、寛解と再燃を繰り返すか、治療の見通し","ref":"p.174"},{"text":"医療的ケアの実施状況、使っている医療機器・移動補助具・入出力支援機器","ref":"p.176"},{"text":"心身の状態や発達（身体面と精神面）","ref":"p.175"},{"text":"医療機関からの情報：診断・検査結果、病院の保育士やCLS（チャイルド・ライフ・スペシャリスト）が行った療育の内容。本人・保護者の許可を得て主治医から","ref":"pp.176–177"}],"development":[{"text":"健康と安全、姿勢、基本的生活習慣（介助の方法を含む）","ref":"pp.177–178"},{"text":"運動・動作（筆記の力と補助具）、意思の伝達、感覚の働き、知的発達","ref":"pp.178–179"},{"text":"入院や治療による体験の不足、学習の空白がないか","ref":"pp.182–183"},{"text":"障害が重度で重複している場合：食事と水分、排泄、嘔吐・下痢・便秘、拘縮・側弯・骨折・感染症","ref":"p.179"}],"interest":[{"text":"園等や病院の保育での遊びの中の関わり、興味・関心","ref":"p.180"},{"text":"安心して取り組める活動、入院中も続けられること（ICTでの交流を含む）","ref":"pp.182–183"}],"strengths":[{"text":"病気の理解：気付き、受け止め、援助を求められるか。家族がどう教えているか","ref":"p.179"},{"text":"困難を減らす工夫（補助的手段の理解）、自分で安全を管理し危険を避けられるか","ref":"pp.179–180"},{"text":"対人関係、学習への意欲（読み書きの技能と速さ）","ref":"p.180"},{"text":"情緒の安定（治療の副作用、入退院による不安）と社会性","ref":"pp.178–179"}],"wish":[{"text":"本人の思いや願い。治療や進学への不安を含めて。高校段階は学びの場が限られ不安を抱えやすい","ref":"pp.184, 185–191"},{"text":"保護者の思いや願い、日頃の様子","ref":"p.177"}],"how":[{"text":"本人が安心できる環境で聞き取りと観察をする","ref":"p.176"},{"text":"検査は個別式を優先し、非言語性を併用する。下位項目を構造的に見て「どんな条件や援助があればできるか」の視点で","ref":"p.180"},{"text":"学びの場は病状だけでなく、日々変動する病状、治療の見通し、医療機関の設備、教育との連携、地域の体制を勘案する。年度途中の発症・回復に弾力的に対応する","ref":"p.184"},{"text":"主治医（本人・保護者の許可を得て）、病院の保育士・CLS、園・児童発達支援施設から情報を集める","ref":"pp.176–177, 180"}],"tests":[{"name":"学校生活管理指導表","note":"主治医が指導区分（A〜E）を記入。運動の可否はこれに従う。心疾患・腎疾患用とアレルギー疾患用がある","ref":"pp.195–214"},{"name":"糖尿病患児の治療・緊急連絡法等の連絡表","note":"血糖測定・インスリン注射・低血糖時の対応を学校に伝える","ref":"pp.195–214"},{"name":"主治医の指示書（医療的ケア）","note":"種類・手順・姿勢・所要時間、緊急時の対応","ref":"p.176"}]},"specific":[{"title":"学校生活管理指導表の読み方","ref":"pp.195–214","body":["主治医が指導区分を記入する。A：在宅医療・入院が必要、B：登校はできるが運動は不可、C：軽い運動は可、D：中等度の運動まで可、E：強い運動も可。","学校での運動や行事の参加は、この指示に従う。制限が不要な範囲まで制限しないことも、手引が求めている。","アレルギー疾患には別の様式があり、エピペンの管理や食物依存性運動誘発アナフィラキシーの対応を含む。"]},{"title":"てんかん発作の見方（緊急対応を要する発作と、見守る発作）","ref":"pp.195–214","body":["発作の型（全般か焦点か、意識があるか）と、いつもの発作の様子・持続時間を主治医から聞いておく。","いつもと違う長い発作、繰り返す発作、呼吸の異常は緊急対応。短くいつもどおりの発作は安全を確保して見守り、記録する。","服薬の状況と、発作の誘因（睡眠不足、光刺激など）を把握しておく。"]},{"title":"心身症と精神疾患の見方","ref":"pp.195–214","body":["反復性腹痛や頭痛、起立性調節障害などの心身症は、身体の症状として現れる。検査で異常がなくても本人の苦痛は実在する。","うつ病、適応障害、統合失調症、摂食障害などの精神疾患は、中学校段階から現れることがある。希死念慮や自傷への対応は、医療との連携と校内の体制を前提にする。","こうした子どもの多くは、発達障害、いじめ、虐待、不登校の経験と重なる。生徒指導上の課題（不登校・自殺予防・虐待）のページと併せて見る。"]}],"guidance":{"intro":"手引が病弱・身体虚弱について挙げている指導内容と支援の要点です。","preschool":null,"school":{"label":"特別な指導内容","ref":"pp.180–181","items":["病気の状態の理解と生活管理（自己管理の力）","情緒の安定（治療の副作用、入退院への不安。Web会議の活用）","困難を改善しようとする意欲（進行性の病気の子ども、卒業後を視野に）","移動の力と移動手段（心疾患の負担を踏まえて）","コミュニケーション手段の選択と活用、表出・表現する力（ICT・支援機器）"]},"accommodation":{"label":"合理的配慮を含む支援の内容","ref":"pp.182–184","groups":[{"title":"教育内容・方法","items":["服薬管理の指導、学校生活管理指導表に基づく学習内容の変更","学習の空白への対応、ICTによる体験と交流、同時双方向の授業配信","感染対策、心理状態に応じた弾力的な対応"]},{"title":"支援体制","items":["校内の緊急体制、医療関係者との連携","外部から分かりにくい病気（ペースメーカー、心身症・精神疾患）の理解啓発","搬送と救急隊への事前連絡、災害時の逃げ遅れ防止"]},{"title":"施設・設備","items":["自己導尿の設備、紫外線カット、落ち着ける空間","薬の保管と非常用電源"]}]}},"placesIntro":"手引 §2（pp.185–191）に基づく程度と学びの場の目安です。特別支援学校（病弱）は入院中に限らず通学生も多く、特別支援学級は小中学校内の設置が大半です。通級は回復後の自立活動（喘息の腹式呼吸、1型糖尿病の運動量と血糖測定など）が例です。","conditionsIntro":"手引が「比較的多くみられる」として挙げる疾患の枠組み（pp.195–214）で整理しています。各行は経過・治療の制限・緊急時の要点です。運動の可否は学校生活管理指導表に従います。","conditionGroups":[{"title":"悪性新生物（小児がん）","items":[{"name":"白血病（急性リンパ性白血病など）","axis":"経過／長期の治療・寛解と再発","line":"小児がんで最も多い。入院と外来での化学療法が長期に及び、感染予防と学習の空白への対応が要る。治療後の晩期合併症の経過観察が続く。小児慢性特定疾病。","ref":"pp.195–214","links":[{"label":"小児慢性特定疾病情報センター（前駆B細胞急性リンパ性白血病）","url":"https://www.shouman.jp/disease/details/01_01_001/","sourceId":"shouman"}]},{"name":"脳腫瘍（髄芽腫など）","axis":"経過／治療後の後遺症","line":"手術・放射線・化学療法のあとに運動・視覚・認知の面の後遺症や高次脳機能障害が残ることがある。小児慢性特定疾病。","ref":"pp.195–214","links":[{"label":"小児慢性特定疾病情報センター（髄芽腫）","url":"https://www.shouman.jp/disease/details/01_06_076/","sourceId":"shouman"}]},{"name":"神経芽腫","axis":"経過／乳幼児期の発症","line":"交感神経から生じる腫瘍。乳幼児期に多く、治療後の経過観察が就学後も続く。小児慢性特定疾病。","ref":"pp.195–214","links":[{"label":"小児慢性特定疾病情報センター","url":"https://www.shouman.jp/disease/details/01_05_027/","sourceId":"shouman"}]},{"name":"骨肉腫","axis":"経過／学齢期の発症・運動の制限","line":"思春期に多い骨の
