abel":"予防と切れ目のない支援","text":"退学は結果であり、その前に不登校・学業不振・進路の迷いがある。予防と、やむを得ず退学する場合の進路の選択肢と支援機関へのつなぎ（追指導）が学校の役割"},"basis":[{"text":"文部科学省は「児童生徒の問題行動・不登校等生徒指導上の諸課題に関する調査」で高等学校の中途退学者数と事由（学業不振、学校生活・学業不適応、進路変更、病気・けが・死亡、経済的理由、家庭の事情、問題行動等）を毎年公表している","sourceId":"mext-mondai-kodo"},{"text":"文部科学省と厚生労働省は、平成27年5月の通知（中途退学者等を対象とした地域若者サポートステーション及びハローワークと学校との連携の確保）と平成28年6月の連名通知（関係機関間の連携強化による中途退学者等への切れ目ない支援）で、退学後の進路のカウンセリング等の追指導と、サポステ・ハローワークとの連携を求めている"},{"text":"地域若者サポートステーション（サポステ）は、働くことに悩む若者の就労・自立支援を行う厚生労働省の事業で、高等学校との連携（在学中の出張相談、退学者の誘導）を進めている","sourceId":"saposute"},{"text":"高等学校では平成30年度から通級による指導が制度化され、障害のある生徒が在籍校で自立活動等の指導を受けられる。中途退学の要因の一つである学習や学校生活の困難への対応手段になる"},{"text":"生徒指導提要（令和4年12月改訂）第9章は、中途退学の要因と、未然防止（学業・進路・生活面の困難への早期の支援）、退学時の進路指導と追指導、関係機関との連携を整理している","sourceId":"seito-shido-teiyo"}],"overview":"中途退学は、高等学校・高等部で、学業不振、学校生活への不適応、進路の変更、病気、経済的事情、家庭の事情などから退学に至ることです。退学そのものは結果で、その前に不登校、成績不振、対人関係の困難、進路の迷いといった前兆があります。義務教育と違って進級・卒業に出席日数と単位の要件があるため、欠席が続くと制度上の期限が迫ることも特徴です。本ハンドブックで扱うのは、発達障害のある生徒が学習や対人関係の困難から退学に至ることが少なくなく、高校の通級や合理的配慮でその多くが防げる可能性があるからです。","points":["退学は選択肢の一つであって、失敗ではない。ただし、本人が十分な情報と支援なしに追い込まれて選ぶ退学は防ぐ。通信制・定時制への転編入、休学、単位認定の仕組み、通級、合理的配慮を早い時期に本人・保護者に示す","出席日数と単位の期限を、本人・保護者に早めに、具体的に伝える。「あと何日休むと」を知らないまま期限を越える事例が多い","退学しても支援は切れない。進路のカウンセリング（追指導）を行い、サポステ・ハローワーク・教育支援センター・高卒認定の学習支援につなぐ。連絡先を本人に直接渡す","障害のある生徒の退学の背景には、未診断・未支援の特性があることがある。学業不振や対人関係の困難が続く場合は、特別支援教育コーディネーターと見立て、通級や合理的配慮を検討する"],"signsLabel":"気づきのポイント","signs":["欠席・遅刻の増加、特定の教科の欠課が続く。出席日数の期限に近づいている","成績不振が続く。提出物が出ない、定期考査の未受験、追試の未受験","対人関係の困難、部活動や委員会からの離脱、一人で過ごすことが増える","「辞めたい」「向いていない」という言葉。進路の迷い、目的の喪失","アルバイトの増加、家庭の経済的事情、家族のケア、体調不良や通院","障害のある生徒の場合：授業の理解や課題の遂行に困難があるのに支援がない。感覚や対人の負担で教室にいられない"],"supportsLabel":"支援の要点","supports":[{"title":"未然防止","items":["入学時に、学習の困難や配慮の必要を把握する（中学校からの引継ぎ、個別の教育支援計画、本人・保護者との面談）。障害のある生徒は通級や合理的配慮を早い時期に検討する","出席日数と単位の要件を、年度初めに本人・保護者に具体的に示し、欠席が増え始めた時点で再度確認する","学業不振には補習・個別の課題調整、対人関係の困難にはSC・居場所、進路の迷いには進路指導とキャリア相談。担任一人で抱えず、学年・進路・教育相談・特別支援のチームで","不登校の状態になったら、不登校のページの支援を参照。高校では出席日数の期限を踏まえた計画が要る"]},{"title":"退学が現実的になったとき","items":["本人の意思を確認し、選択肢を示す。休学、通信制・定時制への転編入、単位制の活用、学びの多様化学校、高卒認定、就労。「退学か継続か」の二択にしない","退学する場合は、退学後の進路と相談先を決めてから。進路のカウンセリング（追指導）を行い、サポステ、ハローワーク、教育支援センター、高卒認定の学習支援などの連絡先を本人に直接渡す","障害のある生徒は、障害者就業・生活支援センターや障害福祉サービス（就労移行支援など）も選択肢になる。療育手帳・精神障害者保健福祉手帳の情報を本人・保護者と共有する","在学中の個別の教育支援計画や配慮の内容は、本人の同意を得て転編入先や支援機関に引き継ぐ"]},{"title":"外部連携","items":["地域若者サポートステーション：在学中の出張相談や、退学者の誘導。学校とサポステの定期的な情報共有","ハローワーク、教育支援センター、教育委員会の学び直し支援（高卒認定の学習支援など）","非行や問題行動が背景にある場合は、警察・児童相談所・保護観察所と連携し、修学の中断を防ぐ"]}],"planningLabel":"計画への落とし込み","planning":["退学のおそれのある生徒について、出席日数と単位の状況、背景、支援の方針、選択肢の提示状況、関係機関との連携を1枚に整理し、学年・進路・教育相談で経過を確認する","障害のある生徒は、個別の教育支援計画に高校段階の配慮と通級の状況を書き、退学・転編入時の引継ぎに使う","退学後の追指導の記録（進路、相談先、連絡の経過）を残し、設置者の求めに応じて報告できるようにする"],"related":[{"catId":"ld","note":"学業不振が続いて退学に至ることがある。合理的配慮と通級を早い時期に"},{"catId":"adhd","note":"提出物や出席の管理の困難が、単位の未修得につながることがある。外部の仕組み（リマインド、可視化）で支える"},{"catId":"autism","note":"対人関係や感覚の負担で教室にいられない。別室や通級、環境調整で在籍を続けられることがある"},{"catId":"emotional","note":"不安や抑うつによる欠席が出席日数の期限に達することがある。医療と連携し、休学や通信制への転編入も選択肢に"},{"catId":"health","note":"病気やけがによる長期欠席は中途退学の事由の一つ。入院中の学習保障、休学、単位認定の仕組みを確認する"}],"relatedTopics":[{"tab":"seito","id":"futoukou","note":"高校の不登校は出席日数の期限を伴う。不登校の支援と単位の見通しを同時に"},{"tab":"seito","id":"violence-delinquency","note":"非行や問題行動を理由とする修学の中断を防ぐ"},{"tab":"seito","id":"young-carer","note":"家族のケアや家計のためのアルバイトが欠席や退学の背景にあることがある"},{"tab":"curriculum","id":"nihongo","note":"日本語の力の不足による学業不振。高校でも日本語指導の特別の教育課程が令和5年度から"}],"sources":["mext-mondai-kodo","saposute","seito-shido-teiyo"],"reviewed":"2026-09-14"},{"id":"futoukou","num":"10","name":"不登校","en":"School Non-Attendance","subtitle":"何らかの心理的・情緒的・身体的あるいは社会的要因・背景により、登校しない、あるいはしたくてもできない状況にある幼児児童生徒（病気や経済的理由による者を除く）","status":{"tone":"info","label":"生徒指導上の課題","text":"不登校は障害ではなく、生徒指導提要が第10章で扱う生徒指導上の課題です。提要の枠組み（重層的支援構造）で整理しています"},"basis":[{"text":"文部科学省の定義では、不登校とは「何らかの心理的、情緒的、身体的あるいは社会的要因・背景により、登校しないあるいはしたくてもできない状況にある者（ただし、病気や経済的な理由による者を除く。）」で、調査上は年間30日以上の欠席を目安とする","sourceId":"mext-futoukou-tsuchi-r1"},{"text":"「義務教育の段階における普通教育に相当する教育の機会の確保等に関する法律」（教育機会確保法、平成28年12月公布）が、不登校児童生徒への教育機会の確保を国と自治体の責務として定めた。学校以外の場での多様で適切な学習活動の重要性、休養の必要性を認めている","sourceId":"mext-kakuho-ho"},{"text":"法第7条に基づく基本指針（平成29年3月31日）が、魅力ある学校づくり、不登校児童生徒への支援、教育支援センターの整備、民間団体との連携などの方向を示している","sourceId":"mext-kakuho-shishin"},{"text":"「不登校児童生徒への支援の在り方について」（令和元年10月25日通知）は、支援の視点を「学校に登校する」という結果のみを目標にせず社会的自立を目指すことに置き、「児童生徒理解・支援シート」による組織的・計画的支援、教育支援センターや自宅でのICT学習を指導要録上の出席扱いとできる要件を示した","sourceId":"mext-futoukou-tsuchi-r1"},{"text":"生徒指導提要（令和4年12月改訂）第10章は、不登校を重層的支援構造（発達支持的生徒指導／課題未然防止教育／課題早期発見対応／困難課題対応的生徒指導）で整理し、「社会に開かれたチーム学校」としての体制と関係機関との連携を求めている","sourceId":"seito-shido-teiyo"},{"text":"「誰一人取り残されない学びの保障に向けた不登校対策（COCOLOプラン）」（令和5年3月31日）は、学びの場の確保、心の小さなSOSを見逃さないチーム学校、学校風土の「見える化」の3本柱を掲げた。同年8月に不登校特例校の名称が「学びの多様化学校」に改められた","sourceId":"mext-cocolo"},{"text":"文部科学省の問題行動・不登校等調査では、不登校児童生徒数が増加を続けている。年度ごとの数値と要因分類は調査の最新版で確認する（令和5年度以降、要因の分類方法が変更されている）","sourceId":"mext-mondai-kodo"}],"overview":"不登校は、特定の原因や病態を指す言葉ではなく、登校していないという状態を表す言葉です。背景には、不安や緊張、無気力、学校生活上の出来事、発達の特性、家庭の状況、身体症状、精神疾患などが単独または重なって存在します。文部科学省と生徒指導提要は、不登校を「問題行動」と判断してはならないこと、登校のみを目標にしないこと、幼児児童生徒によっては不登校の時期が休養や自分を見つめ直す積極的な意味を持つことがある一方で、学業の遅れや進路選択上の不利益、社会的自立へのリスクもあることに留意するよう求めています。","points":["目標は「登校すること」ではなく、幼児児童生徒が自らの進路を主体的に捉え、社会的に自立すること。登校再開はその途中で起こりうる一つの形に過ぎない","不登校の原因・背景は多岐にわたる。「本人の問題」「家庭の問題」「学校の問題」のどれか一つに帰さず、アセスメントに基づいて支援の目標と方針を定める","障害との重なりに注意する。文部科学省の手引は、意図的に登校を渋る場合を情緒障害に含めないと明示している。一方で、発達障害の特性や起立性調節障害などの身体症状が背景にあることは少なくない。関連する障害種別の欄を参照し、見立てを分ける","担任一人で抱えない。教育相談コーディネーター、養護教諭、SC・SSW、管理職を含むチームで、校内の会議に載せて動く。これは提要が学校の組織体制として求めていることであり、担任の力量の問題ではない"],"framework":{"title":"生徒指導提要 第10章の枠組み（重層的支援構造）","intro":"提要は生徒指導を「発達支持的」「課題予防的（未然防止教育・早期発見対応）」「困難課題対応的」の層で整理しています。不登校への取組もこの層に沿って置くと、学校が今どの層で何をしているかが見えます。","items":[{"k":"発達支持的生徒指導","v":"全ての幼児児童生徒を対象とする「魅力ある学校づくり」。安心して過ごせる学級、分かる授業、居場所と絆づくり。教育機会確保法の基本指針でも第一に置かれている"},{"k":"課題未然防止教育","v":"全ての幼児児童生徒を対象に、SOSの出し方に関する教育、対人関係やストレスへの対処を学ぶ機会を意図的に設ける"},{"k":"課題早期発見対応","v":"欠席・遅刻・保健室利用・提出物・表情の変化などの兆候を早期に把握し、初期段階で組織的に対応する。1人1台端末による心の健康観察もCOCOLOプランで例示されている"},{"k":"困難課題対応的生徒指導","v":"不登校の状態にある幼児児童生徒への、アセスメントに基づく個別の支援。児童生徒理解・支援シートで目標と方針を共有し、教育支援センター・医療・福祉などと連携する"},{"k":"学校の組織体制","v":"教育相談コーディネーターを中心とした校内の支援チームと、SC・SSW・関係機関を含むネットワーク型の支援チーム。ケース会議で情報を集約し、役割を分担する"},{"k":"関係機関等との連携","v":"教育支援センター、教育委員会、医療機関、児童相談所、福祉部局、民間団体（フリースクール等）。連携の窓口と情報共有のルールを校内で決めておく"}]},"signsLabel":"気づきのポイント","signsNote":"欠席が続く前の段階で現れやすい兆候です。単独で判断せず、複数の重なりと経過を見ます。","signs":["遅刻・早退が増える。月曜日や長期休業明けに欠席が集中する","保健室や相談室の利用が増える。頭痛・腹痛・吐き気など、朝に強く午後に軽くなる身体症状を訴える","提出物の遅れ、忘れ物、成績の急な変化","表情が乏しくなる、休み時間に一人でいることが増える、交友関係が変わる","登校しても教室に入りにくい、特定の授業や行事を避ける","家庭から「朝起きられない」「登校を渋る」と連絡がある","端末の健康観察や日々の日記・アンケートに、気持ちの落ち込みや不安がにじむ"],"supportsLabel":"支援の要点","supports":[{"title":"初期対応（欠席が続き始めたとき）","items":["欠席が続く前に、本人・保護者とつながる。理由を問い詰めるのではなく、本人の話を聞く姿勢で","アセスメント（見立て）を担任一人でしない。養護教諭・教育相談コーディネーター・SC・SSWと、少人数で早めにケース会議を持つ","身体症状が続く場合は医療受診を勧める。起立性調節障害などの身体疾患、社交不安などの精神疾患が背景にあることがある","いじめが疑われる場合は、いじめ防止対策推進法に基づく対応を優先する"]},{"title":"欠席が続いているとき","items":["本人の希望を聞き、今できるつながり方（家庭訪問、電話、端末を通じた連絡、放課後の登校）から始める。無理な登校刺激は避ける","生活リズム（昼夜逆転など）と、家庭での過ごし方を把握する。保護者を責めない","学習の空白を埋める手立て（オンライン授業の配信、課題の受け渡し、教育支援センターでの学習）を本人のペースで用意する","「学校に来ること」以外の小さな目標（連絡が取れる、外出できる、興味のあることに取り組める）を本人と共有する"]},{"title":"学びの場の選択肢","items":["校内教育支援センター（スペシャルサポートルーム）：学校には来られるが教室に入りにくいときの校内の居場所。COCOLOプランで設置が推進されている","教育支援センター（適応指導教室）：教育委員会が設置する公的な学習・相談の場","学びの多様化学校（いわゆる不登校特例校）：不登校児童生徒の実態に配慮した特別の教育課程を編成する学校。令和5年8月に名称変更","ICTを活用した学習：オンライン授業の配信、教材の配布。要件を満たせば指導要録上の出席扱いとできる","フリースクール等の民間施設：在籍校と連携し、要件を満たせば出席扱いとできる","夜間中学：学齢を過ぎた人などが学び直せる中学校の夜間学級。教育機会確保法が設置を求めている"]},{"title":"出席扱いと学習評価","items":["教育支援センター等の施設で相談・指導を受けた場合、自宅でICT等を活用した学習を行った場合は、令和元年通知の要件（校長の判断、学校と施設の連携、訪問等による状況把握、計画的な学習プログラムなど）を満たせば指導要録上の出席扱いとできる","学習の成果は、学校外での学習も含めて適切に評価に反映する。評価できる材料を本人が持てるように、課題の受け渡しと記録を設計する","高校段階では、進級・卒業の要件と単位認定の仕組みを早い時期に本人・保護者と確認する"]},{"title":"保護者・関係機関","items":["保護者は最も近い支援者であり、同時に疲弊しやすい。保護者の相談先（教育委員会、教育支援センター、民間の親の会）を案内する","医療・福祉・児童相談所・民間団体との連携は、本人・保護者の同意と、情報共有のルールを前提に進める","進路の情報（学びの多様化学校、通信制・定時制高校、高卒認定など）を早めに本人と保護者に伝える。進路の見通しが不安を減らすことがある"]}],"planningLabel":"計画への落とし込み（児童生徒理解・支援シート）","planning":["令和元年通知が示す「児童生徒理解・支援シート」（参考様式）を作成する。欠席状況、不登校になったきっかけと継続理由、本人・保護者の希望、関係機関との連携状況、具体的な支援策、経過と見直しを記録する","シートは関係者間で共有されて初めて効果があり、支援の進捗に応じて定期的に見直す。小・中・高等学校間、転校先への引継ぎにも使う","障害のある幼児児童生徒として個別の指導計画・個別の教育支援計画を作成している場合、不登校の支援はそれとは別の根拠（生徒指導）で扱う。両方に該当するときは、シートと計画を相互に参照させ、目標が食い違わないようにする","次期学習指導要領に向けて、通級指導・日本語指導・不登校・特異な才能の各計画を一体的に運用する参考様式（「2階シート」仮称）を国が示す方向で検討されている。シートの項目を、共通事項と不登校固有の事項に分けて書いておくと移行しやすい"],"related":[{"catId":"emotional","note":"文部科学省の手引は、意図的に登校を渋る場合を情緒障害に含めないと明示している。不安や緊張による登校困難と、情緒障害としての選択性かん黙などを分けて見立てる"},{"catId":"autism","note":"感覚過敏や見通しの持ちにくさ、対人関係の困難が登校の負担になっていることがある"},{"catId":"adhd","note":"授業についていけない、叱責が重なる、といった経験が登校回避につながることがある"},{"catId":"ld","note":"読み書きの困難が学業不振と自己評価の低下を経て不登校に至ることがある"},{"catId":"health","note":"起立性調節障害など、朝に強い身体症状を伴う疾患が背景にあることがある。医療受診と学校生活管理の両面から見る"}],"relatedTopics":[{"tab":"seito","id":"young-carer","note":"家族のケアの負担が、欠席や遅刻の形で現れることがある"},{"tab":"curriculum","id":"twice-exceptional","note":"才能に見合った学びがないことによる不適応が、不登校の形で現れることがある"},{"tab":"seito","id":"bullying","note":"いじめによる欠席が年間30日の目安に達すれば不登校重大事態として調査に着手する"},{"tab":"seito","id":"child-abuse","note":"長期欠席は虐待のリスク情報。家庭訪問で本人に会えない場合は関係機関と共有する"},{"tab":"seito","id":"suicide-prevention","note":"不登校の背景に抑うつや希死念慮があることがある"},{"tab":"seito","id":"dropout","note":"高校の不登校は出席日数の期限を伴う。単位の見通しを同時に"},{"tab":"seito","id":"internet","note":"不登校の背景や結果としてネット・ゲームの長時間利用がある"}],"sources":["seito-shido-teiyo","mext-futoukou-tsuchi-r1","mext-kakuho-ho","mext-kakuho-shishin","mext-cocolo","mext-mondai-kodo"],"reviewed":"2026-09-14","chapter":"第10章 不登校"},{"id":"internet","num":"11","chapter":"第11章 インターネット・携帯電話に関わる問題","name":"インターネット・SNSに関わる問題","en":"Internet, Smartphone and SNS Issues","subtitle":"ネット上のいじめ、SNSを通じた被害、画像の拡散、課金、ゲームやネットへの依存など、インターネット利用に関わる困難を抱える幼児児童生徒","status":{"tone":"info","label":"予防教育と早期対応","text":"情報モラル教育（学習指導要領の情報活用能力）による予防と、トラブルが起きたときの早期対応・関係機関連携。1人1台端末の時代は、学校の端末の使い方も対象"},"basis":[{"text":"青少年が安全に安心してインターネットを利用できる環境の整備等に関する法律（平成20年法律第79号、平成29年改正）は、学校教育においてインターネットの適切な利用に関する教育を推進することを国の施策として定め、フィルタリングの利用促進を求めている"},{"text":"学習指導要領は、情報モラルを含む「情報活用能力」を教科等横断的に育成する資質・能力と位置づけている。文部科学省は幼児児童生徒向け動画教材、教員向け指導の手引き、保護者向け資料を提供している","sourceId":"mext-joho-moral"},{"text":"いじめ防止対策推進法はインターネットを通じて行われるいじめを定義に含め（第2条）、ネット上のいじめ対策のための体制整備を求めている（第19条）。文部科学省は「ネット上のいじめ」対応マニュアル・事例集を提供している","sourceId":"mext-net-page"},{"text":"ICD-11（WHO）は「ゲーム行動症」を疾患として分類した。依存の兆候がある場合は医療機関につなぐ対象になる","sourceId":"icd11"},{"text":"生徒指導提要（令和4年12月改訂）第11章は、ネット上のいじめ、SNSを通じた被害、ネット依存などを取り上げ、情報モラル教育による未然防止、早期発見、関係機関との連携を求めている","sourceId":"seito-shido-teiyo"}],"overview":"インターネットとSNSに関わる問題は、ネット上のいじめ、知らない相手とのやりとりからの被害、自分の画像を送ってしまう自画撮り被害、高額な課金、ゲームやネットの使いすぎによる生活の乱れ、と幅があります。共通するのは、学校からは見えにくく、本人が気づいたときには拡散や被害が進んでいることです。1人1台端末が配られてからは、学校の端末の使い方も対象になりました。本ハンドブックで扱うのは、障害のある子どもは、ネットの世界が安心できる居場所になりやすい一方で、危険の認知や境界の理解が難しく、被害にもトラブルの当事者にもなりやすいからです。","points":["見えないことを前提にする。アンケート、端末の健康観察、保護者からの情報、本人の様子の変化から気づく。定期的に「困っていることはないか」を聞く仕組みを持つ","ネット上のいじめは、いじめ対策組織で扱う。画像や書き込みの拡散は、削除の依頼と警察への相談を並行し、被害の子どもを責めない","依存は意志の問題ではない。生活リズムの乱れ、欠席、成績の低下が続く場合は、家庭と相談し、医療機関（ゲーム行動症）につなぐ選択肢を持つ","障害のある子どもには、ルールを言葉で伝えるだけでなく、具体的な場面で「してよいこと・いけないこと」「困ったらどうするか」を繰り返し教える。端末の設定（フィルタリング、時間制限）も併用する"],"signsLabel":"気づきのポイント","signs":["朝起きられない、授業中の居眠り、遅刻・欠席の増加。夜遅くまでの利用","端末を手放せない、取り上げると激しく怒る。使えないと落ち着かない","課金や金銭のトラブル。保護者のカードの無断使用、友達への借金","SNSでの誹謗中傷や仲間外し。グループチャットから外された、画像を撮られた・拡散された","知らない相手とのやりとり。会う約束、画像を送るよう求められている、金銭や物をもらっている","学校の端末で授業と無関係な利用、他人のアカウントの使用、不適切な書き込み","障害のある子どもの場合：ネットの中の関係だけが安心できる、相手の意図を読み違えて被害に遭う、ルールの理解が曖昧なまま使っている"],"supportsLabel":"支援の要点","supports":[{"title":"未然防止（情報モラル教育・家庭との連携）","items":["文部科学省の動画教材と指導の手引きを、発達段階に応じて年間計画に位置づける。教科等横断的に、実際に起きたトラブルの例を扱う","保護者向けの資料や説明会で、フィルタリング、時間や場所のルール、課金の管理を家庭と共有する。子どもと保護者の利用実態の差を見せると効果がある","学校の端末の利用ルールを、子どもにも保護者にも明確に示す。「児童生徒の健康に留意してICTを活用するためのガイドブック」を参考に、目や睡眠への配慮も","障害のある子どもには、絵や具体的な場面で「してよいこと・いけないこと」「困ったらどうするか」を繰り返し教える。端末の設定（フィルタリング、時間制限、購入の制限）を保護者と確認する"]},{"title":"トラブルが起きたとき","items":["ネット上のいじめは、いじめ対策組織で扱う。書き込みや画像は削除される前に記録（スクリーンショット）し、削除の依頼と並行して対応する","画像の拡散、知らない相手からの接触、金銭の要求は、本人を責めず、警察（サイバー犯罪相談窓口）に相談する。児童ポルノにあたる画像の送信を求められた場合も同様","課金トラブルは、保護者と事業者への連絡（未成年者取消しの可能性）を案内する","本人が「相談してよかった」と思える対応を。叱責や端末の没収だけで終わると、次から相談しなくなる"]},{"title":"依存が疑われるとき","items":["生活リズム、欠席、成績、家庭での様子を、保護者と共有する。取り上げるだけでは解決せず、対立を生む","背景に不登校、いじめ、家庭の問題、発達の特性があることが多い。ネットの利用は結果であることを踏まえて、背景に働きかける","ゲーム行動症（ICD-11）の可能性がある場合は、精神科・小児科・依存症の専門医療機関につなぐ。精神保健福祉センターも相談先になる","現実の場に居場所と役割を作る。部活動、係、興味のある活動、教育支援センターなど"]}],"planningLabel":"計画への落とし込み","planning":["情報モラル教育を年間指導計画に、端末の利用ルールを学校のきまりに位置づける。障害のある子どもについては、個別の指導計画に端末の使い方や配慮（設定、支援者、ルールの教え方）を書く","ネット上のいじめは、学校いじめ防止基本方針の中で対応の流れを定めておく","依存や被害の対応は、家庭・医療・警察との連携記録を残し、進級・進学時に引き継ぐ"],"related":[{"catId":"autism","note":"ネットの中の関係やゲームが安心できる居場所になりやすく、こだわりと重なると使用が長時間になりやすい。相手の意図を読み違えて被害に遭うことも"},{"catId":"adhd","note":"衝動的な書き込みや課金、切り替えの難しさによる長時間の利用。時間の管理を外部の仕組み（設定）で支える"},{"catId":"intellectual","note":"危険の認知やルールの理解が難しく、被害に遭いやすい。具体的な場面での繰り返しの指導と、端末の設定"},{"catId":"ld","note":"読み書きの困難がある子どもにとって端末は学習の道具でもある。利用の制限が学習の手段を奪わないよう配慮する"},{"catId":"emotional","note":"対人不安や不登校の子どもにとってネットが唯一のつながりになることがある。取り上げる前に背景を見る"},{"catId":"hearing","note":"文字でのやりとりが主なコミュニケーション手段になっている場合、ネット上のトラブルの影響が大きい"}],"relatedTopics":[{"tab":"seito","id":"bullying","note":"ネット上のいじめは法の定義に含まれる。いじめ対策組織で扱う"},{"tab":"seito","id":"sexuality","note":"SNSを通じた性被害、自画撮り被害"},{"tab":"seito","id":"futoukou","note":"不登校の背景や結果としてネット・ゲームの長時間利用がある。取り上げるだけでは解決しない"},{"tab":"seito","id":"suicide-prevention","note":"ネット上の自殺に関連する情報の影響への配慮は、改正自殺対策基本法の基本理念に加わった"}],"sources":["mext-joho-moral","mext-net-page","icd11","seito-shido-teiyo"],"reviewed":"2026-09-14"},{"id":"sexuality","num":"12","chapter":"第12章 性に関する課題","name":"性に関する課題","en":"Sexuality-Related Issues","subtitle":"性暴力の被害・加害、性的マイノリティとされる幼児児童生徒への配慮、性に関する指導など、性をめぐって配慮が必要な幼児児童生徒","status":{"tone":"info","label":"予防教育と個別の配慮","text":"「生命（いのち）の安全教育」で全ての子どもを性暴力の加害者・被害者・傍観者にさせない予防と、性的マイノリティとされる幼児児童生徒への個別の配慮の2本立て。性的虐待や性被害が疑われる場合は、学校が確認するより前に通告・相談する"},"basis":[{"text":"「性犯罪・性暴力対策の強化の方針」（令和2年6月 関係府省会議決定）を受け、文部科学省と内閣府が「生命（いのち）の安全教育」の教材と指導の手引きを作成（令和3年4月公表、令和8年3月改訂版）。幼児期から高校まで発達段階に応じた教材があり、各学校の判断で教育課程の内外で活用でき、学校や地域の状況に応じて加除・改変してよい","sourceId":"mext-seibouryoku-page"},{"text":"文部科学省「性同一性障害に係る児童生徒に対するきめ細かな対応の実施等について」（平成27年4月30日通知）。性同一性障害に係る幼児児童生徒への支援の実例（服装、髪型、更衣室、トイレ、呼称、水泳、修学旅行など）と、「性的マイノリティ」とされる幼児児童生徒全般について、自身の状態を秘匿しておきたい場合があることを踏まえて相談しやすい環境を整えること、教職員が心ない言動を慎むことを求めている","sourceId":"mext-gid-tsuchi-h27"},{"text":"文部科学省は教職員向けの理解啓発パンフレット・研修動画を提供し、性的指向及びジェンダーアイデンティティの多様性に関する国民の理解の増進に関する法律（令和5年）に基づく基本計画を通知している","sourceId":"mext-lgbt-page"},{"text":"性的虐待が疑われる場合は、学校が積極的な情報収集や確認を行うより前に、早急に児童相談所に通告する。障害や発達の特性のある子どもは、性的虐待と認識できない、言葉で伝えることが難しいなどの理由で把握が難しいため、速やかに専門機関と協議する（虐待対応の手引き）","sourceId":"mext-gyakutai-tebiki-r8"},{"text":"生徒指導提要（令和4年12月改訂）第12章は、性犯罪・性暴力、性的マイノリティ、SNS等を通じた性被害などを取り上げ、生命の安全教育による未然防止と、被害を受けた子どもへの組織的な対応・関係機関との連携を求めている","sourceId":"seito-shido-teiyo"}],"overview":"性に関する課題は、性暴力の被害と加害、性的マイノリティとされる幼児児童生徒への配慮、SNSを通じた性被害、妊娠など幅があり、いずれも本人が言い出しにくく、周囲が気づきにくいという共通点があります。国は「生命（いのち）の安全教育」で、自分と相手の体を大切にすること、境界を守ること、嫌なことは嫌と言ってよいこと、困ったら信頼できる大人に相談することを、幼児期から発達段階に応じて教えるよう求めています。本ハンドブックで扱うのは、障害のある子どもは性被害の把握が難しく、また性に関する指導に障害の状態に応じた工夫が要るからです。","points":["予防教育は全ての子どもが対象。障害のある子どもには、視覚教材や具体物、繰り返しを使って「プライベートゾーン」「よい触り方・悪い触り方」「嫌なときの断り方」「相談の仕方」を、発達段階と障害の状態に応じて教える","被害が疑われるときは、学校が事実確認を重ねない。性的虐待は児童相談所へ、家庭外の性被害は警察・ワンストップ支援センターへ、速やかにつなぐ。聞き取りは専門機関に任せ、学校は本人の安全と安心の確保に徹する","性的マイノリティとされる幼児児童生徒については、本人の意向を最優先に、秘匿したい場合があることを前提に対応する。本人の同意なく他の教職員や保護者・幼児児童生徒に伝えない","加害の側に立った子どもにも指導と支援が要る。性に関する知識の不足や、境界の理解の難しさが背景にあることがある。生命の安全教育と、必要に応じて専門機関の助言を"],"signsLabel":"気づきのポイント","signs":["年齢や発達段階に不相応な性的な言動、性的な事柄への強い関心や不安。幼児・低学年では性的虐待の発見のきっかけになることが多い","特定の人・場所を急に避ける、触られることをひどく嫌がる、更衣や水泳を拒む","SNSで知らない相手とやりとりしている、自分の画像を送るよう求められている、金銭や物をもらっている","無断欠席、身だしなみの急な変化、体調不良の訴え、自傷や希死念慮（性被害の後に現れることがある）","服装・髪型・呼称・更衣室・トイレなど、性別で分けられる場面での強い抵抗や苦痛。本人が「相談したいことがある」と言いにくそうにしている","障害のある子どもの場合：距離感や身体接触の境界が分かりにくく、被害にも、意図しない加害にもなりうる。本人が「嫌」と言えない、言っても伝わらない"],"supportsLabel":"支援の要点","supports":[{"title":"未然防止（生命の安全教育）","items":["文部科学省の教材と指導の手引き（令和8年3月改訂版）を、発達段階と学校の状況に応じて年間計画に位置づける。加除・改変は可能","障害のある子どもには、絵カード・具体物・ロールプレイで「プライベートゾーン」「よい触り方・悪い触り方」「嫌なときの断り方」「相談の仕方」を具体的に、繰り返し教える。保健や特別活動、必要なら個別の場面で","相談窓口（担任、養護教諭、SC、24時間子供SOSダイヤル、ワンストップ支援センター）を、子どもと保護者に周知する","SNSでのやりとりや画像の送信の危険を、情報モラル教育と関連づけて教える"]},{"title":"被害が疑われるとき","items":["本人の安全と安心の確保を最優先に。話を聞いた教職員は責めない・疑わない・詳しく聞き出さないで、「話してくれてありがとう」と受け止め、管理職・養護教諭・SCに直ちにつなぐ","性的虐待（保護者・同居人による）が疑われる場合は、学校が確認するより前に児童相談所へ通告する。家庭外の性被害は、本人・保護者の意向を確認しつつ、警察・ワンストップ支援センター（内閣府が全都道府県に設置）につなぐ","障害のある子どもは、被害を認識できない、言葉で伝えられないことがある。行動の変化から気づき、専門機関と速やかに協議する","SNS等での画像被害は、削除の依頼と警察への相談を並行する。本人を責めない","医療機関の受診（外傷、感染症、妊娠の可能性）は、本人・保護者と相談し、ワンストップ支援センターの助言を得る"]},{"title":"性的マイノリティとされる幼児児童生徒への配慮","items":["本人の意向を最優先に。秘匿したい場合があることを前提に、本人の同意なく他の教職員・保護者・幼児児童生徒に伝えない","平成27年通知の配慮例：自認する性別の服装や髪型、更衣室やトイレの使い方（多目的トイレの利用など）、呼称、水泳（別室での着替え、補習での対応）、修学旅行の部屋割りや入浴。学校の状況に応じて、本人・保護者と相談して決める","教職員自身が心ない言動を慎む。戸籍上の性別によく見られる服装や髪型をしていない場合に、一方的に否定したり揶揄したりしない","校内にサポートチーム（管理職、担任、養護教諭、SC等）を置き、対応を一貫させる。医療機関との連携が必要な場合は本人・保護者と相談する"]},{"title":"加害の側に立った子どもへの対応","items":["行為を止め、被害の子どもの安全を確保したうえで、背景（性に関する知識の不足、境界の理解の難しさ、本人自身の被害体験）を見る","障害のある子どもの場合、距離感や身体接触の境界が分かりにくいことがある。叱責だけでなく、具体的な行動の教え直しと環境調整を","いじめ・暴力行為・犯罪に相当する場合は、それぞれの枠組みで警察等と連携する"]}],"planningLabel":"計画への落とし込み","planning":["生命の安全教育を学校の年間指導計画に位置づける。特別支援学校・特別支援学級では、障害の状態に応じた教材の加除・改変と、個別の指導計画への反映を検討する","性的マイノリティとされる幼児児童生徒への配慮は、本人・保護者と相談した内容をサポートチームで共有し、進級・進学時の引継ぎは本人の意向を確認して行う","被害への対応は、児童相談所・警察・ワンストップ支援センターとの連携記録を設置者と共有し、学校単独で調査計画を立てない"],"related":[{"catId":"intellectual","note":"被害を認識できない、言葉で伝えられないことがある。生命の安全教育は具体物と繰り返しで"},{"catId":"autism","note":"距離感や身体接触の境界が分かりにくい。被害にも意図しない加害にもなりうる。境界のルールを具体的に教える"},{"catId":"adhd","note":"衝動的な言動が性的な加害と受け取られることがある。行動の教え直しと環境調整"},{"catId":"language","note":"言葉で伝えることの難しさから、被害の把握が難しい"},{"catId":"emotional","note":"性的マイノリティに関する悩みや性被害が、不安や抑うつ、選択性かん黙の背景にあることがある"},{"catId":"physical","note":"介助を受ける場面が多く、身体接触の境界を本人と介助者の双方で確認する必要がある"}],"relatedTopics":[{"tab":"seito","id":"child-abuse","note":"性的虐待は児童相談所へ。学校が確認するより前に通告する"},{"tab":"seito","id":"bullying","note":"性的な言動によるからかいや、性的指向・性自認に関するいじめ。基本方針の「特に配慮が必要な児童生徒」"},{"tab":"seito","id":"internet","note":"SNSを通じた性被害、画像の送信・拡散"},{"tab":"seito","id":"suicide-prevention","note":"性被害や性的マイノリティに関する悩みは自殺の危険因子になりうる"}],"sources":["mext-seibouryoku-page","mext-gid-tsuchi-h27","mext-lgbt-page","mext-gyakutai-tebiki-r8","seito-shido-teiyo"],"reviewed":"2026-09-14"},{"id":"young-carer","num":"13","name":"ヤングケアラー","en":"Young Carers","subtitle":"家族の介護や幼いきょうだいの世話、家事、通訳などを日常的に担い、学習や学校生活に影響が出ている幼児児童生徒","status":{"tone":"info","label":"法定の支援対象","text":"令和6年6月の法改正で国・自治体の支援対象として法律に明記。学校の役割は「指導」ではなく、気づいて関係機関につなぐこと。生徒指導提要では第13章「支援を要する家庭状況」で扱われる"},"basis":[{"text":"令和6年6月の子ども・若者育成支援推進法改正により、「家族の介護その他の日常生活上の世話を過度に行っていると認められる子ども・若者」として、ヤングケアラーが国・地方公共団体による支援の対象に明記された。18歳以上も含む","sourceId":"cfa-yc"},{"text":"令和3年5月17日、厚生労働省・文部科学省「ヤングケアラーの支援に向けた福祉・介護・医療・教育の連携プロジェクトチーム報告」が、早期発見・把握、支援策の推進、社会的認知度の向上の3本柱を示した。学校は「早期発見・把握」の要と位置づけられている","sourceId":"mhlw-mext-yc-pt"},{"text":"文部科学省「生徒指導提要」（令和4年12月改訂）は、第13章「多様な背景を持つ児童生徒への生徒指導」の中で、家庭状況を背景とする課題の一つとしてヤングケアラーを取り上げ、早期発見と関係機関との連携を求めている","sourceId":"seito-shido-teiyo"},{"text":"こども家庭庁は法改正を受けて「ヤングケアラー支援ガイドライン」を策定し、文部科学省はこれをもとに「ヤングケアラー支援における学校等の役割について」（令和7年8月、事務連絡の別添）を各教育委員会等に通知した。学校の役割を「気づき」「情報集約」「支援」「見守り」の4段階で整理している。本項の「校内での初動」「外部連携」はこの4段階に沿って書いている","sourceId":"mext-yc-renkei-r7"},{"text":"令和8年7月23日、こども家庭庁を中心に「就労」を加えた5分野の連携プロジェクトチームが「ヤングケアラー支援プラン」（令和8〜10年度）を公表した","sourceId":"cfa-yc-plan-r8"}],"overview":"ヤングケアラーは、本来大人が担うと想定されている家事や家族の世話（きょうだいの世話、障害や病気のある家族の介護・見守り、日本語が不自由な家族の通訳、家計を支える労働など）を日常的に行っている子どもを指します。本ハンドブックで扱うのは、障害ではないが、学習や学校生活に大きな影響を及ぼし、かつ「本人も周囲も気づきにくい」という点で、他の配慮を要する背景と共通するからです。","points":["これは「指導」の対象ではなく、「気づいて、つなぐ」対象。教員が家庭の問題を解決するのではない","家庭内のことであり、本人が当たり前だと思っている、または話したくないと思っていることが多い。表面化しにくい","本人の負担軽減と同時に、ケアされている家族への福祉サービスが入ることで状況が変わる。子どもを「介護力」として当てにしないよう、福祉側にも配慮が求められている（プロジェクトチーム報告）"],"signsLabel":"気づきのサイン","signsNote":"プロジェクトチーム報告やこども家庭庁の啓発資料で挙げられている例です。単独では判断できないので、複数の重なりと経過を見ます。","signs":["遅刻・早退・欠席が多い。特に理由が曖昧、または「家の用事」と説明する","授業中の居眠り、疲労、集中の低下","提出物・持ち物の遅れ、学習の遅れが続く","身だしなみや衛生面の変化","部活動や放課後の活動に参加できない、急いで帰る","幼いきょうだいの送迎や世話を本人がしている","保護者と連絡が取りにくい、面談に来られない","学校の連絡や書類の通訳・翻訳を本人が担っている（外国人家庭の場合）","本人が家族のことを聞かれるのを避ける、または逆に大人びた家族の話をする"],"supportsLabel":"気づいてからの動き","supports":[{"title":"校内での初動（気づき・情報集約）","items":["気づいた教員が一人で抱えない。担任・学年・養護教諭・特別支援教育コーディネーター・管理職・SC・SSWで情報を共有する。文部科学省の通知も、「ヤングケアラーかもしれない」と気づいたときにそのままにしないことを求めている","本人への聞き取りは「詮索」にならないように。困っていることを話してよい場所があること、話しても家族が責められないことを伝える。本人が語るまで待つ姿勢が基本。プロジェクトチーム報告も、家族の状況を知られたくない子どもがいることへの留意を挙げている","遅刻・欠席・提出物の遅れを、事情を知らずに叱責しない。「叱られる場所」になると、なおさら話さなくなる","学習面の配慮（提出期限の調整、補習の時間帯、家庭学習の量）は、本人の負担を増やさない形で","記録は事実（見た・聞いたこと）と推測を分けて残す","本人の同意が得られず個人情報を伏せる必要がある場合でも、その時点で把握している情報（個人情報を除く）をもとに、自治体のヤングケアラー支援担当部署に今後の対応を相談してよい（文部科学省通知）。「同意がないから何もできない」ではない"]},{"title":"外部連携（支援・見守り）","items":["学校からのつなぎ先：SSW（スクールソーシャルワーカー）、こども家庭センターなど市町村の子ども家庭支援の窓口、自治体のヤングケアラー支援担当部署、要保護児童対策地域協議会（要対協）。ケアされている家族の状況によって、高齢者福祉（地域包括支援センター）、障害福祉、医療機関、外国人相談窓口が関わる","自治体によってはヤングケアラー・コーディネーターや専用の相談窓口、支援ガイドブックが用意されている。所在自治体のものを校内で共有しておく","本人の同意と、家庭への介入の順序については、SSWや児童相談の専門職と相談してから動く。学校単独で家庭に働きかけると、本人の立場を悪くすることがある","支援が始まった後、あるいは一区切りついた後も、状況は変わりうる。学校は日常の見守りを続け、進学などで所属が変わるときは引継ぎを行う（文部科学省通知の「見守り」）","支援の対象年齢は18歳で切れない。法改正後は、こども期を過ぎてケアが続く若者も対象に含まれている。高校段階では卒業後の切れ目を意識する"]}],"related":[{"catId":"health","note":"家族に慢性疾患のある幼児児童生徒。病弱の項目はケアされる側の理解に役立つ"},{"catId":"physical","note":"家族に肢体不自由のある幼児児童生徒。同上"},{"catId":"intellectual","note":"家族に知的障害のある幼児児童生徒。同上"}],"sources":["mhlw-mext-yc-pt","cfa-yc","mext-yc-renkei-r7","mext-yc-yakuwari-r7","cfa-yc-plan-r8","seito-shido-teiyo"],"reviewed":"2026-09-14","relatedTopics":[{"tab":"curriculum","id":"nihongo","note":"家族の通訳・翻訳を担うことがヤングケアラーの一形態になる。日本語指導が必要な児童生徒と重なりうる"},{"tab":"seito","id":"futoukou","note":"ケアの負担が、不登校の形で現れることがある。不登校対応の中で家庭の状況を確認する視点"},{"tab":"seito","id":"child-abuse","note":"ネグレクトと重なりうる。きょうだいの世話のための欠席は両方の視点で見る"},{"tab":"seito","id":"dropout","note":"家族のケアや家計のためのアルバイトが退学の背景になることがある"}],"chapter":"第13章 多様な背景を持つ幼児児童生徒"}],"links":[{"id":"plan","title":"個別の指導計画・個別の教育支援計画を作る","lead":"計画の様式と考え方の根拠。障害のある子はこの3本、それ以外の背景は各タブの「計画への落とし込み」を参照。","items":[{"sourceId"   // プレビュー: URL に ?preview=合言葉 を付けて開くと、このタブの間だけ覆いを外す。
  var PREVIEW = false;
  function initPreview() {
    var key = META.maintenance && META.maintenance.previewKey;
    var q = location.search.match(/[?&]preview=([^&]*)/);
    try {
      if (q && key && decodeURIComponent(q[1]) === key) {
        sessionStorage.setItem('tk-preview', '1');
        // 合言葉を URL に残さない
        history.replaceState(null, '', location.pathname + location.hash);
      }
      PREVIEW = sessionStorage.getItem('tk-preview') === '1';
    } catch (e) { PREVIEW = !!(q && key && q[1] === key); }
    if (PREVIEW) {
      var bar = document.createElement('div');
      bar.className = 'preview-bar';
      bar.innerHTML = '<span>プレビュー表示中：メンテナンス中の箇所の中身を表示しています（このタブだけ）</span>' +
        '<button type="button" id="previewOff">解除</button>';
      document.body.insertBefore(bar, document.body.firstChild);
      document.getElementById('previewOff').onclick = function () {
        try { sessionStorage.removeItem('tk-preview'); } catch (e) {}
        location.reload();
      };
    }
  }
  function maint(key) {
    if (PREVIEW) return null;
    var m = META.maintenance && META.maintenance[key];
    return (m && m.on) ? m : null;
  }
  function maintCover(m, opts) {
    opts = opts || {};
    return '<div class="maint' + (opts.compact ? ' compact' : '') + '" role="status">' +
      '<span class="maint-tag">メンテナンス中</span>' +
      '<h3>' + esc(m.title || '整備中です') + '</h3>' +
      (m.note ? '<p>' + esc(m.note) + '</p>' : '') +
      (m.until ? '<p class="maint-until">再開の目安：' + esc(m.until) + '</p>' : '') +
      (opts.back ? '<p><a href="' + opts.back.href + '">' + esc(opts.back.label) + '</a></p>' : '') +
      '</div>';
  }
  function renderMaintPage(m, back) {
    mainContent.innerHTML = '<div class="jiritsu-table-wrap">' + maintCover(m, { back: back }) + '</div>';
    playFadeIn();
  }
  function topicOf(key) { return TOPICS[key]; }
  function topicItem(key, id) {
    var t = TOPICS[key];
    return t ? t.items.find(function (x) { return x.id === id; }) : null;
  }
  var SRC = {};   // id -> source

  function srcLink(id) {
    var s = SRC[id];
    if (!s) return '';
    var title = esc(s.title) + (s.edition ? '（' + esc(s.edition) + '）' : '');
    if (!s.url) return title;
    return title + '<br><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.url) + '</a>';
  }

  /* ---------- DOM 参照 ---------- */

  var catList, mainContent, searchBox, sideNav,
      tabGuide, tabCurriculum, tabSeito, tabJiritsu, tabPlan, tabTerms, bookTokushi, bookTeiyo, layoutRoot, homeBtn, homeLink, homeEmblem, siteFooter;

  var currentId = null;
  var mode = 'guide'; // 'guide' | 'curriculum' | 'seito' | 'jiritsu' | 'terms'
  var openDisease = null;   // 開いている疾患名（URLに載せる）
  var routing = false;      // 描画中の navigate を無視するための印

  var supportKeyLabels = {
    content: '教育内容・方法', method: '教材・情報保障',
    system: '支援体制', facility: '施設・設備'
  };

  function playFadeIn() {
    mainContent.classList.remove('fade-in');
    void mainContent.offsetWidth; // 強制リフローでアニメーションを再スタート
    mainContent.classList.add('fade-in');
  }

  /* ==========================================================
     ルーティング
     現在地を URL のハッシュに持たせる。これで
       ・ブラウザの戻る／進むが効く
       ・特定の疾患を指すURLを同僚に送れる
       ・ブックマークできる
     ハッシュを使うのは、GitHub Pages でも単一ファイル版（file://）でも
     サーバ側の設定なしに同じ動きをするため。
     ========================================================== */

  var ROUTES = {
    site:    function () { return '#/'; },          // 全体のホーム（2冊への分岐）
    home:    function () { return '#/guide'; },     // 特別支援ガイドブックのホーム（障害種別の索引）
    cat:     function (id, disease) {
      return '#/c/' + encodeURIComponent(id) +
             (disease ? '/' + encodeURIComponent(disease) : '');
    },
    search:  function (q) { return '#/q/' + encodeURIComponent(q); },
    jiritsu: function () { return '#/jiritsu'; },
    support: function (catId) { return '#/jiritsu/support' + (catId ? '?cat=' + encodeURIComponent(catId) : ''); },
    plan:    function () { return '#/plan'; },
    terms:   function () { return '#/terms'; },
    curriculum: function (id) { return '#/curriculum' + (id ? '/' + encodeURIComponent(id) : ''); },
    seito:   function (id) { return '#/seito'  + (id ? '/' + encodeURIComponent(id) : ''); },
    topic:   function (key, id) { return key === 'seito' ? ROUTES.seito(id) : ROUTES.curriculum(id); }
  };

  // ハッシュの後ろの ?key=value を読む（例: #/jiritsu/support?cat=hearing）
  function hashQuery(h) {
    var q = {}, i = h.indexOf('?');
    if (i < 0) return { path: h, q: q };
    h.slice(i + 1).split('&').forEach(function (kv) {
      var p = kv.split('=');
      try { q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); } catch (e) {}
    });
    return { path: h.slice(0, i), q: q };
  }

  function parseHash() {
    var raw = (location.hash || '').replace(/^#\/?/, '');
    if (!raw) return { view: 'site' };
    var hq = hashQuery(raw), h = hq.path;
    var seg = h.split('/').map(function (x) {
      try { return decodeURIComponent(x); } catch (e) { return x; }
    });
    switch (seg[0]) {
      case 'guide':   return { view: 'home' };
      case 'c':       return { view: 'cat', catId: seg[1], disease: seg[2] || null };
      case 'q':       return { view: 'search', q: seg.slice(1).join('/') };
      case 'jiritsu': return seg[1] === 'support' ? { view: 'support', cat: hq.q.cat || null } : seg[1] === 'sheet2' ? { view: 'plan', legacyPlan: true } : { view: 'jiritsu' };
      case 'plan':    return { view: 'plan' };  // 旧逆引き(#/jiritsu/区分/項目)は一覧へ
      case 'terms':   return { view: 'terms' };
      case 'curriculum': return seg[1] ? { view: 'topic-item', topic: 'curriculum', id: seg[1] } : { view: 'topic', topic: 'curriculum' };
      // 旧「配慮を要する背景」(#/haikei)。版4.0.0で振り分けたので転送する
      case 'haikei':  return seg[1] === 'young-carer'
        ? { view: 'topic-item', topic: 'seito', id: 'young-carer', legacy: true }
        : seg[1] ? { view: 'topic-item', topic: 'curriculum', id: seg[1], legacy: true } : { view: 'topic', topic: 'curriculum', legacy: true };
      case 'seito':   return seg[1] ? { view: 'topic-item', topic: 'seito',  id: seg[1] } : { view: 'topic', topic: 'seito' };
      default:        return { view: 'site' };
    }
  }

  // 画面から遷移するときはこれを呼ぶ。描画は hashchange 経由で1本化する。
  function navigate(hash, replace) {
    if (location.hash === hash) { applyRoute(); return; }
    if (replace && history.replaceState) {
      history.replaceState(null, '', hash);
      applyRoute();
    } else {
      navIntent = 'push';     // 自分で押した遷移。戻る／進むと区別する
      location.hash = hash;   // hashchange が発火して applyRoute が走る
    }
  }

  /* ---------- スクロール位置の扱い ----------
     方針: 画面の最上部には戻さない。
     ・自分で押して別の画面に移ったとき → 本文の先頭（タブの直下）が見えるところまで。すでに見えていれば動かさない
     ・戻る／進む → 離れたときの位置に戻す
     ・同じ画面の中の操作（疾患を開く、検索、タブ内の切替）→ 動かさない。開いた疾患が画面外なら最小限だけ寄せる */
  var navIntent = null;           // 'push' | null（null は戻る／進む・URL直打ち）
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';  // ブラウザ任せの復元と競合させない
  var scrollMemo = {};            // hash → 離れたときの scrollY
  var lastHash = location.hash || '#/';

  function contentTop(preferMain) {
    var t = document.querySelector('.navbar');
    var anchor = t ? t.getBoundingClientRect().bottom + window.scrollY : mainContent.getBoundingClientRect().top + window.scrollY;
    // スマホ幅では索引（sideNav）が本文の上に積まれる。障害種別ページを開いたときは索引ではなく本文の先頭へ
    if (preferMain && sideNav.style.display !== 'none') {
      var nav = sideNav.getBoundingClientRect(), main = mainContent.getBoundingClientRect();
      if (nav.bottom <= main.top + 1) anchor = main.top + window.scrollY;
    }
    return Math.max(0, Math.round(anchor - 8));
  }
  function scrollToContent(preferMain) {
    var top = contentTop(preferMain);
    // 本文の先頭が画面の上半分に見えているなら動かさない
    if (window.scrollY <= top && (top - window.scrollY) < window.innerHeight * 0.5) return;
    window.scrollTo({ top: top, behavior: 'smooth' });
  }
  function afterRouteScroll(prevHash, newHash) {
    if (prevHash === newHash) return;
    var isCat = /^#\/c\//.test(newHash);
    if (navIntent === 'push') {
      scrollToContent(isCat);
    } else if (scrollMemo[newHash] != null) {
      var y = scrollMemo[newHash];
      // 描画直後は高さが確定していないことがあるので、少し待ってから戻す
      window.scrollTo({ top: y, behavior: 'auto' });
      setTimeout(function () { window.scrollTo({ top: y, behavior: 'auto' }); }, 60);
    } else {
      scrollToContent(isCat);
    }
    navIntent = null;
  }

  function setTabs(m) {
    // どの冊に属するモードかで上段の切替と下段のタブを揃える
    if (m === 'site') currentBook = null;
    else if (m !== 'terms') currentBook = BOOKS.teiyo.modes.indexOf(m) >= 0 ? 'teiyo' : 'tokushi';
    bookTokushi.classList.toggle('on', currentBook === 'tokushi');
    bookTeiyo.classList.toggle('on', currentBook === 'teiyo');
    document.body.classList.toggle('at-site-home', m === 'site');
    document.querySelectorAll('.navbar .nav-group[data-book]').forEach(function (g) {
      g.classList.toggle('on', g.getAttribute('data-book') === currentBook);
    });
    tabGuide.classList.toggle('on', m === 'guide');
    tabCurriculum.classList.toggle('on', m === 'curriculum');
    tabSeito.classList.toggle('on', m === 'seito');
    tabJiritsu.classList.toggle('on', m === 'jiritsu');
    tabPlan.classList.toggle('on', m === 'plan');
    tabTerms.classList.toggle('on', m === 'terms');
  }

  function applyRoute() {
    if (routing) return;
    routing = true;
    try {
      var r = parseHash();
      mode = r.view === 'site' ? 'site'
           : (r.view === 'jiritsu' || r.view === 'support') ? 'jiritsu'
           : r.view === 'plan' ? 'plan'
           : r.view === 'terms' ? 'terms'
           : (r.view === 'topic' || r.view === 'topic-item') ? r.topic
           : 'guide';
      setTabs(mode);

      var wide = (mode !== 'guide');
      sideNav.style.display = wide ? 'none' : '';
      layoutRoot.classList.toggle('wide', wide);

      if (r.legacy) { navigate(ROUTES.topic(r.topic, r.id), true); return; }
      // サイト全体のメンテナンス。どの画面でも案内だけを出す（プレビュー中は通常どおり）
      if (maint('site')) {
        sideNav.style.display = 'none';
        layoutRoot.classList.add('wide');
        mainContent.innerHTML = '<div class="jiritsu-table-wrap">' + maintCover(maint('site')) + '</div>';
        playFadeIn();
        document.title = 'メンテナンス中｜' + (META.title || '');
        return;
      }
      // 版3.0.0で不登校を障害種別から生徒指導上の課題へ移した。古いURL(#/c/futoukou)は転送する
      if (r.view === 'cat' && r.catId === 'futoukou') { navigate(ROUTES.seito('futoukou'), true); return; }
      if (r.view === 'site') {
        renderSite();
      } else if (r.view === 'cat' || r.view === 'search' || r.view === 'home') {
        searchBox.value = (r.view === 'search') ? (r.q || '') : '';
        currentId = (r.view === 'cat') ? r.catId : null;
        openDisease = (r.view === 'cat') ? (r.disease || null) : null;
        renderIndex(searchBox.value);
        if (r.view === 'cat' && DATA.some(function (c) { return c.id === r.catId; })) {
          renderMain(r.catId, r.disease || null);
        } else {
          currentId = null;
          renderHome();
        }
      } else if (r.view === 'jiritsu') {
        renderJiritsuTable();
      } else if (r.view === 'support') {
        if (maint('support')) renderMaintPage(maint('support'), { href: ROUTES.jiritsu(), label: '自立活動 6区分27項目 一覧へ戻る' });
        else renderSupport(r.cat);
      } else if (r.view === 'plan') {
        if (r.legacyPlan) { navigate(ROUTES.plan(), true); return; }
        if (maint('sheet2')) renderMaintPage(maint('sheet2'), { href: ROUTES.home(), label: 'ホームへ戻る' });
        else renderSheet2();
      } else if (r.view === 'terms') {
        renderTerms();
      } else if (r.view === 'topic' || r.view === 'topic-item') {
        if (maint(r.topic)) {
          renderMaintPage(maint(r.topic), { href: ROUTES.home(), label: 'ホームへ戻る' });
        } else if (r.view === 'topic') {
          renderTopicIndex(topicOf(r.topic));
        } else {
          var tp = topicItem(r.topic, r.id);
          if (tp) renderTopicItem(topicOf(r.topic), tp); else renderTopicIndex(topicOf(r.topic));
        }
      }
      document.title = pageTitle(r);
    } finally {
      routing = false;
    }
  }

  function pageTitle(r) {
    var base = META.title || '特別支援教育 指導支援ハンドブック';
    if (r.view === 'cat') {
      var c = DATA.find(function (x) { return x.id === r.catId; });
      if (c) return (r.disease ? r.disease + '｜' : '') + c.name + '｜' + base;
    }
    if (r.view === 'search') return '「' + r.q + '」の検索結果｜' + base;
    if (r.view === 'jiritsu') return '自立活動 6区分27項目｜' + base;
    if (r.view === 'support') return '自立活動サポートシート｜' + base;
    if (r.view === 'plan') return '計画シート｜' + base;
    if (r.view === 'site') return base;
    if (r.view === 'home') return '障害種別ガイド｜' + base;
    if (r.view === 'terms') return '出典・リンク集｜' + base;
    if (r.view === 'topic') return topicOf(r.topic).title + '｜' + base;
    if (r.view === 'topic-item') {
      var h = topicItem(r.topic, r.id);
      if (h) return h.name + '｜' + topicOf(r.topic).title + '｜' + base;
    }
    return base;
  }

  function goHome() { navigate(ROUTES.site()); }
  function setMode(m) {
    navigate(m === 'guide' ? ROUTES.home()
           : m === 'jiritsu' ? ROUTES.jiritsu()
           : m === 'curriculum' ? ROUTES.curriculum()
           : m === 'plan' ? ROUTES.plan()
           : m === 'seito' ? ROUTES.seito()
           : ROUTES.terms());
  }

  /* ---------- 検索 ---------- */

  var HIT_LABEL = {
    name: '病名', overview: '説明', support: '支援内容',
    severity: '程度別'
  };

  // どのフィールドで当たったかを返す。当たらなければ null。
  function matchDisease(d, f) {
    if ((d.name || '').toLowerCase().indexOf(f) >= 0) return 'name';
    if ((d.overview || '').toLowerCase().indexOf(f) >= 0) return 'overview';
    var i, j;
    for (i = 0; i < (d.support || []).length; i++) {
      if (d.support[i].toLowerCase().indexOf(f) >= 0) return 'support';
    }
    for (i = 0; i < (d.severity || []).length; i++) {
      var sv = d.severity[i];
      if ((sv.level + sv.criteria).toLowerCase().indexOf(f) >= 0) return 'severity';
      for (j = 0; j < (sv.support || []).length; j++) {
        if (sv.support[j].toLowerCase().indexOf(f) >= 0) return 'severity';
      }
    }
    return null;
  }

  /* ---------- 索引 ---------- */

  function renderIndex(filter) {
    var f = (filter || '').trim().toLowerCase();
    catList.innerHTML = '';
    var diseaseHits = [];

    DATA.forEach(function (cat) {
      var catHay = (cat.name + cat.en + cat.overview +
        (cat.needs || []).map(function (n) { return n.k + n.v; }).join('') +
        (cat.instruction || []).map(function (x) { return x.t + x.d; }).join('') +
        Object.keys(cat.support || {}).map(function (k) { return cat.support[k].join(''); }).join('') +
        v5Hay(cat)
      ).toLowerCase();
      // 病名・概要に加え、支援内容・程度別支援・自立活動の項目名まで探す。
      // 「拡大教材」のような手立ての言葉から、それを要する状態を辿れるように。
      var matched = f ? cat.diseases.filter(function (d) {
        d._hit = matchDisease(d, f);
        return !!d._hit;
      }) : [];
      var catMatches = !f || catHay.indexOf(f) >= 0;
      if (f && matched.length) {
        matched.forEach(function (d) { diseaseHits.push({ cat: cat, disease: d }); });
      }
      if (f && !catMatches && !matched.length) return;

      var li = document.createElement('li');
      if (cat.id === currentId) li.className = 'active';
      var btn = document.createElement('button');
      btn.type = 'button';
      var hitBadge = matched.length ? '<span class="idx-hit-count">' + matched.length + '</span>' : '';
      btn.innerHTML = '<span class="num">' + esc(cat.num) + '</span>' +
                      '<span class="cat-name">' + esc(cat.name) + '</span>' + hitBadge;
      btn.onclick = function () { navigate(ROUTES.cat(cat.id)); };
      li.appendChild(btn);
      catList.appendChild(li);
    });

    var hitsEl = document.getElementById('diseaseHits');
    if (hitsEl) hitsEl.remove();
    if (f && diseaseHits.length) {
      hitsEl = document.createElement('div');
      hitsEl.id = 'diseaseHits';
      hitsEl.className = 'disease-hits';
      var label = document.createElement('p');
      label.className = 'index-label';
      label.style.marginTop = '18px';
      label.textContent = '疾患名でのヒット（' + diseaseHits.length + '件）';
      hitsEl.appendChild(label);
      var ul = document.createElement('ul');
      ul.className = 'hit-list';
      diseaseHits.slice(0, 30).forEach(function (h) {
        var li = document.createElement('li');
        var btn = document.createElement('button');
        btn.type = 'button';
        var where = h.disease._hit && h.disease._hit !== 'name'
          ? '<span class="hit-where">' + esc(HIT_LABEL[h.disease._hit] || '') + '</span>' : '';
        btn.innerHTML = '<span class="hit-disease">' + esc(h.disease.name) + where + '</span>' +
                        '<span class="hit-cat">' + esc(h.cat.name) + '</span>';
        btn.onclick = function () { navigate(ROUTES.cat(h.cat.id, h.disease.name)); };
        li.appendChild(btn);
        ul.appendChild(li);
      });
      hitsEl.appendChild(ul);
      if (diseaseHits.length > 30) {
        var more = document.createElement('p');
        more.className = 'block-sub';
        more.style.margin = '6px 2px 0';
        more.textContent = '他 ' + (diseaseHits.length - 30) + ' 件（検索語を絞り込んでください）';
        hitsEl.appendChild(more);
      }
      catList.insertAdjacentElement('afterend', hitsEl);
    }
  }

  /* ---------- ホーム ---------- */

  // ホームの先頭に置く「先生方へ」と2冊の説明・一次資料（文面は meta.json の notice）
  function homeNoticeHtml() {
    var n = META.notice; if (!n) return '';
    var html = '<section class="home-notice" aria-label="先生方へのお知らせ">' +
      '<div class="home-notice-text">' +
        '<p class="home-notice-heading">' + esc(n.heading || '先生方へ') + '</p>' +
        (n.lines || []).map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('') +
      '</div>' +
      '<div class="home-notice-actions">' +
        (n.form ? '<a class="notice-btn" href="' + esc(n.form.url) + '" target="_blank" rel="noopener"><span class="notice-btn-main">' + esc(n.form.label) + '</span>' + (n.form.sub ? '<span class="notice-btn-sub">' + esc(n.form.sub) + '</span>' : '') + '</a>' : '') +
        (n.pdf ? '<a class="notice-doc" href="' + esc(n.pdf.url) + '" target="_blank" rel="noopener"><span class="notice-doc-icon" aria-hidden="true">PDF</span><span>' + esc(n.pdf.label) + '</span></a>' : '') +
      '</div></section>';
    return html;
  }

  /* ---------- 右下の「メニュー」パネル ----------
     上の帯にある冊とタブの切替は繰り返さない。ここに置くのは
     「今いる画面の中の移動」と「よく使う行き先」。 */
  function navPanelHtml() {
    var cur = location.hash || '#/';
    var r = parseHash();
    var html = '<div class="nav-panel-inner">' +
      '<div class="nav-panel-head"><span>メニュー</span><button type="button" class="nav-panel-close" aria-label="閉じる">閉じる</button></div>';

    // 1) このページの中を移動（本文の見出しから自動で拾う）
    var heads = Array.prototype.slice.call(mainContent.querySelectorAll('h3.block-title, .ku-heading h3'));
    var seen = 0;
    if (heads.length >= 2) {
      html += '<div class="nav-panel-group"><p>このページの中</p><div class="nav-panel-chips">';
      heads.forEach(function (h, i) {
        var label = (h.childNodes[0] && h.childNodes[0].textContent || h.textContent).trim().replace(/\s+/g, ' ').slice(0, 18);
        if (!label || seen >= 8) return;
        var host = h.closest('section, .block, .ku-group') || h;
        if (!host.id) host.id = 'sec-' + i;

  // 見出しに付ける「出典①」の印。末尾の出典欄の番号と対応する

  // 出典欄。①概要 ②個別に求められる支援 ③程度別の支援 の順に、何に基づくかを示す
  function basisBadges(d) {
    var b = d.basis;
    if (!b) return '';
    var ov = META.basisLabels.overview[b.overview];
    var sp = META.basisLabels.support[b.support];
    if (!ov && !sp) return '';

    // どの資料に基づくのかを、資料名と（あれば）URLで示す
    var refs = (b.sources || []).map(function (id) {
      var x = SRC[id];
      if (!x) return '';
      var name = esc(x.title) + (x.edition ? '（' + esc(x.edition) + '）' : '');
      return x.url
        ? '<li><a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + name + '</a>' +
          '<span class="basis-pub">' + esc(x.publisher || '') + '</span></li>'
        : '<li>' + name + '<span class="basis-pub">' + esc(x.publisher || '') + '</span></li>';
    }).filter(Boolean);

    var rows = [];
    // ① 概要
    var ovBody = '';
    if (refs.length) ovBody += '<ul class="basis-refs">' + refs.join('') + '</ul>';
    if (b.evidence) {
      var isUrl = /^https?:\/\//.test(b.evidence);
      ovBody += '<p class="basis-evidence">' + (isUrl
        ? '該当ページ：<a href="' + esc(b.evidence) + '" target="_blank" rel="noopener">' + esc(b.evidence) + '</a>'
        : esc(b.evidence)) + '</p>';
    }
    if (ov) rows.push(basisRow('①', '概要（医学的説明）', ov, ovBody));
    // ② 個別に求められる支援
    if (sp) {
      var spBody = (b.support === 'editorial')
        ? '<p class="basis-note">上の資料に示された医学的特性を踏まえ、本ツールが教育実務上まとめたものです。資料に支援内容の記載があるわけではありません。</p>'
        : '';
      rows.push(basisRow('②', '個別に求められる支援', sp, spBody));
    }
    // ③ 程度別の支援
    if (d.severity) {
      var sc = d.severityScale;
      var lab, tone, scBody = '';
      if (sc && sc.basis !== 'editorial') {
        lab = '公的な尺度に基づく区分'; tone = 'ok';
        scBody = '<p class="basis-note">用いている尺度：' + esc(sc.name) + '。区分ごとの支援内容は本ツールによる教育的整理です。</p>';
      } else {
        lab = '本ツールによる目安'; tone = 'info';
        scBody = '<p class="basis-note">' + (sc ? '目安の立て方：' + esc(sc.name) + '。' : '') + '対応する公的な尺度がないため、本ツールが教育実務上の目安として区分したものです。</p>';
      }
      rows.push(basisRow('③', '程度別の支援', { label: lab, tone: tone }, scBody));
    }
    return '<div class="basis-detail"><p class="basis-label">出典</p><dl class="basis-legend">' + rows.join('') + '</dl></div>';
  }
  function basisRow(num, title, lab, body) {
    return '<dt><span class="src-ref">' + num + '</span>' + esc(title) + '</dt>' +

  /* ---------- 通知が定める学級・通級の程度 ---------- */

  // 25文科初第756号 通知（別紙）。特別支援学級と通級による指導の対象となる
  // 障害の程度で、施行令第22条の3（特別支援学校）とは別の基準。
  // これも条文の引用なので言い換えない。
  function programBlock(cat) {
    var pc = cat.programCriteria;
    if (!pc) return '';
    var src = SRC[pc.sourceId];
    var byProgram = ['特別支援学級', '通級による指導'].map(function (prog) {
      var hit = (pc.entries || []).filter(function (e) { return e.program === prog; });
      if (hit.length) {
        return '<div class="prog-item">' +
          '<p class="prog-head"><span class="prog-name">' + esc(prog) + '</span>' +
            hit.map(function (e) {
              return '<span class="prog-term">' + esc(e.term) +
                (e.part ? '　第' + esc(e.part) + '号' : '') + '</span>';
            }).join('') +
          '</p>' +
          hit.map(function (e) {
            return e.text.split('\n').map(function (line) {
              return '<p class="legal-clause">' + esc(line) + '</p>';
            }).join('');
          }).join('') +
        '</div>';
      }
      var ab = (pc.absent || []).filter(function (a) { return a.program === prog; })[0];
      if (!ab) return '';
      return '<div class="prog-item prog-absent">' +
        '<p class="prog-head"><span class="prog-name">' + esc(prog) + '</span>' +
          '<span class="prog-term prog-none">この通知には定めなし</span></p>' +
        '<p class="prog-reason">' + esc(ab.reason) + '</p>' +
      '</div>';
    }).join('');

    return '<section class="block">' +

      '<div class="legal-box">' + byProgram + '</div>' +
      '<div class="section-disclaimer"><b>該当すれば必ず利用できる、というものではありません</b>' +
        '<p>' + esc(pc.note) + '</p></div>' +
      (src ? '<p class="legal-src">出典：' +
        (src.url
          ? '<a href="' + esc(src.url) + '" target="_blank" rel="noopener">' + esc(src.title) + '</a>'
          : esc(src.title)) +
        '（' + esc(src.publisher || '') + '）</p>' : '') +

  }

  /* ==========================================================
     障害種別ページ（版5.0 の型）
     手引 第3編の各章を一次資料に、「見るべき軸」「実態把握の仕方（校内様式の5欄）」
     「固有の見方」「指導内容と支援の要点」「学びの場」「主な疾患」「用語」の順で組む。
     疾患ごとの支援は書かない。自立活動の項目との対応も持たない。
     「この子の支援を考える」のカードから、障害種の観点を持った状態でサポートシートへ。
     ========================================================== */

  // 検索用の文字列（v5 の区分）
  function v5Hay(cat) {
    var v = cat.v5; if (!v) return '';
    var out = [v.definition || ''];
    (v.axes || []).forEach(function (a) { out.push(a.name, (a.levels || []).join(''), a.meaning || ''); });
    (v.terms || []).forEach(function (t) { out.push(t.term, t.desc); });
    (v.specific || []).forEach(function (s) { out.push(s.title, (s.body || []).join('')); });
    return out.join('');
  }

  // 手引のページ番号の印。章のPDFに飛べるようにする
  function v5Ref(cat, ref) {
    if (!ref) return '';
    var s = SRC[cat.sourceId];
    var label = '手引 ' + ref;
    return s && s.url

          ((scale.sources || []).length

                return x.url
                  ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.title) + '</a>'

              }).filter(Boolean).join('／') + '</p>'

      ) : '';

        '<p class="dd-label">程度別の支援' + srcRef(3) + '</p>' + scaleBlock +
        '<div class="severity-list">' + d.severity.map(function (sv) {
          return '<div class="severity-item">' +
            '<div class="sv-level">' + esc(sv.level) + '</div>' +
            '<div class="sv-criteria">' + esc(sv.criteria) + '</div>' +
            '<ul class="sv-support">' + sv.support.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>' +

        }).join('') + '</div>'

          '<b>この分類についての出典表示</b>' +

        '</div>' +
        '<div class="disease-list">' + diseaseHtml + '</div>' +

      '<section class="block">' +
        '<h3 class="block-title">教育的ニーズの要点</h3>' +
        '<div class="need-grid">' + needsHtml + '</div>' +

        '<h3 class="block-title">求められる特別な指導内容（例）</h3>' +

        '<p>疾患や障害種から項目を引くのではなく、実態把握 → 課題の整理 → 項目の選定 → 指導内容、の手順で決めます。' +

      '<section class="block">' +

        '<p>出典：' + srcLink(cat.sourceId) + '</p>' +
      '</div>';

    playFadeIn();

    /* --- 支援内容タブ --- */
    var tabWrap = document.getElementById('supportTabs');
    var panel = document.getElementById('supportPanel');
    var keys = Object.keys(cat.support);
    function showTab(k) {
      tabWrap.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.k === k); });
      panel.innerHTML = '<ul>' + cat.support[k].map(function (li) { return '<li>' + esc(li) + '</li>'; }).join('') + '</ul>';
    }
    tabWrap.innerHTML = keys.map(function (k) {
      return '<button type="button" data-k="' + esc(k) + '">' + esc(supportKeyLabels[k] || k) + '</button>';
    }).join('');
    tabWrap.querySelectorAll('button').forEach(function (b) { b.onclick = function () { showTab(b.dataset.k); }; });
    showTab(keys[0]);

    /* --- 疾患アコーディオン --- */
    function measureHeight(detail) {
      var inner = detail.querySelector('.disease-detail-inner');
      return inner ? inner.scrollHeight : detail.scrollHeight;
    }
    function openDiseaseItem(item) {
      var detail = item.querySelector('.disease-detail');
      var hint = item.querySelector('.d-hint');
      item.classList.add('open');
      detail.style.maxHeight = measureHeight(detail) + 'px';
      if (hint) hint.textContent = '閉じる';
    }
    function closeDiseaseItem(item) {
      var detail = item.querySelector('.disease-detail');
      var hint = item.querySelector('.d-hint');
      detail.style.maxHeight = measureHeight(detail) + 'px'; // 現在の高さを明示してから0へ
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { detail.style.maxHeight = '0px'; });
      });
      item.classList.remove('open');
      if (hint) hint.textContent = '詳細を見る';
    }
    mainContent.querySelectorAll('.disease-item').forEach(function (item) {
      item.querySelector('.disease-row').onclick = function () {
        var willOpen = !item.classList.contains('open');
        if (willOpen) { openDiseaseItem(item); } else { closeDiseaseItem(item); }
        // 開いている疾患をURLに載せる。履歴は積まない（戻るは前の画面へ）
        var name = cat.diseases[Number(item.dataset.idx)].name;
        openDisease = willOpen ? name : null;
        // 画面は描き直さない（描き直すと位置が飛ぶ）。URLだけ差し替える
        var h = willOpen ? ROUTES.cat(cat.id, name) : ROUTES.cat(cat.id);
        if (history.replaceState) { history.replaceState(null, '', h); lastHash = h; }
        // 開いた詳細が画面の外にはみ出すなら、最小限だけ寄せる
        if (willOpen) {
          setTimeout(function () {
            var r = item.getBoundingClientRect();
            if (r.top < 0 || r.bottom > window.innerHeight) item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }, 320);
        }
      };
    });

    if (openDiseaseName) {
      var idx = cat.diseases.findIndex(function (d) { return d.name === openDiseaseName; });
      if (idx >= 0) {
        var target = mainContent.querySelector('.disease-item[data-idx="' + idx + '"]');
        if (target) {
          openDiseaseItem(target);
          setTimeout(function () {
            var rr = target.getBoundingClientRect();
            if (rr.top < 0 || rr.top > window.innerHeight * 0.6) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 320);
        }
      }
    }
  }

  function spFieldsOf(cat, col) {
    if (!cat) return [];

  }
  function spFKey(cat, x) { return cat.id + ':' + x.k; }

  // 校内様式へ貼るためのテキスト（【欄名】＋内容）
  function spFormText(d) {

  // AIの回答から、校内様式の欄（【欄名】…）と計画シートの欄（■ 欄名…）を読み取る。校内様式の欄は SP に入れる
  function spParseForm(text, d) {
    var lines = (text || '').split(/\r?\n/), key = null, buf = [], filled = 0;
    var map = {}; SP_FORM.forEach(function (f) { map[f.label] = f.k; });
    function flush() {
      if (!key) return;
      var v = buf.join('\n').trim().replace(/^（未確認）$|^（未記入）$/, '');
      if (v) { d[key] = v; filled++; }
      key = null; buf = [];
    }
    lines.forEach(function (ln) {
      var t = ln.trim();
      var m = /^【(.+?)】$/.exec(t);
      if (m) { flush(); key = map[m[1]] || null; return; }
      if (/^[＜<【■]/.test(t) && !m) { flush(); return; }
      if (key) buf.push(ln);
    });
    flush();
    return filled;
  }

  // AIの回答（■ 欄名／内容 の形式）を欄に流し込む。見出し【…】で共通／個別を区別する
  function s2Parse(text, d) {
    var lines = (text || '').split(/\r?\n/);
    var scope = null, key = null, buf = [], filled = 0, skipped = [];
    var labelMap = {};
    S2_COMMON.forEach(function (f) { labelMap['c|' + f.label] = ['c', f.k]; });
    S2_SPECIAL.forEach(function (s) { s.fields.forEach(function (f) { labelMap[s.id + '|' + f.label] = [s.id, f.k]; }); });
    function flush() {
      if (!key) return;
      var val = buf.join('\n').trim().replace(/^（未記入）$/, '');
      buf = [];
      var m = labelMap[key];
      if (!m || !val) { key = null; return; }
      if (m[0] === 'c') d.common[m[1]] = val; else { d.sp[m[0]][m[1]] = val; d.on[m[0]] = true; }
      filled++; key = null;
    }
    lines.forEach(function (ln) {
      var t = ln.trim();
      var h = /^【(共通シート|個別シート[：:](.+?))】$/.exec(t);
      if (h) { flush(); scope = h[1] === '共通シート' ? 'c' : null;
        if (!scope) { var sp = S2_SPECIAL.find(function (s) { return h[2].indexOf(s.name.replace(/（.*$/, '')) === 0 || s.name === h[2]; }); scope = sp ? sp.id : null; }
        return; }
      var f = /^[■●◆・]?\s*(.+?)\s*$/.exec(t);
      if (t.charAt(0) === '■' && scope) { flush(); var lab = t.replace(/^■\s*/, ''); key = scope + '|' + lab; if (!labelMap[key]) { skipped.push(lab); key = null; } return; }
      if (key) buf.push(ln);
    });
    flush();
    return { filled: filled, skipped: skipped };
  }

      '<div class="hk-groups">' + h.supports.map(function (g) {
        return '<div class="hk-group"><h4>' + esc(g.title) + '</h4>' +
          '<ul class="hk-list">' + g.items.map(hkLi).join('') + '</ul></div>';
      }).join('') + '</div></section>';

    var planningHtml = '';
    if (h.planning) {
      planningHtml = '<section class="block" id="hk-planning">' +
        '<h3 class="block-title">' + esc(h.planningLabel) + '</h3>' +
        '<ul class="hk-list">' + h.planning.map(hkLi).join('') + '</ul>' +
        '</section>';
    } else {
      planningHtml = '<section class="block">' +
        '<h3 class="block-title">計画への落とし込み<span class="tally">対象外</span></h3>' +
        '<div class="section-disclaimer"><b>この項目は個別の指導計画の対象ではありません</b>' +
        '<p>指導ではなく、気づいて関係機関につなぐことが学校の役割です。校内での情報共有と経過の記録は上の要点に沿って行い、計画の様式には載せません。</p></div>' +
        '</section>';
    }

    var jiritsuLine = (t.key === 'seito')
      ? '<div class="section-disclaimer"><b>障害のある幼児児童生徒がこの課題に直面している場合の自立活動</b>' +
        '<p>自立活動の目標は、この課題名から項目を引くのではなく、<a href="' + ROUTES.support() + '">サポートシート</a>の手順（実態把握 → 課題の整理 → 項目の選定）で決めます。' +
        'この課題を①実態把握と③指導すべき課題に書き込むところから始めてください。</p></div>'
      : '';
    var relatedHtml = jiritsuLine + '<section class="block" id="hk-related">' +
      '<h3 class="block-title">関連する障害種別<span class="tally">特別支援ガイドブックへ</span></h3>' +
      '<p class="block-sub">見立てを分ける、または重なりを確認するときに参照する区分です。</p>' +
      '<div class="hk-rel">' + (h.related || []).map(function (r) {
        var c = DATA.find(function (x) { return x.id === r.catId; });
        if (!c) return '';
        return '<a class="hk-rel-card" href="' + ROUTES.cat(c.id) + '">' +
          '<span class="num">' + esc(c.num) + '</span><b>' + esc(c.name) + '</b><span>' + esc(r.note) + '</span></a>';
      }).join('') + '</div>' +
      (h.relatedNote ? '<p class="hk-rel-note">' + esc(h.relatedNote) + '</p>' : '') +
      '</section>';

    // 他の主題タブの項目への横リンク（不登校↔ヤングケアラー など）
    if (h.relatedTopics && h.relatedTopics.length) {
      relatedHtml += '<section class="block">' +
        '<h3 class="block-title">関連する項目<span class="tally">他の冊・タブへ</span></h3>' +
        '<div class="hk-rel">' + h.relatedTopics.map(function (r) {
          var it = topicItem(r.tab, r.id), tt = topicOf(r.tab);
          if (!it || !tt) return '';
          return '<a class="hk-rel-card" href="' + ROUTES.topic(r.tab, it.id) + '">' +
            '<span class="num">' + esc(BOOKS[tt.book].title + '／' + tt.title) + '</span><b>' + esc(it.name) + '</b><span>' + esc(r.note) + '</span></a>';
        }).join('') + '</div></section>';
    }

    var basisBlock = '<section class="block" id="hk-basis">' +
      '<details class="hk-basis-wrap"><summary><span class="block-title-like">公的な位置づけ</span><span class="tally">法令・通知の根拠 ' + (h.basis || []).length + '件</span></summary>' +
      '<ul class="hk-list hk-basis">' + basisHtml + '</ul></details>' +
      '</section>';

    var srcHtml = basisBlock + '<div class="source-box">' +
      '<p class="basis-label">この項目が基づく資料</p>' +
      '<ul class="basis-refs">' + (h.sources || []).map(hkSourceRef).join('') + '</ul>' +
      '<p style="margin-top:10px;">出典確認 ' + esc(h.reviewed) + '。制度や資料の要旨は本ツールによる整理で、原文の言い換えを含みます。指導計画や会議の根拠にする際は原文をご確認ください。</p>' +
      feedbackLink(t.title, h.name) +
      '</div>';

    var html = '<div class="jiritsu-table-wrap hk-view">' +
      '<p class="crumb"><a href="' + ROUTES.topic(t.key) + '">' + esc(t.title) + '</a> › ' + esc(h.name) + '</p>' +
      '<div class="article-head">' +
        '<div class="article-num" style="border-radius:3px;">' + esc(h.num) + '</div>' +
        '<h2 class="cat-title">' + esc(h.name) + '<span class="en">' + esc(h.en) + '</span></h2>' +
      '</div>' +
      (h.chapter ? '<p class="hk-chapter">生徒指導提要 ' + esc(h.chapter) + '</p>' : '') +
      '<p class="hk-subtitle">' + esc(h.subtitle) + '</p>' +
      '<div class="hk-status tone-' + esc(st.tone || 'info') + '">' + hkStatusTag(h) + '<span>' + esc(st.text || '') + '</span></div>' +
      '<div class="overview">' + esc(h.overview) + '</div>' +
      '<nav class="hk-toc" aria-label="ページ内の移動">' +
        '<a href="javascript:void(0)" data-jump="hk-points">押さえておきたい点</a>' +
        '<a href="javascript:void(0)" data-jump="hk-signs">' + esc(h.signsLabel) + '</a>' +
        '<a href="javascript:void(0)" data-jump="hk-supports">' + esc(h.supportsLabel) + '</a>' +
        (h.planning ? '<a href="javascript:void(0)" data-jump="hk-planning">' + esc(h.planningLabel) + '</a>' : '') +
        '<a href="javascript:void(0)" data-jump="hk-related">関連する障害種別</a>' +
        '<a href="javascript:void(0)" data-jump="hk-basis">公的な位置づけ</a>' +
      '</nav>' +
      '<section class="block" id="hk-points">' +
        '<h3 class="block-title">押さえておきたい点</h3>' +
        '<ol class="hk-points">' + pointsHtml + '</ol>' +
      '</section>' +
      frameworkHtml + signsHtml + supportsHtml + planningHtml + relatedHtml + srcHtml +
      '</div>';

    mainContent.innerHTML = html;
    playFadeIn();
    mainContent.querySelectorAll('[data-jump]').forEach(function (a) {
      a.addEventListener('click', function () {
        var el = document.getElementById(a.getAttribute('data-jump'));
        if (!el) return;
        var d = el.querySelector('details'); if (d) d.open = true;
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  /* ---------- フッター ---------- */

  function renderFooter() {
    var fb = META.feedback;
    siteFooter.innerHTML =
      '<p>' + esc(META.disclaimer.long) + '</p>' +
      '<p class="footer-meta">' +
        '最終更新 ' + esc(META.updated) + '（版 ' + esc(META.version) + '）／ ' +
        '収録 ' + DATA.length + '区分・主な疾患 ' +
        DATA.reduce(function (s, c) { return s + c.diseases.length; }, 0) + '件／ ' +
        '特別の教育課程 ' + TOPICS.curriculum.items.length + '件／ 生徒指導上の課題 ' + TOPICS.seito.items.length + '件／ ' +
        '出典 ' + SOURCES.length + '件（詳細は上部タブ「出典・リンク集」）' +
      '</p>' +
      '<p class="footer-feedback"><b>' + esc(fb.label) + '</b>：' + esc(fb.note) +
        ' <a href="' + esc(fb.url) + '" target="_blank" rel="noopener">' + esc(fb.url) + '</a></p>';
  }

  /* ---------- ホーム画面追加の案内 ---------- */

  function installBanner() {
    try {
      var standalone = window.matchMedia('(display-mode: standalone)').matches ||
                       window.navigator.standalone === true;
      if (standalone || localStorage.getItem('installBannerDismissed') === '1') return;
      var ua = navigator.userAgent;
      var isIOS = /iPhone|iPad|iPod/.test(ua);
      var isAndroid = /Android/.test(ua);
      if (!isIOS && !isAndroid) return;
      var banner = document.getElementById('installBanner');
      document.getElementById('installText').textContent = isIOS
        ? '画面下部の共有ボタン（□に↑）から「ホーム画面に追加」でアプリのように使えます'
        : 'ブラウザメニュー（⋮）から「ホーム画面に追加」または「アプリをインストール」でアプリのように使えます';
      banner.style.display = 'flex';
      document.getElementById('installClose').onclick = function () {
        banner.style.display = 'none';
        try { localStorage.setItem('installBannerDismissed', '1'); } catch (e) {}
      };
    } catch (e) { /* localStorage等が使えない環境では何もしない */ }
  }

  /* ---------- 起動 ---------- */

  function bindDom() {
    catList = document.getElementById('catList');
    mainContent = document.getElementById('mainContent');
    searchBox = document.getElementById('searchBox');
    sideNav = document.getElementById('sideNav');
    tabGuide = document.getElementById('tabGuide');
    tabCurriculum = document.getElementById('tabCurriculum');
    bookTokushi = document.getElementById('bookTokushi');
    bookTeiyo = document.getElementById('bookTeiyo');
    tabSeito = document.getElementById('tabSeito');
    tabJiritsu = document.getElementById('tabJiritsu');
    tabPlan = document.getElementById('tabPlan');
    tabTerms = document.getElementById('tabTerms');
    layoutRoot = document.getElementById('layoutRoot');
    homeBtn = document.getElementById('menuBtn');
    homeLink = document.getElementById('homeLink');
    homeEmblem = document.getElementById('homeEmblem');
    siteFooter = document.getElementById('siteFooter');

    // ホームへ戻る操作は3か所。いずれも button 要素なので、
    // Enter / Space の処理はブラウザに任せられる。
    homeBtn.onclick = function () { openNavPanel(document.getElementById('navPanel').hidden); };
    document.addEventListener('click', function (e) {
      var panel = document.getElementById('navPanel');
      if (!panel || panel.hidden) return;
      if (panel.contains(e.target) || homeBtn.contains(e.target)) return;
      openNavPanel(false);
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') openNavPanel(false); });
    homeLink.onclick = goHome;
    if (homeEmblem) homeEmblem.onclick = goHome;
    tabGuide.onclick = function () { setMode('guide'); };
    tabCurriculum.onclick = function () { setMode('curriculum'); };
    bookTokushi.onclick = function () { navigate(BOOKS.tokushi.home); };
    bookTeiyo.onclick = function () { navigate(BOOKS.teiyo.home); };
    tabSeito.onclick = function () { setMode('seito'); };
    tabJiritsu.onclick = function () { setMode('jiritsu'); };
    tabPlan.onclick = function () { setMode('plan'); };
    tabTerms.onclick = function () { setMode('terms'); };

    // 検索は打つたびにURLを積むと戻るボタンが使い物にならないので、
    // 表示だけ即座に更新し、URLは打ち終わってから置き換える。
    var searchTimer = null;
    searchBox.addEventListener('input', function () {
      renderIndex(searchBox.value);
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        var q = searchBox.value.trim();
        navigate(q ? ROUTES.search(q) : ROUTES.home(), true);
      }, 600);
    });
  }

  function boot(bundle) {
    META = bundle.meta;
    SOURCES = bundle.sources;
    JIRITSU27 = bundle.jiritsu27;
    DATA = bundle.categories;
    // 版5.0 の区分：<id>.json が配列ではなく1つのオブジェクト。疾患は検索・件数のために平らにしておく
    DATA.forEach(function (c) {
      if (Array.isArray(c.diseases)) return;
      c.v5 = c.diseases;
      c.diseases = [];
      (c.v5.conditionGroups || []).forEach(function (g) {
        (g.items || []).forEach(function (x) { c.diseases.push({ name: x.name, overview: (x.axis ? x.axis + '。' : '') + x.line, support: [] }); });
      });
    });
    TOPICS.curriculum.items = bundle.curriculum || [];
    TOPICS.seito.items = bundle.seito || [];
    LINKS = bundle.links || [];
    SOURCES.forEach(function (s) { SRC[s.id] = s; });

    bindDom();
    initPreview();
    // 整備中のタブに印を付ける
    [['curriculum', tabCurriculum], ['seito', tabSeito], ['sheet2', tabPlan]].forEach(function (pair) {
      if (maint(pair[0])) pair[1].insertAdjacentHTML('beforeend', '<span class="maint-mini">整備中</span>');
    });
    renderFooter();
    installBanner();

    // 戻る／進む、URL直打ち、リンク経由のいずれもここで拾う
    window.addEventListener('hashchange', function () {
      var prev = lastHash, next = location.hash || '#/';
      scrollMemo[prev] = window.scrollY;   // 離れる画面の位置を覚える（戻る用）
      applyRoute();
      lastHash = next;
      afterRouteScroll(prev, next);
    });
    applyRoute();
  }

  function fail(err) {
    console.error(err);
    var main = document.getElementById('mainContent');
    if (main) {
      main.innerHTML = '<div class="section-disclaimer"><b>データを読み込めませんでした</b>' +
        '<p>通信状況をご確認のうえ、ページを再読み込みしてください。' +
        'ローカルのファイルを直接開いた場合は、<code>python3 -m http.server</code> などのローカルサーバー経由で開いてください。</p></div>';
    }
  }

  function loadJson(path) {
    return fetch(path, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error(path + ' → HTTP ' + r.status);
      return r.json();
    });
  }

  function start() {
    // 結合ビルド（tokushi-guidebook-standalone.html）ではデータが埋め込み済み
    if (window.__BUNDLE__) { boot(window.__BUNDLE__); return; }

    Promise.all([
      loadJson('meta.json'),
      loadJson('sources.json'),
      loadJson('jiritsu27.json'),
      loadJson('categories.json'),
      loadJson('curriculum.json'),
      loadJson('seito.json'),
      loadJson('links.json')
    ]).then(function (r) {
      var meta = r[0], sources = r[1], jiritsu27 = r[2], categories = r[3], curriculum = r[4], seito = r[5], links = r[6];
      return Promise.all(categories.map(function (c) {
        return loadJson(c.id + '.json').then(function (ds) {
          c.diseases = ds;
          return c;
        });
      })).then(function (cats) {
        boot({ meta: meta, sources: sources, jiritsu27: jiritsu27, categories: cats, curriculum: curriculum, seito: seito, links: links });
      });
    }).catch(fail);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();

</script>

</body>
</html>
