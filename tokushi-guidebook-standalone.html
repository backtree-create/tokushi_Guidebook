<style>
  :root{
    /* ---- 面 ----
       地は白。副次的な面はごくわずかに青みを帯びた明るいグレーで、
       濃紺のヘッダーと同じ系統に収める。生成りは使わない。 */
    --paper:#ffffff;
    --paper2:#f2f5f8;
    --card:#ffffff;
    --line:#dce2e8;
    --line-strong:#a9b4be;

    /* ---- 濃紺（構造色）----
       ヘッダー、見出しの罫、選択状態。このツールの背骨。 */
    --navy:#132132;
    --navy-2:#1c3040;

    /* ---- 文字 ----
       白地で18:1。行政文書の水準に合わせて高めに取る。 */
    --ink:#141719;
    --ink-strong:#0e2033;
    --ink-soft:#40484f;
    --ink-faint:#59626a;

    /* ---- 操作色 ----
       リンクと押せるもの。金や青緑ではなく、公的機関で通用する藍。 */
    --accent:#0f4c8a;
    --accent-soft:#e9eff7;

    /* ---- 金 ----
       濃紺の面の上でのみ使う。明るい地には置かない（濁って見えるため）。 */
    --gold-soft:#c9a96b;
    --gold-line:#a8823c;

    /* ---- 状態を表す色 ---- */
    --tone-ok-fg:#12592f;   --tone-ok-bg:#e8f2ec;   --tone-ok-bd:#6a9a7c;
    --tone-info-fg:#0f4c8a; --tone-info-bg:#e9eff7; --tone-info-bd:#7799bf;
    --tone-warn-fg:#7a4c00; --tone-warn-bg:#fbf0dd; --tone-warn-bd:#b8934f;
    --tag-fg:#0d3d54;       --tag-bg:#e6eef3;

    --shadow: 0 1px 2px rgba(19,33,50,.05), 0 6px 18px -12px rgba(19,33,50,.22);
    --serif: "Noto Serif JP","Shippori Mincho","游明朝体","Hiragino Mincho ProN",serif;
    --sans: "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    --mono: "Roboto Mono", "SFMono-Regular", Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; max-width:100%; overflow-x:hidden; scrollbar-gutter:stable;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.75;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    word-break:normal;
    overflow-wrap:break-word;
    line-break:strict;
  }
  a{color:var(--accent); overflow-wrap:break-word; word-break:break-word;}
  /* 文中のリンクは下線を太めに。カード型のリンク(.hk-card等)は各自で text-decoration:none にしている */
  .source-box a,.basis-refs a,.hk-ref a,.src-index a,.item-table a,.block-sub a,.crumb a,.hk-rel-note a{
    text-decoration:underline;
    text-decoration-thickness:1.5px;
    text-underline-offset:3px;
    font-weight:600;
  }
  .source-box a:hover,.basis-refs a:hover,.item-table a:hover{background:var(--tone-info-bg);}
  /* 外部リンクの印 */
  .source-box a[target="_blank"]::after,.basis-refs a[target="_blank"]::after,
  .hk-ref a[target="_blank"]::after,.item-table a[target="_blank"]::after{
    content:"\2197";
    font-size:.8em;
    margin-left:3px;
    color:var(--ink-faint);
  }
  img, table, pre, .source-box, .credential, .top-strip{max-width:100%;}

  /* ---------- 上部帯（機関名） ---------- */
  .top-strip{
    background:var(--navy);
    color:#c9d2da;
    font-size:12px;
    letter-spacing:.06em;
    padding:7px 24px;
    display:flex;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .top-strip span.dim{color:#7c8ea0;}

  /* ---------- ヘッダー ---------- */
  header{
    position:relative;
    padding:30px 24px 0;
    background:var(--navy);
    color:#f2f1ea;
    border-bottom:3px solid var(--gold-line);
  }
  .header-inner{max-width:1220px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:28px;flex-wrap:wrap;padding-bottom:22px; min-width:0;}
  .brandmark{
    display:flex;
    align-items:center;
    gap:16px;
    min-width:0;
    max-width:100%;
    flex:1 1 640px;   /* 名称が長くなったので、右の一次資料欄が落ちないよう縮めるのはこちら */
  }
  .brandmark .brand-text{min-width:0;}
  .emblem{
    /* button 要素なので既定の見た目を打ち消す */
    padding:0;
    background:none;
    cursor:pointer;
    transition:opacity .15s, border-color .15s;
    width:52px;height:52px;
    border:1.5px solid var(--gold-soft);
    border-radius:50%;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);
    font-size:20px;
    color:var(--gold-soft);
    position:relative;
  }
  .emblem::after{
    content:"";
    position:absolute;
    inset:5px;
    border:1px solid rgba(201,169,107,.4);
    border-radius:50%;
  }
  .eyebrow{
    font-family:var(--sans);
    letter-spacing:.28em;
    font-size:11.5px;
    color:var(--gold-soft);
    margin:0 0 8px;
    text-transform:uppercase;
  }
  h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:clamp(22px,2.4vw,28px);
    margin:0 0 6px;
    line-height:1.3;
    letter-spacing:.02em;
    color:#fbfaf6;
  }
  header p.lead{
    margin:2px 0 0;
    color:#b7c0c8;
    font-size:13.5px;
    max-width:600px;
    overflow-wrap:break-word;
  }
  .credential{
    text-align:right;
    font-size:12.5px;
    color:#9fb0bb;
    line-height:1.9;
    flex:0 1 auto;
    max-width:400px;
  }
  @media (max-width:900px){
    .credential{text-align:left;max-width:100%;}
  }
  .credential b{color:#e9e4d5;font-weight:600;}

  /* ---------- ヘッダーのお知らせ（作成の趣旨と問い合わせフォーム） ---------- */
  .header-notice{
    max-width:1220px;
    margin:0 auto 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:24px;
    padding:16px 20px;

    font-size:12.5px;
    font-weight:600;
    padding:9px 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    text-align:center;
    position:relative;
  }
  .install-banner button{
    all:unset;
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:2px 6px;
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
  }

  @keyframes fadeInMain{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  #mainContent.fade-in{animation:fadeInMain .32s cubic-bezier(.4,0,.2,1);}
  @media (prefers-reduced-motion: reduce){
    #mainContent.fade-in{animation:none;}
    .disease-detail{transition:none;}
  }

  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:5px;}

  /* ==========================================================
     2026-08-25 追加：出典表示・診断名対応表・フッター
     ========================================================== */

  /* --- セクション冒頭の出典ことわり（フッターまで読ませない） --- */
  .section-disclaimer{
    background:var(--card);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-radius:3px;
    padding:12px 16px;
    margin:0 0 18px;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.85;
  }
  .section-disclaimer b{
    display:block;
    font-family:var(--serif);
    font-size:12.5px;
    color:var(--ink);
    margin-bottom:4px;
  }
  .section-disclaimer p{margin:0;}
  .section-disclaimer code{
    font-family:var(--mono);
    font-size:12px;
    background:var(--paper2);
    padding:1px 5px;
    border-radius:2px;
  }

  /* --- 疾患ごとの出典区分バッジ --- */
  /* 見出しの出典番号（①②③）と、末尾の出典欄 */
  .src-ref{
    display:inline-block;
    margin-left:6px;
    font-family:var(--sans);
    font-size:.85em;
    font-weight:700;
    color:var(--accent);
    vertical-align:baseline;
  }
  .basis-legend{
    margin:6px 0 0;
    display:grid;
    grid-template-columns:max-content 1fr;
    gap:6px 18px;
    align-items:baseline;
  }
  .basis-legend dt{
    font-size:13px;
    font-weight:700;
    color:var(--ink-strong);
    white-space:nowrap;
  }
  .basis-legend dt .src-ref{margin:0 6px 0 0;font-size:13px;}
  .basis-legend dd{margin:0;min-width:0;font-size:13px;line-height:1.75;color:var(--ink);}
  .basis-kind{font-weight:700;}
  .basis-kind.tone-ok{color:var(--tone-ok-fg);}
  .basis-kind.tone-info{color:var(--ink-strong);}
  .basis-kind.tone-warn{color:var(--tone-warn-fg);}
  .basis-legend .basis-refs{margin:2px 0 0;}
  .basis-legend .basis-evidence{margin:2px 0 0;font-size:12.5px;}
  .basis-note{margin:2px 0 0;font-size:12.5px;line-height:1.75;color:var(--ink-soft);}
  @media (max-width:640px){
    .basis-legend{grid-template-columns:1fr;gap:2px 0;}
    .basis-legend dd{margin-bottom:8px;padding-left:22px;}
  }
  .basis-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:14px;
    padding-top:12px;
    border-top:1px dashed var(--line);
  }
  .basis-tag{
    font-family:var(--sans);
    font-size:11.5px;
    line-height:1.7;
    font-weight:600;
    letter-spacing:.02em;
    line-height:1.6;
    padding:3px 9px;
    border-radius:2px;
    border:1px solid var(--line-strong);
    color:var(--ink-soft);
    background:var(--paper2);
    /* 色だけに頼らず、必ず文字で区別が付くようにしている */
  }
  .basis-tag.tone-ok{border-color:var(--tone-ok-bd);color:var(--tone-ok-fg);background:var(--tone-ok-bg);}
  .basis-tag.tone-info{border-color:var(--tone-info-bd);color:var(--tone-info-fg);background:var(--tone-info-bg);}
  .basis-tag.tone-warn{border-color:var(--tone-warn-bd);color:var(--tone-warn-fg);background:var(--tone-warn-bg);}

  /* --- 編集上の注記 --- */
  .d-note{
    margin:14px 0 0;
    padding:10px 14px;
    background:var(--paper2);
    border-left:2px solid var(--line-strong);
    border-radius:2px;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.85;
  }
  .d-note b{
    display:block;
    font-family:var(--serif);
    color:var(--ink);
    font-size:12px;
    margin-bottom:2px;
  }

  /* --- 出典一覧の補足表示 --- */
  .src-note,.src-index{
    display:inline-block;
    font-size:12px;
    color:var(--ink-faint);
    line-height:1.7;
    margin-top:3px;
  }
  .src-index a{word-break:break-all;}
  .policy-tag{
    display:inline-block;
    font-size:11.5px;
    font-weight:600;
    padding:2px 8px;
    border-radius:2px;
    border:1px solid var(--line-strong);
    white-space:nowrap;
  }
  .policy-tag.latest{border-color:var(--tone-warn-bd);color:var(--tone-warn-fg);background:var(--tone-warn-bg);}
  .policy-tag.pinned{color:var(--ink-soft);background:var(--paper2);}

  /* ---------- 配慮を要する背景（障害以外の教育的ニーズ） ---------- */
  .hk-home-note{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px 16px;
    margin:22px 0 18px;
    padding:14px 18px;
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--navy);
    border-radius:3px;
    font-size:13.5px;
    color:var(--ink);
  }
  .hk-home-note b{font-family:var(--serif);color:var(--ink-strong);font-size:14px;}
  .hk-home-note span{flex:1 1 320px;color:var(--ink-soft);}
  .hk-home-note a{font-weight:700;color:var(--accent);white-space:nowrap;text-decoration:none;border-bottom:1px solid var(--accent);}

  .hk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin:6px 0 28px;}
  .hk-card{
    display:flex;
    flex-direction:column;
    gap:6px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    padding:18px 20px 16px;
    box-shadow:var(--shadow);
    text-decoration:none;
    color:var(--ink);
    transition:border-color .12s, transform .12s;
  }
  .hk-card:hover{border-color:var(--navy);transform:translateY(-1px);}
  .hk-card .num{font-family:var(--mono);color:var(--accent);font-size:11.5px;}
  .hk-card h4{font-family:var(--serif);margin:0;font-size:17px;line-height:1.4;color:var(--ink-strong);}
  .hk-card p{margin:0;font-size:12.5px;line-height:1.8;color:var(--ink-soft);flex:1;}
  .hk-card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px;padding-top:10px;border-top:1px solid var(--line);}
  .hk-card-cnt{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);}

  .hk-subtitle{margin:14px 0 10px;font-size:14px;color:var(--ink-soft);line-height:1.8;}
  .hk-status{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:12px 16px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--card);
    font-size:13.5px;
    line-height:1.8;
    color:var(--ink);
    margin-bottom:6px;
  }
  .hk-status .basis-tag{flex-shrink:0;margin-top:3px;}
  .hk-status.tone-ok{border-left:4px solid var(--tone-ok-bd);}
  .hk-status.tone-info{border-left:4px solid var(--tone-info-bd);}
  .hk-status.tone-warn{border-left:4px solid var(--tone-warn-bd);}

  .hk-list{margin:12px 0 0;padding-left:0;list-style:none;}
  .hk-list li{
    position:relative;
    padding:10px 0 10px 22px;
    font-size:14.5px;
    line-height:1.9;
    color:var(--ink);
    border-bottom:1px dashed var(--line);
    max-width:56em;
  }
  .hk-lead{font-weight:700;color:var(--ink-strong);}
  .hk-signs li{padding:8px 0 8px 22px;}
  .hk-list li:last-child{border-bottom:none;}
  .hk-list li::before{
    content:"";
    position:absolute;
    left:4px;top:17px;
    width:7px;height:7px;
    background:var(--navy);
    transform:rotate(45deg);
  }
  .hk-ref{display:block;font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .hk-ref a{color:var(--accent);}

  .hk-points{margin:14px 0 0;padding:0;list-style:none;counter-reset:none;}
  .hk-points li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-size:14.5px;line-height:1.9;color:var(--ink);max-width:56em;}
  .hk-pt-n{
    flex-shrink:0;
    width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-weight:700;font-size:13px;
    color:#fff;background:var(--navy);border-radius:50%;
    margin-top:3px;
  }

  .hk-dl{margin:14px 0 0;display:grid;gap:8px;}
  .hk-dl-row{
    display:grid;
    grid-template-columns:180px 1fr;
    gap:0 16px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    padding:12px 16px;
  }
  .hk-dl dt{font-family:var(--serif);font-weight:700;font-size:14px;color:var(--ink-strong);line-height:1.7;}
  .hk-dl dd{margin:0;font-size:13.5px;line-height:1.85;color:var(--ink);}
  @media (max-width:640px){.hk-dl-row{grid-template-columns:1fr;gap:4px;}}

  .hk-groups{display:grid;gap:18px;margin-top:14px;}
  .hk-group{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:16px 22px 12px;}
  .hk-group h4{
    margin:0;
    font-family:var(--serif);
    font-size:15px;
    color:var(--ink-strong);
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .hk-group .hk-list{margin-top:4px;}

  .hk-toc{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 28px;}
  .hk-toc a{
    padding:6px 12px;
    font-size:12.5px;font-weight:700;
    color:var(--ink-strong);
    background:var(--card);
    border:1px solid var(--line-strong);
    border-radius:16px;
    text-decoration:none;
  }
  .hk-toc a:hover{border-color:var(--navy);}
  .hk-basis-wrap summary{
    cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:8px 0 8px 12px;
    border-left:4px solid var(--navy);
    list-style:none;
  }
  .hk-basis-wrap summary::-webkit-details-marker{display:none;}
  .hk-basis-wrap summary .block-title-like{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--ink-strong);}
  .hk-basis-wrap summary::after{content:"開く";font-size:12px;color:var(--accent);margin-left:auto;}
  .hk-basis-wrap[open] summary::after{content:"閉じる";}
  .hk-basis-wrap summary .tally{margin-left:8px;}
  .hk-basis li{font-size:13.5px;}
  .hk-rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:14px;}
  .hk-rel-card{
    display:flex;flex-direction:column;gap:4px;
    padding:12px 14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    text-decoration:none;
    color:var(--ink);
    transition:border-color .12s;
  }
  .hk-rel-card:hover{border-color:var(--navy);}
  .hk-rel-card .num{font-family:var(--mono);font-size:11px;color:var(--accent);}
  .hk-rel-card b{font-family:var(--serif);font-size:14.5px;color:var(--ink-strong);}
  .hk-rel-card span:last-child{font-size:12.5px;line-height:1.75;color:var(--ink-soft);}
  .hk-rel-note{margin:12px 0 0;font-size:13px;color:var(--ink-soft);}

  /* ---------- 目的別リンク集（出典・リンク集タブ） ---------- */
  .lk-jump{
    display:flex;flex-wrap:wrap;gap:8px;
    margin:0 0 22px;
  }
  .lk-jump a{
    padding:7px 14px;
    font-size:13px;font-weight:700;
    color:var(--ink-strong);
    background:var(--card);
    border:1px solid var(--line-strong);
    border-radius:3px;
    text-decoration:none;
  }
  .lk-jump a:hover{border-color:var(--navy);}
  .lk-guide{display:grid;gap:22px;margin:0 0 30px;}
  .lk-group{margin:0;}
  .lk-title{
    margin:0 0 4px;
    font-family:var(--serif);
    font-size:17px;
    color:var(--ink-strong);
    padding-left:12px;
    border-left:4px solid var(--navy);
  }
  .lk-lead{margin:0 0 10px 16px;font-size:13px;color:var(--ink-soft);line-height:1.8;}
  .lk-list{display:grid;gap:8px;}
  .lk-row{
    display:grid;
    grid-template-columns:minmax(220px,2fr) 3fr auto;
    align-items:center;
    gap:6px 18px;
    padding:12px 16px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    text-decoration:none;
    color:var(--ink);
    transition:border-color .12s, background .12s;
  }
  .lk-row:hover,.lk-row:focus-visible{border-color:var(--accent);background:var(--tone-info-bg);outline:none;}
  .lk-row.internal{border-style:dashed;}
  .lk-main{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .lk-label{
    font-size:15px;font-weight:700;
    color:var(--accent);
    text-decoration:underline;
    text-decoration-thickness:1.5px;
    text-underline-offset:3px;
    line-height:1.5;
  }
  .lk-row.internal .lk-label{color:var(--ink-strong);text-decoration:none;}
  .lk-sub{font-size:12px;color:var(--ink-faint);}
  .lk-note{font-size:13px;line-height:1.75;color:var(--ink-soft);}
  .lk-mark{font-size:18px;color:var(--ink-faint);}
  .lk-row:hover .lk-mark{color:var(--accent);}
  @media (max-width:760px){
    .lk-row{grid-template-columns:1fr auto;}
    .lk-mark{grid-row:1;grid-column:2;}
    .lk-note{grid-column:1 / -1;}
  }

  /* ---------- 自立活動サポートシート（AIと考える） ---------- */
  .sp-entry{
    display:flex;align-items:center;gap:16px;
    margin:0 0 16px;
    padding:16px 20px;
    background:var(--card);
    border:1px solid var(--line-strong);
    border-left:5px solid var(--accent);
    border-radius:3px;
    text-decoration:none;color:var(--ink);
    transition:border-color .12s, transform .12s;
  }
  .sp-entry:hover{border-color:var(--accent);transform:translateY(-1px);}
  .sp-entry-main{display:flex;flex-direction:column;gap:4px;flex:1;}
  .sp-entry-main b{font-family:var(--serif);font-size:17px;color:var(--ink-strong);}
  .sp-entry-main span{font-size:13px;line-height:1.75;color:var(--ink-soft);}
  .sp-entry-mark{font-size:24px;color:var(--accent);}
  /* カード内の説明文用の指定（span の色と大きさ）が「整備中」の印にも効いていたのを外す */
  .sp-entry-main .maint-mini{font-size:11px;color:var(--tone-warn-fg);line-height:1.5;}

  .sp-num{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;margin-right:10px;
    font-family:var(--serif);font-size:13px;font-weight:700;
    color:#fff;background:var(--navy);border-radius:50%;
    vertical-align:middle;
  }
  .sp-form{display:block;}
  .sp-field{display:flex;flex-direction:column;gap:5px;margin:12px 0;}
  .sp-label{font-size:14px;font-weight:700;color:var(--ink-strong);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;}
  .sp-hint{font-size:12px;font-weight:400;color:var(--ink-faint);}
  .sp-field textarea,.sp-field input[type="text"]{
    width:100%;
    box-sizing:border-box;
    padding:9px 12px;
    font:inherit;
    font-size:14px;
    line-height:1.7;
    color:var(--ink);
    background:var(--card);
    border:1px solid var(--line-strong);
    border-radius:3px;
    resize:vertical;
  }
  .sp-field textarea:focus,.sp-field input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .sp-level{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:6px 0 14px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:3px;}
  .sp-radio{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink-strong);cursor:pointer;}
  .sp-radio input{width:16px;height:16px;}
  .sp-radio .sp-hint{margin-left:2px;}
  .sp-two{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;}
  @media (max-width:640px){.sp-two{grid-template-columns:1fr;}}

  .sp-adv{margin:6px 0 18px;border:1px dashed var(--line-strong);border-radius:3px;padding:0 16px;background:var(--card);}
  .sp-adv summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--ink-strong);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;}
  .sp-adv summary .sp-hint{font-weight:400;}
  .sp-adv[open] summary{border-bottom:1px solid var(--line);margin-bottom:6px;}
  .sp-adv .block{padding-top:6px;}
  .sp-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0;}
  .sp-btn{
    padding:9px 16px;
    font:inherit;font-size:13.5px;font-weight:700;
    color:var(--ink-strong);
    background:var(--card);
    border:1px solid var(--line-strong);
    border-radius:3px;
    cursor:pointer;
  }
  .sp-btn:hover{border-color:var(--navy);}
  .sp-btn.primary{color:#fff;background:var(--navy);border-color:var(--navy);}
  .sp-btn.primary:hover{background:var(--accent);border-color:var(--accent);}
  .sp-btn.danger{color:var(--tone-warn-fg);}
  .sp-copied{font-size:13px;color:var(--tone-ok-fg);font-weight:700;}
  .sp-out{
    width:100%;box-sizing:border-box;
    padding:12px 14px;
    font-family:var(--mono);
    font-size:12.5px;
    line-height:1.7;
    color:var(--ink);
    background:var(--card);
    border:1px solid var(--line-strong);
    border-radius:3px;
  }

  .preview-bar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:center;gap:14px;
    padding:8px 14px;
    font-size:13px;font-weight:700;
    color:#1b1a14;background:var(--gold-soft);
    border-bottom:2px solid #a88a4c;
  }
  .preview-bar button{
    padding:4px 12px;font:inherit;font-size:12.5px;font-weight:700;
    color:#1b1a14;background:#fff;border:1px solid #7a6636;border-radius:3px;cursor:pointer;
  }
  @media print{.preview-bar{display:none !important;}}

  /* ---------- メンテナンス中の覆い ---------- */
  .maint{
    margin:8px 0 24px;
    padding:28px 26px;
    background:var(--card);
    border:1px dashed var(--line-strong);
    border-left:5px solid var(--tone-warn-bd);
    border-radius:3px;
    text-align:left;
  }
  .maint.compact{padding:18px 20px;margin:12px 0 0;}
  .maint-tag{
    display:inline-block;
    padding:2px 10px;
    font-size:12px;font-weight:700;letter-spacing:.06em;
    color:var(--tone-warn-fg);background:var(--tone-warn-bg);
    border:1px solid var(--tone-warn-bd);border-radius:3px;
  }
  .maint h3{margin:10px 0 8px;font-family:var(--serif);font-size:19px;color:var(--ink-strong);}
  .maint.compact h3{font-size:16px;}
  .maint p{margin:0 0 6px;font-size:14px;line-height:1.85;color:var(--ink);}
  .maint-until{color:var(--ink-soft);font-size:13px;}
  .maint a{color:var(--accent);font-weight:700;}
  .maint-mini{
    display:inline-block;
    font-family:var(--sans);
    margin-left:8px;
    padding:1px 7px;
    font-size:11px;font-weight:700;letter-spacing:.04em;
    color:var(--tone-warn-fg);background:var(--tone-warn-bg);
    border:1px solid var(--tone-warn-bd);border-radius:3px;
    vertical-align:middle;
  }
  .mode-tabs button .maint-mini{margin-left:6px;}
  .sp-entry.maint-on{border-left-color:var(--tone-warn-bd);}

  /* ---------- 2階シート（試作） ---------- */
  .s2-gate-note{margin:8px 0 24px;padding:14px 16px;background:var(--card);border:1px dashed var(--line-strong);border-radius:3px;font-size:14px;color:var(--ink-soft);}
  .s2-checks{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:10px;}
  .s2-check{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line-strong);border-radius:3px;background:var(--card);font-size:14px;font-weight:700;color:var(--ink-strong);cursor:pointer;}
  .s2-check input{width:18px;height:18px;}
  .s2-tabs{margin-top:12px;}
  .s2-tabs button.off{opacity:.45;}
  .s2-tabs button.off::after{content:"（未選択）";font-weight:400;font-size:11px;margin-left:4px;}
  .s2-panel{padding-top:6px;}
  .s2-sheet-sec{margin-top:16px;}
  .s2-sheet-sec h4{margin:0 0 6px;font-family:var(--serif);font-size:15px;color:var(--ink-strong);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;}
  .s2-sheet-sec h4 span{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--ink-soft);}
  .s2-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
  .s2-table th,.s2-table td{border:1px solid var(--line-strong);padding:8px 10px;vertical-align:top;line-height:1.75;overflow-wrap:break-word;}
  .s2-table th{width:200px;text-align:left;background:var(--paper2);color:var(--ink-strong);font-weight:700;}
  @media (max-width:640px){
    .s2-table th{width:110px;padding:6px 8px;}
    .s2-table td{padding:6px 8px;}
    .s2-table{font-size:12.5px;}
  }
  /* --- フッター --- */
  footer p{margin:0 0 10px;}
  .footer-meta{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-faint);
    padding-top:10px;
    border-top:1px solid var(--line);
  }
  .footer-feedback{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    padding:10px 14px;
  }
  .footer-feedback b{color:var(--ink);}
  .footer-feedback a{word-break:break-all;}

  /* タブが3つになり、狭い画面では折り返す。
     折り返しても押せる範囲がはっきり分かるよう枠を付ける。 */
  @media (max-width:760px){
    .mode-tabs{
      flex-wrap:wrap;
      gap:6px;
      padding:0 12px 10px;
    }
    .mode-tabs button{
      flex:1 1 auto;
      text-align:center;
      font-size:12.5px;
      padding:9px 14px;
      border:1px solid rgba(201,169,107,.45);
      border-radius:4px;
    }
    .mode-tabs button.on{border-color:var(--paper);}
  }

  @media (max-width:640px){
    .basis-row{gap:5px;}
    .section-disclaimer{padding:11px 13px;}
  }

  .item-official{
    display:block;
    font-family:var(--sans);
    font-weight:400;
    font-size:12px;
    color:var(--ink-faint);
    line-height:1.65;
    margin-top:3px;
  }

  /* --- 出典の内訳（疾患カード内） --- */
  .basis-detail{
    margin-top:12px;
    padding:11px 14px;
    background:var(--paper2);
    border-radius:2px;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.8;
  }
  .basis-label{
    margin:0 0 6px;
    font-family:var(--serif);
    font-size:13px;
    color:var(--ink);
  }
  .basis-refs{
    list-style:none;
    margin:0;
    padding:0;
  }
  .basis-refs li{
    padding:3px 0 3px 14px;
    position:relative;
  }
  .basis-refs li::before{
    content:"–";
    position:absolute;
    left:0;
    color:var(--ink-faint);
  }
  .basis-refs a{word-break:break-word;}
  .basis-pub{
    display:block;
    font-size:12px;
    color:var(--ink-faint);
  }
  .basis-evidence{
    margin:8px 0 0;
    padding-top:8px;
    border-top:1px dashed var(--line);
    font-size:12.5px;
    color:var(--ink-faint);
  }
  .basis-evidence a{word-break:break-all;}


  /* ==========================================================
     2026-08-25 視認性の調整
     小さい文字ほど行間を確保し、字面を詰めない。
     色は --ink-faint / --gold を暗くしてコントラスト比4.5以上を確保済み。
     ========================================================== */
  .dd-label{ line-height:1.7; }
  .d-overview{ line-height:1.85; }
  .dd-support li,.sv-support li{ line-height:1.8; margin-bottom:6px; }
  .disease-detail-inner .dd-support li{ margin-bottom:7px; }
  .home-card p{ line-height:1.8; }
  .src-note,.src-index{ line-height:1.75; }
  .item-table td{ line-height:1.8; }
  .credential{ line-height:1.85; }

  /* 数字・番号のような要素は等幅数字にして揃える */
  .home-stat b,.block-title .tally,.idx-hit-count,
  ul.cat-list button .num,.home-card .num,.article-num{
    font-variant-numeric:tabular-nums;
  }

  /* 端末側で文字を大きくしている利用者の設定を妨げない */
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }

  /* ==========================================================
     ホームへ戻る操作の範囲
     以前はヘッダーのブロック全体がボタンで、説明文をなぞろうとしただけで
     ホームへ飛んでいた。紋章とタイトルの2つだけを操作対象にする。
     ========================================================== */
  .emblem:hover{opacity:.85;border-color:var(--gold-soft);}
  .emblem:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px;}

  .h1-home{
    /* h1 の字面をそのまま引き継ぐ */
    font:inherit;
    color:inherit;
    letter-spacing:inherit;
    background:none;
    border:none;
    padding:0;
    margin:0;
    text-align:left;
    cursor:pointer;
    display:inline;
  }
  .h1-home:hover{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px;}
  .h1-home:focus-visible{outline:2px solid var(--gold-soft);outline-offset:4px;}

  /* 説明文はクリック対象ではない。文字を選んで読める。 */
  .brandmark .lead{cursor:text;user-select:text;}

  /* ==========================================================
     自立活動からの逆引き・学びの場・指摘フォーム
     ========================================================== */
  .crumb{margin:0 0 14px;font-size:13px;}
  .crumb a{color:var(--accent);}

  /* 逆引き(.rev-*)のスタイルは版3.0.0で機能ごと削除した */
  .item-label{font-weight:700;color:var(--ink-strong);}

  .fb-line{
    margin:12px 0 0;
    padding-top:12px;
    border-top:1px dashed var(--line);
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:4px 12px;
  }
  .fb-link{font-size:12.5px;font-weight:700;color:var(--accent);white-space:nowrap;}
  .fb-ctx{font-size:11.5px;color:var(--ink-faint);}

  .hit-where{
    display:inline-block;
    margin-left:6px;
    font-family:var(--mono);
    font-size:11px;
    font-weight:400;
    color:var(--ink-soft);
    border:1px solid var(--line-strong);
    border-radius:2px;
    padding:0 5px;
  }


  /* ==========================================================
     印刷
     支援会議の資料や、個別の指導計画を書くときの下敷きとして
     紙に出す前提で整える。画面用の要素は落とし、リンク先のURLは
     紙の上でも辿れるよう本文の後ろに出す。
     ========================================================== */
  /* ==========================================================
     読みやすさの調整（版4.3.3）— 余白・行間・文字の大きさを全体で広げる
     ========================================================== */
  body{line-height:1.85;}
  main{padding:36px 40px 100px;}
  @media (max-width:900px){ main{padding:28px 20px 90px;} }
  /* ヘッダーを軽くする：一次資料は右の欄をやめて名称の下に1行で */
  .header-inner{gap:20px;padding-bottom:18px;}
  .credential{
    flex:1 1 100%;
    max-width:none;
    text-align:left;
    font-size:12px;
    line-height:1.7;
    color:#8fa0ab;
    padding-left:74px;
  }
  .credential b{display:inline;margin-right:6px;}
  .credential br{display:none;}
  @media (max-width:640px){ .credential{padding-left:0;} }
  header p.lead{font-size:13.5px;max-width:720px;}
  .header-notice{padding:14px 18px;margin-bottom:14px;}
  .header-notice .notice-text p:not(.notice-heading){font-size:13px;line-height:1.75;}
  .notice-btn{padding:10px 18px;min-width:220px;}
  .book-switch{margin-bottom:8px;}
  .book-switch button{padding:10px 16px;}
  /* 本文：見出しを少し大きく、節の間を広く */
  section.block{margin-bottom:48px;}
  h3.block-title{font-size:15.5px;margin-bottom:12px;padding-bottom:10px;}
  .block-sub{font-size:13.5px;line-height:1.8;margin-bottom:14px;}
  .cat-title{font-size:26px;}
  .article-head{margin-bottom:10px;padding-bottom:18px;}
  /* 囲みを軽くする：線と影を減らし、余白で区切る */
  .overview{padding:20px 24px;margin:20px 0 34px;box-shadow:none;border-color:transparent;font-size:15.5px;line-height:1.9;}
  .section-disclaimer{padding:14px 18px;margin-bottom:22px;box-shadow:none;border-color:transparent;font-size:13.5px;line-height:1.85;}
  .source-box{padding:18px 22px;line-height:1.85;}
  /* 疾患の一覧と詳細 */
  .disease-row{padding:15px 6px;}
  .disease-row .d-name{font-size:15px;}
  .disease-detail-inner{padding-top:6px;}
  .d-overview{font-size:15px;line-height:1.9;max-width:60em;}
  .dd-label{margin-top:18px;}
  .dd-support li{padding:6px 0;line-height:1.85;font-size:14.5px;max-width:60em;}
  .sv-block{padding:14px 18px;}
  /* ホームのカード */
  .home-card{padding:18px 20px;box-shadow:none;}
  .home-card h4{font-size:16px;}
  .hk-card{padding:20px 22px 18px;box-shadow:none;}
  .hk-card h4{font-size:17.5px;}
  .hk-card p{font-size:13px;line-height:1.85;}
  /* 索引 */
  nav.index{padding:28px 18px 60px 26px;}
  nav.index button{padding:11px 8px;font-size:14px;}
  /* 表 */
  .item-table th,.item-table td{padding:11px 14px;line-height:1.8;}
  /* 目的別リンク */
  .lk-row{padding:14px 18px;}
  .lk-guide{gap:28px;}
  /* ==========================================================
     ヘッダーの圧縮（版4.4.0）: 2段。名称＋リンク／2冊とタブを1本の帯
     ========================================================== */
  header{padding:0;}
  .masthead{
    max-width:1220px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:12px 24px 10px;
  }
  .mast-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .masthead .emblem,.topbar .emblem{width:38px;height:38px;font-size:17px;flex-shrink:0;}
  .masthead h1,.topbar h1{margin:0;font-size:clamp(16px,1.6vw,20px);line-height:1.3;}
  .masthead h1 .h1-home{white-space:normal;}
  .mast-right{display:flex;gap:6px;flex-shrink:0;}
  .mast-right a{
    padding:6px 12px;
    font-size:12.5px;font-weight:700;
    color:#e6e9ea;text-decoration:none;
    border:1px solid rgba(255,255,255,.28);border-radius:14px;
    white-space:nowrap;
  }
  .mast-right a:hover{border-color:var(--gold-soft);color:#fff;}
  .navbar{
    max-width:1220px;margin:0 auto;
    display:flex;flex-wrap:wrap;align-items:flex-end;gap:0 18px;
    padding:0 24px;
  }
  .nav-group{display:flex;align-items:flex-end;gap:2px;padding:6px 0 0;}
  .nav-group.on .nav-book{color:#1b1a14;background:var(--gold-soft);}
  .nav-group-terms{margin-left:auto;}
  .nav-book{
    all:unset;cursor:pointer;
    font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.06em;
    color:#c8d0d8;background:rgba(255,255,255,.08);
    padding:6px 9px;margin:0 6px 6px 0;border-radius:3px;
  }
  .nav-book:hover{background:rgba(255,255,255,.16);color:#fff;}
  .navbar button:not(.nav-book){
    all:unset;cursor:pointer;
    font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:.02em;
    color:#aab7c1;padding:10px 16px;border-radius:5px 5px 0 0;
  }
  .navbar button:not(.nav-book).on{background:var(--paper);color:var(--ink-strong);}
  .navbar button:not(.nav-book):not(.on):hover{color:#eef0ec;}
  .navbar button .maint-mini{margin-left:6px;}
  @media (max-width:760px){
    .masthead{padding:10px 14px 8px;}
    .masthead h1{font-size:15px;}
    .mast-right a{padding:5px 9px;font-size:11.5px;}
    .navbar{flex-wrap:nowrap;overflow-x:auto;padding:0 10px;gap:0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .navbar::-webkit-scrollbar{display:none;}
    .nav-group{flex-shrink:0;}
    .nav-group-terms{margin-left:6px;}
    .navbar button:not(.nav-book){padding:10px 12px;font-size:13px;white-space:nowrap;}
  }
  @media (max-width:520px){
    .top-strip{display:none;}                   /* 狭い画面では帯を出さない（名称は見出しにある） */
    .mast-right{display:none;}                  /* 趣意書と問い合わせはホームの案内から */
    .masthead{padding:10px 12px 6px;}
    .masthead h1{font-size:14.5px;}
  }

  /* 右下の「メニュー」ボタンとパネル（開閉と選択にアニメーション） */
  .fab-menu{
    all:unset;
    position:fixed;right:18px;bottom:18px;z-index:60;
    display:flex;align-items:center;gap:10px;
    background:var(--navy);color:var(--gold-soft);
    border:2px solid var(--gold-soft);border-radius:30px;
    padding:11px 18px 11px 14px;
    font-family:var(--sans);font-size:13px;font-weight:700;
    cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25);
    transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s, background .18s;
  }
  .fab-menu:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.3);}
  .fab-menu:active{transform:scale(.96);}
  .fab-menu.open{background:var(--gold-soft);color:#1b1a14;}
  .fab-menu:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px;}
  /* 三本線 → ×。3本目を消し、上下2本を回転させる */
  .burger{position:relative;width:20px;height:14px;display:block;flex-shrink:0;}
  .burger span{
    position:absolute;left:0;width:20px;height:2px;border-radius:2px;
    background:currentColor;
    transition:transform .26s cubic-bezier(.2,.8,.2,1), opacity .18s, top .26s cubic-bezier(.2,.8,.2,1);
  }
  .burger span:nth-child(1){top:0;}
  .burger span:nth-child(2){top:6px;}
  .burger span:nth-child(3){top:12px;}
  .fab-menu.open .burger span:nth-child(1){top:6px;transform:rotate(45deg);}
  .fab-menu.open .burger span:nth-child(2){opacity:0;transform:scaleX(.2);}
  .fab-menu.open .burger span:nth-child(3){top:6px;transform:rotate(-45deg);}
  .nav-panel{
    position:fixed;right:18px;bottom:74px;z-index:59;
    width:min(340px,calc(100vw - 36px));
    background:var(--card);color:var(--ink);
    border:1px solid var(--line-strong);border-radius:12px;
    box-shadow:0 12px 36px rgba(0,0,0,.28);
    overflow:hidden;
    transform-origin:100% 100%;
    opacity:0;transform:translateY(10px) scale(.96);
    transition:opacity .2s ease, transform .22s cubic-bezier(.2,.8,.2,1);
    pointer-events:none;
  }
  .nav-panel.open{opacity:1;transform:none;pointer-events:auto;}
  .nav-panel-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--paper2);border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink-soft);}
  .nav-panel-close{all:unset;cursor:pointer;font-size:12px;color:var(--accent);padding:4px 6px;border-radius:4px;transition:background .15s;}
  .nav-panel-close:hover{background:rgba(0,0,0,.05);}
  .nav-panel-group{padding:8px 8px 6px;}
  .nav-panel-group + .nav-panel-group{border-top:1px solid var(--line);}
  .nav-panel-group p{margin:2px 8px 4px;font-size:11.5px;letter-spacing:.06em;color:var(--ink-faint);font-weight:700;}
  /* 項目は開くときに上から順にふわっと出る */
  .nav-panel-item{
    display:flex;align-items:center;gap:8px;
    padding:10px 12px;border-radius:8px;
    font-size:14px;font-weight:600;color:var(--ink-strong);text-decoration:none;
    position:relative;overflow:hidden;
    opacity:0;transform:translateY(6px);
    transition:background .15s, color .15s, transform .15s, opacity .25s;
  }
  .nav-panel.open .nav-panel-item{opacity:1;transform:none;}
  .nav-panel-group:nth-child(2) .nav-panel-item:nth-child(2){transition-delay:.03s;}
  .nav-panel-group:nth-child(2) .nav-panel-item:nth-child(3){transition-delay:.06s;}
  .nav-panel-group:nth-child(2) .nav-panel-item:nth-child(4){transition-delay:.09s;}
  .nav-panel-group:nth-child(2) .nav-panel-item:nth-child(5){transition-delay:.12s;}
  .nav-panel-group:nth-child(3) .nav-panel-item{transition-delay:.15s;}
  .nav-panel-group:nth-child(4) .nav-panel-item{transition-delay:.18s;}
  .nav-panel-item::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px;
    background:var(--accent);transform:scaleY(0);transition:transform .18s cubic-bezier(.2,.8,.2,1);
  }
  .nav-panel-item:hover{background:var(--paper2);transform:translateX(3px);}
  .nav-panel-item:hover::before{transform:scaleY(1);}
  .nav-panel-item.on{background:var(--navy);color:#fff;}
  .nav-panel-item.on::before{background:var(--gold-soft);transform:scaleY(1);}
  .nav-panel-item.on .maint-mini{background:#fff;}
  /* 選んだ項目：短く光って、他は薄くなる */
  .nav-panel-item.pressed{background:var(--gold-soft);color:#1b1a14;transform:scale(.98);}
  .nav-panel-item.dim{opacity:.35;}
  .nav-panel-item:active{transform:scale(.98);}
  @media (max-width:520px){
    .nav-panel{
      left:0;right:0;bottom:0;width:auto;border-radius:16px 16px 0 0;
      max-height:80vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0);
      transform-origin:50% 100%;
      transform:translateY(24px);
    }
    .nav-panel.open{transform:none;}
    .fab-menu{z-index:61;}
    body.nav-open .fab-menu{bottom:auto;top:12px;}
  }
  @media (prefers-reduced-motion:reduce){
    .fab-menu,.burger span,.nav-panel,.nav-panel-item{transition:none !important;}
  }
  /* ホーム先頭のお知らせと2冊の説明 */
  .home-notice{
    display:flex;justify-content:space-between;align-items:center;gap:24px;
    margin:0 0 18px;padding:18px 22px;
    background:var(--navy);color:#e6e9ea;
    border-left:5px solid var(--gold-soft);border-radius:6px;
  }
  .home-notice-text{flex:1 1 420px;min-width:0;}
  .home-notice-heading{margin:0 0 6px;font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--gold-soft);}
  .home-notice-text p:not(.home-notice-heading){margin:0 0 4px;font-size:14px;line-height:1.85;color:#e6e9ea !important;}
  .home-notice .home-notice-heading{color:var(--gold-soft) !important;}
  .home-notice-actions{display:flex;flex-direction:column;gap:10px;flex:0 0 auto;}
  .home-notice .notice-btn{min-width:230px;}
  .home-intro{margin:0 0 30px;padding:0 4px;}
  .home-intro p{margin:0 0 10px;font-size:14.5px;line-height:1.9;color:var(--ink);max-width:60em;}
  .home-intro-src{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-size:12.5px;line-height:1.8;color:var(--ink-soft);}
  .home-intro-src dt{font-weight:700;color:var(--ink);}
  .home-intro-src dd{margin:0;}
  @media (max-width:760px){
    .home-notice{flex-direction:column;align-items:stretch;gap:14px;padding:16px;}
    .home-notice .notice-btn{width:100%;min-width:0;}
    .home-intro-src{grid-template-columns:1fr;gap:2px;}
  }
  /* ホームのお知らせを軽く：白地に金の縁 */
  .home-notice{background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--gold-soft);}
  .home-notice-text p:not(.home-notice-heading){color:var(--ink) !important;}
  .home-notice .home-notice-heading{color:var(--accent) !important;}
  .home-notice .notice-doc{color:var(--ink-strong);border-color:var(--line-strong);}
  .home-notice .notice-doc:hover{background:var(--paper2);}
  /* メニューの中身（版4.4.3）：ページ内の見出し・障害種別・道具・操作 */
  .nav-panel{width:min(400px,calc(100vw - 36px));max-height:min(78vh,720px);overflow-y:auto;}
  .nav-panel-chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 6px 4px;}
  .nav-chip{
    all:unset;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 10px;border-radius:14px;
    font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-strong);
    background:var(--paper2);border:1px solid transparent;
    transition:background .15s,border-color .15s,transform .12s;
  }
  .nav-chip:hover{border-color:var(--accent);background:var(--card);transform:translateY(-1px);}
  .nav-chip:active,.nav-chip.pressed{transform:scale(.96);background:var(--gold-soft);color:#1b1a14;}
  .nav-chip.on{background:var(--navy);color:#fff;}
  .nav-chip .num{font-family:var(--mono);font-size:11px;color:var(--accent);}
  .nav-chip.on .num{color:var(--gold-soft);}
  .nav-panel-chips.cats .nav-chip{padding:6px 9px;}
  .nav-panel-actions{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 12px;background:var(--paper2);}
  .nav-action{
    all:unset;cursor:pointer;flex:1 1 auto;text-align:center;
    padding:9px 10px;border-radius:8px;
    font-family:var(--sans);font-size:13px;font-weight:700;color:#fff;background:var(--navy);
    transition:background .15s,transform .12s;
  }
  .nav-action:hover{background:var(--accent);}
  .nav-action:active,.nav-action.pressed{transform:scale(.97);}
  /* 本文の読み幅と左右のバランス */
  .layout{max-width:1260px;}
  .layout.wide main{max-width:1040px;}
  main > .jiritsu-table-wrap,main > .home-view{max-width:960px;}
  @media (max-width:520px){
    .nav-panel{max-height:80vh;}
  }
  /* 冊の切替（特別支援／指導提要）をタブより一回り大きく */
  .nav-book{
    font-size:14px;letter-spacing:.06em;
    padding:9px 16px;margin:0 10px 4px 0;
    border-radius:6px;
    color:#e6e9ea;background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.22);
  }
  .nav-book:hover{background:rgba(255,255,255,.2);border-color:var(--gold-soft);}
  .nav-group.on .nav-book{background:var(--gold-soft);color:#1b1a14;border-color:var(--gold-soft);box-shadow:0 2px 8px rgba(0,0,0,.25);}
  .navbar button:not(.nav-book){font-size:13px;padding:9px 13px;}
  .navbar .nav-group + .nav-group{margin-left:10px;padding-left:12px;border-left:1px solid rgba(255,255,255,.12);}
  .navbar .nav-group-terms{border-left:none;}
  @media (max-width:760px){
    .nav-book{font-size:13px;padding:8px 12px;}
    .navbar .nav-group + .nav-group{margin-left:6px;padding-left:8px;}
  }
  /* 全体のホーム：2冊への分岐 */
  .site-home{max-width:1040px;}
  .site-home-h{font-family:var(--serif);font-size:22px;margin:30px 0 14px;color:var(--ink-strong);}
  .book-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-bottom:34px;}
  .book-card{
    display:flex;flex-direction:column;gap:10px;
    padding:24px 26px 20px;
    background:var(--card);
    border:1px solid var(--line);
    border-top:5px solid var(--navy);
    border-radius:8px;
    text-decoration:none;color:var(--ink);
    box-shadow:var(--shadow);
    transition:transform .15s, box-shadow .15s, border-color .15s;
  }
  .book-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(19,33,50,.16);border-color:var(--navy);}
  .book-card.teiyo{border-top-color:var(--gold-line);}
  .book-card.teiyo:hover{border-color:var(--gold-line);}
  .book-card-kicker{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent);display:flex;align-items:center;gap:8px;}
  .book-card.teiyo .book-card-kicker{color:#8a6d2f;}
  .book-card-title{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--ink-strong);line-height:1.35;}
  .book-card-desc{font-size:14px;line-height:1.85;color:var(--ink);}
  .book-card-list{display:flex;flex-direction:column;gap:4px;margin-top:4px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-soft);line-height:1.7;}
  .book-card-go{margin-top:auto;padding-top:12px;font-weight:700;color:var(--accent);font-size:14px;}
  .site-home-cross{margin:16px 4px 26px;font-size:13.5px;color:var(--ink-soft);line-height:1.8;}
  .site-home .home-intro{margin:0 0 24px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:6px;}
  .site-home-more{margin:10px 0 0;font-size:13px;color:var(--ink-soft);}
  .site-home .home-notice{margin-bottom:6px;}
  /* 全体のホームでは冊の切替はどちらも点いていない状態にする */
  body.at-site-home .nav-group .nav-book{background:rgba(255,255,255,.10);color:#e6e9ea;}
  /* ---------- ダークモードの視認性（版4.4.9） ----------
     青の強調色を明るくし、濃紺で塗っていた「選択中」は金色に置き換える（濃紺は地に沈む） */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --accent:#a6cdf5;
      --accent-soft:#1a2a3a;
    }
  }
  :root[data-theme="dark"]{ --accent:#a6cdf5; --accent-soft:#1a2a3a; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) ul.cat-list li.active button,
    :root:not([data-theme="light"]) .nav-link.on,
    :root:not([data-theme="light"]) .nav-panel-item.on,
    :root:not([data-theme="light"]) .nav-chip.on{background:var(--gold-soft);color:#1b1a14;}
    :root:not([data-theme="light"]) .nav-chip.on .num,
    :root:not([data-theme="light"]) ul.cat-list li.active button .num{color:#5a4a20;}
    :root:not([data-theme="light"]) .nav-panel-item.on .maint-mini{background:#fff;color:#1b1a14;}
    :root:not([data-theme="light"]) .nav-action{background:#2a4460;color:#fff;}
    :root:not([data-theme="light"]) .nav-action:hover{background:#3a5c80;}
    :root:not([data-theme="light"]) .book-card{border-top-color:var(--accent);}
    :root:not([data-theme="light"]) .book-card:hover{border-color:var(--accent);}
    :root:not([data-theme="light"]) .book-card.teiyo{border-top-color:var(--gold-soft);}
    :root:not([data-theme="light"]) .book-card.teiyo .book-card-kicker{color:var(--gold-soft);}
    :root:not([data-theme="light"]) .dd-label{color:var(--accent);}
    :root:not([data-theme="light"]) .src-ref{color:var(--accent);}
    :root:not([data-theme="light"]) .hk-cross-book,
    :root:not([data-theme="light"]) .hk-chapter{color:var(--accent);}
    :root:not([data-theme="light"]) .sv-block,
    :root:not([data-theme="light"]) .hk-status{border-left-color:var(--accent);}
    :root:not([data-theme="light"]) .hk-card .num,
    :root:not([data-theme="light"]) .hk-rel-card .num{color:var(--accent);}
    :root:not([data-theme="light"]) .stage-flow{color:var(--accent);}
    :root:not([data-theme="light"]) .home-notice-heading,
    :root:not([data-theme="light"]) .lk-label{color:var(--accent) !important;}
    :root:not([data-theme="light"]) .lk-row:hover,
    :root:not([data-theme="light"]) .lk-row:focus-visible{background:var(--accent-soft);}
    :root:not([data-theme="light"]) .sp-entry{border-left-color:var(--gold-soft);}
    :root:not([data-theme="light"]) .hk-toc a.on,
    :root:not([data-theme="light"]) .j-step.on{border-color:var(--gold-soft);}
  }
  @media print{
    body.s2-print header,body.s2-print .mode-tabs,body.s2-print .book-switch,body.s2-print .index,body.s2-print footer,
    body.s2-print .crumb,body.s2-print .article-head,body.s2-print .overview,body.s2-print .section-disclaimer,
    body.s2-print .sp-form,body.s2-print .source-box,body.s2-print .block:not(.s2-sheet){display:none !important;}
    body.s2-print .s2-sheet{display:block !important;}
    .s2-table th,.s2-table td{border:.5pt solid #000 !important;color:#000 !important;background:#fff !important;}
    .s2-sheet-sec{break-inside:avoid;}
    @page{ margin:16mm 14mm; }

    html,body{
      background:#fff !important;
      color:#000 !important;
      font-size:10.5pt;
      line-height:1.7;
      overflow:visible !important;
    }

    /* 画面の操作部品は紙に出さない */
    .top-strip,.mode-tabs,.fab-home,.install-banner,
    .index,.search-wrap,.disease-hits,.school-stage,
    .support-tabs,.crumb,
    .fb-line,.d-hint,.chevron,.header-notice,.book-switch,.fab-menu,.nav-panel,.navbar,.mast-right,.side-backdrop,.site-nav{
      display:none !important;
    }

    header{background:#fff !important;border-bottom:1.5pt solid #000;padding-bottom:8pt;}
    .header-inner{display:block;padding-bottom:6pt;}
    .emblem{display:none !important;}
    h1{color:#000 !important;font-size:17pt;margin:0 0 4pt;}
    .eyebrow{color:#555 !important;letter-spacing:.1em;}
    header p.lead,.lead{color:#333 !important;font-size:9pt;max-width:none;}
    .credential{
      color:#333 !important;background:none;border:none;
      font-size:8.5pt;text-align:left;margin-top:6pt;
    }
    .credential b{color:#000 !important;}

    .layout{display:block !important;}
    main{padding:0 !important;}
    .jiritsu-table-wrap{max-width:none;}

    /* 開いている疾患だけを詳しく刷る。
       全件を展開すると病弱で70ページを超え、実用にならないため。
       閉じているものは名前だけを索引として残す。 */
    .disease-item.open .disease-detail{max-height:none !important;overflow:visible !important;}
    .disease-item:not(.open) .disease-detail{display:none !important;}
    .disease-item:not(.open){
      display:inline-block;
      width:auto;
      border:none;
      margin:0 10pt 0 0;
      padding:0;
    }
    .disease-item:not(.open) .disease-row{
      display:inline;padding:0;font-size:9pt;color:#444 !important;
    }
    .disease-item:not(.open) .d-name{font-size:9pt;font-weight:400;}
    .disease-item:not(.open) .sev-badge{display:none !important;}
    .disease-item:not(.open){margin-right:14pt;}
    /* 画面では縦積みだが、紙では名前を流し込んで行数を節約する */
    .disease-list{display:block !important;line-height:1.9;border-top:none;}

    .disease-item.open{
      display:block;width:auto;
      break-inside:avoid;page-break-inside:avoid;
      border:1pt solid #666;padding:8pt 10pt;margin:8pt 0;
    }
    .disease-item.open .disease-row{padding:0 0 4pt;}
    .disease-item.open .d-name{font-size:12pt;font-weight:700;}
    .disease-item.open .disease-detail-inner{padding:0;}

    .block{break-inside:avoid;page-break-inside:avoid;}
    .hk-list li::before,.hk-pt-n{background:#000 !important;}
    .hk-card,.hk-rel-card,.hk-group,.hk-dl-row,.hk-status{box-shadow:none !important;border-color:#999 !important;}
    .block-title{border-left:3pt solid #000;padding-left:6pt;}
    /* 閉じている疾患は名前だけ並ぶので、その旨を添える */
    .disease-list::before{
      content:"※ 開いている項目のみ詳細を印刷します。以下は同じ障害種に含まれる他の項目です。";
      display:block;font-size:8.5pt;color:#555;margin-bottom:6pt;
    }
    h2,h3{break-after:avoid;page-break-after:avoid;}

    /* 支援内容のタブは紙では意味がないので、全区分を並べる */
    .support-panel{display:block !important;}

    .need-card,.instr-item,.place-row,.severity-item,
    .source-box,.section-disclaimer,.basis-detail,.d-note{
      border-color:#999 !important;background:#fff !important;
      break-inside:avoid;page-break-inside:avoid;
    }
    .basis-tag{border:.5pt solid #666 !important;background:#fff !important;color:#000 !important;}

    /* リンクは紙では押せないので、URLを添える */
    .lk-jump{display:none !important;}
    .lk-row{border-color:#999 !important;}
    .source-box a[href^="http"]::after,
    .basis-refs a[href^="http"]::after{
      content:" 〈" attr(href) "〉";
      font-size:8pt;color:#444;word-break:break-all;
    }
    a{color:#000 !important;text-decoration:none;}

    table{page-break-inside:auto;}
    tr{break-inside:avoid;page-break-inside:avoid;}
    thead{display:table-header-group;}

    footer{
      border-top:1pt solid #000;margin-top:12pt;padding-top:6pt;
      font-size:8pt;color:#333 !important;
    }
    .footer-feedback{border:none;background:none;padding:0;}

    /* 出典を明記したまま配れるように、末尾に版を刷る */
    .footer-meta{font-size:8pt;}
  }

  /* ==========================================================
     暗い配色
     端末の設定に従って自動で切り替わる。紺のヘッダーは残し、
     地色だけを暗くする。文字色は明るい側と同じく、いずれの背景でも
     コントラスト比4.5以上を満たす値に置き換えている。
     ========================================================== */
  @media (prefers-color-scheme: dark){
    :root{
      /* 明るい配色と同じ骨格のまま、面と文字を反転させる。
         濃紺のヘッダーはさらに沈め、地との段差を残す。 */
      --paper:#10151a;
      --paper2:#1a2027;
      --card:#161c22;
      --line:#2a323a;
      --line-strong:#414b55;

      --navy:#0b131c;
      --navy-2:#16283a;

      --ink:#eef1f4;
      --ink-strong:#eaf0f7;
      --ink-soft:#b8c1c9;
      --ink-faint:#98a2ab;

      --accent:#7db3e8;
      --accent-soft:#152331;

      --gold-soft:#d3b478;
      --gold-line:#8a6a30;

      --tone-ok-fg:#8fd0a5;   --tone-ok-bg:#14261b;   --tone-ok-bd:#3d6a4c;
      --tone-info-fg:#9ec9f2; --tone-info-bg:#12212e; --tone-info-bd:#3e6488;
      --tone-warn-fg:#e0b878; --tone-warn-bg:#2a2113; --tone-warn-bd:#7a6132;
      --tag-fg:#9fd0e0;       --tag-bg:#14252c;

      --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 18px -12px rgba(0,0,0,.8);
    }

    /* 薄い塗りは暗い地では逆方向に効かせる */
    .disease-row:hover{background:rgba(255,255,255,.04);}
    ul.cat-list button:hover{background:rgba(255,255,255,.04);}
    ul.cat-list li.active button{background:var(--accent-soft);color:var(--ink);}
    ul.cat-list li.active button .num{color:var(--gold-soft);}
    .support-panel{background:var(--card);}
    .support-tabs button.on{background:var(--accent);color:#0b131c;border-color:var(--accent);}
    /* 濃紺は暗い地に沈むので、配慮を要する背景の印は明るい色に替える */
    .hk-list li::before{background:var(--accent);}
    .hk-pt-n{background:var(--accent);color:#0b131c;}
    .hk-home-note{border-left-color:var(--accent);}
    .j-step.on{border-color:var(--accent);}
    .lk-title{border-left-color:var(--accent);}
    .hk-toc a:hover,.hk-basis-wrap summary{border-color:var(--accent);}
    .sp-num{background:var(--accent);color:#0b131c;}
    .sp-btn.primary{background:var(--accent);color:#0b131c;border-color:var(--accent);}
    .lk-jump a:hover{border-color:var(--accent);}
    .j-step.on b{background:var(--accent);color:#0b131c;border-color:var(--accent);}
    .hk-card:hover,.hk-rel-card:hover{border-color:var(--accent);}
    .mode-tabs button.on{background:var(--paper);color:var(--ink);}
    .idx-hit-count{background:var(--accent);color:#0b131c;}
    .sev-badge{background:var(--accent);color:#0b131c;}
    h3.block-title::before{background:var(--accent);}
    .install-banner{background:var(--accent-soft);color:var(--ink);}
    .home-card:hover{border-color:var(--accent);}

    /* 印刷は常に明るい配色で出す（下の @media print が優先される） */
  }


  /* ==========================================================
     法令が定める障害の程度／程度別支援の尺度
     ========================================================== */
  .legal-box{
    background:var(--paper2);
    border:1px solid var(--line-strong);
    border-left:4px solid var(--navy);
    border-radius:2px;
    padding:14px 18px;
    margin:0 0 16px;
  }
  .legal-clause{
    font-family:var(--serif);
    font-size:14.5px;
    line-height:2;
    color:var(--ink);
    margin:0;
    text-indent:0;
  }
  .legal-clause + .legal-clause{margin-top:10px;}
  .legal-src{
    font-size:12px;
    color:var(--ink-faint);
    margin:0;
  }
  .legal-src a{word-break:break-all;}

  /* 通知が定める学級・通級の程度 */
  .prog-item + .prog-item{
    margin-top:16px;
    padding-top:16px;
    border-top:1px dashed var(--line-strong);
  }
  .prog-head{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:8px;
    margin:0 0 8px;
  }
  .prog-name{
    font-size:13px;
    font-weight:700;
    color:#ffffff;
    background:var(--navy);
    border-radius:2px;
    padding:3px 10px;
    letter-spacing:.04em;
  }
  .prog-term{
    font-size:13.5px;
    font-weight:700;
    color:var(--ink-strong);
  }
  .prog-none{
    font-weight:600;
    color:var(--ink-soft);
  }
  .prog-absent .prog-name{
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--line-strong);
    padding:2px 9px;
  }
  .prog-reason{
    font-size:13.5px;
    line-height:1.85;
    color:var(--ink-soft);
    margin:0;
  }

  .scale-box{
    background:var(--accent-soft);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-radius:2px;
    padding:11px 14px;
    margin:0 0 12px;
  }
  /* 確立した尺度ではないものは、色を変えて同じに見せない */
  .scale-box.editorial{
    background:var(--tone-warn-bg);
    border-left-color:var(--tone-warn-fg);
  }
  .scale-name{
    margin:0 0 5px;
    font-weight:700;
    font-size:13px;
    color:var(--ink-strong);
  }
  .scale-note{
    margin:0;
    font-size:12.5px;
    line-height:1.85;
    color:var(--ink-soft);
  }
  .scale-src{
    margin:7px 0 0;
    font-size:12px;
    color:var(--ink-faint);
  }
  .scale-src a{word-break:break-word;}

  @media print{
    .legal-box{background:#fff !important;border-color:#666 !important;}
    .scale-box{background:#fff !important;border-color:#666 !important;}
  }

  /* ---- 学校生活管理指導表 ---- */
  .form-badge{
    font-size:11px;
    font-weight:700;
    color:#fff;
    background:var(--ink-strong);
    padding:2px 8px;
    border-radius:10px;
    flex-shrink:0;
    margin-left:6px;
  }
  .form-line{
    margin:14px 0 0;
    padding:12px 15px;
    background:var(--paper2);
    border:1px solid var(--line-strong);
    border-left:3px solid var(--ink-strong);
    border-radius:2px;
  }
  .form-head{
    margin:0 0 6px;
    font-family:var(--serif);
    font-weight:700;
    font-size:13.5px;
    color:var(--ink-strong);
  }
  .form-body{
    margin:0;
    font-size:12.8px;
    line-height:1.85;
    color:var(--ink-soft);
  }
  .form-src{margin:7px 0 0;font-size:12px;}
  .form-src a{word-break:break-word;}
  .form-ground{
    margin:6px 0 0;
    font-size:12px;
    color:var(--ink-faint);
    line-height:1.75;
  }
  @media print{
    .form-line{background:#fff !important;border-color:#666 !important;}
  }

  /* ==========================================================
     版5.0 障害種別ページの新しい型（軸・実態把握・固有の見方・疾患）
     ========================================================== */
  .v5-view .overview{margin-bottom:10px;}
  .v5-toc{margin-top:14px;}
  .v5-ref{
    display:inline-block;margin-left:6px;padding:1px 6px;border-radius:3px;
    font-family:var(--mono);font-size:11px;letter-spacing:.02em;line-height:1.5;vertical-align:middle;
    color:var(--ink-faint);background:var(--paper2);border:1px solid var(--line);text-decoration:none;white-space:nowrap;
  }
  a.v5-ref:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}
  .item-table a.v5-ref[target="_blank"]::after{content:none;}

  /* 軸の表 */
  table.v5-axes td.item-name{width:170px;}
  .v5-axis-n{
    display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-right:6px;border-radius:50%;
    background:var(--navy);color:#fff;font-family:var(--mono);font-size:11px;vertical-align:middle;
  }
  .v5-level{
    display:inline-block;margin:2px 6px 2px 0;padding:2px 8px;border-radius:3px;
    background:var(--tag-bg);color:var(--tag-fg);font-size:12.5px;line-height:1.6;
  }
  @media (max-width:640px){table.v5-axes td.item-name{width:120px;}}

  /* この子の支援を考える */
  .v5-think-card{
    background:var(--card);border:1px solid var(--gold-line);border-left:5px solid var(--gold);border-radius:3px;
    padding:18px 22px 20px;box-shadow:var(--shadow);
  }
  .v5-think-card p{margin:0 0 10px;font-size:14.5px;line-height:1.85;color:var(--ink);}
  .v5-think-card .v5-think-sub{font-size:12.5px;color:var(--ink-faint);}
  .v5-think-btn{display:inline-block;text-decoration:none;margin-top:4px;}
  .v5-think-btn .maint-mini{margin-left:8px;font-size:11px;color:var(--tone-warn-fg);}

  /* 実態把握（5欄） */
  .v5-assess-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:6px;}
  .v5-assess-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px;}
  .v5-assess-card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:14px 18px 12px;}
  .v5-assess-card.how,.v5-assess-card.tests{background:var(--paper2);}
  .v5-assess-head{
    display:flex;align-items:center;gap:8px;margin:0 0 8px;font-family:var(--sans);font-weight:700;font-size:14px;color:var(--ink-strong);
    padding-bottom:8px;border-bottom:1px solid var(--line);
  }
  .v5-assess-card ul{margin:0;padding-left:18px;}
  .v5-assess-card li{font-size:13.5px;line-height:1.8;margin:3px 0;color:var(--ink);}
  .v5-tests{margin:0;}
  .v5-tests dt{font-weight:700;font-size:13.5px;color:var(--ink-strong);margin-top:6px;}
  .v5-tests dd{margin:0 0 4px;font-size:13px;color:var(--ink-soft);line-height:1.7;}

  /* 固有の見方・指導内容 */
  .v5-spec{margin:12px 0 0;}
  .v5-spec h4{
    margin:0 0 6px;font-family:var(--sans);font-size:14.5px;font-weight:700;color:var(--ink-strong);
    padding-left:10px;border-left:4px solid var(--gold);
  }
  .v5-spec .hk-list{margin-top:2px;}
  .v5-spec .hk-groups{margin-top:8px;}

  /* 主な疾患・状態 */
  .v5-cond-group{margin-top:14px;}
  .v5-cond-group > h4{
    margin:0 0 6px;font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--ink-faint);text-transform:none;
  }
  .v5-cond{
    background:var(--card);border:1px solid var(--line);border-radius:3px;padding:12px 16px;margin-bottom:8px;
    transition:box-shadow .25s,border-color .25s;
  }
  .v5-cond.hit{border-color:var(--gold-line);box-shadow:0 0 0 3px var(--gold-soft);}
  .v5-cond-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 4px;}
  .v5-cond-head b{font-size:15px;color:var(--ink-strong);}
  .v5-cond-axis{
    font-size:11.5px;padding:2px 8px;border-radius:3px;background:var(--tone-info-bg);color:var(--tone-info-fg);border:1px solid var(--tone-info-bd);
  }
  .v5-cond-line{margin:0 0 6px;font-size:13.5px;line-height:1.8;color:var(--ink);}
  .v5-links{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px;}
  .v5-links li{font-size:12.5px;line-height:1.7;}
  .v5-links li a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;}
  .v5-links .basis-pub{margin-left:4px;color:var(--ink-faint);font-size:11.5px;}
  .v5-links .v5-link-note{display:block;color:var(--ink-faint);font-size:11.5px;}
  .v5-cond-foot{margin:12px 0 0;font-size:13px;color:var(--ink-soft);}
  .v5-cond-foot a{color:var(--accent);}
  .source-box .v5-links{display:block;}
  .source-box .v5-links li{margin:2px 0;}

  /* ホームのカードの印 */
  .home-card .v5-tag{
    display:inline-block;margin-left:8px;padding:1px 7px;border-radius:3px;vertical-align:middle;
    font-size:11px;font-weight:600;letter-spacing:.04em;background:var(--gold-soft);color:var(--navy);
  }

  /* サポートシートが障害種の観点を受け取ったとき */
  .sp-cat-banner{
    display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:0 0 16px;padding:12px 16px;
    background:var(--card);border:1px solid var(--gold-line);border-left:5px solid var(--gold);border-radius:3px;
  }
  .sp-cat-banner b{font-size:14.5px;color:var(--ink-strong);}
  .sp-cat-banner span{flex:1 1 100%;font-size:13px;line-height:1.75;color:var(--ink-soft);}
  .sp-cat-banner a{font-size:13px;color:var(--accent);}
  .sp-cat select{
    font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:3px;background:var(--card);color:var(--ink);min-width:240px;
  }
  .sp-field textarea::placeholder{color:var(--ink-faint);opacity:.75;font-size:12.5px;}

  @media (prefers-color-scheme: dark){
    .v5-axis-n{background:var(--gold);color:var(--navy);}
    .v5-level{background:#1e2a36;color:#cfe0f2;}
    .home-card .v5-tag{color:#10151a;}
  }

  /* 版5.0.1：実態把握の見出しの番号の円が横に伸びないように */
  .v5-assess-head .sp-num{flex:0 0 auto;width:24px;height:24px;min-width:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;padding:0;}
  .v5-links li a[href^="#/"]{text-decoration:none;font-weight:600;}

  /* 版5.2.0：サポートシートが障害種の観点を持つときの補助 */
  .sp-cat-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 12px;}
  .sp-cat-tools .sp-hint{font-size:12px;color:var(--ink-faint);}
  .sp-cat-ref{margin:0 0 14px;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:3px;background:var(--paper2);}
  .sp-cat-ref summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:14px;color:var(--ink-strong);}
  .sp-cat-ref summary .sp-hint{display:block;font-weight:400;font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .sp-cat-ref-body{padding:0 16px 12px;}
  .sp-cat-ref-head{margin:8px 0 4px;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .sp-cat-ref-body ul{margin:0;padding-left:18px;}
  .sp-cat-ref-body li{font-size:13.5px;line-height:1.75;}

  /* 版5.3.0：サポートシート ①実態把握の障害種ごとの項目 */
  .sp-col{margin:0 0 18px;padding:14px 16px 6px;background:var(--card);border:1px solid var(--line);border-radius:3px;}
  .sp-col-head{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-family:var(--sans);font-weight:700;font-size:15px;color:var(--ink-strong);padding-bottom:8px;border-bottom:1px solid var(--line);}
  .sp-col-head .sp-num{flex:0 0 auto;width:24px;height:24px;min-width:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;padding:0;}
  .sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px 16px;margin-bottom:6px;}
  .sp-grid .sp-f{margin:0 0 6px;}
  .sp-grid .sp-f.sp-f-checks,.sp-grid .sp-f.sp-f-image,.sp-grid .sp-f textarea{grid-column:1 / -1;}
  .sp-grid .sp-f:has(textarea){grid-column:1 / -1;}
  .sp-f select,.sp-f input[type="text"],.sp-f input[type="number"]{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:3px;background:var(--paper);color:var(--ink);width:100%;}
  .sp-num-wrap{display:flex;align-items:center;gap:6px;}
  .sp-num-wrap input{max-width:140px;}
  .sp-unit{font-size:13px;color:var(--ink-faint);}
  .sp-f .v5-ref{margin-left:6px;}
  .sp-checks{display:flex;flex-wrap:wrap;gap:4px 14px;}
  .sp-check-item{font-size:13.5px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;}
  .sp-img-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;}
  .sp-img-add{cursor:pointer;display:inline-block;}
  .sp-thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;}
  .sp-thumb{margin:0;width:180px;background:var(--paper2);border:1px solid var(--line);border-radius:3px;padding:6px;}
  .sp-thumb img{display:block;width:100%;height:120px;object-fit:contain;background:#fff;border-radius:2px;}
  .sp-thumb figcaption{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px;font-size:11.5px;}
  .sp-thumb-name{flex:1 1 100%;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sp-mini{font:inherit;font-size:11.5px;padding:2px 8px;border:1px solid var(--line-strong);border-radius:3px;background:var(--card);color:var(--ink);cursor:pointer;}
  .sp-mini.danger{color:#8a2a2a;}
  .sp-img-note{margin-bottom:12px;}
  @media (prefers-color-scheme: dark){ .sp-thumb img{background:#fff;} .sp-mini.danger{color:#f0a0a0;} }
  .sp-img-state{font:inherit;font-size:13.5px;padding:5px 8px;border:1px solid var(--line-strong);border-radius:3px;background:var(--paper);color:var(--ink);}

  /* 版5.4.0：出典・リンク集の表 */
  .lk-view table.item-table{table-layout:fixed;min-width:0;width:100%;}
  .lk-view table.item-table td{word-break:break-word;vertical-align:top;}
  .lk-view table.item-table td.item-name{width:auto;}
  .lk-view .src-note{display:block;margin-top:3px;font-weight:400;font-size:12px;color:var(--ink-faint);line-height:1.6;}
  .lk-view td.lk-date{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);white-space:nowrap;}
  .lk-src-group{
    display:flex;align-items:center;justify-content:space-between;margin:22px 0 8px;padding-left:10px;border-left:4px solid var(--gold);
    font-family:var(--sans);font-size:14.5px;font-weight:700;color:var(--ink-strong);
  }
  .lk-src-group .tally{font-weight:400;font-size:12px;color:var(--ink-faint);}
  @media (max-width:640px){
    .lk-view table.item-table{table-layout:auto;min-width:560px;}
  }

  /* ==========================================================
     版5.5.0 障害種別ページの見やすさ：節の区切り・軸のカード・疾患の行・出典の印
     ========================================================== */
  /* 節：番号付きの見出しと余白で区切る */
  .v5-view section.block{margin-top:40px;padding-top:0;}
  .v5-view section.block > h3.block-title{font-size:19px;padding-bottom:10px;margin-bottom:14px;border-bottom:2px solid var(--line-strong);}
  .v5-view section.block > h3.block-title .tally{font-size:12px;}
  .v5-view .block-sub{margin:0 0 14px;color:var(--ink-soft);}
  /* 目次：画面上部に貼り付く */
  .v5-toc{position:sticky;top:0;z-index:5;margin:14px -8px 10px;padding:10px 8px;background:var(--paper);border-bottom:1px solid var(--line);gap:6px;}
  .v5-toc a{font-size:12.5px;padding:5px 10px 5px 6px;display:inline-flex;align-items:center;gap:6px;}
  .v5-toc-n{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--mono);font-size:11px;}
  /* 出典の印：目立たせない */
  .v5-view .v5-ref,.sp-f .v5-ref{background:none;border:none;padding:0;margin-left:6px;font-size:11px;color:var(--ink-faint);}
  .v5-view a.v5-ref:hover{background:none;border:none;color:var(--accent);text-decoration:underline;}
  /* 軸：カードを縦に並べ、区分と意味を左右に */
  .v5-axis-list{display:flex;flex-direction:column;gap:10px;}
  .v5-axis{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 18px 12px;}
  .v5-axis-head{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-family:var(--sans);font-size:15.5px;font-weight:700;color:var(--ink-strong);}
  .v5-axis-body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr);gap:8px 24px;}
  .v5-axis-lab{display:block;margin-bottom:4px;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink-faint);}
  .v5-axis-levels .v5-level{display:block;width:fit-content;margin:0 0 5px;padding:4px 10px;font-size:13.5px;line-height:1.6;}
  .v5-axis-meaning{margin:0;font-size:14px;line-height:1.85;color:var(--ink);}
  @media (max-width:720px){.v5-axis-body{grid-template-columns:1fr;}}
  /* 実態把握：カードの見出しを少し大きく */
  .v5-assess-head{font-size:15px;}
  /* 疾患：枠を減らし、区切り線で並べる。リンクは右（狭い画面では下） */
  .v5-cond-group{margin-top:22px;}
  .v5-cond-group > h4{font-size:14px;color:var(--ink-strong);padding:6px 0;border-bottom:2px solid var(--line-strong);margin-bottom:0;}
  .v5-cond{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:4px 20px;align-items:start;background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:12px 4px;margin:0;}
  .v5-cond:last-child{border-bottom:none;}
  .v5-cond.hit{background:var(--tone-warn-bg);box-shadow:none;border-left:4px solid var(--gold);padding-left:10px;}
  .v5-cond-head{margin:0 0 2px;}
  .v5-cond-head b{font-size:15.5px;}
  .v5-cond-axis{border:none;background:none;padding:0;color:var(--ink-faint);font-size:12px;}
  .v5-cond-axis::before{content:"— ";}
  .v5-cond-line{margin:0;font-size:14px;line-height:1.8;}
  .v5-cond-links .v5-links{flex-direction:column;gap:3px;padding-top:2px;}
  .v5-cond-links .v5-links li{font-size:12.5px;line-height:1.6;}
  .v5-cond-links .v5-links li a{text-decoration:none;color:var(--accent);}
  .v5-cond-links .v5-links li a::before{content:"↗ ";color:var(--ink-faint);}
  .v5-cond-links .v5-links li a:hover{text-decoration:underline;}
  @media (max-width:760px){.v5-cond{grid-template-columns:1fr;}}
  /* 用語：行間を広げる */
  .v5-view .hk-dl-row{padding:8px 0;}
  @media (prefers-color-scheme: dark){
    .v5-toc{background:var(--paper);}
    .v5-cond.hit{background:#2a2410;}
  }

  /* 版5.5.1：見るべき軸を「左に軸名、右に区分と意味」の行にする */
  .v5-axis-list{gap:0;}
  .v5-axis{display:grid;grid-template-columns:190px minmax(0,1fr);gap:4px 24px;background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:16px 4px;}
  .v5-axis:first-child{border-top:1px solid var(--line);}
  .v5-axis-head{flex-direction:column;align-items:flex-start;gap:6px;margin:0;font-size:15px;line-height:1.5;}
  .v5-axis-head .v5-ref{margin-left:0;}
  .v5-axis-body{display:block;}
  .v5-axis-lab{display:none;}
  .v5-axis-levels{display:flex;flex-wrap:wrap;gap:6px 8px;margin-bottom:8px;}
  .v5-axis-levels .v5-level{display:inline-block;width:auto;margin:0;padding:3px 10px;font-size:13px;}
  .v5-axis-meaning{font-size:14px;color:var(--ink-soft);}
  @media (max-width:720px){.v5-axis{grid-template-columns:1fr;gap:8px;}}
  .v5-axis-head{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;}
  .v5-axis-head .v5-ref{flex-basis:100%;margin-top:-2px;}

</style>
</head>
